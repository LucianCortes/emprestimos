function loadFile(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var el=document.getElementById('restore-input');if(el)el.value=ev.target.result;};r.readAsText(f);}
// Marca para exclusão tudo que existe hoje no aparelho e não veio no arquivo.
function _tombstonarAusentes(tabela,atuais,doArquivo){
  var vivos={};
  (doArquivo||[]).forEach(function(o){if(o&&o.id)vivos[o.id]=1;});
  (atuais||[]).forEach(function(o){if(o&&o.id&&!vivos[o.id])addTombstone(tabela,o.id);});
}
// Lista os registros que existem hoje e NAO estao no arquivo — ou seja,
// exatamente o que a restauracao vai apagar aqui e na nuvem.
function _ausentesDoArquivo(atuais,doArquivo){
  var vivos={};
  (doArquivo||[]).forEach(function(o){if(o&&o.id)vivos[o.id]=1;});
  return (atuais||[]).filter(function(o){return o&&o.id&&!vivos[o.id];});
}
// Data do arquivo em texto claro (o app ja grava exportedAt em todo backup).
function _dataDoArquivo(iso){
  if(!iso)return 'sem data gravada no arquivo';
  var d=new Date(iso);
  if(isNaN(d.getTime()))return 'sem data gravada no arquivo';
  var txt=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()
    +' às '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  var dias=Math.floor((Date.now()-d.getTime())/86400000);
  if(dias>0)txt+=' (há '+dias+' dia'+(dias>1?'s':'')+')';
  return txt;
}
// Baixa sozinho uma copia do estado ATUAL antes de qualquer substituicao.
// Se nem isso der certo, a restauracao nao segue: e a ultima rede de seguranca.
function _backupAntesDeRestaurar(){
  return buildBackup().then(function(b){
    _salvarArquivoBackup(b.obj,'antes-de-restaurar-'+today()+'.json');
    markBackup();
    var faltam=b.fotos.esperadas-b.fotos.incluidas;
    showToast(faltam>0
      ? '💾 Cópia de segurança baixada (sem '+faltam+' foto(s)).'
      : '💾 Cópia de segurança do estado atual baixada.');
    return true;
  });
}
// D4 — RESTAURAR DEIXOU DE SER UM BOTAO DE APAGAR TUDO.
// Antes, restaurar um arquivo de 9 dias atras substituia tudo E marcava para
// exclusao na nuvem todo registro que existia hoje e nao estava no arquivo:
// 9 dias de trabalho evaporavam nos dois aparelhos, sem volta. Agora, nesta
// ordem: (1) recusa se houver pendencia; (2) mostra o que vai ser apagado;
// (3) baixa sozinho um backup do estado atual; (4) exige digitar RESTAURAR.
function restoreBackup(){
  var raw=(document.getElementById('restore-input')||{}).value||'';
  if(!raw.trim()){showToast('Cole os dados primeiro','error');return;}
  var p;
  try{
    p=JSON.parse(raw);
    if(!Array.isArray(p.loans))throw new Error('inválido');
  }catch(e){showToast('Arquivo inválido','error');return;}

  // (1) Pendencia na fila: restaurar agora jogaria fora o que ainda nao subiu.
  var pend=pendingCount();
  if(pend>0){
    pedirConfirmacao({
      titulo:'Não dá para restaurar agora',
      texto:'Tem '+pend+' lançamento'+(pend>1?'s':'')+' que ainda não subiu'+(pend>1?'ram':'')+' para a nuvem.\n\n'
        +'Sincronize antes de restaurar, senão '+(pend>1?'eles se perdem':'ele se perde')+'.',
      ok:'Sincronizar agora',cancelar:'Fechar'
    },function(){ressincronizar();});
    return;
  }

  // (2) O que o dono precisa ver ANTES de decidir.
  var arqEmp=p.loans||[], arqCli=p.clients||[], arqInad=p.inadimplentes||[];
  var somEmp=_ausentesDoArquivo(loans,arqEmp);
  var somCli=_ausentesDoArquivo(clients,arqCli);
  var somInad=_ausentesDoArquivo(inadimplentes,arqInad);
  var apagar=somEmp.length+somCli.length+somInad.length;
  var noArquivo=arqEmp.length+arqCli.length+arqInad.length;
  var hojeTem=loans.length+clients.length+(inadimplentes||[]).length;

  var msg='Data do arquivo: '+_dataDoArquivo(p.exportedAt)+'.\n'
    +'O arquivo tem '+noArquivo+' registro'+(noArquivo===1?'':'s')+'. '
    +'Hoje existem '+hojeTem+' neste aparelho.\n\n';
  if(apagar>0){
    msg+='VÃO SER APAGADOS '+apagar+' registro'+(apagar===1?'':'s')+' — aqui e na nuvem, em todos os aparelhos.';
    // Com poucos, mostra os nomes: numero sozinho nao deixa ninguem decidir.
    if(apagar<=10){
      var nomes=[];
      somEmp.concat(somInad).concat(somCli).forEach(function(o){
        var n=(o.name||'(sem nome)');
        if(nomes.indexOf(n)<0)nomes.push(n);
      });
      msg+='\n'+nomes.join(', ')+'.';
    }
  }else{
    msg+='Nenhum registro será apagado: tudo que existe hoje também está no arquivo.';
  }
  msg+='\n\nAntes de substituir, o app vai baixar sozinho uma cópia do estado atual.';

  pedirConfirmacao({titulo:'Restaurar este backup?',texto:msg,
    ok:'Continuar',cancelar:'Cancelar',perigo:apagar>0},function(){
    // (3) Copia de seguranca do estado atual, automatica.
    _backupAntesDeRestaurar().then(function(){
      // (4) Palavra digitada — folha do proprio app, nao o prompt do navegador.
      pedirTexto({titulo:'Confirmação final',
        texto:'Digite a palavra RESTAURAR para substituir os dados deste aparelho e da nuvem.',
        rotulo:'Digite RESTAURAR',dica:'RESTAURAR'},function(v){
        if(String(v||'').trim().toUpperCase()!=='RESTAURAR'){
          showToast('Restauração cancelada — nada foi alterado.','warn');
          return;
        }
        _restoreBackupExec(p);
      });
    }).catch(function(e){
      if(typeof console!=='undefined'&&console.error)console.error('backup antes de restaurar',e);
      showToast('⚠️ Não foi possível baixar a cópia de segurança. Restauração cancelada.','error');
    });
  });
}
// Aplica de verdade. So chega aqui depois dos quatro passos acima.
function _restoreBackupExec(p){
  try{
    // Restaurar significa "este arquivo passa a ser a verdade". O que existe
    // aqui e NAO esta no arquivo vira exclusao de verdade — sem isto, esses
    // registros sobreviviam na nuvem e voltavam na proxima sincronizacao,
    // que era como um aparelho com dados errados contaminava o outro.
    _tombstonarAusentes('emprestimos',loans,p.loans);
    _tombstonarAusentes('clientes',clients,p.clients||[]);
    _tombstonarAusentes('inadimplentes',inadimplentes,p.inadimplentes||[]);
    loans=p.loans;clients=p.clients||[];inadimplentes=p.inadimplentes||[];
    migrateLoans(loans);
    // Devolve as fotos do backup para o IndexedDB
    var docs=p.docs||{};var keys=Object.keys(docs);
    var writeDocs=keys.length?Promise.all(keys.map(function(k){return docSet(k,docs[k]).catch(function(){});})):Promise.resolve();
    writeDocs.then(function(){
      save('*');saveInad('*');renderAll();closeModal();
      showToast('✅ '+loans.length+' empréstimos restaurados!');
    });
  }catch(e){showToast('Arquivo inválido','error');}
}

// ============================================================
// REDE DE SEGURANÇA — cópias dentro do app, lixeira, conferência e cópia legível
// ============================================================
// POR QUE ISTO EXISTE. A sincronização e o backup manual já foram resolvidos.
// O que sobrava eram duas formas de perder dinheiro que nenhum dos dois cobre:
//   1) ERRO HUMANO — um toque errado apaga um empréstimo aqui E na nuvem, e o
//      outro aparelho apaga junto. Não havia volta nenhuma.
//   2) DEFEITO SILENCIOSO — uma conta que para de bater e ninguém percebe.
// Daqui saem quatro redes: cópias completas guardadas no próprio aparelho
// (IndexedDB), uma lixeira de 30 dias, uma conferência que só lê, e uma cópia
// em texto que qualquer pessoa entende sem o app.
//
// REGRA DESTE BLOCO: nada aqui apaga dado do dono. A ÚNICA exclusão é a
// rotação das cópias e a limpeza da lixeira vencida — ambas descritas abaixo,
// e a cópia mais recente nunca é tocada.
//
// As fotos NÃO entram nas cópias: são grandes, já vivem no IndexedDB e na
// nuvem, e o que se perde por engano é lançamento, não foto. O banco das
// fotos (emp_docs) não é tocado por nada deste bloco.

var SEG_DB_NOME='emp_copias', SEG_DB_VER=1;
var SEG_ST_COPIAS='copias', SEG_ST_LIXO='lixeira';
var SEG_HORAS_COPIA=20;        // idade mínima da última cópia para fazer outra
var SEG_COPIAS_RECENTES=10;    // quantas cópias recentes ficam sempre
var SEG_COPIAS_MESES=6;        // e a primeira de cada mês destes últimos meses
var SEG_COPIAS_PROTEGIDAS=20;  // teto das cópias "antes de operação perigosa"
var SEG_LIXO_DIAS=30, SEG_LIXO_MAX=200;

var _segDB=null, _segIniciado=false;
var _segCopias=[], _segLixo=[];      // caches para a tela desenhar sem esperar
var _segUltimaConferencia='';        // texto da última conferência (botão Copiar)

// ---- banco próprio (não encosta no emp_docs, que guarda as fotos) ----
function segDB(){
  return new Promise(function(res,rej){
    if(_segDB)return res(_segDB);
    if(typeof indexedDB==='undefined'||!indexedDB)return rej(new Error('sem indexedDB'));
    var rq=indexedDB.open(SEG_DB_NOME,SEG_DB_VER);
    rq.onupgradeneeded=function(){
      var db=rq.result;
      if(!db.objectStoreNames.contains(SEG_ST_COPIAS))db.createObjectStore(SEG_ST_COPIAS,{keyPath:'id'});
      if(!db.objectStoreNames.contains(SEG_ST_LIXO))db.createObjectStore(SEG_ST_LIXO,{keyPath:'id'});
    };
    rq.onsuccess=function(){_segDB=rq.result;res(_segDB);};
    rq.onerror=function(){rej(rq.error||new Error('erro ao abrir '+SEG_DB_NOME));};
  });
}
function _segPut(store,obj){
  return segDB().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction(store,'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete=function(){res(obj);};
    tx.onerror=function(){rej(tx.error||new Error('erro ao gravar'));};
    tx.onabort=function(){rej(tx.error||new Error('gravação abortada'));};
  });});
}
function _segGet(store,id){
  return segDB().then(function(db){return new Promise(function(res,rej){
    var rq=db.transaction(store,'readonly').objectStore(store).get(id);
    rq.onsuccess=function(){res(rq.result||null);};
    rq.onerror=function(){rej(rq.error);};
  });});
}
// Cursor em vez de getAll(): getAll não existe em Android antigo.
function _segAll(store){
  return segDB().then(function(db){return new Promise(function(res,rej){
    var out=[];
    var rq=db.transaction(store,'readonly').objectStore(store).openCursor();
    rq.onsuccess=function(){var c=rq.result;if(!c){res(out);return;}out.push(c.value);c.continue();};
    rq.onerror=function(){rej(rq.error);};
  });});
}
function _segDel(store,id){
  return segDB().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction(store,'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete=function(){res(true);};
    tx.onerror=function(){rej(tx.error);};
  });});
}

// ---- utilidades de data/texto ----
function _segDataHora(iso){
  var d=new Date(iso);
  if(!iso||isNaN(d.getTime()))return 'NÃO INFORMADO';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()
    +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function _segMs(iso){var t=Date.parse(iso||'');return isNaN(t)?0:t;}
function _segOrdemNova(campo){
  return function(a,b){return String(b[campo]||'').localeCompare(String(a[campo]||''));};
}
function _segPlural(n,um,muitos){return n+' '+(n===1?um:muitos);}
function _repintarConta(){
  if(typeof currentScreen!=='undefined'&&currentScreen==='conta'
     &&typeof document!=='undefined'&&document.getElementById('conta-content'))renderConta();
}

// ============================================================
// S1 — CÓPIAS AUTOMÁTICAS DENTRO DO APP
// ============================================================
// Assinatura do conteúdo. Serve para não gravar cópia igual à anterior — o
// dono foi explícito: guardar UMA cópia e só substituir quando houver mudança.
function _segAssinatura(){
  var s;
  try{s=JSON.stringify({l:loans,c:clients,i:inadimplentes||[]});}
  catch(e){return 'sem-assinatura-'+Date.now();}
  var h=5381;
  for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}
  return 'a'+h.toString(36)+'-'+s.length;
}
// Grava uma cópia completa. protegida=true são as de "antes de operação
// perigosa": elas nunca são as primeiras a sair na rotação.
function salvarCopiaSeguranca(motivo,protegida){
  var copia;
  try{
    copia={
      id:'c'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
      versao:1,
      feitoEm:new Date().toISOString(),
      motivo:String(motivo||'cópia automática'),
      protegida:!!protegida,
      assinatura:_segAssinatura(),
      loans:JSON.parse(JSON.stringify(loans||[])),
      clients:JSON.parse(JSON.stringify(clients||[])),
      inadimplentes:JSON.parse(JSON.stringify(inadimplentes||[]))
    };
  }catch(e){return Promise.reject(e);}
  return _segPut(SEG_ST_COPIAS,copia).then(function(){
    _marcarGravacaoOk('emp_copias');
    return _rotacionarCopias().then(function(){return _recarregarCopias();}).then(function(){return copia;});
  }).catch(function(e){
    if(typeof console!=='undefined'&&console.error)console.error('cópia automática',e);
    // Regra 2: nunca falhar calado. Mesmo aviso fixo do resto do app.
    _marcarGravacaoFalhou('emp_copias');
    throw e;
  });
}
// Mês limite (YYYY-MM) do "primeira de cada mês dos últimos N meses".
function _segMesLimite(meses){
  var d=new Date();
  d.setDate(1);
  d.setMonth(d.getMonth()-(meses-1));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
// ÚNICA exclusão de cópia que existe. Fica sempre: a mais recente (sempre),
// as 10 mais novas, a primeira de cada mês dos últimos 6 meses e as 20 mais
// novas feitas antes de operação perigosa.
function _rotacionarCopias(){
  return _segAll(SEG_ST_COPIAS).then(function(lista){
    if(lista.length<=SEG_COPIAS_RECENTES)return null;
    lista.sort(_segOrdemNova('feitoEm'));          // mais nova primeiro
    var manter={};
    manter[lista[0].id]=1;                         // a mais recente NUNCA sai
    lista.slice(0,SEG_COPIAS_RECENTES).forEach(function(c){manter[c.id]=1;});
    var limiteMes=_segMesLimite(SEG_COPIAS_MESES), mesVisto={};
    lista.slice().reverse().forEach(function(c){   // da mais antiga para a mais nova
      var m=String(c.feitoEm||'').slice(0,7);
      if(!m||m<limiteMes)return;
      if(!mesVisto[m]){mesVisto[m]=1;manter[c.id]=1;}
    });
    var n=0;
    lista.forEach(function(c){if(c.protegida&&n<SEG_COPIAS_PROTEGIDAS){manter[c.id]=1;n++;}});
    var sobra=lista.filter(function(c){return !manter[c.id];});
    if(!sobra.length)return null;
    return Promise.all(sobra.map(function(c){return _segDel(SEG_ST_COPIAS,c.id).catch(function(){});}));
  }).catch(function(e){
    if(typeof console!=='undefined'&&console.warn)console.warn('rotação de cópias',e);
  });
}
function _recarregarCopias(){
  return _segAll(SEG_ST_COPIAS).then(function(l){
    l.sort(_segOrdemNova('feitoEm'));
    _segCopias=l;
    return l;
  }).catch(function(){_segCopias=[];return [];});
}
// Ao abrir o app: só grava se a última cópia tiver mais de 20 horas E o
// conteúdo tiver mudado desde ela.
function verificarCopiaAutomatica(){
  return _segAll(SEG_ST_COPIAS).then(function(lista){
    var temDado=(loans&&loans.length)||(clients&&clients.length)||(inadimplentes&&inadimplentes.length);
    if(!temDado)return null;                       // base vazia: não há o que copiar
    if(!lista.length)return salvarCopiaSeguranca('primeira cópia automática',false);
    lista.sort(_segOrdemNova('feitoEm'));
    var ult=lista[0];
    var idade=Date.now()-_segMs(ult.feitoEm);
    if(idade<SEG_HORAS_COPIA*3600000)return null;  // ainda é nova
    if(ult.assinatura&&ult.assinatura===_segAssinatura())return null;  // nada mudou
    return salvarCopiaSeguranca('cópia automática do dia',false);
  }).catch(function(e){
    if(typeof console!=='undefined'&&console.warn)console.warn('verificar cópia',e);
    return null;
  });
}
// Uma cópia no MESMO formato do backup manual — assim ela abre em qualquer
// lugar que abra o .json do app. Sem fotos (o campo fica vazio de propósito).
function _copiaParaBackup(c){
  return {
    loans:c.loans||[],clients:c.clients||[],inadimplentes:c.inadimplentes||[],
    docs:{},
    exportedAt:c.feitoEm||new Date().toISOString(),
    origem:'cópia automática do app — '+(c.motivo||'NÃO INFORMADO')
  };
}
function baixarCopiaSeguranca(id){
  _segGet(SEG_ST_COPIAS,id).then(function(c){
    if(!c){showToast('Cópia não encontrada','error');return;}
    var d=new Date(c.feitoEm);
    var nome='copia-'+(isNaN(d.getTime())?today():(d.getFullYear()+'-'
      +String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')))+'.json';
    _salvarArquivoBackup(_copiaParaBackup(c),nome);
    markBackup();
    showToast('📥 Cópia baixada!');
    _repintarConta();
  }).catch(function(){showToast('Não consegui ler a cópia','error');});
}
// RESTAURAR UMA CÓPIA PASSA PELO MESMO CAMINHO DO ARQUIVO.
// Não existe uma segunda restauração aqui: a cópia é colocada no campo que a
// restauração já lê e quem manda é o restoreBackup() que já está testado —
// recusa com pendência na fila, resumo do que será apagado, backup automático
// e a palavra RESTAURAR digitada.
function restaurarCopiaSeguranca(id){
  _segGet(SEG_ST_COPIAS,id).then(function(c){
    if(!c){showToast('Cópia não encontrada','error');return;}
    var texto=new Blob?null:null;   // (sem uso: mantido simples de propósito)
    var el=document.createElement('textarea');
    el.id='restore-input';
    el.style.display='none';
    el.value=JSON.stringify(_copiaParaBackup(c));
    // Primeiro no documento: se a janela de backup estiver aberta, é esta que
    // a restauração vai ler, não a caixa vazia de lá.
    document.body.insertBefore(el,document.body.firstChild);
    try{restoreBackup();}          // restoreBackup() lê o campo na primeira linha
    finally{if(el.parentNode)el.parentNode.removeChild(el);}
  }).catch(function(){showToast('Não consegui ler a cópia','error');});
}

// ============================================================
// S3 — LIXEIRA DE 30 DIAS
// ============================================================
// A exclusão na nuvem continua EXATAMENTE como era (o tombstone é criado e o
// outro aparelho apaga junto). A lixeira é uma rede local: guarda o registro
// inteiro aqui, para o dono poder trazer de volta se o toque foi errado.
function _segTabelaDoTipo(tipo){
  if(tipo==='emprestimo')return 'emprestimos';
  if(tipo==='cliente')return 'clientes';
  // T4 — página de documento NÃO é uma linha de tabela da nuvem: ela mora
  // dentro do empréstimo. Por isso não tem tabela e não tem tombstone.
  if(tipo==='pagina_documento')return null;
  return 'inadimplentes';
}
function _segRotuloTipo(tipo){
  if(tipo==='emprestimo')return 'Empréstimo';
  if(tipo==='cliente')return 'Cliente';
  if(tipo==='pagina_documento')return 'Página de documento';
  return 'Inadimplente';
}
function _segSaldoDoRegistro(tipo,reg){
  if(tipo==='cliente')return null;             // cliente não tem saldo próprio
  if(tipo==='pagina_documento')return null;    // foto também não
  try{return getBalance(reg);}catch(e){return null;}
}
// Quando um item SAI da lixeira de vez (30 dias vencidos ou "apagar de vez"),
// AÍ SIM as fotos dele são apagadas do aparelho e da nuvem — e mesmo assim só
// se nenhum registro estiver mais usando aquela chave (_docApagarSeOrfa).
// Este é o ÚNICO lugar que apaga foto de documento.
function _lixeiraApagarFotos(item){
  if(!item||!item.registro)return Promise.resolve();
  if(item.tipo==='pagina_documento')
    return _docApagarSeOrfa(item.registro.chave).catch(function(){});
  if(item.tipo==='emprestimo'||item.tipo==='inadimplente')
    return _docApagarPaginasDoRegistro(item.registro).catch(function(){});
  return Promise.resolve();
}
function guardarNaLixeira(tipo,registro){
  if(!registro||!registro.id)return Promise.reject(new Error('registro sem id'));
  var item;
  try{
    item={
      id:tipo+':'+registro.id+':'+Date.now(),
      versao:1,
      apagadoEm:new Date().toISOString(),
      tipo:tipo,
      registroId:registro.id,
      nome:registro.name||'NÃO INFORMADO',
      saldo:_segSaldoDoRegistro(tipo,registro),
      registro:JSON.parse(JSON.stringify(registro))
    };
  }catch(e){return Promise.reject(e);}
  return _segPut(SEG_ST_LIXO,item).then(function(){
    _marcarGravacaoOk('emp_lixeira');
    return _recarregarLixeira().then(function(){return item;});
  }).catch(function(e){
    if(typeof console!=='undefined'&&console.error)console.error('lixeira',e);
    _marcarGravacaoFalhou('emp_lixeira');
    throw e;
  });
}
function _recarregarLixeira(){
  return _segAll(SEG_ST_LIXO).then(function(l){
    l.sort(_segOrdemNova('apagadoEm'));
    _segLixo=l;
    return l;
  }).catch(function(){_segLixo=[];return [];});
}
function _segDiasRestantes(apagadoEm){
  var t=_segMs(apagadoEm);
  if(!t)return SEG_LIXO_DIAS;
  var passou=Math.floor((Date.now()-t)/86400000);
  var falta=SEG_LIXO_DIAS-passou;
  return falta<0?0:falta;
}
// Limpeza sozinha: o que passou de 30 dias e, se ainda assim passar de 200
// registros, os mais antigos. Só isso — nada mais apaga da lixeira sozinho.
function _limparLixeiraVelha(){
  return _segAll(SEG_ST_LIXO).then(function(lista){
    var limite=Date.now()-SEG_LIXO_DIAS*86400000, apagar=[], vivos=[];
    lista.forEach(function(it){
      var t=_segMs(it.apagadoEm)||Date.now();
      if(t<limite)apagar.push(it);else vivos.push(it);
    });
    vivos.sort(_segOrdemNova('apagadoEm'));
    if(vivos.length>SEG_LIXO_MAX)apagar=apagar.concat(vivos.slice(SEG_LIXO_MAX));
    if(!apagar.length)return null;
    // O prazo venceu: agora sim a foto do item pode sair do aparelho e da nuvem.
    return Promise.all(apagar.map(function(it){
      return _lixeiraApagarFotos(it).then(function(){
        return _segDel(SEG_ST_LIXO,it.id).catch(function(){});
      });
    }));
  }).catch(function(e){
    if(typeof console!=='undefined'&&console.warn)console.warn('limpeza da lixeira',e);
  });
}
function restaurarDaLixeira(id){
  _segGet(SEG_ST_LIXO,id).then(function(item){
    if(!item||!item.registro||!item.registro.id){showToast('Registro incompleto — não dá para restaurar','error');return;}
    pedirConfirmacao({
      titulo:'Trazer de volta?',
      texto:_segRotuloTipo(item.tipo)+': '+(item.nome||'NÃO INFORMADO')
        +(item.saldo==null?'':' · saldo '+fmt(item.saldo))+'.\n\n'
        +(item.tipo==='pagina_documento'
          ?'A foto volta para o documento do cliente, no fim da fila de páginas.'
          :'Ele volta para a lista com o mesmo cadastro e sobe de novo para a nuvem.'),
      ok:'Trazer de volta'},function(){_restaurarDaLixeiraExec(item);});
  }).catch(function(){showToast('Não consegui ler a lixeira','error');});
}
// O PONTO MAIS FÁCIL DE ERRAR: se o id continuar na lista de exclusões
// (tombstones), a próxima sincronização apaga o registro de novo. Por isso
// tiramos o id de lá ANTES de salvar — e markDirty() dentro do save() tira
// outra vez, de propósito: é barato e fecha a porta.
function _restaurarDaLixeiraExec(item){
  var reg=item.registro, tipo=item.tipo, id=reg.id;
  var tabela=_segTabelaDoTipo(tipo);
  if(tabela)dropTombstones(tabela,[id]);   // página de documento não tem tabela
  // T4 — PÁGINA DE DOCUMENTO. Volta a chave da foto para o FIM da lista do
  // registro de onde ela saiu e marca o registro para subir de novo.
  // Se o registro não existir mais, NADA é apagado: o item fica na lixeira e
  // o dono é avisado. Foto guardada nunca some por conta do app.
  if(tipo==='pagina_documento'){
    var dono=allRecords().find(function(x){return x.id===reg.regId;});
    if(!dono){showToast('O empréstimo dessa página não existe mais','error');return;}
    var lista=docPaginas(dono[reg.campo]);
    if(lista.indexOf(reg.chave)<0)lista.push(reg.chave);   // entra no fim
    dono[reg.campo]=docGuardarPaginas(lista);
    _docGravarRegistro(dono);
    _segDel(SEG_ST_LIXO,item.id).catch(function(){});
    renderAll();
    _recarregarLixeira().then(function(){_repintarConta();});
    showToast('✅ Página de volta no documento');
    return;
  }
  if(tipo==='emprestimo'){
    if(!loans.some(function(l){return l.id===id;}))loans.push(reg);
    migrateLoans(loans);
    save(id);                     // marca pendente para subir de novo
  }else if(tipo==='cliente'){
    if(!clients.some(function(c){return c.id===id;}))clients.push(reg);
    markDirty('clientes',[id]);   // save() só marca cliente que ele mesmo mexeu
    save(null);
  }else{
    if(!inadimplentes)inadimplentes=[];
    if(!inadimplentes.some(function(x){return x.id===id;}))inadimplentes.push(reg);
    saveInad(id);
  }
  _segDel(SEG_ST_LIXO,item.id).catch(function(){});
  renderAll();
  updateInadBadge();
  _recarregarLixeira().then(function(){_repintarConta();});
  showToast('✅ '+_segRotuloTipo(tipo)+' de volta na lista');
}
function apagarDaLixeira(id){
  _segGet(SEG_ST_LIXO,id).then(function(item){
    if(!item){showToast('Item não encontrado','error');return;}
    pedirConfirmacao({
      titulo:'Apagar de vez?',
      texto:_segRotuloTipo(item.tipo)+': '+(item.nome||'NÃO INFORMADO')+'.\n\n'
        +'Sai da lixeira e não tem mais volta por aqui. A cópia automática feita '
        +'na hora da exclusão continua guardada.'
        +(item.tipo==='pagina_documento'
          ?'\n\n⚠️ A FOTO é apagada do aparelho e da nuvem agora. Foto não entra na cópia automática.'
          :''),
      ok:'Apagar de vez',perigo:true},function(){
      // SÓ AQUI a foto é apagada de verdade — depois que o dono mandou.
      _lixeiraApagarFotos(item).then(function(){
        return _segDel(SEG_ST_LIXO,id);
      }).then(function(){
        return _recarregarLixeira();
      }).then(function(){
        _repintarConta();
        showToast('Removido da lixeira');
      }).catch(function(){showToast('Não consegui apagar','error');});
    });
  }).catch(function(){showToast('Não consegui ler a lixeira','error');});
}

// ============================================================
// S2 — CÓPIA ANTES DE TODA OPERAÇÃO PERIGOSA
// ============================================================
// Guarda a cópia (e o registro na lixeira, quando é exclusão) e SÓ ENTÃO
// deixa a operação seguir. Se a gravação falhar, o dono é avisado e decide —
// nunca acontece em silêncio.
function _redeAntesDeOperacao(motivo,seguir){
  salvarCopiaSeguranca(motivo,true).then(function(){
    _repintarConta();
    seguir();
  },function(){
    pedirConfirmacao({
      titulo:'Não consegui guardar a cópia',
      texto:'A cópia de segurança não pôde ser gravada neste aparelho (sem espaço, '
        +'ou o navegador bloqueou). Se você continuar, não haverá como voltar atrás por aqui.',
      ok:'Continuar mesmo assim',cancelar:'Cancelar',perigo:true},function(){seguir();});
  });
}
function _redeAntesDeApagar(motivo,tipo,registro,seguir){
  var passos=[salvarCopiaSeguranca(motivo,true)];
  if(registro&&registro.id)passos.push(guardarNaLixeira(tipo,registro));
  Promise.all(passos.map(function(p){
    return p.then(function(){return true;},function(){return false;});
  })).then(function(res){
    var falhou=res.indexOf(false)>=0;
    if(!falhou){
      _repintarConta();
      seguir();
      return;
    }
    pedirConfirmacao({
      titulo:'Não consegui guardar a cópia',
      texto:'A cópia de segurança e/ou a lixeira não puderam ser gravadas neste aparelho. '
        +'Se você continuar, este registro não terá volta.',
      ok:'Excluir mesmo assim',cancelar:'Cancelar',perigo:true},function(){seguir();});
  });
}
// Embrulha um executor que já existe e está testado, sem alterar uma linha
// dele: a rede roda antes, o original roda igual ao que sempre rodou.
function _segEnvolver(nome,antes){
  var original=(typeof window!=='undefined')?window[nome]:null;
  if(typeof original!=='function')return;
  window[nome]=function(){
    var args=arguments, eu=this;
    var seguir=function(){original.apply(eu,args);};
    try{antes(args,seguir);}
    catch(e){
      if(typeof console!=='undefined'&&console.error)console.error('rede de segurança',e);
      seguir();          // a rede nunca pode impedir o app de funcionar
    }
  };
}
_segEnvolver('_deleteLoanExec',function(args,seguir){
  var l=loans.find(function(x){return x.id===args[0];});
  _redeAntesDeApagar('antes de excluir o empréstimo de '+((l&&l.name)||'NÃO INFORMADO'),
    'emprestimo',l,seguir);
});
_segEnvolver('_excluirInadExec',function(args,seguir){
  var i=(inadimplentes||[]).find(function(x){return x.id===args[0];});
  _redeAntesDeApagar('antes de excluir o inadimplente '+((i&&i.name)||'NÃO INFORMADO'),
    'inadimplente',i,seguir);
});
_segEnvolver('_removeClientExec',function(args,seguir){
  var c=clients[args[0]];
  _redeAntesDeApagar('antes de excluir o cliente '+((c&&c.name)||'NÃO INFORMADO'),
    'cliente',c,seguir);
});
_segEnvolver('_moveClientToInadExec',function(args,seguir){
  var k=args[0];
  var alvo=loans.filter(function(l){return clientKey(l.name)===k&&!l.paid;})[0];
  _redeAntesDeOperacao('antes de mover '+((alvo&&alvo.name)||'NÃO INFORMADO')
    +' inteiro para inadimplentes',seguir);
});
_segEnvolver('_restoreBackupExec',function(args,seguir){
  _redeAntesDeOperacao('antes de restaurar um backup ou uma cópia',seguir);
});

// ============================================================
// S4 — CONFERIR CONTAS (só lê; não altera nada, nunca)
// ============================================================
// Nenhuma linha daqui grava, marca ou recalcula nada gravado. ledger() e
// getBalance() são chamados só para comparar — é exatamente o alarme principal:
// se esses dois discordarem, o dinheiro na tela não é o dinheiro do extrato.
function conferirContas(){
  var probs=[], hoje=today(), vistos={};
  function nome(o){return (o&&o.name)?o.name:'NÃO INFORMADO';}
  function add(g,t){probs.push({grupo:g,texto:t});}
  var todos=(loans||[]).concat(inadimplentes||[]);

  todos.forEach(function(o){
    if(!o){return;}
    if(!o.id){add('Registro sem identificação interna',nome(o)+' não tem id — não sincroniza direito.');return;}
    if(vistos[o.id])add('Dois registros com o mesmo id',nome(o)+' — o id '+o.id+' aparece mais de uma vez.');
    vistos[o.id]=1;
  });

  todos.forEach(function(o){
    if(!o)return;
    var lg,gb;
    try{lg=ledger(o);}catch(e){add('Não consegui ler o extrato',nome(o)+': '+((e&&e.message)||'erro'));return;}
    try{gb=getBalance(o);}catch(e){add('Não consegui ler o saldo',nome(o));return;}
    var dif=Math.abs((lg.saldo||0)-(gb||0));
    if(dif>0.01)add('Saldo do extrato não bate com o saldo do cartão',
      nome(o)+': o extrato fecha em '+fmt(lg.saldo)+' e o cartão mostra '+fmt(gb)
      +' — diferença de '+fmt(dif)+'.');
    if(!(o.history||[]).length&&!(o.payments||[]).length)
      add('Registro sem nenhum lançamento',nome(o)+' não tem nada no histórico — não dá para saber de onde veio o valor.');
    if((gb||0)<-0.004)add('Saldo negativo',nome(o)+': saldo '+fmt(gb)+'.');
    if((parseFloat(o.currentAmount)||0)<-0.004)
      add('Saldo negativo',nome(o)+': o valor guardado no cadastro está negativo ('+fmt(o.currentAmount)+').');
    (o.history||[]).forEach(function(h){
      if(h&&h.date&&h.date>hoje)add('Lançamento com data no futuro',
        nome(o)+': lançamento de '+fmt(h.value||0)+' marcado em '+fmtDate(h.date)+'.');
    });
    (o.payments||[]).forEach(function(p){
      if(p&&p.date&&p.date>hoje)add('Pagamento com data no futuro',
        nome(o)+': pagamento de '+fmt(p.value||0)+' marcado em '+fmtDate(p.date)+'.');
    });
  });

  var chaves={};
  (clients||[]).forEach(function(c){chaves[clientKey(c.name)]=1;});
  (loans||[]).forEach(function(l){
    if(!chaves[clientKey(l.name)])add('Empréstimo sem cliente na lista',
      nome(l)+' tem empréstimo, mas não está mais na lista de clientes.');
    if(l.paid&&Math.abs(getBalance(l))>0.01)add('Marcado como quitado, mas com saldo',
      nome(l)+': está quitado e ainda mostra '+fmt(getBalance(l))+'.');
  });

  // Indicadores da tela contra a soma feita registro a registro.
  try{
    var s=calcStats();
    var emAberto=(loans||[]).filter(function(l){return !l.paid;}).concat(inadimplentes||[]);
    var somaSaldo=_r2(emAberto.reduce(function(a,l){return a+getBalance(l);},0));
    if(Math.abs(_r2(s.totalOwed)-somaSaldo)>0.01)
      add('Indicador da tela não bate com a soma um a um',
        '"A receber" mostra '+fmt(s.totalOwed)+' e somando registro a registro dá '+fmt(somaSaldo)+'.');
    var somaRisco=_r2(emAberto.reduce(function(a,l){return a+ledger(l).emRisco;},0));
    if(Math.abs(_r2(s.emRisco)-somaRisco)>0.01)
      add('Indicador da tela não bate com a soma um a um',
        '"Dinheiro em risco" mostra '+fmt(s.emRisco)+' e somando registro a registro dá '+fmt(somaRisco)+'.');
    var somaInad=_r2((inadimplentes||[]).reduce(function(a,i){return a+getBalance(i);},0));
    if(Math.abs(_r2(s.inadAberto)-somaInad)>0.01)
      add('Indicador da tela não bate com a soma um a um',
        'O total parado com inadimplentes mostra '+fmt(s.inadAberto)+' e a soma um a um dá '+fmt(somaInad)+'.');
  }catch(e){
    add('Não consegui conferir os indicadores da tela',((e&&e.message)||'erro'));
  }

  return {
    problemas:probs,
    emprestimos:(loans||[]).length,
    clientes:(clients||[]).length,
    inadimplentes:(inadimplentes||[]).length
  };
}
// Texto em linguagem comum — é o mesmo que vai para a área de transferência.
function _conferenciaTexto(r){
  var t='CONFERÊNCIA DE CONTAS — '+_segDataHora(new Date().toISOString())+'\n';
  t+=_segPlural(r.emprestimos,'empréstimo','empréstimos')+', '
    +_segPlural(r.clientes,'cliente','clientes')+', '
    +_segPlural(r.inadimplentes,'inadimplente','inadimplentes')+'.\n\n';
  if(!r.problemas.length){
    t+='Tudo conferido, nenhum problema encontrado.\n';
    return t;
  }
  t+='Encontrei '+_segPlural(r.problemas.length,'coisa fora do lugar','coisas fora do lugar')+':\n\n';
  var grupos=[], porGrupo={};
  r.problemas.forEach(function(p){
    if(!porGrupo[p.grupo]){porGrupo[p.grupo]=[];grupos.push(p.grupo);}
    porGrupo[p.grupo].push(p.texto);
  });
  grupos.forEach(function(g){
    t+=g.toUpperCase()+' ('+porGrupo[g].length+')\n';
    porGrupo[g].forEach(function(x){t+='  - '+x+'\n';});
    t+='\n';
  });
  return t;
}
function abrirConferencia(){
  var r;
  try{r=conferirContas();}
  catch(e){showToast('Não consegui conferir agora','error');return;}
  _segUltimaConferencia=_conferenciaTexto(r);
  var cab=_segPlural(r.emprestimos,'empréstimo','empréstimos')+' · '
    +_segPlural(r.clientes,'cliente','clientes')+' · '
    +_segPlural(r.inadimplentes,'inadimplente','inadimplentes');
  var corpo;
  if(!r.problemas.length){
    corpo='<div style="border:1px solid var(--gr);background:var(--grS);border-radius:11px;padding:13px 14px">'
      +'<div style="font-size:15px;font-weight:700;color:var(--gr)">Tudo conferido, nenhum problema</div>'
      +'<div style="font-size:12.5px;color:var(--dim);margin-top:4px">'+esc(cab)+'</div></div>';
  }else{
    var grupos=[], porGrupo={};
    r.problemas.forEach(function(p){
      if(!porGrupo[p.grupo]){porGrupo[p.grupo]=[];grupos.push(p.grupo);}
      porGrupo[p.grupo].push(p.texto);
    });
    corpo='<div style="border:1px solid var(--am);background:var(--amS);border-radius:11px;padding:12px 13px;margin-bottom:11px">'
      +'<div style="font-size:14.5px;font-weight:700;color:var(--am)">'
      +esc('Encontrei '+_segPlural(r.problemas.length,'coisa fora do lugar','coisas fora do lugar'))+'</div>'
      +'<div style="font-size:12.5px;color:var(--dim);margin-top:4px">'+esc(cab)+'</div></div>';
    corpo+=grupos.map(function(g){
      return '<div style="margin-bottom:12px">'
        +'<div style="font-size:13.5px;font-weight:700;margin-bottom:5px">'+esc(g)+' ('+porGrupo[g].length+')</div>'
        +porGrupo[g].map(function(x){
          return '<div style="font-size:12.5px;color:var(--dim);line-height:1.55;padding:5px 0 5px 10px;'
            +'border-left:2px solid var(--ln2)">'+esc(x)+'</div>';
        }).join('')
        +'</div>';
    }).join('');
  }
  modal('<div class="modal-header"><span class="modal-title">Conferir contas</span>'
    +'<button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div style="font-size:12px;color:var(--dim2);line-height:1.5;margin-bottom:11px">'
    +'Esta tela só lê. Nada foi alterado.</div>'
    +corpo
    +'<div class="modal-actions"><button class="btn-secondary" onclick="copiarConferencia()">Copiar</button>'
    +'<button class="btn-primary" onclick="closeModal()">Fechar</button></div>');
}
function copiarConferencia(){
  var t=_segUltimaConferencia||'';
  if(!t){showToast('Nada para copiar','warn');return;}
  try{
    navigator.clipboard.writeText(t).then(function(){showToast('📋 Resultado copiado!');},
      function(){showToast('Não consegui copiar neste aparelho','error');});
  }catch(e){showToast('Não consegui copiar neste aparelho','error');}
}

// S5 — CÓPIA LEGÍVEL EM .TXT
// ============================================================
// O .json é seguro e ilegível; o CSV é um resumo filtrado sem histórico.
// Este arquivo é o oposto: abre no Bloco de Notas e qualquer pessoa entende,
// com o extrato lançamento a lançamento e o saldo em cada linha.
function _txtRepete(car,n){var s='';for(var i=0;i<n;i++)s+=car;return s;}
function _txtEsq(v,n){var s=String(v);if(s.length>n)return s.slice(0,n);while(s.length<n)s+=' ';return s;}
function _txtDir(v,n){var s=String(v);if(s.length>n)s=s.slice(s.length-n);while(s.length<n)s=' '+s;return s;}
// Número sem "R$" para as colunas ficarem alinhadas. Espaço fino do formato
// pt-BR vira espaço comum: o Bloco de Notas antigo não desenha o outro.
function _txtNum(v){
  var s;
  try{s=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0);}
  catch(e){s=String(Math.round((v||0)*100)/100);}
  return s.replace(/ /g,' ');
}
function _txtDinheiro(v){return 'R$ '+_txtNum(v);}
function _txtRegistroBloco(o,rotulo,ordem,total){
  var lg=ledger(o), gb=getBalance(o);
  var L=[];
  L.push('  '+rotulo+' '+ordem+' de '+total+(o.paid?'   [QUITADO]':'   [EM ABERTO]'));
  L.push('  Início: '+(o.startDate?fmtDate(o.startDate):'NÃO INFORMADO')
    +'   Vencimento: '+(o.dueDate?fmtDate(o.dueDate):'NÃO INFORMADO')
    +'   Taxa: '+(o.interest==null||o.interest===''?'NÃO INFORMADO':(o.interest+'%')));
  L.push('  Capital emprestado: '+_txtDinheiro(lg.capitalEmprestado));
  L.push('  Saldo hoje: '+_txtDinheiro(gb));
  if(o.motivo)L.push('  Motivo da inadimplência: '+o.motivo);
  if(o.note)L.push('  Observação: '+o.note);
  L.push('');
  L.push('  EXTRATO (lançamento a lançamento)');
  L.push('  '+_txtEsq('DATA',11)+_txtEsq('LANÇAMENTO',30)+_txtDir('VALOR',13)+_txtDir('SALDO',14));
  if(!lg.linhas.length){
    L.push('  (nenhuma movimentação registrada)');
  }else{
    lg.linhas.forEach(function(li){
      var val=li.sinal?(li.sinal+' '+_txtNum(li.valor)):'—';
      var rot=li.rotulo||'Lançamento';
      if(li.estornado)rot+=' (estornado)';
      L.push('  '+_txtEsq(li.data?fmtDate(li.data):'NÃO INFORM.',11)
        +_txtEsq(rot,30)+_txtDir(val,13)+_txtDir(_txtNum(li.saldoDepois),14));
      if(li.tipo&&li.tipo.indexOf('pagamento')>=0)
        L.push('  '+_txtEsq('',11)+'   '+_txtNum(li.parteJuros)+' de juro e '
          +_txtNum(li.parteCapital)+' abatendo a dívida');
      if(li.nota)L.push('  '+_txtEsq('',11)+'   obs: '+li.nota);
    });
  }
  L.push('');
  L.push('  TOTAIS DESTE '+rotulo.toUpperCase());
  L.push('    Emprestei ....: '+_txtDinheiro(lg.capitalEmprestado));
  L.push('    Recebi .......: '+_txtDinheiro(lg.recebidoTotal));
  L.push('    Juro ganho ...: '+_txtDinheiro(lg.jurosRecebido));
  L.push('    Desconto dado : '+_txtDinheiro(lg.descontoTotal));
  L.push('    Saldo hoje ...: '+_txtDinheiro(gb));
  L.push('');
  return L.join('\n');
}
function montarTextoLegivel(){
  var linha=_txtRepete('=',70), meia=_txtRepete('-',70);
  var L=[];
  L.push(linha);
  L.push('CÓPIA LEGÍVEL — CONTROLE DE EMPRÉSTIMOS');
  L.push('versao: 1');
  L.push('Gerada em: '+_segDataHora(new Date().toISOString()));
  L.push(linha);
  L.push('Este arquivo é para LER e conferir. Para restaurar o app, use o');
  L.push('backup .json ou uma das cópias automáticas da aba Conta.');
  L.push('');

  var s=null;
  try{s=calcStats();}catch(e){s=null;}
  var ativos=(loans||[]).filter(function(l){return !l.paid;}).length;
  var quitados=(loans||[]).length-ativos;
  L.push('RESUMO GERAL');
  L.push('  Empréstimos ........: '+(loans||[]).length+'  ('+ativos+' em aberto, '+quitados+' quitados)');
  L.push('  Clientes ...........: '+(clients||[]).length);
  L.push('  Inadimplentes ......: '+(inadimplentes||[]).length);
  L.push('  A receber ..........: '+(s?_txtDinheiro(s.totalOwed):'NÃO INFORMADO'));
  L.push('  Vencido ............: '+(s?_txtDinheiro(s.totalOverdue):'NÃO INFORMADO'));
  L.push('  Dinheiro em risco ..: '+(s?_txtDinheiro(s.emRisco):'NÃO INFORMADO'));
  L.push('  Juro recebido (vida): '+(s?_txtDinheiro(s.juros):'NÃO INFORMADO'));
  L.push('');

  // Um bloco por cliente: os empréstimos dele e, junto, o que virou inadimplente.
  var chaves=[], porChave={};
  function pega(k,nomeVis,fonte){
    if(!porChave[k]){porChave[k]={nome:nomeVis,emprestimos:[],inadimplentes:[],cad:null};chaves.push(k);}
    if(fonte)porChave[k][fonte].push(arguments[3]);
    return porChave[k];
  }
  (loans||[]).forEach(function(l){pega(clientKey(l.name),l.name||'NÃO INFORMADO','emprestimos',l);});
  (inadimplentes||[]).forEach(function(i){pega(clientKey(i.name),i.name||'NÃO INFORMADO','inadimplentes',i);});
  (clients||[]).forEach(function(c){
    var g=pega(clientKey(c.name),c.name||'NÃO INFORMADO',null);
    g.cad=c;
  });
  chaves.sort(function(a,b){return porChave[a].nome.localeCompare(porChave[b].nome,'pt-BR');});

  chaves.forEach(function(k){
    var g=porChave[k];
    var qualquer=g.emprestimos[0]||g.inadimplentes[0]||g.cad||{};
    var tel=(g.cad&&g.cad.phone)||qualquer.phone||'';
    var end=(g.cad&&g.cad.address)||qualquer.address||'';
    L.push(meia);
    L.push('CLIENTE: '+(g.nome||'NÃO INFORMADO'));
    L.push('Telefone: '+(tel||'NÃO INFORMADO'));
    L.push('Endereço: '+(end||'NÃO INFORMADO'));
    var saldoCli=0;
    g.emprestimos.concat(g.inadimplentes).forEach(function(o){saldoCli+=getBalance(o);});
    L.push('Saldo em aberto deste cliente: '+_txtDinheiro(_r2(saldoCli)));
    L.push(meia);
    L.push('');
    if(!g.emprestimos.length&&!g.inadimplentes.length){
      L.push('  (sem empréstimos registrados)');
      L.push('');
      return;
    }
    g.emprestimos.forEach(function(o,idx){
      L.push(_txtRegistroBloco(o,'Empréstimo',idx+1,g.emprestimos.length));
    });
    g.inadimplentes.forEach(function(o,idx){
      L.push(_txtRegistroBloco(o,'Inadimplente',idx+1,g.inadimplentes.length));
    });
  });

  L.push(linha);
  L.push('FIM DA CÓPIA — '+chaves.length+' cliente(s), '
    +(loans||[]).length+' empréstimo(s), '+(inadimplentes||[]).length+' inadimplente(s).');
  L.push(linha);
  return L.join('\n');
}
function baixarCopiaLegivel(){
  var txt;
  try{txt=montarTextoLegivel();}
  catch(e){
    if(typeof console!=='undefined'&&console.error)console.error('cópia legível',e);
    showToast('Não consegui montar a cópia legível','error');
    return;
  }
  try{
    var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='emprestimos-legivel-'+today()+'.txt';a.click();
    URL.revokeObjectURL(url);
    // De propósito NÃO conta como backup: este arquivo não restaura nada, e
    // marcá-lo desligaria o lembrete de fazer o backup que restaura.
    showToast('📄 Cópia legível baixada!');
  }catch(e){showToast('Não consegui salvar o arquivo','error');}
}

// Liga a rede quando o app abre: limpa lixeira vencida, decide se faz a cópia
// do dia e carrega as duas listas para a tela Conta desenhar sem esperar.
function _iniciarRedeSeguranca(){
  if(_segIniciado)return;
  _segIniciado=true;
  _limparLixeiraVelha()
    .then(function(){return verificarCopiaAutomatica();})
