// ============================================================
// STATS
// ============================================================
function calcStats(){
  var active=loans.filter(function(l){return!l.paid;});
  var now=new Date();var tm=now.getMonth();var ty=now.getFullYear();
  var totalOwed=active.reduce(function(s,l){return s+getBalance(l);},0);
  var totalLent=active.reduce(function(s,l){return s+l.originalAmount;},0);
  var totalOverdue=active.filter(function(l){return daysUntil(l.dueDate)<0;}).reduce(function(s,l){return s+getBalance(l);},0);
  var warn3=active.filter(function(l){var d=daysUntil(l.dueDate);return d>=0&&d<=3;}).length;
  var clientCount=new Set(loans.map(function(l){return clientKey(l.name);})).size;
  function _p2(n){return String(n).padStart(2,'0');}
  var yStart=ty+'-01-01', yEnd=(ty+1)+'-01-01';
  var mStart=ty+'-'+_p2(tm+1)+'-01';
  var mEnd=(tm===11?(ty+1)+'-01-01':ty+'-'+_p2(tm+2)+'-01');
  // Juros recebido (Opção B): juro entra como lucro na hora; capital só baixa quando o cliente abate de fato.
  // inadimplentes entram no juro/lucro: o que ja foi pago antes de atrasar continua contando
  var todos=allRecords();
  var juros=todos.reduce(function(s,l){return s+loanJuros(l);},0);
  var jurosYear=todos.reduce(function(s,l){return s+jurosRecPeriodo(l,yStart,yEnd);},0);
  var lucroM=todos.reduce(function(s,l){return s+jurosRecPeriodo(l,mStart,mEnd);},0);
  var lucroA=jurosYear;
  // Capital emprestado (dinheiro que de fato saiu) — renovação não conta como capital novo
  var capitalYear=capitalNoPeriodo(yStart,yEnd);
  var capitalMonth=capitalNoPeriodo(mStart,mEnd);
  var activeClientCount=new Set(active.map(function(l){return clientKey(l.name);})).size;
  var overdueCount=active.filter(function(l){return daysUntil(l.dueDate)<0;}).length;
  // DINHEIRO EM RISCO: quanto do bolso dele ainda nao voltou. So conta o que
  // ainda esta em aberto — emprestimos ativos + inadimplentes. Emprestimo
  // quitado nao tem mais risco nenhum, esta fechado.
  var emAberto=active.concat(inadimplentes||[]);
  var emRisco=_r2(emAberto.reduce(function(s,l){return s+ledger(l).emRisco;},0));
  var capitalEmRisco=_r2(emAberto.reduce(function(s,l){return s+ledger(l).capitalEmprestado;},0));
  // Quanto do dinheiro que saiu do bolso já voltou, nos empréstimos ainda em aberto.
  // Limitado ao capital de cada um: o que passa disso é lucro, não devolução.
  var capitalRecuperado=_r2(emAberto.reduce(function(s,l){
    var g=ledger(l);return s+Math.min(g.recebidoTotal,g.capitalEmprestado);},0));
  return{totalOwed:totalOwed,totalLent:totalLent,totalOverdue:totalOverdue,warn3:warn3,
    capitalRecuperado:capitalRecuperado,
    clientCount:clientCount,activeClientCount:activeClientCount,overdueCount:overdueCount,
    juros:juros,jurosYear:jurosYear,capitalYear:capitalYear,capitalMonth:capitalMonth,
    lucroM:lucroM,lucroA:lucroA,activeCount:active.length,
    emRisco:emRisco,capitalEmRisco:capitalEmRisco};
}

// ============================================================
// SITUAÇÃO — a cor da barra lateral e do selo saem daqui
// ============================================================
// Só descreve o que já existe (vencimento e quitação). Não calcula dinheiro.
function sitLoan(l){
  if(!l)return 'emdia';
  if(l.paid)return 'quitado';
  var d=daysUntil(l.dueDate);
  if(d<0)return 'vencido';
  if(d===0)return 'hoje';
  if(d<=7)return 'breve';
  return 'emdia';
}
function sitTexto(l){
  if(l.paid)return 'quitado';
  var d=daysUntil(l.dueDate);
  if(d<0)return Math.abs(d)+'d atrás';
  if(d===0)return 'hoje';
  return 'em '+d+'d';
}
function sitFrase(l){
  if(l.paid)return 'Quitado';
  var d=daysUntil(l.dueDate);
  if(d<0)return 'Vencido há '+Math.abs(d)+' dia'+(Math.abs(d)>1?'s':'');
  if(d===0)return 'Vence hoje';
  return 'Vence em '+d+' dia'+(d>1?'s':'');
}
function sitGrupo(g){
  var ativos=g.loans.filter(function(l){return !l.paid;});
  if(!ativos.length)return 'quitado';
  var ordem={vencido:0,hoje:1,breve:2,emdia:3},pior='emdia';
  ativos.forEach(function(l){var s=sitLoan(l);if(ordem[s]<ordem[pior])pior=s;});
  return pior;
}
// Agrupa por cliente — a lista mostra pessoas, não empréstimos soltos.
function gruposDeClientes(lista){
  var g={},ordem=[];
  (lista||loans).forEach(function(l){
    var k=clientKey(l.name);
    if(!g[k]){g[k]={key:k,name:l.name,phone:l.phone||'',address:l.address||'',loans:[]};ordem.push(k);}
    if(l.phone&&!g[k].phone)g[k].phone=l.phone;
    if(l.address&&!g[k].address)g[k].address=l.address;
    g[k].loans.push(l);
  });
  return ordem.map(function(k){
    g[k].loans.sort(function(a,b){
      if(a.paid!==b.paid)return a.paid?1:-1;
      return new Date(a.dueDate)-new Date(b.dueDate);
    });
    return g[k];
  });
}
// Quem precisa aparecer primeiro: vencido, depois o que vence logo, quitado por último.
function ordenarGrupos(arr){
  var peso={vencido:0,hoje:1,breve:2,emdia:3,quitado:4};
  return arr.sort(function(a,b){
    var pa=peso[sitGrupo(a)],pb=peso[sitGrupo(b)];
    if(pa!==pb)return pa-pb;
    var an=a.loans.filter(function(l){return !l.paid;})[0];
    var bn=b.loans.filter(function(l){return !l.paid;})[0];
    if(an&&bn)return new Date(an.dueDate)-new Date(bn.dueDate);
    if(an)return -1;
    if(bn)return 1;
    return a.name.localeCompare(b.name);
  });
}
function saldoGrupo(g){
  return _r2(g.loans.filter(function(l){return !l.paid;})
    .reduce(function(s,l){return s+getBalance(l);},0));
}
function inicial(n){return String(n||'?').trim().charAt(0).toUpperCase();}
// Data curta (dd/mm) — nas linhas o ano só rouba espaço de quem precisa dele.
function _dm(iso){var p=String(iso||'').split('-');return p.length===3?(p[2]+'/'+p[1]):'';}

// Barra lateral + fundo do avatar de acordo com a situação
// A linha inteira é tocável (o ::after do botão principal cobre a linha), mas
// quem recebe o foco do teclado é um <button> de verdade — e o botão Receber
// fica POR CIMA, nunca dentro dele: botão dentro de botão não existe em HTML.
function _linhaAbre(sit,acao,extra){
  return '<div class="linha" style="border-left-color:'+corSit(sit)+(extra||'')+'">'
    +'<button class="linha-main" onclick="'+acao+'">';
}
function _linhaFecha(resto){return '</button>'+resto+'</div>';}

// ============================================================
// CARTEIRA (era "Início")
// ============================================================
function renderHome(){
  var s=calcStats();
  var ativos=loans.filter(function(l){return !l.paid;});
  var cobrar=ativos.filter(function(l){var d=daysUntil(l.dueDate);return d<=0;})
    .sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);});
  var emdia=ativos.filter(function(l){return daysUntil(l.dueDate)>0;})
    .sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);});
  var totalCobrar=_r2(cobrar.reduce(function(t,l){return t+getBalance(l);},0));
  var html='';

  // Inadimplentes NÃO aparecem aqui — a pedido do dono, eles vivem só no
  // filtro da lista de clientes, para a Carteira ficar com quem ainda paga.

  // Os quatro números que cabem numa olhada.
  html+='<div class="tiles">'
    + tile('A receber',dinK(s.totalOwed),'var(--tx)',"goScreen('clients')")
    + tile('Vencido',dinK(s.totalOverdue),s.totalOverdue>0?'var(--rd)':'var(--dim2)',"filtrarClientes('overdue')")
    + tile('Lucro do mês',dinK(s.lucroM),'var(--gr)',"goScreen('report')")
    + tile('Em risco',dinK(s.emRisco),s.emRisco>0?'var(--am)':'var(--gr)',"goScreen('report')")
    +'</div>';

  // O dinheiro do próprio bolso: quanto saiu, quanto já voltou, quanto ainda
  // pode virar prejuízo. Mesma leitura da ficha do cliente, agora da carteira toda.
  if(s.capitalEmRisco>0.009){
    var pctRec=Math.min(100,Math.round((s.capitalRecuperado/s.capitalEmRisco)*100));
    html+='<div class="sec"><span class="sec-t">Meu dinheiro na rua</span>'
      +'<span style="font-size:11.5px;font-weight:600;color:'+(s.emRisco>0?'var(--am)':'var(--gr)')+'">'
      +pctRec+'% recuperado</span></div>'
      +'<div class="bloco">'
      + kv('Tirei do bolso',din(s.capitalEmRisco,13.5))
      + kv('Já voltou',din(s.capitalRecuperado,13.5,'var(--gr)'))
      + kv('Ainda em risco',din(s.emRisco,15.5,s.emRisco>0?'var(--am)':'var(--gr)'),true)
      +'<div style="padding:12px 14px">'
      +'<div style="height:7px;background:var(--pn2);border-radius:4px;overflow:hidden">'
      +'<div style="height:100%;width:'+pctRec+'%;background:'+(s.emRisco>0?'var(--am)':'var(--gr)')
      +';border-radius:4px"></div></div>'
      +'<div style="font-size:12.5px;color:var(--dim);margin-top:8px;font-weight:600">'
      +(s.emRisco>0
        ? 'Faltam '+fmt(s.emRisco)+' voltarem para você não ter nada a perder.'
        : 'Todo o dinheiro que saiu já voltou. O que entrar agora é lucro.')
      +'</div></div></div>';
  }

  // Cobrar hoje: as pessoas antes do total, com o botão na própria linha.
  html+='<div class="sec"><span class="sec-t">Cobrar hoje</span>'
    +(cobrar.length?'<span style="font-size:11.5px;font-weight:600;color:var(--rd)">'
      +cobrar.length+(cobrar.length>1?' cobranças · ':' cobrança · ')+fmt(totalCobrar)+'</span>':'')
    +'</div>';
  if(!cobrar.length){
    html+='<div class="bloco"><div class="vazio" style="padding:24px 18px">'
      +'<span style="color:var(--gr);display:flex;justify-content:center">'+sv(I.check,24)+'</span>'
      +'<div class="vazio-t">Nada para cobrar hoje</div>'
      +'<div style="font-size:12.5px;margin-top:2px">Ninguém está vencido nem vence hoje.</div></div></div>';
  }else{
    html+='<div class="bloco">'+cobrar.map(function(l){return linhaCobranca(l,true);}).join('')+'</div>';
  }

  // No computador a lista curta dá lugar à tabela completa.
  if(emdia.length){
    html+='<div class="sec so-cel"><span class="sec-t">Em dia</span>'
      +'<button class="sec-a" onclick="goScreen(\'clients\')">ver todos →</button></div>'
      +'<div class="bloco so-cel">'+emdia.slice(0,4).map(function(l){return linhaCobranca(l,false);}).join('')+'</div>';
  }else if(!loans.length){
    html+='<div class="bloco so-cel"><div class="vazio">'
      +'<span style="color:var(--dim2);display:flex;justify-content:center">'+sv(I.users,26)+'</span>'
      +'<div class="vazio-t">Nenhum empréstimo ainda</div>'
      +'<div style="font-size:12.5px;margin-top:2px">Toque no + lá em cima para lançar o primeiro.</div></div></div>';
  }
  html+=tabelaDesk();
  document.getElementById('home-content').innerHTML=html;
}
// Linha de um empréstimo na Carteira. Com ação = botão Receber na própria linha.
function linhaCobranca(l,comAcao){
  var sit=sitLoan(l);
  var bal=getBalance(l);
  var sub=l.interest+'% · '+(daysUntil(l.dueDate)<0?'venceu ':'vence ')+_dm(l.dueDate);
  return _linhaAbre(sit,"abrirCliente('"+_js(clientKey(l.name))+"','home')")
    +'<span class="linha-n">'+esc(l.name)+'</span>'
    +'<span class="linha-s">'+esc(sub)+'</span>'
    + _linhaFecha(
      '<span style="text-align:right">'+din(bal,15)+'</span>'
      +(comAcao
        ? '<button class="btn-mini" onclick="abrirReceber(\''+_js(l.id)+'\')">Receber</button>'
        : '<span class="linha-st" style="color:'+corSit(sit)+'">'+sitTexto(l)+'</span>'));
}
// Escapa aspas simples para dentro de onclick="..."
function _js(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

// ============================================================
// CLIENTES — busca, filtros com contagem e lista em linhas
// ============================================================
function renderClientsList(q){_searchQuery=q;renderLoanList(q);}
function filtrarClientes(f){
  currentFilter=f;
  goScreen('clients');
}
function verInadimplentes(){filtrarClientes('inad');}
function setFilter(btn,f){
  currentFilter=f;
  renderLoanList(_searchQuery);
}
// Contagem de cada filtro — o número já diz o tamanho do problema.
function contagens(){
  var gs=gruposDeClientes(loans);
  var c={all:gs.length,overdue:0,today:0,week:0,paid:0,inad:(inadimplentes||[]).length};
  gs.forEach(function(g){
    var ativos=g.loans.filter(function(l){return !l.paid;});
    if(!ativos.length){c.paid++;return;}
    if(ativos.some(function(l){return daysUntil(l.dueDate)<0;}))c.overdue++;
    if(ativos.some(function(l){return daysUntil(l.dueDate)===0;}))c.today++;
    if(ativos.some(function(l){var d=daysUntil(l.dueDate);return d>=0&&d<=7;}))c.week++;
  });
  return c;
}
function grupoCasa(g,f){
  var ativos=g.loans.filter(function(l){return !l.paid;});
  if(f==='paid')return ativos.length===0;
  if(f==='overdue')return ativos.some(function(l){return daysUntil(l.dueDate)<0;});
  if(f==='today')return ativos.some(function(l){return daysUntil(l.dueDate)===0;});
  if(f==='week')return ativos.some(function(l){var d=daysUntil(l.dueDate);return d>=0&&d<=7;});
  return true;
}
function renderChips(){
  var el=document.getElementById('filtro-chips');
  if(!el)return;
  var c=contagens();
  var defs=[['all','Todos',c.all],['overdue','Vencidos',c.overdue],['today','Hoje',c.today],
            ['week','Semana',c.week],['paid','Quitados',c.paid],['inad','Inadimplentes',c.inad]];
  el.innerHTML=defs.map(function(d){
    var on=currentFilter===d[0];
    var badge=(d[0]==='inad')
      ? ' <span id="inad-badge" style="display:'+(c.inad?'inline-flex':'none')
        +';align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;'
        +'border-radius:9px;background:'+(on?'var(--acTx)':'var(--rd)')+';color:'+(on?'var(--ac)':'var(--bg)')
        +';font-size:10px;font-weight:800">'+c.inad+'</span>'
      : ' <span class="mono" style="font-weight:600;opacity:.75">'+d[2]+'</span>';
    return '<button class="chip" aria-pressed="'+on+'" onclick="setFilter(this,\''+d[0]+'\')">'
      +d[1]+badge+'</button>';
  }).join('');
  // Traz o filtro ativo para dentro da tela: o de inadimplentes é o último da
  // fila e ficava escondido, deixando a lista sem explicação.
  var ativo=el.querySelector&&el.querySelector('[aria-pressed="true"]');
  if(ativo&&el.scrollTo)el.scrollTo({left:Math.max(0,ativo.offsetLeft-14),behavior:'auto'});
}
function renderLoanList(search){
  renderChips();
  var container=document.getElementById('loan-list');
  if(!container)return;
  if(currentFilter==='inad'){renderInad();return;}
  var gs=gruposDeClientes(loans).filter(function(g){return grupoCasa(g,currentFilter);});
  if(search){
    var sq=String(search).toLowerCase();
    gs=gs.filter(function(g){
      return g.name.toLowerCase().indexOf(sq)>=0||(g.phone||'').indexOf(sq)>=0;
    });
  }
  if(!gs.length){
    container.innerHTML='<div class="vazio">'
      +'<span style="color:var(--dim2);display:flex;justify-content:center">'+sv(I.search,26)+'</span>'
      +'<div class="vazio-t">Nenhum cliente aqui</div>'
      +'<div style="font-size:12.5px;margin-top:2px">Tente outro filtro ou outra busca.</div></div>';
    return;
  }
  ordenarGrupos(gs);
  var total=_r2(gs.reduce(function(s,g){return s+saldoGrupo(g);},0));
  container.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;'
    +'padding:11px 16px 8px;font-size:11.5px;color:var(--dim2);font-weight:600">'
    +'<span>'+gs.length+' cliente'+(gs.length!==1?'s':'')+'</span>'
    +'<span>'+din(total,11.5,'var(--dim2)')+' em aberto</span></div>'
    +'<div class="bloco">'+gs.map(renderGroup).join('')+'</div>';
}

// Linha de um cliente. O bloco expandido existe desde antes e é o MESMO
// conteúdo da ficha — quem abre a ficha vê isto em tela cheia.
function renderGroup(group){
  var key=group.key;
  var sit=sitGrupo(group);
  var ativos=group.loans.filter(function(l){return !l.paid;});
  var saldo=saldoGrupo(group);
  var prox=ativos.slice().sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);})[0];
  // Capital ainda exposto neste cliente (só os empréstimos ATIVOS). Soma
  // emprestimo a emprestimo: um já recuperado não tapa o buraco de outro.
  var riscoAtivo=_r2(ativos.reduce(function(s,l){return s+ledger(l).emRisco;},0));
  var riscoTag='';
  if(ativos.length){
    riscoTag=riscoAtivo>0
      ?'<span style="color:var(--am)">falta '+fmt(riscoAtivo)+' voltar</span>'
      :'<span style="color:var(--gr)">✓ recuperado</span>';
  }
  var sub=ativos.length
    ? (ativos.length>1?ativos.length+' empréstimos':(prox?prox.interest+'%':''))
      +(prox?' · vence '+_dm(prox.dueDate):'')
    : 'quitado';
  var linha=_linhaAbre(sit,"abrirCliente('"+_js(key)+"')")
    +'<span class="linha-n">'+esc(group.name)+'</span>'
    +'<span class="linha-s">'+esc(sub)+'</span>'
    +(riscoTag?'<span class="linha-s">'+riscoTag+'</span>':'')
    + _linhaFecha(
      '<span style="text-align:right">'
      +(saldo?din(saldo,15):'<span class="mono" style="color:var(--dim2)">—</span>')+'</span>'
      +'<span class="linha-st" style="color:'+corSit(sit)+'">'
      +(prox?sitTexto(prox):'quitado')+'</span>');
  if(!expandedGroups[key])return linha;
  // Expandido = a ficha inteira desenhada no lugar (mesmas peças, sem duplicar
  // regra nenhuma). É por onde a bateria de testes olha o cartão do cliente.
  return linha+'<div style="padding:2px 0 12px;border-bottom:1px solid var(--ln)">'
    + fichaCorpo(key,{dentroDaLista:true})+'</div>';
}

// ============================================================
// FICHA DO CLIENTE
// ============================================================
var fichaLoanId=null;    // qual empréstimo do cliente está aberto no extrato
var fichaVerQuitados=false; // os quitados ficam escondidos até o dono pedir
function renderCliente(){
  var box=document.getElementById('cliente-content');
  if(!box)return;
  if(!clienteAtual){
    box.innerHTML='<div class="vazio">'
      +'<span style="color:var(--dim2);display:flex;justify-content:center">'+sv(I.users,26)+'</span>'
      +'<div class="vazio-t">Escolha um cliente</div>'
      +'<div style="font-size:12.5px;margin-top:2px">A ficha dele aparece aqui.</div></div>';
    return;
  }
  box.innerHTML=fichaCabecalho(clienteAtual)+fichaCorpo(clienteAtual,{});
}
function _loansDoCliente(key){
  return loans.filter(function(l){return clientKey(l.name)===key;})
    .sort(function(a,b){
      if(a.paid!==b.paid)return a.paid?1:-1;
      return new Date(a.dueDate)-new Date(b.dueDate);
    });
}
function fichaCabecalho(key){
  var ls=_loansDoCliente(key);
  var g={key:key,name:_nomeDoCliente(key)||'Cliente',loans:ls,
    phone:'',address:''};
  ls.forEach(function(l){if(l.phone&&!g.phone)g.phone=l.phone;if(l.address&&!g.address)g.address=l.address;});
  if(!g.phone||!g.address){
    var c=(clients||[]).find(function(x){return clientKey(x.name)===key;});
    if(c){g.phone=g.phone||c.phone||'';g.address=g.address||c.address||'';}
  }
  var sit=ls.length?sitGrupo(g):'quitado';
  var contato=[g.phone,g.address].filter(function(x){return x;}).join(' · ');
  return '<div style="display:flex;align-items:center;gap:12px;padding:14px 14px 0">'
    +'<div style="width:50px;height:50px;border-radius:15px;flex:none;display:flex;'
      +'align-items:center;justify-content:center;background:'+corSitS(sit)+';color:'+corSit(sit)
      +';font-family:Archivo,sans-serif;font-size:20px;font-weight:800">'+esc(inicial(g.name))+'</div>'
    +'<div style="flex:1;min-width:0">'
      +'<div class="arch" style="font-size:21px;font-weight:800;line-height:1.15;'
        +'overflow:hidden;text-overflow:ellipsis">'+esc(g.name)+'</div>'
      +'<div style="font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;'
        +'white-space:nowrap">'+esc(contato||'sem contato cadastrado')+'</div></div>'
    +(g.phone?'<button class="ico-btn" style="border:1px solid var(--ln);background:var(--pn);color:var(--gr)"'
      +' aria-label="Falar no WhatsApp com '+esc(g.name)+'"'
      +' onclick="sendWAGroup(\''+_js(key)+'\')">'+sv(I.wa,19)+'</button>':'')
    +'</div>';
}
// O corpo da ficha. `dentroDaLista` deixa as margens iguais às do cartão antigo.
function fichaCorpo(key,op){
  op=op||{};
  var ls=_loansDoCliente(key);
  if(!ls.length){
    return '<div class="vazio"><div class="vazio-t">Sem empréstimos</div>'
      +'<div style="font-size:12.5px;margin-top:2px">Este cliente não tem lançamentos.</div></div>';
  }
  var ativos=ls.filter(function(l){return !l.paid;});
  // Empréstimo em foco: o escolhido pelo seletor, senão o mais urgente.
  var alvo=ls.find(function(l){return l.id===fichaLoanId;})||ativos[0]||ls[0];
  var html='';

  // ---- vários empréstimos: o total em cima, a lista embaixo ----
  // Escolha do dono (opção B): a fileira de botões que rolava para o lado saiu.
  // No lugar entra o que ele deve somando tudo — o número que se fala ao telefone —
  // e uma linha fina por empréstimo, empilhadas, sem rolagem lateral.
  var quitados=ls.filter(function(l){return l.paid;});
  var visiveis=ativos.length?ativos:ls;
  if(fichaVerQuitados)visiveis=ls;
  if(visiveis.length>1){
    var totalCli=_r2(visiveis.reduce(function(s,l){return s+(l.paid?0:getBalance(l));},0));
    var maisVelho=visiveis.filter(function(l){return !l.paid;})
      .sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);})[0];
    var subTotal=visiveis.length+' empréstimos';
    if(maisVelho){
      var dv=daysUntil(maisVelho.dueDate);
      subTotal+=dv<0?' · o mais antigo vencido há '+Math.abs(dv)+' dia'+(Math.abs(dv)>1?'s':'')
        :dv===0?' · um vence hoje':' · o próximo vence em '+dv+' dia'+(dv>1?'s':'');
    }
    html+='<div class="bloco" style="margin-top:12px;padding:14px 15px">'
      +'<span class="rot">Deve no total</span>'
      +'<div style="margin:4px 0 2px">'+din(totalCli,30)+'</div>'
      +'<div style="font-size:12.5px;color:var(--dim)">'+esc(subTotal)+'</div></div>';

    html+='<div class="sec"><span class="sec-t">Os empréstimos</span></div>'
      +'<div class="bloco" style="padding:0;overflow:hidden">'
      + visiveis.map(function(l,i){
          var on=l.id===alvo.id, sl=sitLoan(l), dl=daysUntil(l.dueDate);
          var quando=l.paid?'quitado':(dl<0?'venceu há '+Math.abs(dl)+'d':dl===0?'vence hoje':'vence em '+dl+'d');
          return '<button class="emp-linha" aria-pressed="'+on+'"'
            +' onclick="verEmprestimo(\''+_js(l.id)+'\')"'
            +' style="border-left:3px solid '+corSit(sl)+';background:'+(on?'var(--acS)':'var(--pn)')
            +(i<visiveis.length-1?';border-bottom:1px solid var(--ln)':'')+'">'
            +'<span class="emp-linha-t">vence '+_dm(l.dueDate)
              +' · <span style="color:'+corSit(sl)+';font-weight:600">'+esc(quando)+'</span></span>'
            + din(l.paid?loanPrincipal(l):getBalance(l),14,on?'var(--ac)':'var(--tx)')
            +'</button>';
        }).join('')
      +'</div>';
  }
  if(quitados.length&&ativos.length){
    var totQ=_r2(quitados.reduce(function(s,l){return s+loanPrincipal(l);},0));
    html+='<button class="sec-a" style="margin:10px 14px 0;padding:6px 0;background:none;border:none"'
      +' aria-expanded="'+(fichaVerQuitados?'true':'false')+'" onclick="toggleQuitados()">'
      +(fichaVerQuitados?'esconder':'ver')+' '+quitados.length+' já quitado'+(quitados.length>1?'s':'')
      +' · <span class="mono">'+fmt(totQ)+'</span></button>';
  }

  // ---- saldo devedor (ou o aviso de quitado) ----
  var sit=sitLoan(alvo),bal=getBalance(alvo),pagoPer=getPaidPeriod(alvo);
  if(bal>0.009){
    html+='<div class="bloco" style="margin-top:12px;border-left:3px solid '+corSit(sit)+'">'
      +'<div style="padding:14px 15px 15px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:9px">'
        +'<span class="tile-l">Saldo devedor</span>'
        +selo(sitFrase(alvo),corSit(sit),corSitS(sit))+'</div>'
      +'<div style="margin:5px 0 3px">'+din(bal,32)+'</div>'
      +'<div style="font-size:12.5px;color:var(--dim)">de '+fmt(alvo.currentAmount)
        +' · juro '+alvo.interest+'% ao mês · vence '+fmtDate(alvo.dueDate)+'</div>'
      +(pagoPer>0
        ?'<div style="margin-top:11px;height:6px;background:var(--pn2);border-radius:3px;overflow:hidden">'
         +'<div style="height:100%;width:'+Math.min(100,Math.round(pagoPer/(alvo.currentAmount||1)*100))
         +'%;background:var(--gr)"></div></div>'
         +'<div style="font-size:11.5px;color:var(--gr);margin-top:5px;font-weight:600">'
         +fmt(pagoPer)+' já pago neste período</div>':'')
      +'</div></div>';
  }else{
    html+='<div class="bloco" style="margin-top:12px"><div style="padding:18px;text-align:center">'
      +'<span style="color:var(--gr);display:flex;justify-content:center;margin-bottom:6px">'+sv(I.check,26)+'</span>'
      +'<div style="font-weight:700">Sem dívida em aberto</div>'
      +'<div style="font-size:12.5px;color:var(--dim)">Último vencimento em '+fmtDate(alvo.dueDate)+'</div>'
      +'</div></div>';
  }

  // ---- as quatro ações ----
  var parcelado=!!(alvo.parcelas&&alvo.parcelas.length);
  html+='<div class="acoes">'
    +(bal>0.009&&!parcelado
      ?'<button class="acao pri" onclick="abrirReceber(\''+_js(alvo.id)+'\')">'+sv(I.check,18)+'Receber</button>'
      :'<button class="acao" disabled style="opacity:.45">'+sv(I.check,18)+'Receber</button>')
    +((!parcelado&&bal>0.009)
      ?'<button class="acao" onclick="openRenew(\''+_js(alvo.id)+'\')">'+sv(I.cycle,18)+'Renovar</button>'
      :'<button class="acao" disabled style="opacity:.45">'+sv(I.cycle,18)+'Renovar</button>')
    +'<button class="acao" onclick="openReceipt(\''+_js(alvo.id)+'\')">'+sv(I.rec,18)+'Recibo</button>'
    +'<button class="acao" onclick="openHistory(\''+_js(alvo.id)+'\')">'+sv(I.doc,18)+'Documentos</button>'
    +'</div>';

  // ---- parcelas, quando for o caso ----
  if(parcelado){
    var pagas=alvo.parcelas.filter(function(p){return p.paid;}).length;
    html+='<div class="sec"><span class="sec-t">Parcelas · '+pagas+'/'+alvo.parcelas.length+' pagas</span></div>'
      +'<div class="bloco">'+renderParcelasList(alvo)+'</div>'
      +'<div style="font-size:11.5px;color:var(--dim2);padding:8px 16px 0;line-height:1.5">'
      +'Empréstimo parcelado: o recebimento é parcela por parcela, no botão de cada linha. '
      +'Por isso Receber e Renovar ficam apagados aqui.</div>';
  }

  // ---- meu dinheiro com este cliente (soma do cliente inteiro) ----
  var capCli=0,recCli=0,riscoCli=0;
  ls.forEach(function(l){
    var g2=ledger(l);
    capCli+=g2.capitalEmprestado;recCli+=g2.recebidoTotal;riscoCli+=g2.emRisco;
  });
  if(op.dentroDaLista&&!expandedClientHistory[key]){
    // Na lista o detalhe fica atrás de um toque, como sempre foi.
    html+='<div class="sec"><button class="sec-a" style="color:var(--dim)"'
      +' onclick="toggleClientHistory(\''+_js(key)+'\')">Histórico do cliente ▾</button></div>';
  }else{
    html+='<div class="sec"><span class="sec-t">Meu dinheiro com este cliente</span></div>'
      + _capitalBox(capCli,recCli,riscoCli)
      + _blocoPerfil(key);
  }

  // ---- extrato do razão ----
  if(!op.dentroDaLista||expandedClientHistory[key]){
    html+='<div class="sec"><span class="sec-t">Extrato'
      +(ls.length>1?' deste empréstimo':'')+'</span></div>'
      +'<div class="bloco">'+extratoHtml(alvo)+'</div>';
  }

  // ---- o que mais dá para fazer com este cliente ----
  html+='<div style="display:flex;flex-direction:column;gap:8px;margin:16px 14px 0">'
    +'<button class="btn btn-gh" onclick="novoParaCliente(\''+_js(key)+'\')">'+sv(I.plus,18)
      +'Novo empréstimo para '+esc(_primeiroNome(_nomeDoCliente(key)))+'</button>'
    +(ativos.length>1
      ?'<button class="btn btn-gh" onclick="openPayAll(\''+_js(key)+'\')">'+sv(I.check,18)
        +'Pagar todos — '+fmt(_r2(ativos.reduce(function(s,l){return s+getBalance(l);},0)))+'</button>':'')
    +(ativos.length
      ?'<button class="btn-txt" style="color:var(--am)" onclick="moveClientToInad(\''+_js(key)+'\')">'
        +'Mover para inadimplentes</button>':'')
    +(!alvo.paid
      ?'<div class="btn-fila">'
        +'<button class="btn btn-gh" onclick="openEdit(\''+_js(alvo.id)+'\')">'+sv(I.edit,17)+'Editar</button>'
        +'<button class="btn btn-gh" onclick="openAddValue(\''+_js(alvo.id)+'\')">'+sv(I.plus,17)+'Valor</button>'
        +'<button class="btn btn-gh fixo" style="color:var(--rd)" aria-label="Excluir empréstimo"'
          +' onclick="deleteLoan(\''+_js(alvo.id)+'\')">'+sv(I.trash,17)+'</button>'
       +'</div>'
      :'')
    +'</div>';
  return html;
}
function verEmprestimo(id){fichaLoanId=id;renderAll();}
function toggleQuitados(){fichaVerQuitados=!fichaVerQuitados;renderAll();}
function novoParaCliente(key){
  var l=_loansDoCliente(key)[0]||(clients||[]).find(function(c){return clientKey(c.name)===key;});
  if(!l){openForm();return;}
  openForm({name:l.name,phone:l.phone||'',address:l.address||''});

// Selo + frase do perfil deduzido do comportamento (clientPerfil).
function _blocoPerfil(key){
  var perfil=clientPerfil(key);
  if(!perfil.rotulo)return '';
  return '<div style="margin:9px 14px 0">'
    +'<span class="selo" style="background:var(--pn2);color:var(--dim);border:1px solid var(--ln)">'
      +esc(perfil.rotulo)+'</span>'
    +'<div style="font-size:12px;line-height:1.45;color:var(--dim);margin-top:5px">'
      +esc(perfil.frase)+'</div></div>';
}
// ============================================================
// EXTRATO — uma linha por evento do razão, com o saldo ao lado
// ============================================================
function extratoHtml(loan){
  var lg=ledger(loan);
  var periodoAtual=null;
  var linhas=lg.linhas.map(function(li){
    var sep='';
    if(li.periodo!==periodoAtual){
      periodoAtual=li.periodo;
      sep='<div style="display:flex;align-items:center;gap:8px;padding:10px 14px 4px;background:var(--pn)">'
        +'<span style="height:1px;flex:1;background:var(--ln)"></span>'
        +'<span style="font-size:9px;font-weight:700;color:var(--dim2);letter-spacing:.13em">PERÍODO '+li.periodo+'</span>'
        +'<span style="height:1px;flex:1;background:var(--ln)"></span></div>';
    }
    var cor=li.sinal==='+'?'var(--gr)':li.sinal==='-'?'var(--rd)':'var(--dim2)';
    var rot=esc(li.rotulo);
    if(li.tipo==='renovacao'||li.tipo==='emprestimo'||li.tipo==='empréstimo')
      rot+=' <span style="color:var(--am);font-weight:600">· juro '+fmt(li.juroCobrado)+'</span>';
    if(li.atual)rot+=' <span style="font-size:10px;color:var(--am);font-weight:700">(mês atual)</span>';
    if(li.estornado)rot+=' <span style="font-size:10px;color:var(--rd);font-weight:700">(estornado)</span>';
    var sub='';
    if(li.tipo&&li.tipo.indexOf('pagamento')>=0){
      sub=(li.parteCapital>0.004)
        ?fmt(li.parteJuros)+' de juro · '+fmt(li.parteCapital)+' abateu a dívida'
        :fmt(li.parteJuros)+' de juro · não abateu a dívida';
    }else if(li.tipo==='estorno'&&!li.somenteRastro){
      sub='devolveu '+fmt(li.parteCapital)+' de abatimento e '+fmt(li.parteJuros)+' de juro';
    }else if(li.tipo==='desconto'&&li.juroCobrado<-0.004){
      sub='perdoou '+fmt(-li.juroCobrado)+' de juro pendente';
    }
    return sep+'<div class="ext">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'
      +'<div style="min-width:0"><div class="ext-t">'+rot+'</div>'
      +'<div class="ext-d">'+fmtDate(li.data)+(li.nota?' · '+esc(li.nota):'')+'</div></div>'
      +'<div style="text-align:right;flex:none">'
        +(li.sinal
          ?'<div>'+din(li.valor,14,cor)+'</div>'
          :'<div style="font-size:11.5px;color:var(--dim2)">sem dinheiro</div>')
        +'<div class="ext-s">saldo '+fmt(li.saldoDepois)+'</div></div>'
      +'</div>'
      +(sub?'<div class="ext-sub">'+sub+'</div>':'')
      +'</div>';
  }).join('');
  if(!linhas)linhas='<div class="ext" style="color:var(--dim2);font-size:12.5px">Nenhuma movimentação registrada.</div>';
  // Rodapé com os totais do razão
  return linhas
    +'<div style="padding:11px 14px;background:var(--pn2);font-size:12px;color:var(--dim);line-height:1.7">'
    +'<b style="color:var(--tx)">Emprestei</b> '+fmt(lg.capitalEmprestado)
    +' · <b style="color:var(--tx)">Recebi</b> '+fmt(lg.recebidoTotal)
    +' · <b style="color:var(--tx)">Juro ganho</b> <span style="color:var(--gr);font-weight:700">'
    +fmt(lg.jurosRecebido)+'</span>'
    +' · <b style="color:var(--tx)">Desconto</b> '+fmt(lg.descontoTotal)+'</div>';
}

function openPay(id){abrirReceber(id);}          // nome antigo, caminho novo
function renderReceber(){
  var box=document.getElementById('receber-content');
  if(!box)return;
  var loan=loans.find(function(l){return l.id===receberId;});
  if(!loan||loan.paid){
    // Quitou (ou sumiu): não faz sentido continuar aqui.
    if(currentScreen==='receber'){receberId=null;goScreen(clienteAtual?'cliente':'clients');}
    return;
  }
  var parcelado=!!(loan.parcelas&&loan.parcelas.length);
  var bal=getBalance(loan);
  var jp=_r2(ledger(loan).jurosPendente);
  var pagoPer=getPaidPeriod(loan);
  var totalDesc=loanDescontos(loan);
  var html='<div style="padding:14px 14px 0">'
    +'<div class="arch" style="font-size:22px;font-weight:800">Receber</div>'
    +'<div style="font-size:13.5px;color:var(--dim)">'+esc(loan.name)+' · saldo '+fmt(bal)+'</div>'
    +'</div>';

  // ---- o valor domina a tela ----
  html+='<div style="margin:14px 14px 0;background:var(--pn);border:1px solid var(--ac);'
    +'border-radius:14px;padding:13px 15px 15px">'
    +'<label class="rot" for="pay-input">Valor recebido</label>'
    +'<div style="display:flex;align-items:baseline;gap:8px">'
    +'<span class="mono" style="font-size:22px;color:var(--dim2);flex:none">R$</span>'
    +'<input id="pay-input" class="mono" type="number" inputmode="decimal" step="0.01" placeholder="0,00"'
    +' oninput="updatePayBtn(this.value,\''+_js(loan.id)+'\')"'
    +' style="flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:32px;'
    +'padding:2px 0;color:var(--tx)"></div>'
    +'</div>';

  // ---- atalhos com o valor já calculado ----
  var meio=_r2(bal/2);
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 14px 0">'
    + atalho('Tudo',bal,loan.id)
    + (jp>0?atalho('Só o juro',jp,loan.id):atalho('Só o juro',0,loan.id,'juro pago'))
    + '<button class="seg-btn" style="min-height:48px;font-size:14px" onclick="focarValor()">Parcial</button>'
    + '<button class="seg-btn" style="min-height:48px;font-size:14px" onclick="focarDesconto()">Com desconto</button>'
    +'</div>';

  // ---- a conta antes de confirmar ----
  html+='<div class="sec"><span class="sec-t">O que este valor faz</span></div>'
    +'<div class="bloco" id="pay-div">'+divisaoHtml(loan,0)+'</div>'
    +'<div id="pay-split" style="font-size:11.5px;color:var(--dim);padding:8px 16px 0;line-height:1.45">'
    + esc(_juroDoMesHtml(loan))+'</div>';

  // ---- observação e confirmação ----
  html+='<div style="margin:12px 14px 0">'
    +'<label class="rot" for="pay-note">Observação (opcional)</label>'
    +'<input id="pay-note" class="inp" type="text" placeholder="PIX, dinheiro, quem entregou…">'
    +'<button id="btn-conf-pay" class="btn btn-ac" style="margin-top:10px" disabled'
      +' onclick="doPartialModal(\''+_js(loan.id)+'\')">Registrar pagamento</button>'
    +'<button class="btn btn-gh" style="margin-top:8px"'
      +' onclick="doPayment(\''+_js(loan.id)+'\','+bal+',\'\')">Quitar tudo — '+fmt(bal)+'</button>'
    +'<button class="btn-txt" style="width:100%;margin-top:4px" onclick="voltar()">Cancelar</button>'
    +'</div>';

  // ---- o que já foi pago neste período (com estorno) ----
  if((loan.payments||[]).length){
    html+='<div class="sec"><span class="sec-t">Pagamentos deste período</span>'
      +'<span style="font-size:11.5px;color:var(--gr);font-weight:600">'+fmt(pagoPer)+'</span></div>'
      +'<div class="bloco">'+(loan.payments||[]).map(function(p,i){
        return '<div class="kv"><span class="kv-l">'+fmtDate(p.date)
          +(p.note?' · '+esc(p.note):'')+'</span>'
          +'<span style="display:flex;align-items:center;gap:8px">'
          +din(p.value,14,'var(--gr)')
          +'<button class="ico-btn" style="color:var(--rd)"'
          +' title="Estornar este lançamento" aria-label="Estornar '+fmt(p.value)+'"'
          +' onclick="estornoPagamento(\''+_js(loan.id)+'\','+i+')">'+sv(I.undo,16)+'</button></span></div>';
      }).join('')+'</div>'
      +'<div style="font-size:11px;color:var(--dim2);padding:6px 16px 0;line-height:1.45">'
      +'O estorno desfaz um lançamento feito por engano: o saldo volta a subir e fica registrado no extrato.</div>';
  }

  // ---- períodos já fechados (só leitura) ----
  var passados=(loan.history||[]).filter(function(h){
    return h.type&&(h.type.indexOf('pagamento')>=0||h.type==='desconto'||h.type==='estorno');
  });
  if(passados.length){
    html+='<div class="sec"><span class="sec-t">Períodos já fechados</span></div>'
      +'<div class="bloco">'+passados.slice(-8).map(function(h){
        var mm=_histLabel(h.type);
        return '<div class="kv"><span class="kv-l">'+fmtDate(h.date)+' · '+esc(mm.label.replace(/^\S+\s/,''))+'</span>'
          +din(h.value,13.5,mm.sinal==='+'?'var(--gr)':'var(--rd)')+'</div>';
      }).join('')+'</div>'
      +(passados.length>8?'<div style="font-size:11px;color:var(--dim2);padding:6px 16px 0">'
        +'Mostrando os 8 mais recentes — o extrato completo está na ficha.</div>':'');
  }

  // ---- desconto negociado ----
  html+='<div class="sec" id="sec-desconto"><span class="sec-t">Desconto negociado</span>'
    +(totalDesc>0?'<span style="font-size:11.5px;color:var(--dim2)">já concedido '+fmt(totalDesc)+'</span>':'')
    +'</div>';
  if(parcelado){
    html+='<div class="bloco"><div style="padding:12px 14px;font-size:12.5px;color:var(--dim)">'
      +'Empréstimo parcelado: o desconto não se aplica aqui — ajuste na lista de parcelas.</div></div>';
  }else{
    html+='<div class="bloco"><div style="padding:12px 14px">'
      +'<div style="font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:10px">'
      +'Abate o saldo devedor. <b style="color:var(--tx)">Não</b> conta como dinheiro recebido e '
      +'<b style="color:var(--tx)">não</b> entra no lucro — fica registrado como concessão.</div>'
      +'<div class="dupla">'
      +'<div><label class="rot" for="pay-desc">Desconto (R$)</label>'
        +'<input id="pay-desc" class="inp" type="number" inputmode="decimal" placeholder="0,00"></div>'
      +'<div><label class="rot" for="pay-desc-note">Motivo</label>'
        +'<input id="pay-desc-note" class="inp" type="text" placeholder="Ex: acordo"></div>'
      +'</div>'
      +'<button class="btn btn-gh" style="margin-top:10px" onclick="aplicarDesconto(\''+_js(loan.id)+'\')">'
      +sv(I.tag,17)+'Aplicar desconto</button>'
      +'</div></div>';
  }
  box.innerHTML=html+'<div style="height:12px"></div>';
  // NÃO abrir o teclado sozinho: ele cobria os atalhos ao entrar na tela e
  // voltava a subir depois de registrar. Quem abre o teclado é o botão "Parcial".
}
function atalho(rot,v,id,vazio){
  if(v<=0.009){
    return '<button class="seg-btn" disabled style="min-height:48px;font-size:14px;opacity:.5">'
      +rot+' · '+(vazio||'—')+'</button>';
  }
  return '<button class="seg-btn" style="min-height:48px;font-size:14px" onclick="usarAtalho('+v+',\''+_js(id)+'\')">'
    +rot+' · <span class="mono">'+fmt(v)+'</span></button>';
}
function usarAtalho(v,id){
  var el=document.getElementById('pay-input');
  if(el){el.value=String(v);}
  updatePayBtn(v,id);
}
function focarDesconto(){
  var el=document.getElementById('pay-desc');
  if(el&&el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'});
  if(el&&el.focus)el.focus();
}
// A frase de apoio do campo de valor: quanto ainda falta de juro neste mês.
// Sai do jurosPendente do razão — o mesmo número que a prévia e a gravação usam.
function _juroDoMesHtml(loan){
  var jp=_r2(ledger(loan).jurosPendente);
  if(jp<=0)return 'Juro deste mês já está pago · o que entrar abate a dívida.';
  return 'Juro deste mês: '+fmt(jp)+' · o que passar disso abate a dívida.';
}
// A divisão juro/abatimento — sai de previaPagamento, que sai do razão.
function divisaoHtml(loan,v){
  var p=previaPagamento(loan,v);
  var bal=getBalance(loan);
  if(!v||v<=0){
    var jp=_r2(ledger(loan).jurosPendente);
    return kv('Juro pendente deste mês',din(jp,13.5,jp>0?'var(--am)':'var(--gr)'))
      + kv('Saldo devedor',din(bal,15.5),true);
  }
  return kv('Cobre o juro',din(p.juro,13.5))
    + kv('Abate a dívida',din(p.capital,13.5,'var(--gr)'))
    + kv('Fica devendo',din(p.saldoDepois,15.5),true);
}

// Puxa a taxa do histórico do cliente para o formulário. Não mexe em nada se o
// dono já escolheu uma taxa na mão nesta tela (_rateManual) — a decisão dele
// sempre ganha do palpite do app.
function _adotarTaxaDoCliente(){
  if(formData._rateManual)return null;
  var info=clientRate(formData.name);
  if(info)formData.interest=String(info.taxa);
  return info;
}
// A faixa acima dos botões de taxa. Cinza quando o app apenas lembra; âmbar
// quando o dono escolheu uma taxa diferente da que costuma cobrar deste cliente.
// Nunca bloqueia — só conta o que o histórico diz.
function _taxaHintHtml(){
  var info=clientRate(formData.name);
  if(!info)return '';
  var escolhida=parseFloat(formData.interest);
  var difere=!isNaN(escolhida)&&Math.abs(escolhida-info.taxa)>0.001;
  var lista=info.varias?' (este cliente já teve '+info.taxas.map(_fmtTaxa).join(' e ')+')':'';
  // Os hex #fffbeb/#94a3b8 são LEGADO PRESERVADO: a bateria financeira usa esses
  // dois códigos para distinguir "faixa discreta" de "aviso âmbar". As classes
  // hint-ambar/hint-cinza devolvem a cor do tema por cima deles (ver CSS).
  if(difere){
    return '<div id="rate-hint" class="hint-ambar" style="background:#fffbeb;border:1px solid var(--am);'
      +'border-radius:9px;padding:8px 11px;margin-bottom:7px;font-size:12px;line-height:1.45">'
      +'Atenção: você cobrava '+_fmtTaxa(info.taxa)+' deste cliente.'+esc(lista)+'</div>';
  }
  return '<div id="rate-hint" class="hint-cinza" style="padding:0 2px 7px;font-size:12px;'
    +'line-height:1.45;color:#94a3b8">'
    +'Você cobrou '+_fmtTaxa(info.taxa)+' de '+esc(_primeiroNome(formData.name))
    +(info.quando?' no empréstimo de '+fmtDate(info.quando):'')
    +' — toque em outra taxa para mudar.'+esc(lista)+'</div>';
}
// Redesenha só a faixa e os botões de taxa. Chamado enquanto o dono DIGITA o
// nome: um renderForm() inteiro aqui tiraria o foco do campo a cada tecla.
function _syncTaxaCliente(){
  _adotarTaxaDoCliente();
  var hint=document.getElementById('rate-hint');
  var wrap=document.getElementById('rate-hint-wrap');
  if(wrap)wrap.innerHTML=_taxaHintHtml();
  else if(hint)hint.outerHTML=_taxaHintHtml();
  var seg=document.getElementById('rate-seg');
  if(seg&&!formData._rateManual){
    var atual=String(formData.interest);
    var btns=seg.querySelectorAll('.seg-btn');
    var achou=false;
    btns.forEach(function(b){
      var v=b.getAttribute('data-rate');
      var on=(v!=null&&v===atual);
      if(on)achou=true;
      b.classList[on?'add':'remove']('active');
    });
    var outro=document.getElementById('btn-outro-rate');
    if(outro){
      outro.textContent=achou?'Outro':atual+'%';
      outro.classList[achou?'remove':'add']('active');
    }
  }
  updatePreview();
}

function saveDoc(e,tipo){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var max=1000,w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}
      else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var data;try{data=cv.toDataURL('image/jpeg',0.7);}catch(err){data=ev.target.result;}
      if(tipo==='rg')formData.docRG=data;else formData.docResidencia=data;
      renderForm();
    };
    img.onerror=function(){if(tipo==='rg')formData.docRG=ev.target.result;else formData.docResidencia=ev.target.result;renderForm();};
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
}

// Escolher da lista de sugestões traz também a TAXA do cliente — é o dado que o
// dono mais esquece. Zera _rateManual porque escolher outro cliente é começar
// outra decisão: a taxa que ele tinha tocado era para o nome anterior.
function fillClient(idx){
  var c=clients[idx];if(!c)return;
  formData.name=c.name;formData.phone=c.phone||'';formData.address=c.address||'';
  formData._rateManual=false;
  _adotarTaxaDoCliente();
  renderForm();
}
// Remove um cliente salvo da lista de sugestões (e da nuvem).
function removeClient(idx){
  var c=clients[idx];if(!c)return;
  pedirConfirmacao({titulo:'Remover da lista de clientes?',
    texto:'"'+c.name+'" sai das sugestões. Empréstimos já lançados não são apagados.',
    ok:'Remover',perigo:true},function(){_removeClientExec(idx);});
}
function _removeClientExec(idx){
  var c=clients[idx];if(!c)return;
  var k=clientKey(c.name);
  var temEmp=loans.some(function(l){return clientKey(l.name)===k;});
  clients.splice(idx,1);
  addTombstone('clientes',c.id);
  save();
  if(temEmp)showToast('"'+c.name+'" tem empréstimo ativo, por isso continua na lista.','warn');
  else showToast('Cliente "'+c.name+'" removido');
  showSugg();
}
function addLoan(){
  var amt=parseFloat(formData.amount);
  if(!formData.name.trim()||!amt||amt<=0){showToast('Preencha nome e valor','error');return;}
  var rate=parseFloat(formData.interest)/100;
  var start=formData.startDate||today();
  var nParc=parseInt(formData.parcelas)||1;
  var loan={
    id:uid(),name:formData.name.trim(),phone:formData.phone||'',address:formData.address||'',
    originalAmount:amt,principal:amt,interest:parseFloat(formData.interest),
    startDate:start,note:formData.note||'',
    paid:false,payments:[],
    docRG:'',docResidencia:'',
    // rate: a taxa fica congelada no lancamento — mudar o juro do cliente depois
    // nao pode reescrever o lucro de meses ja fechados.
    history:[{date:start,type:'emprestimo',value:amt,rate:parseFloat(formData.interest),note:'Empréstimo de '+fmt(amt)+' · Juros '+formData.interest+'%'+(nParc>1?' · '+nParc+'x':'')}]
  };
  // Fotos vão para o IndexedDB; o loan guarda só a chave
  ['docRG','docResidencia'].forEach(function(f){
    if(isDataUrl(formData[f])){var key='doc_'+loan.id+'_'+f;loan[f]=key;docSet(key,formData[f]);}
  });
  if(nParc>1){
    loan.parcelas=[];
    var acc=0;
    for(var k=1;k<=nParc;k++){
      var pPrin=(k<nParc)?parseFloat((amt/nParc).toFixed(2)):parseFloat((amt-acc).toFixed(2));
      acc=parseFloat((acc+pPrin).toFixed(2));
      loan.parcelas.push({id:uid(),n:k,principal:pPrin,currentAmount:parseFloat((pPrin*(1+rate)).toFixed(2)),dueDate:addDays(start,30*k),paid:false});
    }
    syncParceledLoan(loan);
  }else{
    loan.currentAmount=parseFloat((amt*(1+rate)).toFixed(2));
    loan.dueDate=addDays(start,30);
  }
  loans.push(loan);save(loan.id);renderAll();closeModal();
  showToast('✅ Empréstimo de '+loan.name+(nParc>1?' ('+nParc+'x)':'')+' adicionado');
}


// ============================================================
// PAYMENTS — múltiplos pagamentos por período
// ============================================================
// A janela de pagamento virou TELA (renderReceber). Os ids dos campos
// (pay-input, pay-note, pay-desc, pay-desc-note, btn-conf-pay) foram
// preservados de propósito: as funções abaixo continuam as mesmas.
// Estorno de um pagamento parcial lancado por engano NO PERIODO CORRENTE.
// O saldo volta a subir e fica um rastro no historico (nada some sem registro).
// idx e a posicao do pagamento em loan.payments (lancamentos antigos podem nao
// ter id, por isso a posicao — a janela e sempre redesenhada antes do clique).
function estornoPagamento(id,idx){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  idx=parseInt(idx,10);
  var p=(loan.payments||[])[idx];
  if(!p){showToast('Lançamento não encontrado (o período pode já ter sido fechado)','error');return;}
  pedirConfirmacao({titulo:'Estornar este pagamento?',
    texto:fmt(p.value)+' lançado em '+fmtDate(p.date)+'.\n'
      +'O saldo devedor volta a subir '+fmt(p.value)+'. O estorno fica registrado no extrato.',
    ok:'Estornar',perigo:true},function(){_estornoExec(id,idx);});
}
function _estornoExec(id,idx){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  var p=(loan.payments||[])[idx];if(!p)return;
  loan.payments.splice(idx,1);
  loan.history=loan.history||[];
  // pagamentoOriginal: a cópia do pagamento desfeito. Vai dentro do JSONB
  // history (nenhuma coluna nova). Sem ela o razão não teria como recriar o
  // pagamento no extrato nem fechar a conta — veja o comentário em _ledgerCalc.
  loan.history.push({type:'estorno',date:today(),value:p.value,
    pagamentoOriginal:{date:p.date,value:p.value,note:p.note||''},
    note:'Estorno do pagamento de '+fmt(p.value)+' lançado em '+fmtDate(p.date)+(p.note?' ('+p.note+')':'')});
  save(id);renderAll();               // save() ja marca o emprestimo como pendente de sincronizacao
  showToast('↩️ Estorno de '+fmt(p.value)+' registrado · saldo '+fmt(getBalance(loan)));
  openPay(id);                        // redesenha a janela com os numeros novos
}
// Desconto lancado pela janela de pagamento
function aplicarDesconto(id){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  if(loan.parcelas&&loan.parcelas.length){showToast('Empréstimo parcelado não aceita desconto por aqui','error');return;}
  var v=parseFloat((document.getElementById('pay-desc')||{}).value)||0;
  var motivo=((document.getElementById('pay-desc-note')||{}).value||'').trim();
  if(v<=0){showToast('⚠️ Informe o valor do desconto','error');return;}
  var bal=getBalance(loan);
  if(v>bal+0.009){showToast('Desconto maior que o saldo ('+fmt(bal)+')','error');return;}
  var confirmar=function(){
    pedirConfirmacao({titulo:'Conceder desconto de '+fmt(v)+'?',
      texto:'Saldo: '+fmt(bal)+' → '+fmt(parseFloat((bal-v).toFixed(2)))+'\n'
        +'Não entra como dinheiro recebido nem no lucro.',
      ok:'Conceder'},function(){_descontoExec(id,v,motivo);});
  };
  if(!motivo){
    pedirConfirmacao({titulo:'Sem informar o motivo?',
      texto:'Conceder '+fmt(v)+' de desconto sem escrever o porquê. Daqui a seis meses o extrato não vai saber explicar.',
      ok:'Seguir assim'},confirmar);
    return;
  }
  confirmar();
}
function _descontoExec(id,v,motivo){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  _regDesconto(loan,v,motivo);
  save(id);renderAll();closeModal();
  showToast('🏷️ Desconto de '+fmt(v)+' registrado'+(loan.paid?' · dívida encerrada':' · saldo '+fmt(getBalance(loan))));
}
function updatePayBtn(val,id){
  var v=parseFloat(val)||0;
  var btn=document.getElementById('btn-conf-pay');
  if(btn){btn.disabled=v<=0;btn.style.opacity=v<=0?'.45':'1';}
  var loan=id?loans.find(function(l){return l.id===id;}):null;
  // Prévia ao vivo da divisão juro/abatimento — mesma conta que o razão fará.
  var bloco=document.getElementById('pay-div');
  if(bloco&&loan)bloco.innerHTML=divisaoHtml(loan,v);
  var box=document.getElementById('pay-split');
  if(!box)return;
  // o bloco de cima já mostra a divisão; aqui fica só o contexto do mês

function doPartialModal(id){
  var el=document.getElementById('pay-input');if(!el)return;
  var note=(document.getElementById('pay-note')||{}).value||'';
  var v=parseFloat(el.value)||0;
  if(v<=0)return;
  _fecharTeclado();          // o teclado do celular não pode ficar aberto depois de registrar
  doPayment(id,v,note);
}
// Tira o foco de qualquer campo: no celular é isso que faz o teclado descer.
function _fecharTeclado(){
  try{
    var a=document.activeElement;
    if(a&&a.blur&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'))a.blur();
  }catch(e){}
}
// Atalho "Parcial": limpa o campo e abre o teclado para o dono digitar o valor exato.
function focarValor(){
  var el=document.getElementById('pay-input');if(!el)return;
  el.value='';
  updatePayBtn('',receberId);
  el.focus();
  try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}
}
function doPayment(id,amount,note){
  var loan=loans.find(function(l){return l.id===id;});if(!loan||amount<=0)return;
  var balance=getBalance(loan);
  amount=parseFloat(amount);
  if(amount>=balance-0.01){
    // Final — quita
    (loan.payments||[]).forEach(function(p){loan.history.push({date:p.date,type:'pagamento_parcial',value:p.value,note:p.note||''});});
    loan.history.push({date:today(),type:'pagamento_final',value:amount,note:(note?note+' · ':'')+'Dívida quitada! Pagamento de '+fmt(amount)});
    loan.paid=true;loan.currentAmount=0;loan.payments=[];
    showToast('✅ Dívida de '+loan.name+' quitada!');
  }else{
    // Parcial — adiciona ao array de pagamentos do período
    loan.payments=loan.payments||[];
    loan.payments.push({id:uid(),date:today(),value:amount,note:note||''});
    showToast('💳 '+fmt(amount)+' registrado para '+loan.name);
  }
  save(id);renderAll();closeModal();
}

function updateRenewPreview(){

    +(desc>0?'<div class="preview-row"><span>Saldo após desconto</span><span style="font-weight:700">'+fmt(base)+'</span></div>':'')
    +'<div class="preview-row"><span>Juros '+loan.interest+'% sobre saldo</span><span style="color:var(--rd)">+'+fmt(juros)+'</span></div>'
    +'<div class="preview-row total"><span>Novo total (próx. mês)</span><span style="color:var(--ac)">'+fmt(newTotal)+'</span></div>'

    +(base<=0?'<div style="font-size:10px;color:var(--gr);margin-top:4px">O desconto zera o saldo: a dívida será encerrada por acordo, sem renovação.</div>':'')

function doRenew(id){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  // 1) desconto negociado (se houver) — abate o saldo antes do juro
  var desc=parseFloat((document.getElementById('rn-desc')||{}).value)||0;
  var dmot=((document.getElementById('rn-desc-note')||{}).value||'').trim();
  if(desc>0){
    var bal0=getBalance(loan);
    if(desc>bal0+0.009){showToast('Desconto maior que o saldo ('+fmt(bal0)+')','error');return;}
    pedirConfirmacao({titulo:'Renovar com '+fmt(desc)+' de desconto?',
      texto:'Saldo: '+fmt(bal0)+' → '+fmt(parseFloat((bal0-desc).toFixed(2)))+' antes do juro.',
      ok:'Renovar'},function(){_doRenewExec(id,desc,dmot);});
    return;
  }
  _doRenewExec(id,0,'');
}
function _doRenewExec(id,desc,dmot){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  if(desc>0){
    _regDesconto(loan,desc,dmot);
    if(loan.paid){                       // desconto zerou tudo: nao ha o que renovar
      save(id);renderAll();closeModal();
      showToast('🏷️ Desconto de '+fmt(desc)+' — saldo zerado, dívida encerrada');
      return;
    }
  }
  // 2) renovacao normal: juro do mes cheio sobre o saldo
  var balance=getBalance(loan);
  var newTotal=parseFloat((balance*(1+loan.interest/100)).toFixed(2));
  // Move pagamentos do período para histórico
  (loan.payments||[]).forEach(function(p){loan.history.push({date:p.date,type:'pagamento_parcial',value:p.value,note:p.note||''});});
  loan.history.push({date:today(),type:'renovacao',value:balance,rate:loan.interest,
    note:'Renovado. Saldo: '+fmt(balance)+'. Juros '+loan.interest+'%: '+fmt(balance*loan.interest/100)+'. Novo total: '+fmt(newTotal)});
  loan.currentAmount=newTotal;
  loan.originalAmount=balance;
  loan.startDate=today();
  loan.dueDate=addDays(today(),30);
  loan.payments=[];
  save(id);renderAll();closeModal();
  showToast('🔄 Renovado! Novo total: '+fmt(newTotal)+(desc>0?' (desconto de '+fmt(desc)+')':''));
}

function updateEditPreview(){
  var l=loans.find(function(x){return x.id===editingId;});if(!l)return;
  var box=document.getElementById('ed-preview');if(!box)return;
  var amount=parseFloat((document.getElementById('ed-amount')||{}).value)||0;
  var rate=parseFloat((document.getElementById('ed-int')||{}).value)||0;
  var paid=getPaidPeriod(l);
  // Ja renovado: mostra saldo antes -> depois (so a diferenca entra)
  if(loanRenovacoes(l)>0){
    var antes=getBalance(l);
    var dif=parseFloat((amount-loanPrincipal(l)).toFixed(2));
    var delta=parseFloat((dif*(1+rate/100)).toFixed(2));
    var depois=parseFloat((antes+delta).toFixed(2));

      +'<div class="preview-row"><span>Diferença no valor emprestado</span><span style="color:'+(dif<0?'var(--gr)':'var(--rd)')+'">'+(dif>=0?'+':'')+fmt(dif)+'</span></div>'
      +'<div class="preview-row"><span>Aplicado ao saldo (com juros '+rate+'%)</span><span style="color:'+(delta<0?'var(--gr)':'var(--rd)')+'">'+(delta>=0?'+':'')+fmt(delta)+'</span></div>'
      +'<div class="preview-row total"><span>Saldo depois</span><span style="color:var(--ac)">'+fmt(depois)+'</span></div>'

  var total=amount*(1+rate/100);
  box.innerHTML='<div class="preview-box"><div class="preview-label">Recalcular</div>'
    +'<div class="preview-row"><span>Valor emprestado</span><span>'+fmt(amount)+'</span></div>'
    +'<div class="preview-row"><span>Juros ('+rate+'%)</span><span style="color:var(--rd)">+'+fmt(amount*rate/100)+'</span></div>'
    +'<div class="preview-row total"><span>Total a receber</span><span style="color:var(--ac)">'+fmt(total)+'</span></div>'
    +(paid>0?'<div class="preview-row"><span>Já pago neste período</span><span style="color:var(--gr)">'+fmt(paid)+'</span></div><div class="preview-row total"><span>Saldo restante</span><span>'+fmt(Math.max(0,total-paid))+'</span></div>':'')

function saveEdit(id){
  var l=loans.find(function(x){return x.id===id;});if(!l)return;
  var name=document.getElementById('ed-name').value.trim();
  var phone=document.getElementById('ed-phone').value;
  var addr=document.getElementById('ed-addr').value;
  var note=(document.getElementById('ed-note')||{}).value||'';
  l.name=name||l.name;l.phone=phone;l.address=addr;l.note=note;
  if(!(l.parcelas&&l.parcelas.length)){
    var amount=parseFloat(document.getElementById('ed-amount').value);
    if(isNaN(amount)||amount<=0)amount=loanPrincipal(l);
    var interest=parseFloat(document.getElementById('ed-int').value);
    if(isNaN(interest))interest=l.interest;
    var start=document.getElementById('ed-start').value||l.startDate;
    var due=document.getElementById('ed-due').value||l.dueDate;
    if(loanRenovacoes(l)===0){
      // Nunca renovado: recalcular do zero esta certo (nao ha juros acumulado a perder)
      l.principal=parseFloat(amount.toFixed(2));
      l.originalAmount=parseFloat(amount.toFixed(2));
      l.interest=interest;
      l.currentAmount=parseFloat((amount*(1+interest/100)).toFixed(2));
    }else{
      // Ja renovado: o saldo acumulado e sagrado. So a DIFERENCA entra.
      var antes=loanPrincipal(l);
      var dif=parseFloat((amount-antes).toFixed(2));
      l.interest=interest;
      if(dif!==0){
        var saldoAntes=l.currentAmount||0;
        var delta=parseFloat((dif*(1+interest/100)).toFixed(2));
        l.currentAmount=parseFloat((saldoAntes+delta).toFixed(2));
        l.principal=parseFloat(amount.toFixed(2));
        l.originalAmount=parseFloat(((l.originalAmount||0)+dif).toFixed(2));
        l.history=l.history||[];
        l.history.push({type:'ajuste',date:today(),value:delta,
          note:'Ajuste do valor emprestado: '+fmt(antes)+' → '+fmt(amount)+'. Saldo '+(delta>=0?'+':'')+fmt(delta)+' (diferença de '+fmt(dif)+' com juros '+interest+'%). Saldo: '+fmt(saldoAntes)+' → '+fmt(l.currentAmount)});
      }
    }
    l.startDate=start;l.dueDate=due;
  }
  editingId=null;
  save(id);renderAll();closeModal();showToast('✅ Atualizado!');
}

// Rotulo, cor e sinal de cada tipo de lancamento do historico.
// Novos tipos: desconto (abate saldo, NAO e dinheiro recebido) e estorno
// (pagamento lancado por engano e desfeito).
function _histLabel(t,current){
  if(t==='emprestimo'||t==='empréstimo')return{label:'Emprestei',cor:'var(--ac)',valCor:'var(--rd)',sinal:'-'};
  if(t==='pagamento_final')return{label:'Quitado',cor:'var(--gr)',valCor:'var(--gr)',sinal:'+'};
  if(t==='renovacao')return{label:'Rolou para o mês seguinte',cor:'var(--am)',valCor:'var(--am)',sinal:'+'};
  if(t==='ajuste')return{label:'Ajuste',cor:'var(--ac)',valCor:'var(--ac)',sinal:'+'};
  if(t==='desconto')return{label:'Desconto',cor:'var(--gr)',valCor:'var(--gr)',sinal:'-'};

function moveToInad(id){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  var outros=loans.filter(function(l){return clientKey(l.name)===clientKey(loan.name)&&l.id!==id&&!l.paid;}).length;
  var aviso='Mover só este empréstimo de '+loan.name+' ('+fmt(getBalance(loan))+') para inadimplentes?';
  if(outros>0)aviso+='\n\nOs outros '+outros+' empréstimo(s) ativo(s) deste cliente continuam normais.';
  if(loan.parcelas&&loan.parcelas.length)aviso+='\n\n⚠️ Empréstimo parcelado: as parcelas viram um saldo único de '+fmt(getBalance(loan))+'.';
  pedirConfirmacao({titulo:'Mover para inadimplentes?',texto:aviso,ok:'Mover'},function(){
    pedirTexto({titulo:'Por que ele virou inadimplente?',
      texto:'Fica registrado na ficha dele.',rotulo:'Motivo',
      dica:'sumiu, número desligado…',ok:'Mover'},function(motivo){
      _moveToInadExec(id,motivo);
    });
  });
}
function _moveToInadExec(id,motivo){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  if(motivo===null||motivo===undefined)return;   // desistiu: nao move nada
  motivo=String(motivo).trim()||'Sem contato';
  var saldo=getBalance(loan);
  _histPagamentosPeriodo(loan); // preserva no historico o que ele ja tinha pago
  inadimplentes.push({
    id:loan.id,name:loan.name,phone:loan.phone||'',address:loan.address||'',
    originalAmount:loan.originalAmount,currentAmount:saldo,
    startDate:loan.startDate,dueDate:loan.dueDate,interest:loan.interest,
    docRG:loan.docRG||'',docResidencia:loan.docResidencia||'',
    motivo:motivo,movidoEm:today(),history:loan.history||[]
  });
  loans=loans.filter(function(l){return l.id!==id;});
  // saiu de verdade da tabela emprestimos: sem isto ele volta no proximo pull
  addTombstone('emprestimos',id);
  delete expandedCards[id];deleteConfirm=null;
  saveInad(id);save();renderAll();closeModal();
  showToast('⚠️ Movido para inadimplentes');
}
// Move os pagamentos do periodo atual para o historico (nao se perde o que ja foi pago)
function _histPagamentosPeriodo(loan){
  if(!loan)return;
  loan.history=loan.history||[];
  (loan.payments||[]).forEach(function(p){
    loan.history.push({date:p.date,type:'pagamento_parcial',value:p.value,note:p.note||''});
  });
  loan.payments=[];
}
function moveClientToInad(key){
  var clientLoans=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;});
  if(!clientLoans.length){showToast('Cliente não tem empréstimos ativos');return;}
  var nome=clientLoans[0].name;
  pedirTexto({titulo:'Marcar '+nome+' como inadimplente?',

      +' da lista normal. O juro continua correndo.',
    rotulo:'Motivo',dica:'sumiu, número desligado…',ok:'Mover'},function(motivo){
    _moveClientToInadExec(key,motivo);
  });
}
function _moveClientToInadExec(key,motivo){
  var clientLoans=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;});
  if(!clientLoans.length)return;
  var nome=clientLoans[0].name;
  if(motivo===null||motivo===undefined)return;
  motivo=String(motivo).trim()||'Sem contato';
  var movidos=[];
  clientLoans.forEach(function(loan){
    var saldo=getBalance(loan);
    _histPagamentosPeriodo(loan); // preserva no historico o que ele ja tinha pago
    inadimplentes.push({
      id:loan.id,name:loan.name,phone:loan.phone||'',address:loan.address||'',
      originalAmount:loan.originalAmount,currentAmount:saldo,
      startDate:loan.startDate,dueDate:loan.dueDate,interest:loan.interest,
      docRG:loan.docRG||'',docResidencia:loan.docResidencia||'',
      motivo:motivo,movidoEm:today(),history:loan.history||[]
    });
    movidos.push(loan.id);
    addTombstone('emprestimos',loan.id); // saiu de verdade da tabela emprestimos
    delete expandedCards[loan.id];
  });
  loans=loans.filter(function(l){return!(clientKey(l.name)===key&&!l.paid);});
  delete expandedGroups[key];deleteConfirm=null;
  saveInad(movidos);save();renderAll();
  showToast('⚠️ '+nome+' movido para inadimplentes');
}

// Report filter state
var _rPeriod='all';var _rStatus='all';var _rClient='';var _rFrom='';var _rTo='';var expandedReportGroups={};

function getReportRange(){
  if(_rPeriod==='custom')return{from:_rFrom||null,to:_rTo||null};
  if(_rPeriod==='all')return{from:null,to:null};
  var now=new Date();var c=new Date(now);
  if(_rPeriod==='1m')c.setMonth(c.getMonth()-1);
  else if(_rPeriod==='3m')c.setMonth(c.getMonth()-3);
  else if(_rPeriod==='6m')c.setMonth(c.getMonth()-6);
  else if(_rPeriod==='1y')c.setFullYear(c.getFullYear()-1);
  return{from:dStr(c),to:today()};
}
function reportFiltered(){
  var r=getReportRange();var q=(_rClient||'').trim().toLowerCase();
  return loans.filter(function(l){
    if(!loanActiveInRange(l,r.from,r.to))return false;
    if(_rStatus==='active'&&l.paid)return false;
    if(_rStatus==='overdue'&&(l.paid||daysUntil(l.dueDate)>=0))return false;
    if(_rStatus==='paid'&&!l.paid)return false;
    if(q&&(l.name||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
// Inadimplentes que entram no relatorio (mesmos filtros de periodo e nome).
// Nos filtros "Ativos" e "Quitados" eles nao aparecem — nao sao nem um nem outro.
function reportFilteredInad(){
  if(_rStatus==='active'||_rStatus==='paid')return [];
  var r=getReportRange();var q=(_rClient||'').trim().toLowerCase();
  return (inadimplentes||[]).filter(function(i){
    if(!loanActiveInRange(i,r.from,r.to))return false;
    if(q&&(i.name||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
// Valor curto para caber embaixo de uma barra estreita
function _curto(v){
  v=Math.round(v||0);
  if(v>=10000)return (Math.round(v/100)/10).toString().replace('.',',')+'k';
  return v.toLocaleString('pt-BR');
}
var _MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
// GRÁFICO DO LUCRO POR MÊS — seis meses, tirados de jurosRecPeriodo().
// Nenhum número novo é inventado aqui: é a mesma função que alimenta o painel.
function graficoLucro(){
  var hoje=new Date();
  var regs=allRecords(),barras=[],max=0;
  for(var i=5;i>=0;i--){
    var d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
    var ini=dStr(d);
    var fim=dStr(new Date(d.getFullYear(),d.getMonth()+1,1));
    var v=_r2(regs.reduce(function(s,l){return s+jurosRecPeriodo(l,ini,fim);},0));
    if(v>max)max=v;
    barras.push({rot:_MESES[d.getMonth()],v:v,atual:(i===0)});
  }
  var corpo=barras.map(function(b){
    var h=max>0?Math.max(2,Math.round(b.v/max*100)):2;
    return '<div class="graf-c">'
      +'<div class="graf-v">'+(b.v>0?_curto(b.v):'—')+'</div>'
      +'<div class="graf-b'+(b.atual?' hoje':'')+'" style="height:'+h+'%"></div>'
      +'<div class="graf-m"'+(b.atual?' style="color:var(--ac);font-weight:700"':'')+'>'+b.rot+'</div>'
      +'</div>';
  }).join('');
  var atual=barras[5].v,anterior=barras[4].v;
  var dif='';
  if(anterior>0){
    var pc=Math.round((atual-anterior)/anterior*100);
    dif='<span style="font-size:12px;font-weight:700;color:'+(pc>=0?'var(--gr)':'var(--rd)')+'">'
      +(pc>=0?'+':'')+pc+'% em '+barras[5].rot+'</span>';
  }
  return '<div class="bloco" style="margin-top:12px"><div style="padding:13px 15px 15px">'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'
    +'<span class="tile-l">Lucro por mês · juro recebido</span>'+dif+'</div>'
    +'<div class="graf">'+corpo+'</div></div></div>';
}
// Contador por situação. O style de linha nas etiquetas é LEGADO PRESERVADO:
// a bateria financeira confere esse trecho de HTML letra por letra. O CSS
// (.cnt div[style^="font-size:9px"]) devolve a cor do tema por cima dele.
function cnt(n,rot,cor,corLegado){

  });

// Planilha do que está filtrado. Só repete números que as telas já mostram.
function exportarCSV(){
  var linhas=[['Cliente','Telefone','Emprestado','Recebido','Juro ganho','Desconto',
               'Saldo','Início','Vencimento','Situação'].join(';')];
  var add=function(l,situacao){
    var g=ledger(l);
    linhas.push([
      '"'+String(l.name||'').replace(/"/g,'""')+'"','"'+(l.phone||'')+'"',
      loanPrincipal(l).toFixed(2).replace('.',','),
      g.recebidoTotal.toFixed(2).replace('.',','),
      g.jurosRecebido.toFixed(2).replace('.',','),
      g.descontoTotal.toFixed(2).replace('.',','),
      getBalance(l).toFixed(2).replace('.',','),
      fmtDate(l.startDate),fmtDate(l.dueDate),situacao
    ].join(';'));
  };
  reportFiltered().forEach(function(l){
    add(l,l.paid?'Quitado':(daysUntil(l.dueDate)<0?'Vencido':'Ativo'));
  });
  reportFilteredInad().forEach(function(i){add(i,'Inadimplente');});
  if(linhas.length===1){showToast('Nada para exportar com estes filtros','warn');return;}
  try{
    var blob=new Blob(['﻿'+linhas.join('\n')],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='emprestimos-'+today()+'.csv';a.click();
    URL.revokeObjectURL(url);
    showToast('Planilha baixada ('+(linhas.length-1)+' linhas)');
  }catch(e){showToast('Não foi possível gerar a planilha aqui','error');}
}

    +'<input id="payall-note" type="text" placeholder="Ex: PIX, dinheiro..." style="width:100%;box-sizing:border-box;background:var(--pn2);border:0.5px solid var(--ln);border-radius:8px;padding:9px 12px;font-size:12px;font-family:inherit;outline:none"></div>'
    +'<button class="btn-primary" onclick="doPayAll(\''+key+'\')"  style="width:100%">Confirmar pagamento</button>');
}
function doPayAll(key){
  var val=parseFloat((document.getElementById('payall-val')||{}).value||0);
  var note=(document.getElementById('payall-note')||{}).value||'';
  if(!val||val<=0){showToast('Informe o valor','error');return;}
  var clientLoans=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;});
  var remaining=val, pagos=[];
  clientLoans.sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);});
  clientLoans.forEach(function(loan){
    if(remaining<=0)return;
    if(loan.parcelas&&loan.parcelas.length){
      loan.parcelas.slice().sort(function(a,b){return new Date(a.dueDate+'T00:00:00')-new Date(b.dueDate+'T00:00:00');}).forEach(function(p){
        if(remaining<=0||p.paid)return;
        if(remaining>=(p.currentAmount||0)-0.01){
          remaining=parseFloat((remaining-p.currentAmount).toFixed(2));
          p.paid=true;p.paidDate=today();
          loan.history.push({date:today(),type:'pagamento_final',value:p.currentAmount,note:'Parcela '+p.n+' (pagar tudo)'});
        }
      });
      // Sobra menor que a próxima parcela: abate parcialmente em vez de sumir
      if(remaining>0.009){
        var prox=loan.parcelas.filter(function(p){return!p.paid;}).sort(function(a,b){return new Date(a.dueDate+'T00:00:00')-new Date(b.dueDate+'T00:00:00');})[0];
        if(prox){
          var ap=Math.min(remaining,prox.currentAmount||0);
          prox.currentAmount=parseFloat(((prox.currentAmount||0)-ap).toFixed(2));
          remaining=parseFloat((remaining-ap).toFixed(2));
          loan.history.push({date:today(),type:'pagamento_parcial',value:ap,note:'Abatimento parcial parcela '+prox.n+' (pagar tudo)'});
        }
      }
      syncParceledLoan(loan);
      return;
    }
    var bal=getBalance(loan);
    var pay=Math.min(remaining,bal);
    remaining=parseFloat((remaining-pay).toFixed(2));
    if(pay>=bal){
      loan.paid=true;
      loan.history.push({date:today(),type:'pagamento_total',description:'Pagamento total (pagar tudo)',value:pay,note:note});
      loan.payments=[];
    }else{
      loan.payments.push({id:Date.now()+'_'+loan.id,date:today(),value:pay,note:note||'Pagar tudo parcial'});
    }
    if(pagos.indexOf(loan.id)<0)pagos.push(loan.id);
  });
  save(pagos);renderAll();closeModal();
  showToast('✅ Pagamento de '+fmt(val)+' registrado!');
}

function sendWA(id){
  var l=loans.find(function(x){return x.id===id;});if(!l||!l.phone)return;

    :'Olá '+l.name+'! Lembrando que seu empréstimo vence em '+fmtDate(l.dueDate)+'. Saldo: *'+fmt(balance)+'*.';

// Junta todas as fotos referenciadas (IndexedDB ou base64 legado) num mapa {chave:base64}
function collectDocs(){
  var refs=[];
  loans.concat(inadimplentes||[]).forEach(function(o){
    ['docRG','docResidencia'].forEach(function(f){if(o[f]&&!isDataUrl(o[f]))refs.push(o[f]);});
  });
  if(!refs.length)return Promise.resolve({});
  return Promise.all(refs.map(function(k){return docGet(k).then(function(d){return{k:k,d:d};}).catch(function(){return{k:k,d:null};});}))
    .then(function(list){var m={};list.forEach(function(x){if(x.d)m[x.k]=x.d;});return m;});
}
function buildBackup(){
  return collectDocs().then(function(docs){
    return {loans:loans,clients:clients,inadimplentes:inadimplentes,docs:docs,exportedAt:new Date().toISOString()};
  });
}
function markBackup(){localStorage.setItem('emp_last_backup',String(Date.now()));}
function downloadBackup(){buildBackup().then(function(obj){var data=JSON.stringify(obj,null,2);var blob=new Blob([data],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='emprestimos-'+today()+'.json';a.click();URL.revokeObjectURL(url);markBackup();showToast('📥 Backup baixado!');});}
function copyBackup(){buildBackup().then(function(obj){navigator.clipboard.writeText(JSON.stringify(obj)).then(function(){markBackup();showToast('📋 Copiado!');});});}
function loadFile(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var el=document.getElementById('restore-input');if(el)el.value=ev.target.result;};r.readAsText(f);}
// Marca para exclusão tudo que existe hoje no aparelho e não veio no arquivo.
function _tombstonarAusentes(tabela,atuais,doArquivo){
  var vivos={};
  (doArquivo||[]).forEach(function(o){if(o&&o.id)vivos[o.id]=1;});
  (atuais||[]).forEach(function(o){if(o&&o.id&&!vivos[o.id])addTombstone(tabela,o.id);});
}
function restoreBackup(){
  var raw=(document.getElementById('restore-input')||{}).value||'';
  if(!raw.trim()){showToast('Cole os dados primeiro','error');return;}
  try{
    var p=JSON.parse(raw);
    if(!Array.isArray(p.loans))throw new Error('inválido');
    // Restaurar significa "este arquivo passa a ser a verdade". O que existe
    // aqui e NAO esta no arquivo vira exclusao de verdade — sem isto, esses
    // registros sobreviviam na nuvem e voltavam na proxima sincronizacao,
    // que era como um aparelho com dados errados contaminava o outro.
    _tombstonarAusentes('emprestimos',loans,p.loans);
    _tombstonarAusentes('clientes',clients,p.clients||[]);
    _tombstonarAusentes('inadimplentes',inadimplentes,p.inadimplentes||[]);
    loans=p.loans;clients=p.clients||[];inadimplentes=p.inadimplentes||[];
    migrateLoans(loans);
    // Devolve as fotos do backup para o IndexedDB
    var docs=p.docs||{};var keys=Object.keys(docs);
    var writeDocs=keys.length?Promise.all(keys.map(function(k){return docSet(k,docs[k]).catch(function(){});})):Promise.resolve();
    writeDocs.then(function(){
      save('*');saveInad('*');renderAll();closeModal();
      showToast('✅ '+loans.length+' empréstimos restaurados!');
    });
  }catch(e){showToast('Arquivo inválido','error');}
}

// ============================================================
// INIT
// ============================================================
initApp();
</script>
