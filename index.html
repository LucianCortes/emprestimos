var _instalarEvt=null;
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('beforeinstallprompt',function(e){
    if(e&&e.preventDefault)e.preventDefault();
    _instalarEvt=e;
    if(currentScreen==='conta')renderConta();
  });
}
function instalarApp(){
  if(!_instalarEvt){showToast('Seu navegador não oferece a instalação agora.','warn');return;}
  _instalarEvt.prompt();
  _instalarEvt=null;
  renderConta();
}
function pintarMenuNuvem(){
  var el=document.getElementById('menu-nuvem');
  if(!el)return;
  var logado=!!(cloudOn&&cloudUser),p=pendingCount();
  var cor=logado?(p>0?'var(--am)':'var(--gr)'):'var(--dim)';
  var fundo=logado?(p>0?'var(--amS)':'var(--grS)'):'var(--pn2)';
  el.setAttribute('style','margin-top:14px;padding:10px 11px;border-radius:9px;font-size:11.5px;'
    +'font-weight:600;background:'+fundo+';color:'+cor);

    +'<div style="display:flex;flex-direction:column;gap:8px;margin:0 14px">'
    +(hasPin()

      :'<button class="btn btn-gh" onclick="showPinScreen(\'set\',\'\')">'+sv(I.lock,17)+'Criar PIN de acesso</button>')
    +'<button class="btn btn-gh" onclick="openBackup()">'+sv(I.down,17)+'Backup e restaurar</button>'
    // D7 — a data do ultimo backup em texto claro, sempre visivel.
    +'<div style="font-size:12px;font-weight:600;line-height:1.5;color:'
      +((diasDesdeBackup()==null||diasDesdeBackup()>=CONFIG.BACKUP_LEMBRETE_DIAS)?'var(--am)':'var(--dim)')+'">'
      +esc(textoUltimoBackup())+'</div>'
    +(_instalarEvt?'<button class="btn btn-gh" onclick="instalarApp()">'+sv(I.install,17)+'Instalar no celular</button>':'')
    +'</div>'
    +'<div style="margin:10px 16px 0;font-size:12px;color:var(--dim);line-height:1.55">'
    +'<b style="color:var(--tx)">Sobre o PIN:</b> é uma trava simples contra quem pega o celular na mão — '
    +'não é criptografia. Quem tiver acesso técnico ao aparelho lê os dados assim mesmo. A proteção de '
    +'verdade é a senha da sua conta e o bloqueio de tela do celular.</div>';

  // Rede de segurança: cópias automáticas, lixeira, conferir contas e cópia

  html+=_blocoRedeSegurancaHtml();

    +'</div>';
  box.innerHTML=html;

    +'<th class="num">Saldo</th><th>Vence</th><th>Situação</th></tr></thead><tbody>'
    + gs.map(function(g){
      var sit=sitGrupo(g);

      var prox=ativos.slice().sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);})[0];
      var emp=_r2(g.loans.reduce(function(s,l){return s+loanPrincipal(l);},0));
      var rec=_r2(g.loans.reduce(function(s,l){return s+loanReceived(l);},0));
      var sal=saldoGrupo(g);

        +' style="cursor:pointer">'

        +'<td class="num">'+din(emp,13,'var(--tx)',500)+'</td>'
        +'<td class="num">'+din(rec,13,rec>0?'var(--gr)':'var(--dim2)',500)+'</td>'
        +'<td class="num">'+(sal?din(sal,13):'<span class="mono" style="color:var(--dim2)">—</span>')+'</td>'
        +'<td style="font-size:12.5px;color:var(--dim)">'+(prox?fmtDate(prox.dueDate):'—')+'</td>'
        +'<td>'+selo(prox?sitTexto(prox):'quitado',corSit(sit),corSitS(sit))+'</td>'

    }).join('')
    +'</tbody></table></div>';
}

function openForm(pre){
  formData=Object.assign({name:'',phone:'',address:'',amount:'',interest:CONFIG.TAXA_PADRAO,startDate:today(),note:'',docRG:'',docResidencia:'',parcelas:'1'},pre||{});
  // Cliente conhecido abre com a taxa DELE, não com o padrão 30%. Só quando quem
  // chamou não impôs uma taxa (o "+ Novo empréstimo para X" não impõe).
  formData._rateManual=false;
  if(!(pre&&pre.interest))_adotarTaxaDoCliente();
  renderForm();
}
// Puxa a taxa do histórico do cliente para o formulário. Não mexe em nada se o
// dono já escolheu uma taxa na mão nesta tela (_rateManual) — a decisão dele
// sempre ganha do palpite do app.
function _adotarTaxaDoCliente(){
  if(formData._rateManual)return null;
  var info=clientRate(formData.name);
  if(info)formData.interest=String(info.taxa);
  return info;
}
// A faixa acima dos botões de taxa. Cinza quando o app apenas lembra; âmbar
// quando o dono escolheu uma taxa diferente da que costuma cobrar deste cliente.
// Nunca bloqueia — só conta o que o histórico diz.
function _taxaHintHtml(){
  var info=clientRate(formData.name);
  if(!info)return '';
  var escolhida=parseFloat(formData.interest);
  var difere=!isNaN(escolhida)&&Math.abs(escolhida-info.taxa)>0.001;
  var lista=info.varias?' (este cliente já teve '+info.taxas.map(_fmtTaxa).join(' e ')+')':'';
  // Os hex #fffbeb/#94a3b8 são LEGADO PRESERVADO: a bateria financeira usa esses
  // dois códigos para distinguir "faixa discreta" de "aviso âmbar". As classes
  // hint-ambar/hint-cinza devolvem a cor do tema por cima deles (ver CSS).
  if(difere){
    return '<div id="rate-hint" class="hint-ambar" style="background:#fffbeb;border:1px solid var(--am);'
      +'border-radius:9px;padding:8px 11px;margin-bottom:7px;font-size:12px;line-height:1.45">'
      +'Atenção: você cobrava '+_fmtTaxa(info.taxa)+' deste cliente.'+esc(lista)+'</div>';
  }
  return '<div id="rate-hint" class="hint-cinza" style="padding:0 2px 7px;font-size:12px;'
    +'line-height:1.45;color:#94a3b8">'
    +'Você cobrou '+_fmtTaxa(info.taxa)+' de '+esc(_primeiroNome(formData.name))
    +(info.quando?' no empréstimo de '+fmtDate(info.quando):'')
    +' — toque em outra taxa para mudar.'+esc(lista)+'</div>';
}
// Redesenha só a faixa e os botões de taxa. Chamado enquanto o dono DIGITA o
// nome: um renderForm() inteiro aqui tiraria o foco do campo a cada tecla.
function _syncTaxaCliente(){
  _adotarTaxaDoCliente();
  var hint=document.getElementById('rate-hint');
  var wrap=document.getElementById('rate-hint-wrap');
  if(wrap)wrap.innerHTML=_taxaHintHtml();
  else if(hint)hint.outerHTML=_taxaHintHtml();
  var seg=document.getElementById('rate-seg');
  if(seg&&!formData._rateManual){
    var atual=String(formData.interest);
    var btns=seg.querySelectorAll('.seg-btn');
    var achou=false;
    btns.forEach(function(b){
      var v=b.getAttribute('data-rate');
      var on=(v!=null&&v===atual);
      if(on)achou=true;
      b.classList[on?'add':'remove']('active');
    });
    var outro=document.getElementById('btn-outro-rate');
    if(outro){
      outro.textContent=achou?'Outro':atual+'%';
      outro.classList[achou?'remove':'add']('active');
    }
  }
  updatePreview();
}

      +'<div class="field"><label for="f-amt">Valor emprestado (R$)</label>'

      +'<button class="seg-btn'+(isCustom?' active':'')+'" id="btn-outro-rate" onclick="askCustomRate(this)">'

// Comprime UMA foto com o tamanho e a qualidade do bloco de configuração
// (CONFIG.FOTO_MAX_PX e CONFIG.FOTO_QUALIDADE). É EXATAMENTE a compressão que
// já existia dentro do saveDoc — só foi separada para poder rodar em várias
// fotos, uma atrás da outra. Nada foi reescrito.
function _docComprimirArquivo(f,cb){
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var max=CONFIG.FOTO_MAX_PX,w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}
      else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var data;try{data=cv.toDataURL('image/jpeg',CONFIG.FOTO_QUALIDADE);}catch(err){data=ev.target.result;}
      cb(data);
    };
    // Não deu para encolher: guarda a foto do jeito que veio. Nunca some.
    img.onerror=function(){cb(ev.target.result);};
    img.src=ev.target.result;
  };
  r.onerror=function(){cb(null);};
  r.readAsDataURL(f);
}
// Comprime a lista inteira NA ORDEM em que o dono escolheu as fotos.
// Uma por vez, de propósito: celular antigo não aguenta cinco canvas juntos.
function _docComprimirLista(arquivos,i,prontas,fim){
  if(i>=arquivos.length){fim(prontas);return;}
  _docComprimirArquivo(arquivos[i],function(data){
    if(data)prontas.push(data);
    _docComprimirLista(arquivos,i+1,prontas,fim);
  });
}
// T1 — anexar no formulário de "Novo empréstimo". Aceita VÁRIOS arquivos.
// Aqui as páginas ainda são as próprias fotos (data URL): o empréstimo ainda
// não existe, então ainda não há id para montar a chave. Quem transforma foto
// em chave é o addLoan(), no momento de gravar.
function saveDoc(e,tipo){
  var campo=(tipo==='rg')?'docRG':'docResidencia';
  var fl=e.target.files;if(!fl||!fl.length)return;
  var arquivos=[],i;
  for(i=0;i<fl.length;i++)arquivos.push(fl[i]);
  var jaTem=docPaginas(formData[campo]);
  _docComprimirLista(arquivos,0,[],function(novas){
    if(!novas.length){showToast('Não consegui ler a imagem','error');return;}
    formData[campo]=docGuardarPaginas(jaTem.concat(novas));
    renderForm();
    showToast(novas.length===1?'1 página anexada':novas.length+' páginas anexadas');
  });
}

function addLoan(){
  var amt=parseFloat(formData.amount);
  if(!formData.name.trim()||!amt||amt<=0){showToast('Preencha nome e valor','error');return;}
  var rate=parseFloat(formData.interest)/100;
  var start=formData.startDate||today();
  var nParc=parseInt(formData.parcelas)||1;
  var loan={
    id:uid(),name:formData.name.trim(),phone:formData.phone||'',address:formData.address||'',
    originalAmount:amt,principal:amt,interest:parseFloat(formData.interest),
    startDate:start,note:formData.note||'',
    paid:false,payments:[],
    docRG:'',docResidencia:'',
    // rate: a taxa fica congelada no lancamento — mudar o juro do cliente depois
    // nao pode reescrever o lucro de meses ja fechados.
    history:[{date:start,type:'emprestimo',value:amt,rate:parseFloat(formData.interest),note:'Empréstimo de '+fmt(amt)+' · Juros '+formData.interest+'%'+(nParc>1?' · '+nParc+'x':'')}]
  };
  // Fotos vão para o IndexedDB; o loan guarda só a(s) chave(s).
  // Cada página vira uma chave própria e o campo é gravado por
  // docGuardarPaginas: 1 página continua string simples, 2+ viram lista JSON.
  ['docRG','docResidencia'].forEach(function(f){
    var chaves=[];
    docPaginas(formData[f]).forEach(function(foto){
      if(!isDataUrl(foto))return;              // só foto de verdade vira chave
      var key=docNovaChave(loan.id,f);
      chaves.push(key);docSet(key,foto);
    });
    loan[f]=docGuardarPaginas(chaves);
  });
  if(nParc>1){
    loan.parcelas=[];
    var acc=0;
    for(var k=1;k<=nParc;k++){
      var pPrin=(k<nParc)?parseFloat((amt/nParc).toFixed(2)):parseFloat((amt-acc).toFixed(2));
      acc=parseFloat((acc+pPrin).toFixed(2));
      loan.parcelas.push({id:uid(),n:k,principal:pPrin,currentAmount:parseFloat((pPrin*(1+rate)).toFixed(2)),dueDate:addDays(start,CONFIG.CICLO_DIAS*k),paid:false});
    }
    syncParceledLoan(loan);
  }else{
    loan.currentAmount=parseFloat((amt*(1+rate)).toFixed(2));
    loan.dueDate=addDays(start,CONFIG.CICLO_DIAS);
  }
  loans.push(loan);save(loan.id);renderAll();closeModal();
  showToast('✅ Empréstimo de '+loan.name+(nParc>1?' ('+nParc+'x)':'')+' adicionado');
}

// A janela de pagamento virou TELA (renderReceber). Os ids dos campos
// (pay-input, pay-note, pay-desc, pay-desc-note, btn-conf-pay) foram
// preservados de propósito: as funções abaixo continuam as mesmas.
// Estorno de um pagamento parcial lancado por engano NO PERIODO CORRENTE.
// O saldo volta a subir e fica um rastro no historico (nada some sem registro).
// idx e a posicao do pagamento em loan.payments (lancamentos antigos podem nao
// ter id, por isso a posicao — a janela e sempre redesenhada antes do clique).
function estornoPagamento(id,idx){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  idx=parseInt(idx,10);
  var p=(loan.payments||[])[idx];
  if(!p){showToast('Lançamento não encontrado (o período pode já ter sido fechado)','error');return;}
  pedirConfirmacao({titulo:'Estornar este pagamento?',
    texto:fmt(p.value)+' lançado em '+fmtDate(p.date)+'.\n'
      +'O saldo devedor volta a subir '+fmt(p.value)+'. O estorno fica registrado no extrato.',
    ok:'Estornar',perigo:true},function(){_estornoExec(id,idx);});
}
function _estornoExec(id,idx){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  var p=(loan.payments||[])[idx];if(!p)return;
  loan.payments.splice(idx,1);
  loan.history=loan.history||[];
  // pagamentoOriginal: a cópia do pagamento desfeito. Vai dentro do JSONB
  // history (nenhuma coluna nova). Sem ela o razão não teria como recriar o
  // pagamento no extrato nem fechar a conta — veja o comentário em _ledgerCalc.
  loan.history.push({type:'estorno',date:today(),value:p.value,
    pagamentoOriginal:{date:p.date,value:p.value,note:p.note||''},
    note:'Estorno do pagamento de '+fmt(p.value)+' lançado em '+fmtDate(p.date)+(p.note?' ('+p.note+')':'')});
  save(id);renderAll();               // save() ja marca o emprestimo como pendente de sincronizacao
  showToast('↩️ Estorno de '+fmt(p.value)+' registrado · saldo '+fmt(getBalance(loan)));
  abrirReceber(id);                   // redesenha a janela com os numeros novos
}

  }catch(e){}

// C11 — PAGAMENTO ACIMA DO SALDO NAO PODE ENTRAR INTEIRO.
// Se o dono digita 2.000 num saldo de 1.250, os 750 a mais nao existem: nao ha
// divida para eles abaterem. Gravar o valor cheio inflava o "recebido" e o lucro
// com dinheiro que nunca entrou por causa DESTE emprestimo.
// Agora: passou do saldo em mais de alguns centavos, o app PERGUNTA antes (na
// folha de confirmacao do proprio app, nunca no confirm() do navegador, que no
// celular aparece como alerta de site); e, de qualquer jeito, grava no maximo o
// saldo. A folga de 0,01 continua valendo para arredondamento de centavo.
function doPayment(id,amount,note){
  var loan=loans.find(function(l){return l.id===id;});if(!loan||amount<=0)return;
  var balance=getBalance(loan);
  amount=parseFloat(amount);
  if(amount>balance+0.01){
    _fecharTeclado();
    pedirConfirmacao({
      titulo:fmt(amount)+' é mais que o saldo de '+fmt(balance)+'.',
      texto:'Registrar só o saldo de '+fmt(balance)+'? O que passa disso não abate '
        +'nada e não entra no seu lucro.',
      ok:'Registrar '+fmt(balance)
    },function(){_doPaymentExec(id,balance,note);});
    return;
  }
  _doPaymentExec(id,amount,note);
}
function _doPaymentExec(id,amount,note){
  var loan=loans.find(function(l){return l.id===id;});if(!loan||amount<=0)return;
  var balance=getBalance(loan);
  amount=parseFloat(amount);
  if(amount>=balance-0.01){
    // Final — quita
    // C11 — grava NO MAXIMO o saldo. Sem o Math.min, o excedente entrava como
    // dinheiro recebido e o razao nunca fechava com o cartao.
    var valorQuita=Math.min(amount,balance);
    (loan.payments||[]).forEach(function(p){loan.history.push({date:p.date,type:'pagamento_parcial',value:p.value,note:p.note||''});});
    loan.history.push({date:today(),type:'pagamento_final',value:valorQuita,note:(note?note+' · ':'')+'Dívida quitada! Pagamento de '+fmt(valorQuita)});
    loan.paid=true;loan.currentAmount=0;loan.payments=[];
    showToast('✅ Dívida de '+loan.name+' quitada!');
  }else{
    // Parcial — adiciona ao array de pagamentos do período
    loan.payments=loan.payments||[];
    loan.payments.push({id:uid(),date:today(),value:amount,note:note||''});
    showToast('💳 '+fmt(amount)+' registrado para '+loan.name);
  }
  save(id);renderAll();closeModal();
}

function doRenew(id){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  // 1) desconto negociado (se houver) — abate o saldo antes do juro
  var desc=parseFloat((document.getElementById('rn-desc')||{}).value)||0;
  var dmot=((document.getElementById('rn-desc-note')||{}).value||'').trim();
  if(desc>0){
    var bal0=getBalance(loan);
    if(desc>bal0+0.009){showToast('Desconto maior que o saldo ('+fmt(bal0)+')','error');return;}
    pedirConfirmacao({titulo:'Renovar com '+fmt(desc)+' de desconto?',
      texto:'Saldo: '+fmt(bal0)+' → '+fmt(parseFloat((bal0-desc).toFixed(2)))+' antes do juro.',
      ok:'Renovar'},function(){_doRenewExec(id,desc,dmot);});
    return;
  }
  _doRenewExec(id,0,'');
}
function _doRenewExec(id,desc,dmot){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  if(desc>0){
    _regDesconto(loan,desc,dmot);
    if(loan.paid){                       // desconto zerou tudo: nao ha o que renovar
      save(id);renderAll();closeModal();
      showToast('🏷️ Desconto de '+fmt(desc)+' — saldo zerado, dívida encerrada');
      return;
    }
  }
  // 2) renovacao normal: juro do mes cheio sobre o saldo
  var balance=getBalance(loan);
  var newTotal=parseFloat((balance*(1+loan.interest/100)).toFixed(2));
  // Move pagamentos do período para histórico
  (loan.payments||[]).forEach(function(p){loan.history.push({date:p.date,type:'pagamento_parcial',value:p.value,note:p.note||''});});
  loan.history.push({date:today(),type:'renovacao',value:balance,rate:loan.interest,
    note:'Renovado. Saldo: '+fmt(balance)+'. Juros '+loan.interest+'%: '+fmt(balance*loan.interest/100)+'. Novo total: '+fmt(newTotal)});
  loan.currentAmount=newTotal;
  loan.originalAmount=balance;
  loan.startDate=today();
  loan.dueDate=addDays(today(),CONFIG.CICLO_DIAS);
  loan.payments=[];
  save(id);renderAll();closeModal();
  showToast('🔄 Renovado! Novo total: '+fmt(newTotal)+(desc>0?' (desconto de '+fmt(desc)+')':''));
}

// C1 — CORRIGE O LANCAMENTO 'emprestimo' ORIGINAL DO HISTORICO.
// POR QUE ISTO PRECISA EXISTIR. O extrato (razao) NAO le l.principal nem
// l.interest: ele refaz a conta inteira a partir dos lancamentos do historico.
// Entao editar so os campos do cartao deixava o cartao dizendo uma coisa e o
// extrato outra — o extrato continuava calculando com o valor e a taxa velhos.
// QUANDO E LEGITIMO REESCREVER O PASSADO. So aqui: emprestimo com ZERO
// renovacoes. Sem renovacao nenhum mes fechou, entao nao ha lucro de mes passado
// para proteger — a digitacao errada e a unica coisa que existe.
// SE HOUVER MAIS DE UM LANCAMENTO 'emprestimo' (o dono adicionou dinheiro depois),
// so o PRIMEIRO recebe o novo valor; os outros ficam intactos. O primeiro fica
// com "o valor total novo MENOS o que foi adicionado depois", para o capital do
// razao bater exatamente com l.principal.
// A TAXA e reescrita em TODOS os lancamentos de emprestimo. A taxa e um campo
// unico do emprestimo e nenhum ciclo fechou; se um lancamento antigo ficasse com
// a taxa velha, o total do razao nao bateria com o currentAmount do cartao.
function _corrigirEmprestimoOriginal(l,amount,interest){
  var hs=(l&&l.history)||[];
  var idxs=[];
  hs.forEach(function(h,i){if(h&&(h.type==='emprestimo'||h.type==='empréstimo'))idxs.push(i);});
  if(!idxs.length)return;                  // registro antigo sem lancamento: nada a corrigir
  var outros=0;
  for(var k=1;k<idxs.length;k++)outros+=parseFloat(hs[idxs[k]].value)||0;
  // Se o dono baixar o total para menos do que ele mesmo adicionou depois, este
  // numero fica negativo. E raro e e o que ele pediu; nao truncamos, porque
  // truncar faria o extrato parar de bater com o saldo do cartao — e a regra de
  // ouro do app e que esses dois numeros sao sempre iguais.
  hs[idxs[0]].value=parseFloat((amount-outros).toFixed(2));
  for(var j=0;j<idxs.length;j++)hs[idxs[j]].rate=interest;
}
function saveEdit(id){
  var l=loans.find(function(x){return x.id===id;});if(!l)return;
  var name=document.getElementById('ed-name').value.trim();
  var phone=document.getElementById('ed-phone').value;
  var addr=document.getElementById('ed-addr').value;
  var note=(document.getElementById('ed-note')||{}).value||'';
  l.name=name||l.name;l.phone=phone;l.address=addr;l.note=note;
  if(!(l.parcelas&&l.parcelas.length)){
    var amount=parseFloat(document.getElementById('ed-amount').value);
    if(isNaN(amount)||amount<=0)amount=loanPrincipal(l);
    var interest=parseFloat(document.getElementById('ed-int').value);
    if(isNaN(interest))interest=l.interest;
    var start=document.getElementById('ed-start').value||l.startDate;
    var due=document.getElementById('ed-due').value||l.dueDate;
    if(loanRenovacoes(l)===0){
      // Nunca renovado: recalcular do zero esta certo (nao ha juros acumulado a perder)
      // C2 — DESCONTO JA CONCEDIDO NAO PODE SUMIR NO RECALCULO.
      // O recalculo abaixo refaz o total do zero. Se o dono ja tinha perdoado
      // parte da divida, esse abatimento tem de continuar valendo: sem isto,
      // editar o cadastro fazia o desconto desaparecer e a divida voltava a subir.
      // Medido ANTES de mexer em qualquer campo, porque loanDescontos() le o razao.
      var descJa=loanDescontos(l);
      // 'ajuste' NAO precisa entrar nesta conta: o unico ajuste com valor
      // diferente de zero e o do ramo de baixo (ja renovado), e um emprestimo que
      // passou por ele nunca mais volta para este ramo. O ajuste que _regDesconto
      // grava tem valor 0 (e so um bilhete dizendo que o desconto zerou o saldo).
      l.principal=parseFloat(amount.toFixed(2));
      l.originalAmount=parseFloat(amount.toFixed(2));
      l.interest=interest;
      l.currentAmount=parseFloat((amount*(1+interest/100)-descJa).toFixed(2));
      if(l.currentAmount<0)l.currentAmount=0;   // desconto maior que o novo total: divida zerada
      // C1 — o historico tambem tem de ser corrigido, senao o extrato continua
      // calculando com o valor e a taxa antigos. Ver o comentario da funcao.
      _corrigirEmprestimoOriginal(l,amount,interest);
    }else{
      // Ja renovado: o saldo acumulado e sagrado. So a DIFERENCA entra.
      var antes=loanPrincipal(l);
      var dif=parseFloat((amount-antes).toFixed(2));
      l.interest=interest;
      if(dif!==0){
        var saldoAntes=l.currentAmount||0;
        var delta=parseFloat((dif*(1+interest/100)).toFixed(2));
        l.currentAmount=parseFloat((saldoAntes+delta).toFixed(2));
        l.principal=parseFloat(amount.toFixed(2));
        l.originalAmount=parseFloat(((l.originalAmount||0)+dif).toFixed(2));
        l.history=l.history||[];
        // C3 — grava TAMBEM o capital puro (a diferenca SEM o juro) e a taxa
        // usada. `value` continua sendo o que entra no saldo (capital + juro);
        // `capital` e o que entra no capital emprestado. Sem os dois separados o
        // razao tinha de adivinhar, e adivinhava errado.
        l.history.push({type:'ajuste',date:today(),value:delta,capital:dif,rate:interest,
          note:'Ajuste do valor emprestado: '+fmt(antes)+' → '+fmt(amount)+'. Saldo '+(delta>=0?'+':'')+fmt(delta)+' (diferença de '+fmt(dif)+' com juros '+interest+'%). Saldo: '+fmt(saldoAntes)+' → '+fmt(l.currentAmount)});
      }
    }
    l.startDate=start;l.dueDate=due;
  }
  editingId=null;
  save(id);renderAll();closeModal();showToast('✅ Atualizado!');
}

// Rotulo, cor e sinal de cada tipo de lancamento do historico.
// Novos tipos: desconto (abate saldo, NAO e dinheiro recebido) e estorno
// (pagamento lancado por engano e desfeito).
function _histLabel(t,current){
  if(t==='emprestimo'||t==='empréstimo')return{label:'Emprestei',cor:'var(--ac)',valCor:'var(--rd)',sinal:'-'};
  // C5 — 'pagamento_total' e o tipo ANTIGO de quitacao (hoje o app grava
  // 'pagamento_final'). Ele continua reconhecido aqui para os lancamentos ja
  // gravados no passado nao voltarem a aparecer como um "Recebi" qualquer.
  if(t==='pagamento_final'||t==='pagamento_total')return{label:'Quitado',cor:'var(--gr)',valCor:'var(--gr)',sinal:'+'};
  // C5 — renovacao NAO e dinheiro entrando: ela so rola o saldo para o mes
  // seguinte cobrando o juro. Por isso vai SEM sinal, igual ao que o razao ja faz.
  if(t==='renovacao')return{label:'Rolou para o mês seguinte',cor:'var(--am)',valCor:'var(--am)',sinal:''};
  if(t==='ajuste')return{label:'Ajuste',cor:'var(--ac)',valCor:'var(--ac)',sinal:'+'};
  if(t==='desconto')return{label:'Desconto',cor:'var(--gr)',valCor:'var(--gr)',sinal:'-'};
  if(t==='estorno')return{label:'Estorno',cor:'var(--rd)',valCor:'var(--rd)',sinal:'-'};
  return{label:'Recebi'+(current?' (mês atual)':''),cor:'var(--gr)',valCor:'var(--gr)',sinal:'+'};
}
function openHistory(id){

  var ehInad=loans.indexOf(l)<0;                       // veio da lista de inadimplentes

  var balance=getBalance(l);var paidPeriod=getPaidPeriod(l);
  var lg=ledger(l);
  var totalDesc=lg.descontoTotal;

  // ---- documentos ----
  // Todas as páginas dos dois documentos, lidas SEMPRE por docPaginas().
  var docCorpo='',temDoc=false;
  ['docRG','docResidencia'].forEach(function(f){
    var pags=docPaginas(l[f]);

// Foto do documento em tela cheia — desenhada dentro do proprio app (nada de
// window.open com data URL, que muitos navegadores de celular bloqueiam).
var _docFullZoom=false;
// T3 — a tela cheia agora trabalha com uma LISTA de páginas e uma POSIÇÃO.
// _docFullLista guarda itens {chave, campo, regId}: a chave é a foto, e campo
// + regId dizem de qual documento de qual registro ela saiu (é o que o botão
// de apagar precisa saber).
var _docFullLista=[], _docFullPos=0, _docFullTitulo='';
// Nome do documento em português, um lugar só.
function docNomeCampo(campo){return campo==='docRG'?'RG / CNH':'Comprovante de residência';}
// Páginas de UM registro (usada no histórico do empréstimo).
function docItensDoRegistro(regId,campo){
  var l=allRecords().find(function(x){return x.id===regId;});
  if(!l)return [];
  return docPaginas(l[campo]).map(function(k){return {chave:k,campo:campo,regId:regId};});
}
// Páginas de TODOS os registros do cliente, na ordem dos registros (usada na
// ficha). Para o dono é "o documento do cliente", não "o do empréstimo 3".
function docItensDoCliente(key,campo){
  var itens=[],vistos={};
  allRecords().forEach(function(l){
    if(!l||clientKey(l.name)!==key)return;
    docPaginas(l[campo]).forEach(function(k){
      if(vistos[k])return;                     // mesma foto citada em dois registros
      vistos[k]=1;itens.push({chave:k,campo:campo,regId:l.id});
    });
  });
  return itens;
}
function abrirDocRegistro(regId,campo,pos){
  var l=allRecords().find(function(x){return x.id===regId;});if(!l)return;
  openDocFull(docItensDoRegistro(regId,campo),pos||0,docNomeCampo(campo)+' · '+l.name);
}
function abrirDocCliente(key,campo,pos){
  openDocFull(docItensDoCliente(key,campo),pos||0,
    docNomeCampo(campo)+' · '+(_nomeDoCliente(key)||'Cliente'));
}
function openDocFull(itens,pos,titulo){
  if(!itens||!itens.length)return;
  closeDocFull();     // fecha ANTES de guardar a lista: closeDocFull limpa ela
  _docFullLista=itens;
  _docFullPos=Math.max(0,Math.min(parseInt(pos,10)||0,itens.length-1));
  _docFullTitulo=titulo||'Documento';
  _docFullZoom=false;
  document.body.insertAdjacentHTML('beforeend','<div id="docview-overlay" style="position:fixed;inset:0;background:var(--tx);z-index:9500;display:flex;flex-direction:column">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--tx);flex:0 0 auto">'
    +'<div id="docview-titulo" style="font-size:12px;font-weight:700;color:var(--ln);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>'
    +'<button id="docview-zoom" onclick="toggleDocZoom()" style="flex:0 0 auto;background:var(--tx);border:none;color:var(--ln);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Ampliar</button>'
    +'</div>'
    // linha de passar página: seta, "página 2 de 3", seta
    +'<div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:0 12px 8px;background:var(--tx);flex:0 0 auto">'
    +'<button id="docview-ant" onclick="_docFullIr(-1)" aria-label="Página anterior"'
    +' style="background:none;border:1px solid var(--ln);color:var(--ln);border-radius:9px;width:40px;height:34px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">‹</button>'
    +'<span id="docview-cont" style="font-size:12px;font-weight:700;color:var(--ln);min-width:96px;text-align:center"></span>'
    +'<button id="docview-prox" onclick="_docFullIr(1)" aria-label="Próxima página"'
    +' style="background:none;border:1px solid var(--ln);color:var(--ln);border-radius:9px;width:40px;height:34px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">›</button>'
    +'</div>'
    +'<div id="docview-scroll" style="flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;text-align:center">'
    +'<img id="docview-img" alt="Carregando foto…" style="max-width:100%;height:auto;border-radius:8px">'
    +'</div>'
    +'<div style="padding:4px 12px 2px;background:var(--tx);font-size:10px;color:var(--dim2);text-align:center;flex:0 0 auto">Use “Ampliar” ou o zoom de dois dedos para ler o documento.</div>'
    // os dois botões de baixo: fechar e apagar esta página
    +'<div style="display:flex;gap:8px;padding:8px 12px 12px;background:var(--tx);flex:0 0 auto">'
    +'<button onclick="closeDocFull()" style="flex:1;background:var(--ln);border:none;color:var(--tx);border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Fechar</button>'
    +'<button onclick="apagarPaginaAtual()" style="flex:1;background:var(--rd);border:none;color:var(--pn);border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Apagar esta página</button>'
    +'</div>'
    +'</div>');
  _docFullPintar();
}
// Passa de página. Nunca sai das pontas (as setas já ficam desabilitadas lá).
function _docFullIr(passo){
  var novo=_docFullPos+passo;
  if(novo<0||novo>=_docFullLista.length)return;
  _docFullPos=novo;
  _docFullZoom=false;
  var img=document.getElementById('docview-img');
  if(img){img.style.maxWidth='100%';img.style.width='auto';}
  var bz=document.getElementById('docview-zoom');
  if(bz)bz.textContent='Ampliar';
  _docFullPintar();
}
// Redesenha título, contador, setas e a foto da posição atual.
function _docFullPintar(){
  var n=_docFullLista.length, it=_docFullLista[_docFullPos];
  var t=document.getElementById('docview-titulo');
  if(t)t.textContent=_docFullTitulo;
  var c=document.getElementById('docview-cont');
  if(c)c.textContent='página '+(_docFullPos+1)+' de '+n;
  var ant=document.getElementById('docview-ant'), prox=document.getElementById('docview-prox');
  if(ant){ant.disabled=(_docFullPos<=0);ant.style.opacity=ant.disabled?'.3':'1';}
  if(prox){prox.disabled=(_docFullPos>=n-1);prox.style.opacity=prox.disabled?'.3':'1';}
  var img=document.getElementById('docview-img');
  if(!img||!it)return;
  img.removeAttribute('src');
  img.alt='Carregando foto…';
  // Formato antigo de tudo: a foto está gravada dentro do próprio campo.
  if(isDataUrl(it.chave)){img.src=it.chave;return;}
  var chave=it.chave;
  docGet(chave).then(function(data){
    var atual=_docFullLista[_docFullPos];
    if(!atual||atual.chave!==chave)return;    // o dono já passou de página
    if(data)img.src=data;
    else img.alt='(foto não encontrada neste aparelho nem na nuvem)';
  }).catch(function(){img.alt='(erro ao abrir a foto)';});
}
function toggleDocZoom(){
  var img=document.getElementById('docview-img');if(!img)return;
  _docFullZoom=!_docFullZoom;
  img.style.maxWidth=_docFullZoom?'none':'100%';
  img.style.width=_docFullZoom?'250%':'auto';
  var b=document.getElementById('docview-zoom');
  if(b)b.textContent=_docFullZoom?'Reduzir':'Ampliar';
}
function closeDocFull(){
  var ov=document.getElementById('docview-overlay');if(ov)ov.remove();
  _docFullLista=[];_docFullPos=0;
}

// ------------------------------------------------------------
// MINIATURAS — uma função só para todas as telas
// ------------------------------------------------------------
// Qualquer <img data-doc-chave="..."> desenhada na tela é preenchida aqui.
// Assim a ficha do cliente, o histórico do empréstimo e qualquer tela nova
// carregam a foto do mesmo jeito, sem repetir código.
// Uma miniatura de página: ~74px de largura, com o número da página embaixo.
// A foto entra depois, por _pintarMiniaturasDoc().
function _docMiniHtml(chave,n,onclick){
  return '<button style="flex:0 0 auto;padding:0;border:1px solid var(--ln);background:var(--pn);'
    +'border-radius:10px;overflow:hidden;width:74px;cursor:zoom-in;font-family:inherit"'
    +' aria-label="Abrir página '+n+'" onclick="'+onclick+'">'
    +'<img data-doc-chave="'+esc(chave)+'" alt="página '+n+'"'
    +' style="width:74px;height:58px;object-fit:cover;display:block;background:var(--pn2)">'
    +'<span style="display:block;font-size:10px;color:var(--dim2);padding:3px 0 4px">pág. '+n+'</span>'
    +'</button>';
}
function _pintarMiniaturasDoc(){
  if(typeof document==='undefined')return;
  var lista=document.querySelectorAll('img[data-doc-chave]');
  for(var i=0;i<lista.length;i++){
    (function(img){
      if(img.getAttribute('data-doc-carregada'))return;   // já pedida
      img.setAttribute('data-doc-carregada','1');
      var chave=img.getAttribute('data-doc-chave');
      if(!chave)return;
      if(isDataUrl(chave)){img.src=chave;return;}          // formato antigo
      docGet(chave).then(function(d){
        if(d)img.src=d;else img.alt='(foto não encontrada)';
      }).catch(function(){img.alt='(erro ao abrir foto)';});
    })(lista[i]);
  }
}

// ------------------------------------------------------------
// T4 — APAGAR UMA PÁGINA PASSA PELA LIXEIRA DE 30 DIAS
// ------------------------------------------------------------
// REGRA: apagar uma página NÃO chama docDel na hora. A foto continua no
// aparelho E na nuvem. O que acontece é:
//   1) a chave sai da lista do registro e o campo é regravado;
//   2) um item vai para a lixeira com o que é preciso para desfazer;
//   3) a imagem só é apagada de verdade quando o item vencer os 30 dias ou
//      quando o dono mandar "apagar de vez" na lixeira.
// Motivo: foto de documento é dinheiro. Toque errado não pode custar a foto.
function _docGravarRegistro(reg){
  if(!reg||!reg.id)return;
  if(loans.some(function(l){return l.id===reg.id;}))save(reg.id);
  else saveInad(reg.id);
}
function apagarPaginaAtual(){
  var it=_docFullLista[_docFullPos];if(!it)return;
  var reg=allRecords().find(function(x){return x.id===it.regId;});
  if(!reg){showToast('Registro não encontrado','error');return;}
  pedirConfirmacao({
    titulo:'Apagar esta página?',
    texto:docNomeCampo(it.campo)+' de '+(reg.name||'NÃO INFORMADO')
      +' · página '+(_docFullPos+1)+' de '+_docFullLista.length+'.\n\n'
      +'A foto vai para a lixeira: dá para trazer de volta por '+SEG_LIXO_DIAS
      +' dias. Só depois disso ela é apagada de verdade.',
    ok:'Apagar página',perigo:true},function(){
    _apagarPaginaDocExec(it.regId,it.campo,it.chave);
  });
}
function _apagarPaginaDocExec(regId,campo,chave){
  var reg=allRecords().find(function(x){return x.id===regId;});
  if(!reg){showToast('Registro não encontrado','error');return;}
  var lista=docPaginas(reg[campo]);
  var i=lista.indexOf(chave);
  if(i<0){showToast('Esta página já não está no registro');return;}
  lista.splice(i,1);
  reg[campo]=docGuardarPaginas(lista);   // sobrando 1, volta a ser string simples
  _docGravarRegistro(reg);
  // A imagem CONTINUA gravada. Quem sabe desfazer é a lixeira.
  guardarNaLixeira('pagina_documento',{
    id:'pag:'+chave,
    name:reg.name||'NÃO INFORMADO',
    chave:chave,campo:campo,regId:regId
  }).then(function(){
    showToast('🗑️ Página na lixeira — dá para voltar por '+SEG_LIXO_DIAS+' dias');
  }).catch(function(){
    // A lixeira falhou: avisa, mas a foto continua gravada do mesmo jeito.
    showToast('Página removida, mas não consegui guardar na lixeira','warn');
  });
  // Tira a página da tela cheia sem fechar tudo à toa.
  var pos=-1,k;
  for(k=0;k<_docFullLista.length;k++)if(_docFullLista[k].chave===chave)pos=k;
  if(pos>=0)_docFullLista.splice(pos,1);
  if(!_docFullLista.length)closeDocFull();
  else{
    if(_docFullPos>=_docFullLista.length)_docFullPos=_docFullLista.length-1;
    _docFullPintar();
  }
  renderAll();
  // Se a janela do histórico do empréstimo estiver aberta atrás, redesenha:
  // senão ela continuaria mostrando a miniatura de uma página que já saiu.
  var mc=document.getElementById('modal-container');
  if(mc&&mc.innerHTML&&allRecords().some(function(x){return x.id===regId;}))openHistory(regId);
  if(typeof _repintarConta==='function')_repintarConta();
}

// Move UM emprestimo para inadimplentes (os outros do mesmo cliente ficam ativos).
// Chamado pelo botao dentro de openHistory.
function moveToInad(id){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  var outros=loans.filter(function(l){return clientKey(l.name)===clientKey(loan.name)&&l.id!==id&&!l.paid;}).length;
  var aviso='Mover só este empréstimo de '+loan.name+' ('+fmt(getBalance(loan))+') para inadimplentes?';
  if(outros>0)aviso+='\n\nOs outros '+outros+' empréstimo(s) ativo(s) deste cliente continuam normais.';
  if(loan.parcelas&&loan.parcelas.length)aviso+='\n\n⚠️ Empréstimo parcelado: as parcelas viram um saldo único de '+fmt(getBalance(loan))+'.';
  pedirConfirmacao({titulo:'Mover para inadimplentes?',texto:aviso,ok:'Mover'},function(){
    pedirTexto({titulo:'Por que ele virou inadimplente?',
      texto:'Fica registrado na ficha dele.',rotulo:'Motivo',
      dica:'sumiu, número desligado…',ok:'Mover'},function(motivo){
      _moveToInadExec(id,motivo);
    });
  });
}
function _moveToInadExec(id,motivo){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  if(motivo===null||motivo===undefined)return;   // desistiu: nao move nada
  motivo=String(motivo).trim()||'Sem contato';
  var saldo=getBalance(loan);
  _histPagamentosPeriodo(loan); // preserva no historico o que ele ja tinha pago
  inadimplentes.push({
    id:loan.id,name:loan.name,phone:loan.phone||'',address:loan.address||'',
    originalAmount:loan.originalAmount,currentAmount:saldo,
    startDate:loan.startDate,dueDate:loan.dueDate,interest:loan.interest,
    docRG:loan.docRG||'',docResidencia:loan.docResidencia||'',
    motivo:motivo,movidoEm:today(),history:loan.history||[]
  });
  loans=loans.filter(function(l){return l.id!==id;});
  // saiu de verdade da tabela emprestimos: sem isto ele volta no proximo pull
  addTombstone('emprestimos',id);
  delete expandedCards[id];deleteConfirm=null;
  saveInad(id);save();renderAll();closeModal();
  showToast('⚠️ Movido para inadimplentes');
}
// Move os pagamentos do periodo atual para o historico (nao se perde o que ja foi pago)
function _histPagamentosPeriodo(loan){
  if(!loan)return;
  loan.history=loan.history||[];
  (loan.payments||[]).forEach(function(p){
    loan.history.push({date:p.date,type:'pagamento_parcial',value:p.value,note:p.note||''});
  });
  loan.payments=[];
}
function moveClientToInad(key){
  var clientLoans=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;});
  if(!clientLoans.length){showToast('Cliente não tem empréstimos ativos');return;}
  var nome=clientLoans[0].name;
  pedirTexto({titulo:'Marcar '+nome+' como inadimplente?',
    texto:'Todos os '+clientLoans.length+' empréstimo'+(clientLoans.length>1?'s ativos dele saem':' ativo dele sai')
      +' da lista normal. O juro continua correndo.',
    rotulo:'Motivo',dica:'sumiu, número desligado…',ok:'Mover'},function(motivo){
    _moveClientToInadExec(key,motivo);
  });
}
function _moveClientToInadExec(key,motivo){
  var clientLoans=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;});
  if(!clientLoans.length)return;
  var nome=clientLoans[0].name;
  if(motivo===null||motivo===undefined)return;
  motivo=String(motivo).trim()||'Sem contato';
  var movidos=[];
  clientLoans.forEach(function(loan){
    var saldo=getBalance(loan);
    _histPagamentosPeriodo(loan); // preserva no historico o que ele ja tinha pago
    inadimplentes.push({
      id:loan.id,name:loan.name,phone:loan.phone||'',address:loan.address||'',
      originalAmount:loan.originalAmount,currentAmount:saldo,
      startDate:loan.startDate,dueDate:loan.dueDate,interest:loan.interest,
      docRG:loan.docRG||'',docResidencia:loan.docResidencia||'',
      motivo:motivo,movidoEm:today(),history:loan.history||[]
    });
    movidos.push(loan.id);
    addTombstone('emprestimos',loan.id); // saiu de verdade da tabela emprestimos
    delete expandedCards[loan.id];
  });
  loans=loans.filter(function(l){return!(clientKey(l.name)===key&&!l.paid);});
  delete expandedGroups[key];deleteConfirm=null;
  saveInad(movidos);save();renderAll();
  showToast('⚠️ '+nome+' movido para inadimplentes');
}
// A tela própria de inadimplentes acabou: eles são um FILTRO da lista de
// clientes. As ações continuam as mesmas (contato, reativar, excluir).
function renderInad(){
  accrueInadimplentes();
  var alvo=document.getElementById('loan-list');
  if(!alvo)return;
  updateInadBadge();
  if(!inadimplentes.length){
    alvo.innerHTML='<div class="vazio">'
      +'<span style="color:var(--gr);display:flex;justify-content:center">'+sv(I.check,26)+'</span>'
      +'<div class="vazio-t">Nenhum inadimplente</div>'
      +'<div style="font-size:12.5px;margin-top:2px">Tudo certo por aqui.</div></div>';
    return;
  }
  var total=_r2(inadimplentes.reduce(function(s,i){return s+(i.currentAmount||0);},0));
  alvo.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;'
    +'padding:11px 16px 8px;font-size:11.5px;color:var(--dim2);font-weight:600">'
    +'<span>'+inadimplentes.length+' inadimplente'+(inadimplentes.length>1?'s':'')+'</span>'

// Report filter state
var _rPeriod='all';var _rStatus='all';var _rClient='';var _rFrom='';var _rTo='';var expandedReportGroups={};

function getReportRange(){
  if(_rPeriod==='custom')return{from:_rFrom||null,to:_rTo||null};
  if(_rPeriod==='all')return{from:null,to:null};
  var now=new Date();var c=new Date(now);
  if(_rPeriod==='1m')c.setMonth(c.getMonth()-1);
  else if(_rPeriod==='3m')c.setMonth(c.getMonth()-3);
  else if(_rPeriod==='6m')c.setMonth(c.getMonth()-6);
  else if(_rPeriod==='1y')c.setFullYear(c.getFullYear()-1);
  return{from:dStr(c),to:today()};
}
function reportFiltered(){
  var r=getReportRange();var q=(_rClient||'').trim().toLowerCase();
  return loans.filter(function(l){
    if(!loanActiveInRange(l,r.from,r.to))return false;
    if(_rStatus==='active'&&l.paid)return false;
    if(_rStatus==='overdue'&&(l.paid||daysUntil(l.dueDate)>=0))return false;
    if(_rStatus==='paid'&&!l.paid)return false;
    if(q&&(l.name||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
// Inadimplentes que entram no relatorio (mesmos filtros de periodo e nome).
// Nos filtros "Ativos" e "Quitados" eles nao aparecem — nao sao nem um nem outro.
function reportFilteredInad(){
  if(_rStatus==='active'||_rStatus==='paid')return [];
  var r=getReportRange();var q=(_rClient||'').trim().toLowerCase();
  return (inadimplentes||[]).filter(function(i){
    if(!loanActiveInRange(i,r.from,r.to))return false;
    if(q&&(i.name||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
// Valor curto para caber embaixo de uma barra estreita
function _curto(v){
  v=Math.round(v||0);
  if(v>=10000)return (Math.round(v/100)/10).toString().replace('.',',')+'k';
  return v.toLocaleString('pt-BR');
}
var _MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
// GRÁFICO DO LUCRO POR MÊS — seis meses, tirados de jurosRecPeriodo().
// Nenhum número novo é inventado aqui: é a mesma função que alimenta o painel.
function graficoLucro(){
  var hoje=new Date();
  var regs=allRecords(),barras=[],max=0;
  for(var i=5;i>=0;i--){
    var d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
    var ini=dStr(d);
    var fim=dStr(new Date(d.getFullYear(),d.getMonth()+1,1));
    var v=_r2(regs.reduce(function(s,l){return s+jurosRecPeriodo(l,ini,fim);},0));
    if(v>max)max=v;
    barras.push({rot:_MESES[d.getMonth()],v:v,atual:(i===0)});
  }
  var corpo=barras.map(function(b){
    var h=max>0?Math.max(2,Math.round(b.v/max*100)):2;
    return '<div class="graf-c">'
      +'<div class="graf-v">'+(b.v>0?_curto(b.v):'—')+'</div>'
      +'<div class="graf-b'+(b.atual?' hoje':'')+'" style="height:'+h+'%"></div>'
      +'<div class="graf-m"'+(b.atual?' style="color:var(--ac);font-weight:700"':'')+'>'+b.rot+'</div>'
      +'</div>';
  }).join('');
  var atual=barras[5].v,anterior=barras[4].v;
  var dif='';
  if(anterior>0){
    var pc=Math.round((atual-anterior)/anterior*100);
    dif='<span style="font-size:12px;font-weight:700;color:'+(pc>=0?'var(--gr)':'var(--rd)')+'">'
      +(pc>=0?'+':'')+pc+'% em '+barras[5].rot+'</span>';
  }
  return '<div class="bloco" style="margin-top:12px"><div style="padding:13px 15px 15px">'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'
    +'<span class="tile-l">Lucro por mês · juro recebido</span>'+dif+'</div>'
    +'<div class="graf">'+corpo+'</div></div></div>';
}
// Contador por situação. O style de linha nas etiquetas é LEGADO PRESERVADO:

function renderReportBody(){
  var body=document.getElementById('report-body');if(!body)return;
  var rr=getReportRange();
  var filtered=reportFiltered();
  var fInad=reportFilteredInad(); // capital e juros de quem atrasou continuam contando
  // Descontos concedidos DENTRO do periodo filtrado (nao sao receita nem capital:
  // e o que se deixou de receber, entao aparece em indicador proprio)
  var totalDesc=filtered.reduce(function(s,l){return s+descontosPeriodo(l,rr.from,rr.to);},0)
    +fInad.reduce(function(s,i){return s+descontosPeriodo(i,rr.from,rr.to);},0);
  // C9 — CAPITAL EMPRESTADO TEM DE RESPEITAR O PERIODO ESCOLHIDO.
  // Antes somava loanPrincipal() de cada um, que e a vida toda do emprestimo: o
  // dono filtrava "ultimos 30 dias" e o numero nao mudava. capitalNoPeriodo()
  // soma so os lancamentos de 'emprestimo' com data dentro da janela — dinheiro
  // que de fato saiu do bolso no periodo — e agora recebe a lista ja filtrada.
  // A janela do relatorio tem o fim INCLUSIVO (rr.to conta), e capitalNoPeriodo
  // usa fim EXCLUSIVO; por isso o +1 dia.
  var capFim=rr.to?addDays(rr.to,1):null;
  var listaCap=filtered.concat(fInad);
  var totalCapital=capitalNoPeriodo(rr.from,capFim,listaCap);
  // REGISTRO ANTIGO SEM LANCAMENTO 'emprestimo'. capitalNoPeriodo so ve o
  // historico; um registro dos primeiros tempos do app (ou vindo da nuvem) pode
  // nao ter esse lancamento e valeria zero aqui — o dono veria o capital dele
  // encolher sem motivo. Para esses, e SO para esses, cai no valor do cadastro,
  // contado no dia em que o emprestimo comecou.
  listaCap.forEach(function(l){
    var temLanc=(l.history||[]).some(function(h){
      return h&&(h.type==='emprestimo'||h.type==='empréstimo');});
    if(temLanc)return;
    if(!inRange(l.startDate,rr.from,rr.to))return;
    totalCapital+=loanPrincipal(l);
  });
  // C7 — mesma correcao do painel: o inadimplente que passou pelo filtro tambem
  // esta em aberto. Antes ele contava no capital e no juro e sumia daqui.
  var totalAberto=filtered.filter(function(l){return!l.paid;}).reduce(function(s,l){return s+getBalance(l);},0)
    +fInad.reduce(function(s,i){return s+getBalance(i);},0);
  var abertoInad=_r2(fInad.reduce(function(s,i){return s+getBalance(i);},0));
  var totalJuros=filtered.reduce(function(s,l){return s+loanJuros(l);},0)
    +fInad.reduce(function(s,i){return s+loanJuros(i);},0);
  var vencidos=filtered.filter(function(l){return!l.paid&&daysUntil(l.dueDate)<0;}).length;
  var quitados=filtered.filter(function(l){return l.paid;}).length;
  var ativos=filtered.filter(function(l){return!l.paid;}).length;
  var cn={};filtered.forEach(function(l){cn[clientKey(l.name)]=1;});
  var nClients=Object.keys(cn).length;

  var html='<div class="tiles">'
    + tile('Capital emprestado',dinK(totalCapital),'var(--tx)')
    + tile('Em aberto',dinK(totalAberto),totalAberto>0?'var(--am)':'var(--dim2)')
    + tile('Juro recebido',dinK(totalJuros),'var(--gr)')
    + tile('Descontos','<span class="mono">'+(totalDesc>0?'−':'')+'R$ '
        +Math.round(totalDesc).toLocaleString('pt-BR')+'</span>',
        totalDesc>0?'var(--dim)':'var(--dim2)')
    +'</div>'
    // C7 — mesma linha de aviso do painel: dizer quanto do "Em aberto" esta
    // parado com inadimplente, para o numero nao mudar sem explicacao.
    +(abertoInad>0.009
      ?'<div style="font-size:11.5px;color:var(--dim2);padding:0 16px 6px;line-height:1.5">'
       +'Em aberto inclui '+fmt(abertoInad)+' parados com '+fInad.length
       +(fInad.length===1?' inadimplente.':' inadimplentes.')+'</div>'
      :'')
    +'<div style="font-size:11.5px;color:var(--dim2);padding:0 16px;line-height:1.5">'
    // C9 — deixa claro que o capital mostrado e o do periodo escolhido, nao o da
    // vida toda: e essa a mudanca que o dono vai notar primeiro.
    +'Capital emprestado é o dinheiro que saiu do bolso dentro do período filtrado. '
    +'Descontos concedidos no período: '+fmt(totalDesc)+' — abatidos do saldo por acordo, '
    +'não são dinheiro recebido nem entram no lucro.'
    +'</div>';

  html+=graficoLucro();

  html+='<div class="cnts">'
    // o 4º argumento é o hex LEGADO da etiqueta (a bateria financeira o confere);
    // quem manda na cor visível é o CSS .cnt div[style^="font-size:9px"]
    + cnt(quitados,'Quitados','var(--gr)','#15803d')
    + cnt(ativos,'Ativos','var(--ac)','#1d4ed8')
    + cnt(vencidos,'Vencidos','var(--rd)','#991b1b')
    + cnt(fInad.length,'Inadimplentes','var(--am)','#92400e')
    +'</div>';

  // Como os clientes do filtro se comportam. Conta CLIENTE, não empréstimo.
  var nSoJuro=0,nAmortiza=0;
  Object.keys(cn).forEach(function(k){
    var t=clientPerfil(k).tipo;
    if(t==='so_juro')nSoJuro++;else if(t==='amortiza')nAmortiza++;
  });
  if(nSoJuro||nAmortiza){
    var partes=[];
    if(nSoJuro)partes.push(nSoJuro+(nSoJuro===1?' paga':' pagam')+' só o juro');
    if(nAmortiza)partes.push(nAmortiza+(nAmortiza===1?' vai':' vão')+' abatendo');
    html+='<div style="padding:9px 16px 0;font-size:11.5px;color:var(--dim2)">'+partes.join(' · ')+'</div>';
  }

  html+='<div class="btn-fila" style="margin:14px 14px 0">'
    +'<button class="btn btn-gh" onclick="exportarCSV()">'+sv(I.down,17)+'Planilha</button>'
    +'<button class="btn btn-gh" onclick="openBackup()">'+sv(I.doc,17)+'Backup</button>'
    +'</div>';

  if(!filtered.length){
    html+='<div class="vazio">'
      +'<span style="color:var(--dim2);display:flex;justify-content:center">'+sv(I.search,26)+'</span>'
      +'<div class="vazio-t">Nenhum resultado</div>'
      +'<div style="font-size:12.5px;margin-top:2px">Ajuste os filtros acima.</div></div>';
  }else{
    var groups={};
    filtered.forEach(function(l){var k=clientKey(l.name);if(!groups[k])groups[k]={key:k,name:l.name,loans:[]};groups[k].loans.push(l);});
    var arr=Object.keys(groups).map(function(k){return groups[k];});
    arr.sort(function(a,b){
      var ao=a.loans.some(function(l){return!l.paid&&daysUntil(l.dueDate)<0;});
      var bo=b.loans.some(function(l){return!l.paid&&daysUntil(l.dueDate)<0;});
      if(ao!==bo)return ao?-1:1;
      var aa=a.loans.every(function(l){return l.paid;});
      var ba=b.loans.every(function(l){return l.paid;});
      if(aa!==ba)return aa?1:-1;
      return a.name.localeCompare(b.name);
    });
    html+='<div class="sec"><span class="sec-t">'+arr.length+' cliente'+(arr.length!==1?'s':'')+' no período</span>'
      +'<span style="font-size:11.5px;color:var(--dim2)">'+filtered.length+' empréstimo'+(filtered.length!==1?'s':'')+'</span></div>'
      +'<div class="bloco">'+arr.map(renderReportGroup).join('')+'</div>';
  }
  body.innerHTML=html;
}
// Linha do relatório: toca e abre as movimentações do período filtrado.

      +'</div></div>';

        +'border-bottom:1px solid var(--ln)">Sem movimentações no período.</div>';
    }else{
      rows=ev.slice(0,60).map(function(h){
        var isB=h.kind==='borrow',isP=h.kind==='pay',isR=h.kind==='renew';

      +'<span class="linha-st" style="color:var(--dim2)">'+(exp?'▴':'▾')+'</span>')
    + rows;
}
// Planilha do que está filtrado. Só repete números que as telas já mostram.
function exportarCSV(){
  var linhas=[['Cliente','Telefone','Emprestado','Recebido','Juro ganho','Desconto',
               'Saldo','Início','Vencimento','Situação'].join(';')];
  var add=function(l,situacao){
    var g=ledger(l);
    linhas.push([
      '"'+String(l.name||'').replace(/"/g,'""')+'"','"'+(l.phone||'')+'"',
      loanPrincipal(l).toFixed(2).replace('.',','),
      g.recebidoTotal.toFixed(2).replace('.',','),
      g.jurosRecebido.toFixed(2).replace('.',','),
      g.descontoTotal.toFixed(2).replace('.',','),
      getBalance(l).toFixed(2).replace('.',','),
      fmtDate(l.startDate),fmtDate(l.dueDate),situacao
    ].join(';'));
  };
  reportFiltered().forEach(function(l){
    add(l,l.paid?'Quitado':(daysUntil(l.dueDate)<0?'Vencido':'Ativo'));
  });
  reportFilteredInad().forEach(function(i){add(i,'Inadimplente');});
  if(linhas.length===1){showToast('Nada para exportar com estes filtros','warn');return;}
  try{
    var blob=new Blob(['﻿'+linhas.join('\n')],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='emprestimos-'+today()+'.csv';a.click();
    URL.revokeObjectURL(url);

    +'<div style="font-size:20px;font-weight:800;color:var(--ac)">'+fmt(totalBal)+'</div></div>'
    +'<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:var(--tx);display:block;margin-bottom:5px">Valor pago (R$)</label>'
    +'<input id="payall-val" type="number" step="0.01" placeholder="0,00" value="'+totalBal.toFixed(2)+'" style="width:100%;box-sizing:border-box;background:var(--pn2);border:0.5px solid var(--ln);border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit;outline:none"></div>'
    +'<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:var(--tx);display:block;margin-bottom:5px">Observação (opcional)</label>'
    +'<input id="payall-note" type="text" placeholder="Ex: PIX, dinheiro..." style="width:100%;box-sizing:border-box;background:var(--pn2);border:0.5px solid var(--ln);border-radius:8px;padding:9px 12px;font-size:12px;font-family:inherit;outline:none"></div>'
    +'<button class="btn-primary" onclick="doPayAll(\''+key+'\')"  style="width:100%">Confirmar pagamento</button>');
}
function doPayAll(key){
  var val=parseFloat((document.getElementById('payall-val')||{}).value||0);
  var note=(document.getElementById('payall-note')||{}).value||'';
  if(!val||val<=0){showToast('Informe o valor','error');return;}
  var clientLoans=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;});
  var remaining=val, pagos=[];
  clientLoans.sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);});
  clientLoans.forEach(function(loan){
    if(remaining<=0)return;
    if(loan.parcelas&&loan.parcelas.length){
      loan.parcelas.slice().sort(function(a,b){return new Date(a.dueDate+'T00:00:00')-new Date(b.dueDate+'T00:00:00');}).forEach(function(p){
        if(remaining<=0||p.paid)return;
        if(remaining>=(p.currentAmount||0)-0.01){
          remaining=parseFloat((remaining-p.currentAmount).toFixed(2));
          p.paid=true;p.paidDate=today();
          loan.history.push({date:today(),type:'pagamento_final',value:p.currentAmount,note:'Parcela '+p.n+' (pagar tudo)'});
        }
      });
      // Sobra menor que a próxima parcela: abate parcialmente em vez de sumir
      if(remaining>0.009){
        var prox=loan.parcelas.filter(function(p){return!p.paid;}).sort(function(a,b){return new Date(a.dueDate+'T00:00:00')-new Date(b.dueDate+'T00:00:00');})[0];
        if(prox){
          var ap=Math.min(remaining,prox.currentAmount||0);
          prox.currentAmount=parseFloat(((prox.currentAmount||0)-ap).toFixed(2));
          remaining=parseFloat((remaining-ap).toFixed(2));
          loan.history.push({date:today(),type:'pagamento_parcial',value:ap,note:'Abatimento parcial parcela '+prox.n+' (pagar tudo)'});
        }
      }
      syncParceledLoan(loan);
      return;
    }
    var bal=getBalance(loan);
    var pay=Math.min(remaining,bal);
    remaining=parseFloat((remaining-pay).toFixed(2));
    if(pay>=bal){
      // C4 — QUITAR PELO "PAGAR TODOS" NAO PODE APAGAR O QUE JA FOI PAGO.
      // Antes o `loan.payments=[]` jogava fora os pagamentos parciais do periodo
      // SEM passa-los ao historico: o dinheiro que o cliente ja tinha entregue
      // sumia do total recebido e do lucro. E o currentAmount ficava com o valor
      // velho, entao o saldo do cartao nao zerava depois de quitar.
      // _histPagamentosPeriodo() e a mesma funcao que os outros caminhos de
      // quitacao ja usavam — aqui ela so estava faltando.
      _histPagamentosPeriodo(loan);      // move os parciais para o historico e limpa payments
      loan.paid=true;
      loan.currentAmount=0;              // sem isto o saldo nao zerava de verdade
      // Tipo 'pagamento_final': a partir de agora existe UM so tipo de quitacao
      // em lancamento NOVO. O antigo 'pagamento_total' continua sendo RECONHECIDO
      // na leitura (razao e _histLabel), porque ja existem lancamentos gravados
      // com ele e o passado nunca pode parar de ser lido.
      loan.history.push({date:today(),type:'pagamento_final',description:'Pagamento total (pagar tudo)',value:pay,note:note});
    }else{
      loan.payments.push({id:Date.now()+'_'+loan.id,date:today(),value:pay,note:note||'Pagar tudo parcial'});
    }
    if(pagos.indexOf(loan.id)<0)pagos.push(loan.id);
  });
  save(pagos);renderAll();closeModal();
  showToast('✅ Pagamento de '+fmt(val)+' registrado!');
}

function sendWA(id){

// Junta todas as fotos referenciadas (IndexedDB ou base64 legado) num mapa {chave:base64}
// D6 — agora tambem CONTA: quantas fotos eram esperadas e quantas entraram de
// verdade. Antes as que faltavam eram omitidas em silencio e o dono guardava um
// backup sem os documentos sem nunca saber disso.
function collectDocs(){
  var refs=[],vistos={};
  loans.concat(inadimplentes||[]).forEach(function(o){
    ['docRG','docResidencia'].forEach(function(f){
      // T5 — TODAS as páginas entram no backup, não só a primeira.
      // A contagem de "esperadas x incluídas" passa a contar páginas.
      docPaginas(o[f]).forEach(function(k){
        if(k&&!isDataUrl(k)&&!vistos[k]){vistos[k]=1;refs.push(k);}
      });
    });
  });
  if(!refs.length)return Promise.resolve({mapa:{},esperadas:0,incluidas:0,faltando:[]});
  return Promise.all(refs.map(function(k){return docGet(k).then(function(d){return{k:k,d:d};}).catch(function(){return{k:k,d:null};});}))
    .then(function(list){
      var m={},faltando=[];
      list.forEach(function(x){if(x.d)m[x.k]=x.d;else faltando.push(x.k);});
      return {mapa:m,esperadas:refs.length,incluidas:refs.length-faltando.length,faltando:faltando};
    });
}
// Devolve {obj: <o backup em si>, fotos: <o balanco das fotos>}
function buildBackup(){
  return collectDocs().then(function(r){
    return {
      obj:{loans:loans,clients:clients,inadimplentes:inadimplentes,docs:r.mapa,exportedAt:new Date().toISOString()},
      fotos:r
    };
  });
}
function markBackup(){
  try{localStorage.setItem('emp_last_backup',String(Date.now()));_marcarGravacaoOk('emp_last_backup');}
  catch(e){_marcarGravacaoFalhou('emp_last_backup');}   // D8 — nem isto pode falhar calado
}
// Salva o arquivo .json no aparelho.

// D6 — pergunta ANTES de baixar quando falta foto. Quem decide e o dono.
// cb() e chamado quando pode seguir; nada acontece se ele cancelar.
function _avisarFotosFaltando(fotos,cb){

      +'(sem internet ou não baixadas neste aparelho). Conecte-se e refaça o backup.',
    ok:'Baixar assim mesmo',cancelar:'Cancelar',perigo:true
  },function(){cb();});
}
