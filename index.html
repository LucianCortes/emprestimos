<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Empréstimos</title>
<!-- D1 — APP INSTALAVEL QUE ABRE SEM INTERNET.
     O manifesto diz ao celular que isto e um aplicativo (nome, icone, cores) e
     nao apenas um atalho de site. Caminho RELATIVO porque o app e publicado
     numa subpasta do GitHub Pages. O registro do service worker fica no fim do
     arquivo, junto com o resto do codigo. -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0A0C10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Empréstimos">
<!-- Tema antes de qualquer pintura: sem isto a tela pisca no tema errado
     quando o dono forçou claro/escuro diferente do aparelho. -->
<script id="tema-boot">
try{var _t=localStorage.getItem('emp_tema');
  if(_t==='claro')document.documentElement.setAttribute('data-theme','light');
  else if(_t==='escuro')document.documentElement.setAttribute('data-theme','dark');
}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   TOKENS — todas as cores nascem aqui, no tema claro.
   O escuro só REDEFINE. Nenhuma cor pode existir apenas dentro
   de @media ou de [data-theme]: se existisse, o outro tema
   ficaria sem ela e a tela sairia ilegível.
   ============================================================ */
:root{
  --bg:#F5F7FA; --pn:#FFFFFF; --pn2:#EDF1F6; --pn3:#E3E9F1;
  --ln:#DDE3EC; --ln2:#C7D0DC;
  --tx:#0B1119; --dim:#576375; --dim2:#8A95A6;
  --ac:#8A6317; --acTx:#FFFFFF;
  --gr:#0B6E4F; --rd:#B3261E; --am:#8A5200;
  --acS:#F5EEE0; --grS:#E2F1EA; --rdS:#FBE7E5; --amS:#FAEEDC;
  --sh:0 1px 2px rgba(11,17,25,.05);
  color-scheme:light;
}
/* escuro automático (segue o aparelho), salvo se o dono forçou o claro */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0C10; --pn:#141922; --pn2:#1C232E; --pn3:#232B37;
  --ln:#262E3A; --ln2:#333D4C;
  --tx:#EDF1F6; --dim:#8B97A8; --dim2:#5D6878;
  --ac:#E3B466; --acTx:#15100A;
  --gr:#4FD59A; --rd:#FF7A6E; --am:#F0B45E;
  --acS:rgba(227,180,102,.12); --grS:rgba(79,213,154,.12);
  --rdS:rgba(255,122,110,.12); --amS:rgba(240,180,94,.12);
  --sh:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}}
/* escuro forçado pelo seletor da tela Conta */
:root[data-theme="dark"]{
  --bg:#0A0C10; --pn:#141922; --pn2:#1C232E; --pn3:#232B37;
  --ln:#262E3A; --ln2:#333D4C;
  --tx:#EDF1F6; --dim:#8B97A8; --dim2:#5D6878;
  --ac:#E3B466; --acTx:#15100A;
  --gr:#4FD59A; --rd:#FF7A6E; --am:#F0B45E;
  --acS:rgba(227,180,102,.12); --grS:rgba(79,213,154,.12);
  --rdS:rgba(255,122,110,.12); --amS:rgba(240,180,94,.12);
  --sh:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--tx);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
/* botão desligado tem que PARECER desligado, não só recusar o toque */
button[disabled]{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:3px}

/* Dinheiro: SEMPRE em mono com as casas alinhadas */
.mono{font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;font-weight:600}
h1,h2,h3,.arch{font-family:Archivo,system-ui,sans-serif;letter-spacing:-.02em}

/* ============================================================
   ESQUELETO
   ============================================================ */
#app{display:none}
.shell{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.col-main{min-width:0}
#menu-desk{display:none}
.topo{background:var(--pn);border-bottom:1px solid var(--ln);padding:8px 12px;
  display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:60;min-height:56px}
.topo-tit{flex:1;min-width:0;font-family:Archivo,sans-serif;font-size:17px;font-weight:800;
  letter-spacing:-.018em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-kick{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.ico-btn{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;
  border-radius:10px;color:var(--dim);flex:none}
.ico-btn:hover{background:var(--pn2)}
.ico-ac{background:var(--ac);color:var(--acTx);min-width:44px;min-height:44px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex:none}
.rotulo-novo{display:none}
/* o seletor de setinhas do campo numérico briga com o valor grande da tela Receber */
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.screen{display:none;padding-bottom:96px}
.screen.active{display:block}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:70;display:flex;
  background:var(--pn);border-top:1px solid var(--ln);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  min-height:52px;justify-content:center;color:var(--dim2);
  font-family:Archivo,sans-serif;font-size:10.5px;font-weight:700;position:relative}
.tab[aria-current="page"]{color:var(--ac)}
.tab-badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--rd);color:var(--bg);
  min-width:16px;height:16px;border-radius:8px;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ============================================================
   PEÇAS (as mesmas em todas as telas)
   ============================================================ */
.sec{padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}
.sec-t{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2)}
.sec-a{color:var(--ac);font-size:12.5px;font-weight:700;font-family:Archivo,sans-serif;
  min-height:44px;display:flex;align-items:center}

/* blocos colados de indicadores: 1px da cor da linha entre eles, sem sombra */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);
  border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin:12px 14px}
.tile{background:var(--pn);padding:10px 11px;min-width:0;width:100%;text-align:left;
  display:block;min-height:56px}
.tile-l{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.tile-v{margin-top:2px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* caixa com borda — NUNCA dentro de outra caixa com borda */
.bloco{background:var(--pn);border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin:0 14px}
.bloco.plano{margin:0}

/* lista em LINHAS, com a barra de situação na lateral esquerda */
.linha{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  width:100%;padding:10px 12px 10px 9px;background:var(--pn);position:relative;
  border-bottom:1px solid var(--ln);border-left:3px solid var(--dim2);min-height:60px}
.linha:last-child{border-bottom:none}
.linha:hover{background:var(--pn2)}
/* o botão principal cobre a linha inteira (área de toque), sem virar
   "botão dentro de botão": o de Receber fica por cima, num nível acima */
.linha-main{min-width:0;text-align:left;padding:0;min-height:44px;
  display:flex;flex-direction:column;justify-content:center;gap:1px}
.linha-main::after{content:"";position:absolute;inset:0;z-index:1}
.linha-main:focus-visible{outline:none}
.linha-main:focus-visible::after{outline:2px solid var(--ac);outline-offset:-3px;border-radius:10px}
.linha>*:not(.linha-main){position:relative;z-index:2}
.linha-n{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-s{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-st{width:64px;text-align:right;font-size:11.5px;font-weight:700;white-space:nowrap}

.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:9px 14px;border-bottom:1px solid var(--ln)}
.kv:has(.ico-btn){align-items:center;padding-top:4px;padding-bottom:4px}
.kv:last-child{border-bottom:none}
.kv-l{font-size:13.5px;color:var(--dim)}
.kv.forte .kv-l{color:var(--tx);font-weight:600}

.selo{display:inline-block;border-radius:6px;padding:3px 9px;font-size:11.5px;font-weight:700;
  white-space:nowrap}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--ln2);background:transparent;color:var(--dim);border-radius:9px;
  padding:0 13px;min-height:44px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--acTx)}

/* Linha de empréstimo na ficha do cliente: empilhada, largura toda, sem rolar
   para o lado. O empréstimo aberto fica com o fundo do dourado suave. */
.emp-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;min-height:48px;padding:10px 13px;border:none;text-align:left;color:var(--tx)}
.emp-linha-t{flex:1;min-width:0;font-size:13.5px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;
  border-radius:12px;font-family:Archivo,sans-serif;font-size:15px;font-weight:700;padding:0 16px;width:100%}
/* botões em fila: sem isto cada um pede 100% da largura e a tela estoura */
.btn-fila{display:flex;gap:8px}
.btn-fila>.btn{width:auto;flex:1;min-width:0}
.btn-fila>.btn.fixo{flex:none;padding:0 15px}
.btn-ac{background:var(--ac);color:var(--acTx)}
.btn-gh{background:var(--pn);color:var(--tx);border:1px solid var(--ln2)}
.btn-rd{background:var(--rdS);color:var(--rd);border:1px solid var(--rd)}
.btn-txt{color:var(--dim);font-weight:600;font-family:inherit;font-size:14px;min-height:44px}
.btn-mini{min-height:44px;border-radius:9px;padding:0 13px;background:var(--ac);color:var(--acTx);
  font-family:Archivo,sans-serif;font-size:13px;font-weight:700;flex:none}
/* aparelho estreito: o botão cede espaço para o nome do cliente */
@media (max-width:359px){
  .btn-mini{padding:0 9px;font-size:12.5px}
  .linha{padding-left:7px;padding-right:9px;gap:7px}
  .linha-st{width:56px}
}

/* as quatro ações da ficha */
.acoes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:11px 14px 0}
.acao{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-height:62px;padding:8px 3px;border-radius:11px;border:1px solid var(--ln);background:var(--pn);
  color:var(--tx);font-family:Archivo,sans-serif;font-size:12px;font-weight:700}
.acao.pri{border-color:var(--ac);background:var(--ac);color:var(--acTx)}

.aviso{display:flex;align-items:center;gap:9px;margin:12px 14px 0;padding:10px 12px;
  border-radius:11px;border:1px solid var(--ln);background:var(--pn);
  font-size:12.5px;font-weight:600;text-align:left;width:calc(100% - 28px);min-height:48px}

.vazio{text-align:center;padding:40px 18px;color:var(--dim2)}
.vazio-t{font-family:Archivo,sans-serif;font-size:16px;font-weight:800;color:var(--tx);margin-top:8px}

/* campos */
.campo{margin-bottom:11px}
.campo>label,.rot{display:block;font-size:10px;color:var(--dim2);font-weight:700;
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.09em}
.inp{width:100%;background:var(--bg);border:1px solid var(--ln2);border-radius:10px;
  padding:12px 12px;color:var(--tx);font-size:15px;outline:none;min-height:46px}
.inp::placeholder{color:var(--dim2)}
.inp:focus{border-color:var(--ac)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg-btn{flex:1 1 0;min-width:0;min-height:44px;border-radius:9px;font-size:13px;font-weight:600;
  border:1px solid var(--ln2);background:var(--pn);color:var(--dim);white-space:nowrap}
.seg-btn.active{background:var(--ac);border-color:var(--ac);color:var(--acTx)}

/* prévia de cálculo (usada no formulário, na renovação e na edição) */
.previa,.preview-box{border:1px solid var(--ln);border-radius:11px;background:var(--pn);
  margin-bottom:11px;padding:11px 13px}
.previa-t,.preview-label{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim2);margin-bottom:7px;display:block}
.preview-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:13.5px;color:var(--dim);margin-bottom:4px}
.preview-row span:last-child{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-weight:600;color:var(--tx)}
.preview-row.total{font-size:15px;font-weight:600;color:var(--tx);
  border-top:1px solid var(--ln);padding-top:7px;margin-top:6px}

/* nomes que vieram do app antigo e continuam valendo — agora com os tokens */
.field{margin-bottom:11px}
.field>label,.field-label{display:block;font-size:10px;color:var(--dim2);font-weight:700;
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.09em}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg-control{display:flex;gap:5px;flex-wrap:wrap}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.modal-title{font-family:Archivo,sans-serif;font-size:18px;font-weight:800;letter-spacing:-.02em}
.modal-close{min-width:44px;min-height:44px;border-radius:10px;background:var(--pn2);color:var(--dim);
  display:flex;align-items:center;justify-content:center;flex:none;font-size:20px}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions>*{flex:1}
.btn-primary,.btn-secondary,.btn-danger{display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:48px;border-radius:12px;font-family:Archivo,sans-serif;font-size:15px;font-weight:700;padding:0 14px}
.btn-primary{background:var(--ac);color:var(--acTx);border:none}
.btn-secondary{background:var(--pn);color:var(--tx);border:1px solid var(--ln2)}
.btn-danger{background:var(--rdS);color:var(--rd);border:1px solid var(--rd)}
.abtn{min-height:44px;border-radius:9px;padding:0 12px;font-size:13px;font-weight:600;
  border:1px solid var(--ln2);background:var(--pn);color:var(--tx)}
.doc-label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border-radius:11px;min-height:76px;padding:10px 8px;text-align:center;cursor:pointer;
  border:1px dashed var(--ln2);background:var(--pn);font-size:12px;font-weight:600;color:var(--dim)}
.doc-label.tem{border-style:solid;border-color:var(--gr);color:var(--gr);background:var(--grS)}
.payment-tracker{border:1px solid var(--ln);border-radius:12px;background:var(--pn);padding:12px 14px;margin-bottom:11px}
.tracker-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;margin-bottom:4px}
.tracker-label{color:var(--dim)}
.tracker-val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.tracker-bar{height:6px;background:var(--pn2);border-radius:3px;margin:8px 0 6px;overflow:hidden}
.tracker-fill{height:100%;background:var(--gr);border-radius:3px}
.payment-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 12px;border:1px solid var(--ln);border-radius:9px;margin-bottom:5px;font-size:13px;background:var(--pn)}
.renew-box{border:1px solid var(--am);background:var(--amS);border-radius:11px;padding:12px 14px;margin-bottom:11px}
.renew-title{font-size:13px;font-weight:700;color:var(--am);margin-bottom:3px}
.hist-item{background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--ln2);
  border-radius:10px;padding:10px 12px;margin-bottom:6px}
.empty-state{text-align:center;padding:36px 18px;color:var(--dim2)}
/* a faixa da taxa carrega hex legado no atributo style (a bateria financeira o
   verifica); aqui o tema vence por cima, para ela não ficar ilegível no escuro */
#rate-hint.hint-cinza{color:var(--dim2)!important}
#rate-hint.hint-ambar{background:var(--amS)!important;color:var(--am)!important}

/* ============================================================
   JANELAS (folha por baixo no celular, centro no computador)
   ============================================================ */
.overlay{position:fixed;inset:0;background:rgba(6,9,14,.6);display:flex;align-items:flex-end;
  justify-content:center;z-index:500;padding:0}
.modal{background:var(--bg);border-radius:18px 18px 0 0;padding:16px 14px calc(30px + env(safe-area-inset-bottom));
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:sobe .22s ease}
@keyframes sobe{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.modal-t{font-family:Archivo,sans-serif;font-size:18px;font-weight:800;letter-spacing:-.02em}
.modal-x{min-width:44px;min-height:44px;border-radius:10px;background:var(--pn2);color:var(--dim);
  display:flex;align-items:center;justify-content:center;flex:none}
.modal-acoes{display:flex;gap:8px;margin-top:14px}
.modal-acoes>*{flex:1}
@media (min-width:900px){
  .overlay{align-items:center;padding:24px}
  .modal{border-radius:16px;max-width:480px;padding-bottom:20px}
}

/* folha de confirmação — substitui confirm()/prompt() do navegador.
   Fica acima de tudo (PIN, foto em tela cheia): é ela que pergunta. */
#sheet-root .overlay{z-index:9990}
.folha-txt{font-size:14px;color:var(--dim);line-height:1.55;margin-bottom:14px;white-space:pre-line}

/* ============================================================
   AVISOS
   ============================================================ */
/* Os avisos moram EMBAIXO, acima das abas: no topo eles tapavam justamente os
   números da Carteira, que é o que o dono abre o app para ver. */
#toast-container{position:fixed;left:12px;right:12px;z-index:9999;display:flex;
  flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  bottom:calc(78px + env(safe-area-inset-bottom))}
@media (min-width:900px){#toast-container{bottom:16px;left:auto;right:16px;align-items:flex-end}}
.toast{background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--gr);
  border-radius:10px;padding:10px 14px;font-size:13px;color:var(--tx);max-width:420px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);animation:entra .2s ease}
.toast.error{border-left-color:var(--rd)}
.toast.warn{border-left-color:var(--am)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   PIN
   ============================================================ */
.pin-overlay{position:fixed;inset:0;background:var(--bg);z-index:9000;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.pin-logo{width:52px;height:52px;border-radius:15px;background:var(--acS);color:var(--ac);
  display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.pin-title{font-family:Archivo,sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em}
.pin-sub{font-size:12.5px;color:var(--dim);margin:3px 0 20px;text-align:center;max-width:280px}
.pin-dots{display:flex;gap:14px;margin-bottom:18px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--ln2);background:transparent}
.pin-dot.filled{background:var(--ac);border-color:var(--ac)}
.pin-error{color:var(--rd);font-size:12px;font-weight:600;margin-bottom:10px;min-height:18px;text-align:center}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:264px}
.pin-key{background:var(--pn);border:1px solid var(--ln);border-radius:12px;min-height:56px;
  font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;color:var(--tx)}
.pin-key:active{background:var(--ac);color:var(--acTx)}
.pin-key.del{font-size:15px;color:var(--dim)}
.pin-forgot{color:var(--dim);font-size:12.5px;margin-top:18px;min-height:44px;display:flex;align-items:center}

/* sugestões de cliente */
#sugg-box{display:none;position:absolute;top:100%;left:0;right:0;background:var(--pn);
  border:1px solid var(--ln);border-radius:11px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.18);
  max-height:190px;overflow-y:auto;margin-top:4px}
.sugg-item{padding:0 12px;min-height:52px;display:flex;align-items:center;gap:8px;
  font-size:14px;border-bottom:1px solid var(--ln)}
.sugg-item:last-child{border-bottom:none}

/* extrato */
.ext{padding:10px 14px;border-bottom:1px solid var(--ln)}
.ext:last-child{border-bottom:none}
.ext-t{font-size:14px;font-weight:600}
.ext-d{font-size:11.5px;color:var(--dim2)}
.ext-s{font-size:11px;color:var(--dim2);margin-top:1px}
.ext-sub{font-size:11.5px;margin-top:5px;font-weight:600;color:var(--gr)}

/* gráfico de barras do lucro por mês */
.graf{display:flex;align-items:flex-end;gap:8px;height:104px;margin-top:12px}
.graf-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.graf-v{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.graf-b{width:100%;background:var(--pn3);border-radius:4px 4px 2px 2px;min-height:2px}
.graf-b.hoje{background:var(--ac)}
.graf-m{font-size:10.5px;color:var(--dim2);font-weight:600}

/* contadores do relatório — a etiqueta herda o tema (o style de linha é legado
   preservado porque a bateria de testes financeiros o verifica letra por letra) */
.cnts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 14px 0}
/* em tela bem estreita quatro colunas não cabem: viram duas, sem cortar palavra */
@media (max-width:359px){.cnts{grid-template-columns:1fr 1fr}}
.cnt{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:9px 4px;
  text-align:center;min-width:0;overflow:hidden}
.cnt>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt div[style^="font-size:9px"]{font-size:10px!important;font-weight:600;margin-top:1px;
  color:var(--dim2)!important}

/* ============================================================
   COMPUTADOR — três painéis, como no protótipo aprovado
   ============================================================ */
#pane-cliente{min-width:0}
@media (min-width:900px){
  body{overflow:hidden}
  .shell{max-width:none;margin:0;display:grid;
    grid-template-columns:220px minmax(0,1fr) 350px;height:100vh;overflow:hidden}
  .col-main{overflow-y:auto;height:100vh}
  .tabs{display:none}
  .screen{padding-bottom:24px}
  #menu-desk{display:flex;flex-direction:column;gap:2px;background:var(--pn);
    border-right:1px solid var(--ln);padding:14px 10px;overflow-y:auto;height:100vh}
  .menu-i{display:flex;align-items:center;gap:9px;padding:0 11px;min-height:44px;border-radius:9px;
    font-family:Archivo,sans-serif;font-size:13.5px;font-weight:700;color:var(--dim);width:100%}
  .menu-i[aria-current="page"]{background:var(--acS);color:var(--ac)}
  #pane-cliente{border-left:1px solid var(--ln);background:var(--pn);overflow-y:auto;height:100vh}
  #screen-cliente{display:block;padding-bottom:24px}
  #screen-cliente.active{display:block}
  .topo{position:sticky}
  .modal{max-height:80vh}
  /* quatro indicadores lado a lado, como no protótipo */
  .tiles{grid-template-columns:repeat(4,1fr)}
  /* o menu já carrega o nome do app: no cabeçalho ele seria eco */
  .topo-kick{display:none!important}
  #btn-novo{width:auto;padding:0 15px;gap:8px;font-family:Archivo,sans-serif;font-size:13.5px;font-weight:700}
  .rotulo-novo{display:inline}
}
/* a tabela larga só existe no computador */
.tabela-wrap{display:none}
@media (min-width:900px){
  .tabela-wrap{display:block;margin:0 14px 18px;border:1px solid var(--ln);border-radius:11px;
    background:var(--pn);overflow-x:auto}
  .tabela{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  .tabela th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--dim2);font-weight:700;padding:10px 11px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
  .tabela th.num{text-align:right}
  .tabela td{padding:9px 11px;border-bottom:1px solid var(--ln);white-space:nowrap}
  .tabela td.num{text-align:right}
  .tabela tr:last-child td{border-bottom:none}
  .tabela tr.sel td{background:var(--acS)}
  .so-cel{display:none}
}
@media (max-width:899px){.so-desk{display:none!important}}

<body>
<div id="toast-container"></div>
<div id="modal-container"></div>
<!-- folhas de confirmação: substituem confirm()/prompt() do navegador -->
<div id="sheet-root"></div>
<div id="app">
 <div class="shell">

  <!-- menu lateral (só no computador) -->
  <nav id="menu-desk" aria-label="Seções">
    <div style="padding:4px 11px 14px">
      <div class="topo-kick">Controle de</div>
      <div class="arch" style="font-size:17px;font-weight:800">Empréstimos</div>
    </div>
    <button class="menu-i" id="menu-home" onclick="goScreen('home')"><span id="mi-home"></span>Carteira</button>
    <button class="menu-i" id="menu-clients" onclick="goScreen('clients')"><span id="mi-clients"></span>Clientes</button>

         Quando o armazenamento do aparelho enche, a fila de pendencias nao e

    <!-- CARTEIRA -->

             border:1px solid var(--ln);border-radius:11px;padding:0 12px;min-height:46px">
          <span id="busca-ico" style="color:var(--dim2);display:flex;flex:none"></span>

    <!-- RECEBER -->

    <!-- CONTA -->

  </div>

  <!-- FICHA DO CLIENTE: tela empilhada no celular, painel fixo no computador -->
  <aside id="pane-cliente">
    <div id="screen-cliente" class="screen"><div id="cliente-content"></div></div>
  </aside>
 </div>

 <nav class="tabs" aria-label="Navegação principal">
   <button class="tab" id="nav-home" onclick="goScreen('home')"><span id="ti-home"></span>Carteira</button>
   <button class="tab" id="nav-clients" onclick="goScreen('clients')"><span id="ti-clients"></span>Clientes</button>
   <button class="tab" id="nav-report" onclick="goScreen('report')"><span id="ti-report"></span>Números</button>
   <button class="tab" id="nav-conta" onclick="goScreen('conta')"><span id="ti-conta"></span>Conta</button>
 </nav>

<script>
// ============================================================
// CONFIGURAÇÃO — AS REGRAS DO SEU NEGÓCIO
// ============================================================
// Este é o único lugar que você precisa mexer para mudar as regras
// do app. Troque só o valor depois dos dois-pontos (:) e não apague
// as vírgulas. Depois de mudar, feche e abra o app de novo.
//
// ATENÇÃO: mexer aqui muda como o app calcula daqui para a frente.
// Empréstimos que já estão lançados continuam com as datas que já
// receberam — o valor novo vale para o que for lançado ou renovado
// depois da mudança.
var CONFIG = {

  // De quantos em quantos dias o empréstimo vence e o juro corre.
  // É o "mês" do app. Hoje: 30 dias.
  // Se você trocar para 15, todo empréstimo novo vencerá em 15 dias
  // e o juro passará a ser cobrado de 15 em 15 dias. É o valor mais
  // pesado deste bloco: mexe em vencimento, renovação e juro.
  CICLO_DIAS: 30,

  // Os botões de juro que aparecem no formulário de novo empréstimo.
  // São textos entre aspas, separados por vírgula. Pode tirar, pôr ou
  // reordenar. Não precisa incluir todos: sempre existe o botão
  // "Outro" para digitar uma taxa que não está na lista.
  TAXAS: ['10','15','20','25','30'],

  // Os botões de parcelamento do formulário (1x, 2x, 3x...).
  // Mesma ideia: textos entre aspas, separados por vírgula.
  PARCELAS: ['1','2','3','4','6','12'],

  // O juro que já vem marcado quando você lança um empréstimo para
  // um cliente NOVO. Para cliente que você já atendeu, o app usa a
  // taxa que aquele cliente já tinha e ignora este valor.
  // Escreva entre aspas, como nos botões acima.
  TAXA_PADRAO: '30',

  // Tamanho máximo, em pontos de tela, das fotos de documento (RG,
  // comprovante). A foto é reduzida até caber neste tamanho antes de
  // ser guardada. Número maior = foto mais nítida, porém mais pesada
  // para guardar e mais lenta para sincronizar.
  FOTO_MAX_PX: 1000,

  // A qualidade da foto depois de reduzida, de 0 a 1.
  // 0.7 é um bom meio-termo. Perto de 1 = quase sem perda, arquivo
  // grande. Perto de 0.4 = arquivo pequeno, foto embaçada.
  FOTO_QUALIDADE: 0.7,

  // Quanto o app espera, em milésimos de segundo, antes de mandar as
  // alterações para a nuvem (1200 = 1,2 segundo). Essa espera serve
  // para juntar várias mudanças seguidas num envio só. Aumentar
  // economiza internet; diminuir manda mais rápido.
  PUSH_ESPERA_MS: 1200,

  // De quantos em quantos dias o app lembra você de baixar o backup.
  // Passado esse tempo sem baixar, o aviso do backup fica amarelo.
  BACKUP_LEMBRETE_DIAS: 30,

  // O corte, em por cento, que separa os dois tipos de cliente no
  // selo de perfil. Se o cliente já abateu MENOS que esta porcentagem
  // da dívida, ele é "Paga só o juro"; daí para cima é "Vai abatendo".
  // Isso é só o rótulo na tela — não muda nenhuma conta.
  PERFIL_CORTE_PCT: 5

};

// ============================================================
// STATE
// ============================================================
var loans=[],clients=[],inadimplentes=[];
var currentFilter='all',currentScreen='home';
var expandedGroups={},expandedCards={},expandedClientHistory={},deleteConfirm=null;
var appUnlocked=false,pinBuffer='',pinMode='check',pinNewTemp='';
var _searchQuery='';
var PIN_KEY='emp_pin_v3';
var formData={};

// ============================================================
// NUVEM (Supabase) — endereço e chave
// ============================================================
// ISTO NÃO É CONFIGURAÇÃO DE REGRA e por isso ficou FORA do bloco
// CONFIG lá em cima. É o endereço e a chave da nuvem onde os dados
// são guardados — quem mexe aqui é quem cuida do servidor, não o
// dono do negócio. Trocar estes dois valores por engano desliga a
// sincronização.
var SUPA_URL='https://dqauszhnkswgabkpbznf.supabase.co';
var SUPA_KEY='sb_publishable_EUqGfUca6mmNCPoBRRo5YQ_eClBC7NG';
var sb=null, cloudOn=false, cloudUser=null, cloudEmail='', _pushTimer=null;
try{
  if(window.supabase&&window.supabase.createClient){
    sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
    cloudOn=true;
  }
}catch(e){cloudOn=false;}

// ============================================================
// PERSISTENCE
// ============================================================
// save(touched): "touched" e o(s) id(s) mexido(s) agora. Se nao vier nada,
// marca tudo como pendente (conservador: em caso de duvida, o aparelho manda).
function save(touched){
  // D2 — REDE DE SEGURANCA. A partir de agora o envio para a nuvem manda SO as
  // linhas marcadas como pendentes. Entao "chamar save sem dizer o que mudou"
  // deixou de ser inofensivo: seria dado que nunca sobe. Quando nao vem
  // argumento nenhum, tratamos como "marcar tudo" — enviar demais custa rede,
  // enviar de menos custa dinheiro. save(null) continua significando
  // "nada mudou de fato" para quem escreveu isso de proposito.
  if(arguments.length===0)touched='*';
  _ledgerInvalidate();                 // qualquer gravacao invalida o razao em cache
  var cliTocados=[];
  loans.forEach(function(l){var id=upsertClient(l);if(id)cliTocados.push(id);});
  markDirty('emprestimos',_idList(touched,loans));
  // So os clientes realmente criados/alterados. Marcar a lista toda fazia o
  // aparelho vencer a nuvem sempre nessa tabela.
  markDirty('clientes',touched==='*'?clients.map(function(c){return c.id;}):cliTocados);
  _saveLocal();
  cloudQueue();
}
function _saveLocal(){
  try{
    localStorage.setItem('emp_loans_v3',JSON.stringify(loans));
    localStorage.setItem('emp_clients_v3',JSON.stringify(clients));
    _marcarGravacaoOk('emp_loans_v3');   // D8 — esta chave gravou de novo
  }catch(e){
    // D8 — o texto antigo dizia "os dados na nuvem seguem salvos", o que e
    // mentira quando o app esta offline ou fora da conta: nesse caso o
    // lancamento some ao fechar o app. Agora acende o mesmo aviso fixo do resto.
    if(typeof console!=='undefined')console.error('Falha ao salvar local:',e);
    _marcarGravacaoFalhou('emp_loans_v3');
  }
}
function load(){
  try{loans=JSON.parse(localStorage.getItem('emp_loans_v3')||localStorage.getItem('emp_loans_v2')||'[]');}catch(e){loans=[];}
  try{clients=JSON.parse(localStorage.getItem('emp_clients_v3')||localStorage.getItem('emp_clients_v2')||'[]');}catch(e){clients=[];}
  try{inadimplentes=JSON.parse(localStorage.getItem('emp_inad_v1')||'[]');}catch(e){inadimplentes=[];}
  migrateLoans(loans);
}
// Migracao defensiva: garante arrays e o campo principal (capital realmente emprestado)
function migrateLoans(arr){
  (arr||[]).forEach(function(l){
    if(!Array.isArray(l.payments))l.payments=[];
    if(!Array.isArray(l.history))l.history=[];
    if(l.principal==null){
      var f=l.history.find(function(h){return h.type==='emprestimo'||h.type==='empréstimo';});
      l.principal=f?f.value:(l.originalAmount||0);
    }
  });
}
function saveInad(touched){
  if(arguments.length===0)touched='*';  // D2 — mesma rede de seguranca do save()
  _ledgerInvalidate();                 // idem para inadimplentes
  markDirty('inadimplentes',_idList(touched,inadimplentes));
  _saveInadLocal();
  cloudQueue();
}
function _saveInadLocal(){
  try{localStorage.setItem('emp_inad_v1',JSON.stringify(inadimplentes));_marcarGravacaoOk('emp_inad_v1');}
  catch(e){
    if(typeof console!=='undefined')console.error('Falha ao salvar inadimplentes:',e);
    _marcarGravacaoFalhou('emp_inad_v1');   // D8 — mesmo aviso fixo, nada falha calado
  }
}
// Devolve o id do cliente criado ou alterado — nulo quando nada mudou.
// Serve para marcar sujo so quem mexeu, em vez da lista inteira.
function upsertClient(l){
  var k=clientKey(l.name);
  var ex=clients.find(function(c){return clientKey(c.name)===k;});
  if(!ex){clients.push({id:l.id,name:l.name,phone:l.phone||'',address:l.address||''});return l.id;}
  var mudou=false;
  if(l.phone&&ex.phone!==l.phone){ex.phone=l.phone;mudou=true;}
  if(l.address&&ex.address!==l.address){ex.address=l.address;mudou=true;}
  return mudou?ex.id:null;
}

// ============================================================
// PENDENCIAS OFFLINE — o que ainda nao foi confirmado na nuvem
// ============================================================
// Duas listas guardadas no aparelho:
//  - emp_dirty_v1      : ids alterados aqui e ainda nao aceitos pela nuvem ("sujos").
//  - emp_tombstones_v1 : ids que o usuario apagou de fato (unica coisa que autoriza
//                        apagar na nuvem). Tombstone velho (>90 dias) e descartado.
var DIRTY_KEY='emp_dirty_v1', TOMB_KEY='emp_tombstones_v1', TOMB_MAX_DAYS=90;
var SYNC_TABLES=['emprestimos','clientes','inadimplentes'];
function _lsGet(k,def){try{var v=JSON.parse(localStorage.getItem(k)||'null');return (v==null)?def:v;}catch(e){return def;}}
// D8 — _lsSet grava a FILA DE PENDENCIAS e a lista de EXCLUSOES. Se ela falhar
// calada (era um catch vazio), o lancamento fica na tela, o app diz "salvo", a
// marca de pendente nao e guardada e aquele lancamento NUNCA sobe para a nuvem.
// Agora: toast de erro na hora + aviso fixo no alto da tela, que so apaga
// quando uma gravacao voltar a dar certo.
// O aviso e por CHAVE: gravar a lista de emprestimos com sucesso nao pode
// apagar o aviso de que a FILA DE PENDENCIAS falhou. Enquanto sobrar uma chave
// na lista de falhas, o aviso continua na tela.
var _gravacaoFalhas={};
function _gravacaoTemFalha(){
  for(var k in _gravacaoFalhas){if(_gravacaoFalhas[k])return true;}
  return false;
}
function _pintarAvisoGravacao(){
  if(typeof document==='undefined')return;
  var el=document.getElementById('aviso-gravacao');
  if(!el)return;
  if(_gravacaoTemFalha()){
    el.textContent='⚠️ A gravação falhou — faça um backup agora e libere espaço no aparelho. Enquanto isso, lançamentos novos podem não ser guardados nem subir para a nuvem.';
    el.style.display='block';
  }else{
    el.textContent='';
    el.style.display='none';
  }
}
function _marcarGravacaoFalhou(chave){
  var novo=!_gravacaoTemFalha();
  _gravacaoFalhas[chave||'?']=true;
  _pintarAvisoGravacao();
  // O toast so aparece na primeira falha da sequencia, para nao virar enxurrada.
  if(novo&&typeof showToast==='function')showToast('⚠️ A gravação falhou — faça um backup agora e libere espaço.','error');
}
function _marcarGravacaoOk(chave){
  var k=chave||'?';
  if(!_gravacaoFalhas[k])return;
  delete _gravacaoFalhas[k];
  _pintarAvisoGravacao();
}
function _lsSet(k,v){
  try{
    localStorage.setItem(k,JSON.stringify(v));
    _marcarGravacaoOk(k);          // gravou: esta chave sai da lista de falhas
    return true;
  }catch(e){
    if(typeof console!=='undefined'&&console.error)console.error('Falha ao gravar '+k,e);
    _marcarGravacaoFalhou(k);
    return false;
  }
}
// Normaliza o argumento "touched": undefined => todos os ids do array
function _idList(touched,arr){
  // null  => nada mudou de fato (nao marca nada como sujo)
  // '*'   => tudo (so a restauracao de backup usa isso)
  // id/[] => exatamente o que mudou
  if(touched==='*')return (arr||[]).map(function(o){return o.id;});
  if(touched==null)return [];
  return (Array.isArray(touched)?touched:[touched]);
}
// ---- sujos ----
function _dirtyAll(){
  var o=_lsGet(DIRTY_KEY,{});
  if(!o||typeof o!=='object')o={};
  SYNC_TABLES.forEach(function(t){if(!Array.isArray(o[t]))o[t]=[];});
  return o;
}
function markDirty(table,ids){
  if(!table||!ids||!ids.length)return;
  var o=_dirtyAll(),ch=false;
  ids.forEach(function(id){if(id&&o[table].indexOf(id)<0){o[table].push(id);ch=true;}});
  if(ch)_lsSet(DIRTY_KEY,o);
  // se o registro voltou a existir, ele nao pode continuar na lista de apagados
  dropTombstones(table,ids);
}
function clearDirty(table,ids){
  if(!table||!ids||!ids.length)return;
  var o=_dirtyAll(),before=o[table].length;
  o[table]=o[table].filter(function(id){return ids.indexOf(id)<0;});
  if(o[table].length!==before)_lsSet(DIRTY_KEY,o);
}
function dirtyIds(table){return _dirtyAll()[table]||[];}
function isDirty(table,id){return dirtyIds(table).indexOf(id)>=0;}
// ---- apagados (tombstones) ----
function tombstones(){
  var arr=_lsGet(TOMB_KEY,[]);
  if(!Array.isArray(arr))arr=[];
  var limite=Date.now()-TOMB_MAX_DAYS*86400000,keep=[];
  arr.forEach(function(t){
    if(!t||!t.table||!t.id)return;
    var at=Date.parse(t.at||'');
    if(isNaN(at))at=Date.now();
    if(at>=limite)keep.push({table:t.table,id:t.id,at:t.at||new Date(at).toISOString()});
  });
  if(keep.length!==arr.length)_lsSet(TOMB_KEY,keep);
  return keep;
}
function addTombstone(table,id){
  if(!table||!id)return;
  var arr=tombstones();
  if(!arr.some(function(t){return t.table===table&&t.id===id;})){
    arr.push({table:table,id:id,at:new Date().toISOString()});
    _lsSet(TOMB_KEY,arr);
  }
  clearDirty(table,[id]); // apagado nao precisa mais ser enviado
}
function dropTombstones(table,ids){
  var arr=tombstones();
  var keep=arr.filter(function(t){return !(t.table===table&&ids.indexOf(t.id)>=0);});
  if(keep.length!==arr.length)_lsSet(TOMB_KEY,keep);
}
function tombIds(table){
  return tombstones().filter(function(t){return t.table===table;}).map(function(t){return t.id;});
}
function isTomb(table,id){return tombIds(table).indexOf(id)>=0;}
// Quantos lancamentos ainda nao chegaram na nuvem (aparece no aviso de sincronizacao)
function pendingCount(){
  var o=_dirtyAll(),n=0;
  SYNC_TABLES.forEach(function(t){n+=o[t].length;});
  // D5 — as fotos que ainda nao subiram entram na MESMA conta, para aparecerem
  // no mesmo aviso da tela. Foto que so existe no aparelho tambem e dado em risco.
  return n+tombstones().length+(typeof pendingDocsCount==='function'?pendingDocsCount():0);
}

// D9 — TRAVA DOS PRIMEIROS SEGUNDOS.
// initApp mostra a tela com o dado do aparelho e busca a nuvem em paralelo. Um
// lancamento feito nesses dois segundos disparava um envio do estado ANTERIOR a
// fusao. Enquanto a busca estiver rodando, o envio automatico fica segurado e e
// solto assim que a fusao terminar.
var _pullEmAndamento=false, _pushAdiado=false;
// Agenda um envio para a nuvem (espera 1,2s para juntar várias mudanças)
function cloudQueue(){
  if(!cloudOn||!cloudUser)return;
  if(_pullEmAndamento){_pushAdiado=true;return;}   // D9 — espera a fusao terminar
  if(_pushTimer)clearTimeout(_pushTimer);
  _pushTimer=setTimeout(function(){cloudPush();},CONFIG.PUSH_ESPERA_MS);
}
// Envia o estado atual para a nuvem: grava/atualiza tudo e apaga SOMENTE o que
// o usuario apagou de fato (lista de tombstones). Nunca apaga "o que nao esta na lista".
function cloudPush(){
  if(!cloudOn||!cloudUser)return Promise.resolve();
  setSync('Salvando na nuvem…');
  var jobs=[
    _pushTable('emprestimos', loans.map(loanToRow), loans.map(function(l){return l.id;})),
    _pushTable('clientes', clients.map(clientToRow), clients.map(function(c){return c.id;})),
    _pushTable('inadimplentes', inadimplentes.map(inadToRow), inadimplentes.map(function(i){return i.id;})),
    pushDocsPendentes()   // D5 — toda subida de dado tenta levar junto as fotos pendentes
  ];
  return Promise.all(jobs).then(function(){setSync('Tudo salvo na nuvem ✓',true);})
    .catch(function(e){if(console)console.error('cloudPush',e);setSync('Sem conexão — salvo só no aparelho',true);});
}
function _pushTable(table, rows, ids){
  // fotografia dos pendentes ANTES do envio: o que o usuario mexer durante o
  // envio continua marcado como pendente e sobe no proximo push.
  var pend = dirtyIds(table);
  // D2 — SO SOBE O QUE MUDOU NESTE APARELHO.
  // Antes daqui saia a lista INTEIRA em upsert. Um celular com a tela
  // desatualizada reescrevia na nuvem o que o outro aparelho tinha acabado de
  // lancar. Agora vao so as linhas cujo id esta na fila de pendentes.
  var enviar = rows.filter(function(r){return r&&r.id&&pend.indexOf(r.id)>=0;});
  var p = enviar.length ? sb.from(table).upsert(enviar,{onConflict:'id'}) : Promise.resolve({error:null});
  return Promise.resolve(p).then(function(res){
    if(res&&res.error)throw res.error;
    // so limpa a marca de pendente do que realmente foi enviado e aceito
    clearDirty(table, pend.filter(function(id){return ids.indexOf(id)>=0;}));
    // apaga na nuvem apenas os ids que o usuario apagou aqui (e que nao voltaram a existir)
    var del = tombIds(table).filter(function(id){return ids.indexOf(id)<0;});
    if(!del.length)return;
    return Promise.resolve(sb.from(table).delete().eq('user_id',cloudUser).in('id',del))
      .then(function(r2){
        if(r2&&r2.error)throw r2.error;
        dropTombstones(table,del); // exclusao aplicada na nuvem: pode esquecer
      });
  });
}
// Junta nuvem + aparelho SEM perder o que foi feito offline.
// so na nuvem -> entra | so no aparelho -> fica (e sobe) | nos dois -> sujo vence local, senao vence a nuvem
function _mergeTable(table,cloudArr,localArr){
  var out=[],seen={},localById={};
  (localArr||[]).forEach(function(o){if(o&&o.id)localById[o.id]=o;});
  (cloudArr||[]).forEach(function(c){
    if(!c||!c.id||seen[c.id])return;
    if(isTomb(table,c.id))return;           // apagado aqui: nao ressuscita
    seen[c.id]=1;
    var l=localById[c.id];
    out.push((l&&isDirty(table,c.id))?l:c); // sujo => o aparelho manda
  });
  (localArr||[]).forEach(function(l){
    if(!l||!l.id||seen[l.id])return;
    if(isTomb(table,l.id))return;
    seen[l.id]=1;
    markDirty(table,[l.id]);                // so existe aqui: precisa subir
    out.push(l);
  });
  return out;
}
// Baixa os dados da nuvem e FUNDE com o aparelho (nunca substitui).
// Se a nuvem estiver vazia e o aparelho tiver dados, envia os do aparelho (primeira vez).
function cloudPull(){
  if(!cloudOn||!cloudUser)return Promise.resolve();
  _pullEmAndamento=true;                       // D9 — segura o envio automatico
  setSync('Atualizando…');
  var ciclo=Promise.all([
    sb.from('emprestimos').select('*'),
    sb.from('clientes').select('*'),
    sb.from('inadimplentes').select('*')
  ]).then(function(res){
    for(var i=0;i<res.length;i++){if(res[i].error)throw res[i].error;}
    var cl=res[0].data||[], cc=res[1].data||[], ci=res[2].data||[];
    var cloudEmpty=(cl.length+cc.length+ci.length)===0;
    var localHas=(loans.length+clients.length+inadimplentes.length)>0;
    if(cloudEmpty&&localHas){
      // Primeira vez: semeia a nuvem com o que já existe no aparelho.
      // D2 — como o envio agora manda SO o que esta marcado como pendente, aqui
      // e obrigatorio marcar TUDO antes de chamar o envio. Sem esta linha, um
      // aparelho cheio de dados e sem pendencia semearia a nuvem com nada.
      markDirty('emprestimos',loans.map(function(l){return l.id;}));
      markDirty('clientes',clients.map(function(c){return c.id;}));
      markDirty('inadimplentes',(inadimplentes||[]).map(function(i){return i.id;}));
      return cloudPush().then(function(){migrateDocsToCloud();setSync('Dados enviados para a nuvem ✓',true);});
    }
    loans=_mergeTable('emprestimos',cl.map(rowToLoan),loans);
    clients=_mergeTable('clientes',cc.map(rowToClient),clients);
    inadimplentes=_mergeTable('inadimplentes',ci.map(rowToInad),inadimplentes);
    migrateLoans(loans);
    _ledgerInvalidate();               // veio coisa nova da nuvem: refaz o razao
    _saveLocal(); _saveInadLocal();
    // Só agora, com os dados de verdade na mão, os juros automáticos podem
    // correr. Antes isto rodava no cache velho, antes da fusão.
    accrueTudo();
    renderAll(); updateInadBadge();
    migrateDocsToCloud();
    // sobrou algo feito offline (ou alguma exclusao)? sobe agora.
    if(pendingCount()>0)return cloudPush();
    setSync('Sincronizado ✓',true);
  }).catch(function(e){
    if(console)console.error('cloudPull',e);
    setSync('Sem conexão — usando dados do aparelho',true);
  });
  // D9 — a trava so cai quando TODO o ciclo (buscar, fundir e, se preciso,
  // enviar) terminar. Se alguem salvou nesse meio-tempo, o envio adiado sai agora.
  return ciclo.then(function(){
    _pullEmAndamento=false;
    if(_pushAdiado){_pushAdiado=false;cloudQueue();}
  });
}
function setSync(msg,fade){
  var el=document.getElementById('sync-status'); if(!el)return;
  var p=pendingCount();
  var txt=msg;
  if(p>0){ // enquanto houver pendencia o aviso fica na tela
    txt=msg+' · '+p+' lançamento'+(p>1?'s':'')+' aguardando internet';
    fade=false;
  }
  if(_pullEmAndamento)fade=false;   // D9 — indicador discreto fica enquanto atualiza
  el.textContent=txt; el.style.opacity='1';
  if(fade)setTimeout(function(){if(el)el.style.opacity='0';},2500);
}

// ============================================================
// D3 — RESSINCRONIZAR QUANDO A INTERNET VOLTA
// ============================================================
// Antes nao existia nada: nem evento 'online', nem aba voltando a ficar
// visivel, nem nova tentativa. E, pior, se o app fosse aberto em modo aviao o
// cloudUser ficava nulo e NADA subia ate fechar e reabrir o app, mesmo com a
// internet de volta. Esta e a funcao unica que resolve os tres casos.
var _ressincOcupado=false, _ultimaRessinc=0, _ressincTimer=null;
var RESSINC_ESPERA=8000;        // minimo entre duas execucoes (evita rajada)
var RESSINC_PERIODO=180000;     // 3 minutos, so enquanto houver pendencia

// (1) Refaz o reconhecimento da sessao quando ela nao foi obtida na abertura.
function _garantirSessao(){
  if(!cloudOn||!sb||!sb.auth)return Promise.resolve(null);
  if(cloudUser)return Promise.resolve(cloudUser);
  return Promise.resolve(sb.auth.getSession()).then(function(res){
    var sess=res&&res.data&&res.data.session;
    if(sess&&sess.user){
      cloudUser=sess.user.id;
      cloudEmail=sess.user.email||'';
      if(typeof pintarMenuNuvem==='function')pintarMenuNuvem();
      if(typeof renderConta==='function'&&document.getElementById('conta-content'))renderConta();
    }
    return cloudUser;
  }).catch(function(){return null;});
}
// (1) sessao, (2) busca da nuvem, (3) se sobrou pendencia, envia.
function ressincronizar(){
  if(!cloudOn)return Promise.resolve();
  if(_ressincOcupado)return Promise.resolve();          // ja tem uma rodando
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return Promise.resolve();
  var espera=RESSINC_ESPERA-(Date.now()-_ultimaRessinc);
  if(espera>0){
    // Rajada (o celular costuma disparar 'online' e 'aba visivel' juntos):
    // junta tudo numa execucao so, um pouco depois, em vez de varias seguidas.
    if(!_ressincTimer&&typeof setTimeout!=='undefined'){
      _ressincTimer=setTimeout(function(){_ressincTimer=null;ressincronizar();},espera);
    }
    return Promise.resolve();
  }
  _ressincOcupado=true;_ultimaRessinc=Date.now();
  return _garantirSessao().then(function(){
    if(!cloudUser)return null;                          // ainda sem login: nada a fazer
    return cloudPull().then(function(){
      // cloudPull ja envia quando sobra pendencia, mas se ele caiu no erro de
      // rede o envio nao aconteceu: tenta aqui tambem. Enviar duas vezes nao
      // estraga nada (e upsert); nao enviar, sim.
      if(pendingCount()>0)return cloudPush();
      return null;
    });
  }).catch(function(e){
    if(typeof console!=='undefined'&&console.warn)console.warn('ressincronizar',e&&e.message);
  }).then(function(){_ressincOcupado=false;});
}
// Gatilhos: internet de volta, aba voltando a ficar visivel, e de 3 em 3
// minutos enquanto houver algo esperando para subir.
function _ligarGatilhosRessinc(){
  if(typeof window==='undefined'||!window.addEventListener)return;
  window.addEventListener('online',function(){
    if(!cloudOn){
      // A biblioteca da nuvem nem chegou a carregar nesta abertura (o app subiu
      // sem internet e sem a copia em cache). Daqui nao da para sincronizar:
      // e preciso abrir o app de novo. Dizer isso e melhor do que ficar calado.
      showToast('Internet de volta — feche e abra o app para sincronizar.','warn');
      return;
    }
    setSync('Internet de volta — sincronizando…');
    ressincronizar();
  });
  if(typeof document!=='undefined'&&document.addEventListener){
    document.addEventListener('visibilitychange',function(){
      if(!document.hidden)ressincronizar();
    });
  }
  if(typeof setInterval!=='undefined'){
    setInterval(function(){
      if(pendingCount()>0)ressincronizar();
    },RESSINC_PERIODO);
  }
}

// ============================================================
// DOCUMENTOS — fotos na nuvem (Supabase Storage) + cache no aparelho
// ============================================================
// O loan guarda só a "chave" da foto (ex: doc_<id>_docRG) — e, quando o
// documento tem mais de uma página, a LISTA de chaves em texto JSON. Quem
// entende os dois formatos é docPaginas()/docGuardarPaginas(), logo abaixo.
// A imagem em si fica:
//  - na nuvem (bucket "docs"), para sincronizar entre aparelhos;
//  - e em cache no IndexedDB, para abrir rápido e economizar tráfego.
var _docDB=null, DOC_BUCKET='docs';
function docDB(){
  return new Promise(function(res,rej){
    if(_docDB)return res(_docDB);
    if(!window.indexedDB)return rej(new Error('sem indexedDB'));
    var rq=indexedDB.open('emp_docs',1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore('docs');};
    rq.onsuccess=function(){_docDB=rq.result;res(_docDB);};
    rq.onerror=function(){rej(rq.error);};
  });
}
// --- cache local (IndexedDB) ---
function _idbSet(key,dataUrl){
  return docDB().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction('docs','readwrite');tx.objectStore('docs').put(dataUrl,key);
    tx.oncomplete=function(){res(key);};tx.onerror=function(){rej(tx.error);};
  });});
}
function _idbGet(key){
  return docDB().then(function(db){return new Promise(function(res,rej){
    var rq=db.transaction('docs','readonly').objectStore('docs').get(key);
    rq.onsuccess=function(){res(rq.result||null);};rq.onerror=function(){rej(rq.error);};
  });}).catch(function(){return null;});
}
function _idbDel(key){
  if(!key)return Promise.resolve();
  return docDB().then(function(db){return new Promise(function(res){
    var tx=db.transaction('docs','readwrite');tx.objectStore('docs').delete(key);
    tx.oncomplete=function(){res();};tx.onerror=function(){res();};
  });}).catch(function(){});
}
// --- conversões base64 <-> blob ---
function dataUrlToBlob(d){
  var parts=d.split(','),mime=((parts[0].match(/:(.*?);/)||[])[1])||'image/jpeg',bin=atob(parts[1]),arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function blobToDataUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});}
function docCloudPath(key){return cloudUser+'/'+key+'.jpg';}
function docCloudAvailable(){return cloudOn&&cloudUser&&sb&&sb.storage;}

// D5 — FILA DE FOTOS PENDENTES
// ------------------------------------------------------------
// A foto tirada sem internet ficava so no aparelho: o envio falhava em silencio
// (era um console.warn) e docSet respondia como se tivesse dado certo. A rede de
// seguranca (migrateDocsToCloud) rodava UMA VEZ na vida do aparelho por causa da
// trava emp_docs_clouded_<user>, entao nunca mais tentava.
// Agora: mesma ideia da fila de lancamentos.
//  - emp_docs_dirty_v1 : chaves de foto que ainda nao subiram (tenta de novo sempre).
//  - emp_docs_sent_v1  : marca POR FOTO de que ja subiu (no lugar da trava por aparelho).
var DOCS_DIRTY_KEY='emp_docs_dirty_v1', DOCS_SENT_KEY='emp_docs_sent_v1';
function docsDirty(){var a=_lsGet(DOCS_DIRTY_KEY,[]);return Array.isArray(a)?a:[];}
function markDocDirty(key){
  if(!key)return;
  var a=docsDirty();
  if(a.indexOf(key)<0){a.push(key);_lsSet(DOCS_DIRTY_KEY,a);}
}
function _docFilaTirar(key){
  var a=docsDirty(),b=a.filter(function(k){return k!==key;});
  if(b.length!==a.length)_lsSet(DOCS_DIRTY_KEY,b);
}
function _docMarcarEnviada(key){
  _docFilaTirar(key);
  var s=_lsGet(DOCS_SENT_KEY,[]);
  if(!Array.isArray(s))s=[];
  if(s.indexOf(key)<0){s.push(key);_lsSet(DOCS_SENT_KEY,s);}
}
function _docDesmarcarEnviada(key){
  var s=_lsGet(DOCS_SENT_KEY,[]);
  if(!Array.isArray(s))s=[];
  var b=s.filter(function(k){return k!==key;});
  if(b.length!==s.length)_lsSet(DOCS_SENT_KEY,b);
}
// Quantas fotos ainda nao chegaram na nuvem (entra no mesmo aviso da tela)
function pendingDocsCount(){return docsDirty().length;}
// Tenta subir a fila. Vai em lotes para nao afogar a rede do celular; o que
// sobrar tenta de novo no proximo envio ou na ressincronizacao.
var DOCS_LOTE=15, _docsSubindo=false;
function pushDocsPendentes(){
  if(!docCloudAvailable())return Promise.resolve(0);
  if(_docsSubindo)return Promise.resolve(0);   // ja tem um envio de fotos rodando
  var fila=docsDirty();
  if(!fila.length)return Promise.resolve(0);
  _docsSubindo=true;
  var lote=fila.slice(0,DOCS_LOTE),subiram=0;
  return Promise.all(lote.map(function(k){
    return _idbGet(k).then(function(durl){
      if(!durl){
        // A foto nao existe neste aparelho: daqui nao ha o que enviar. Tirar da
        // fila evita uma pendencia eterna que nunca teria como ser resolvida.
        _docFilaTirar(k);
        return null;
      }
      return Promise.resolve(sb.storage.from(DOC_BUCKET).upload(docCloudPath(k),dataUrlToBlob(durl),{upsert:true,contentType:'image/jpeg'}))
        .then(function(r){
          if(r&&r.error)throw r.error;
          _docMarcarEnviada(k);subiram++;
        });
    }).catch(function(e){
      // Falhou: a chave FICA na fila e tenta de novo depois. Nunca some calada.
      if(typeof console!=='undefined'&&console.warn)console.warn('foto pendente',k,e&&e.message);
    });
  })).then(function(){
    _docsSubindo=false;
    if(subiram&&typeof pintarMenuNuvem==='function')pintarMenuNuvem();
    return subiram;
  }).catch(function(){_docsSubindo=false;return 0;});
}

// --- API pública: grava, lê e apaga (coordena nuvem + cache) ---
function docSet(key,dataUrl){
  return _idbSet(key,dataUrl).then(function(){
    // D5 — entra na fila ANTES de tentar subir. Se o envio falhar (sem internet,
    // sem login, erro do servidor), a foto continua marcada como pendente e o
    // app tenta de novo sozinho. So sai da fila quando a nuvem confirmar.
    markDocDirty(key);
    _docDesmarcarEnviada(key);   // foto trocada: a marca de "ja subiu" nao vale mais
    if(docCloudAvailable()){
      try{ sb.storage.from(DOC_BUCKET).upload(docCloudPath(key),dataUrlToBlob(dataUrl),{upsert:true,contentType:'image/jpeg'})
        .then(function(r){
          if(r&&r.error){if(typeof console!=='undefined'&&console.warn)console.warn('upload foto',r.error.message);return;}
          _docMarcarEnviada(key);
        }).catch(function(){}); }catch(e){}
    }
    return key;
  });
}
function docGet(key){
  if(!key)return Promise.resolve(null);
  return _idbGet(key).then(function(cached){
    if(cached)return cached;                       // já está no aparelho
    if(!docCloudAvailable())return null;            // sem nuvem e sem cache
    return sb.storage.from(DOC_BUCKET).download(docCloudPath(key)).then(function(r){
      if(r&&r.data){return blobToDataUrl(r.data).then(function(durl){_idbSet(key,durl);return durl;});}
      return null;
    }).catch(function(){return null;});
  });
}
function docDel(key){
  if(!key)return Promise.resolve();
  if(docCloudAvailable()){try{sb.storage.from(DOC_BUCKET).remove([docCloudPath(key)]);}catch(e){}}
  _docFilaTirar(key);_docDesmarcarEnviada(key);  // D5 — apagada: sai da fila e das marcas
  return _idbDel(key);
}
function isDataUrl(v){return typeof v==='string'&&v.indexOf('data:')===0;}

// ------------------------------------------------------------
// PÁGINAS DE UM DOCUMENTO — RG com frente e verso, comprovante com 2 folhas…
// ------------------------------------------------------------
// COMO O CAMPO É GRAVADO (regra fechada; não mude sem falar com o dono):
//   nenhuma página  -> ''                        (igual ao app antigo)
//   1 página        -> a chave, string simples   (IGUAL ao app antigo)
//   2 ou mais       -> texto JSON: ["chave1","chave2"]
// POR QUE a página única continua no formato antigo: o dono guarda a versão
// anterior do app e sabe voltar atrás. Enquanto o caso comum (uma foto só)
// ficar do jeito de sempre, voltar atrás continua funcionando sem perder foto.
//
// REGRA DE LEITURA: NUNCA leia loan.docRG direto para mostrar na tela.
// Passe SEMPRE por docPaginas() — ela entende os três formatos acima e também
// o formato mais antigo de todos: a data URL gravada dentro do próprio registro.
function docPaginas(valor){
  if(!valor)return [];                            // vazio, nulo ou indefinido
  if(Array.isArray(valor))return valor.slice();   // já veio lista (uso interno)
  if(typeof valor!=='string')return [];
  if(valor.charAt(0)==='['){                      // tem cara de lista JSON
    try{
      var a=JSON.parse(valor);
      if(Array.isArray(a))return a.filter(function(k){return typeof k==='string'&&k;});
    }catch(e){ /* JSON quebrado: não perde nada, trata como página única */ }
  }
  return [valor];                                 // chave antiga OU data URL antiga
}
// Devolve o TEXTO que vai ser gravado no campo, seguindo a regra das três
// situações acima. Use SEMPRE esta função para gravar: é ela que garante que
// um documento de uma página só volte ao formato do app antigo.
function docGuardarPaginas(lista){
  if(!lista||!lista.length)return '';
  var limpa=[];
  for(var i=0;i<lista.length;i++){
    var k=lista[i];
    if(typeof k==='string'&&k&&limpa.indexOf(k)<0)limpa.push(k);
  }
  if(!limpa.length)return '';
  if(limpa.length===1)return limpa[0];            // string simples, como sempre foi
  return JSON.stringify(limpa);
}
// Chave de uma PÁGINA NOVA: doc_<id do registro>_<campo>_<sorteio>.
// O sorteio (uid) impede que uma página nova pise na chave de uma página que
// já existe — inclusive na chave antiga doc_<id>_<campo>, que fica intacta.
function docNovaChave(regId,campo){return 'doc_'+regId+'_'+campo+'_'+uid();}
// Algum registro ainda aponta para esta foto? É a trava antes de apagar de
// verdade: foto que ainda está em uso em algum lugar NUNCA é apagada.
function _docChaveEmUso(chave){
  if(!chave)return false;
  var achou=false;
  loans.concat(inadimplentes||[]).forEach(function(o){
    if(!o)return;
    ['docRG','docResidencia'].forEach(function(f){
      if(docPaginas(o[f]).indexOf(chave)>=0)achou=true;
    });
  });
  return achou;
}
// Apaga a imagem de vez (aparelho + nuvem) SÓ se nenhum registro usar mais.
// Todo caminho de "apagar de vez" passa por aqui, nunca por docDel direto.
function _docApagarSeOrfa(chave){
  if(!chave||isDataUrl(chave))return Promise.resolve();
  if(_docChaveEmUso(chave))return Promise.resolve();
  return docDel(chave);
}
// Apaga de vez TODAS as páginas dos dois documentos de um registro.
function _docApagarPaginasDoRegistro(reg){
  if(!reg)return Promise.resolve();
  var todas=[];
  ['docRG','docResidencia'].forEach(function(f){
    docPaginas(reg[f]).forEach(function(k){todas.push(k);});
  });
  return Promise.all(todas.map(function(k){
    return _docApagarSeOrfa(k).catch(function(){});
  }));
}

// Migra fotos antigas em base64 (gravadas no próprio registro) para o cache/nuvem.
function migrateDocsToIDB(){
  if(!window.indexedDB)return;
  var pending=[],tocadosDocs=[];
  loans.forEach(function(l){
    ['docRG','docResidencia'].forEach(function(f){
      var pags=docPaginas(l[f]);
      if(!pags.length)return;
      var novas=[],mudou=false;
      pags.forEach(function(p,i){
        if(isDataUrl(p)){
          // A PRIMEIRA página de um registro antigo mantém a chave de sempre
          // (doc_<id>_<campo>). Só as seguintes ganham chave nova.
          var key=(i===0)?('doc_'+l.id+'_'+f):docNovaChave(l.id,f);
          novas.push(key);pending.push(docSet(key,p));mudou=true;
        }else novas.push(p);
      });
      if(mudou){
        l[f]=docGuardarPaginas(novas);
        if(tocadosDocs.indexOf(l.id)<0)tocadosDocs.push(l.id);
      }
    });
  });
  if(pending.length)Promise.all(pending).then(function(){save(tocadosDocs);}).catch(function(){});
}
// Sobe para a nuvem as fotos que hoje só existem no aparelho.
// D5 — antes tinha uma trava (emp_docs_clouded_<user>) que fazia isto rodar UMA
// VEZ na vida do aparelho: a foto tirada offline depois disso nunca mais era
// tentada. A trava por aparelho virou marca POR FOTO (emp_docs_sent_v1): toda
// foto referenciada que ainda nao foi confirmada na nuvem entra na fila e e
// tentada de novo a cada envio e a cada ressincronizacao.
function migrateDocsToCloud(){
  if(!docCloudAvailable())return Promise.resolve(0);
  var enviadas=_lsGet(DOCS_SENT_KEY,[]);
  if(!Array.isArray(enviadas))enviadas=[];
  loans.concat(inadimplentes||[]).forEach(function(o){
    ['docRG','docResidencia'].forEach(function(f){
      // TODAS as páginas entram na fila, não só a primeira.
      docPaginas(o[f]).forEach(function(k){
        if(k&&!isDataUrl(k)&&enviadas.indexOf(k)<0)markDocDirty(k);
      });
    });
  });
  return pushDocsPendentes();
}

// ============================================================
// PIN — guardado como hash (não fica mais em texto puro)
// ============================================================
// Observação honesta: por ser um app 100% no navegador, isto é uma TRANCA
// BÁSICA, não criptografia forte. Um PIN de 4 dígitos é fácil de quebrar por
// quem tiver acesso técnico ao aparelho. A proteção real é o bloqueio do
// celular + backups frequentes.
function pinHash(s){var h=5381;s=String(s);for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return 'h'+h.toString(36);}
function hasPin(){return !!localStorage.getItem(PIN_KEY);}
function checkPin(buf){
  var stored=localStorage.getItem(PIN_KEY)||'';
  if(!stored)return true;
  // compat: PIN antigo gravado em texto puro
  if(stored.charAt(0)!=='h')return buf===stored;
  return pinHash(buf)===stored;
}
function setPin(buf){localStorage.setItem(PIN_KEY,pinHash(buf));}

function fmt(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);}
function fmtDate(s){if(!s)return'';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];}
function uid(){return Math.random().toString(36).slice(2,10);}
function daysUntil(s){var n=new Date();n.setHours(0,0,0,0);return Math.ceil((new Date(s+'T00:00:00')-n)/86400000);}
function clientKey(name){return(name||'').trim().toLowerCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg,type){var t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;document.getElementById('toast-container').appendChild(t);setTimeout(function(){t.remove();},3500);}

// ---- TEMA: segue o aparelho por padrão; o dono pode forçar em Conta ----
var TEMA_KEY='emp_tema';
function temaSalvo(){
  try{var t=localStorage.getItem(TEMA_KEY);return (t==='claro'||t==='escuro')?t:'auto';}
  catch(e){return 'auto';}
}
function aplicarTema(t){
  t=(t==='claro'||t==='escuro')?t:'auto';
  try{localStorage.setItem(TEMA_KEY,t);}catch(e){}
  var el=(typeof document!=='undefined')&&document.documentElement;
  if(el&&el.setAttribute){
    if(t==='auto')el.removeAttribute('data-theme');
    else el.setAttribute('data-theme',t==='escuro'?'dark':'light');
  }
  return t;
}
function setTema(t){aplicarTema(t);renderConta();showToast(t==='auto'?'Tema seguindo o aparelho':(t==='claro'?'Tema claro':'Tema escuro'));}

// Loan balance helpers
function getBalance(loan){
  if(loan.parcelas&&loan.parcelas.length){
    return parseFloat(loan.parcelas.filter(function(p){return!p.paid;}).reduce(function(s,p){return s+(p.currentAmount||0);},0).toFixed(2));
  }
  var paid=(loan.payments||[]).reduce(function(s,p){return s+(p.value||0);},0);
  return Math.max(0,parseFloat((loan.currentAmount-paid).toFixed(2)));
}
function syncParceledLoan(l){
  if(!l.parcelas||!l.parcelas.length)return;
  l.paid=l.parcelas.every(function(p){return p.paid;});
  l.currentAmount=parseFloat(l.parcelas.reduce(function(s,p){return s+(p.currentAmount||0);},0).toFixed(2));
  var un=l.parcelas.filter(function(p){return!p.paid;}).slice().sort(function(a,b){return new Date(a.dueDate+'T00:00:00')-new Date(b.dueDate+'T00:00:00');});
  if(un.length)l.dueDate=un[0].dueDate;
}
function accrueParcelas(){
  var changed=false, tocados=[];
  loans.forEach(function(l){
    if(!l.parcelas||!l.parcelas.length)return;
    l.parcelas.forEach(function(p){
      if(p.paid)return;
      var guard=0;
      while(daysUntil(p.dueDate)<0&&guard<600){
        var before=parseFloat(p.currentAmount)||0;
        var juros=parseFloat((before*(l.interest/100)).toFixed(2));
        // C8 — DATA DA COMPETENCIA, NAO DE HOJE.
        // Guardado ANTES de rolar o vencimento: e o mes que esta sendo rolado.
        // Antes gravava today(), entao quem ficasse 3 meses sem abrir o app via as
        // tres rolagens caindo todas no mesmo dia. Pior: um pagamento feito no meio
        // desses meses ficava com data ANTERIOR ao juro que ele deveria pagar, e o
        // razao o classificava como abatimento de capital em vez de juro.
        // Formato YYYY-MM-DD, o mesmo de today() e de addDays() no resto do arquivo.
        var venc=p.dueDate;
        p.currentAmount=parseFloat((before+juros).toFixed(2));
        p.dueDate=addDays(p.dueDate,CONFIG.CICLO_DIAS);
        l.history=l.history||[];
        // rate: congela a taxa usada AGORA, para o passado nao mudar se a taxa mudar
        l.history.push({date:venc,type:'renovacao',value:before,rate:l.interest,note:'Parcela '+p.n+': juros '+l.interest+'%: +'+fmt(juros)+'. Novo saldo da parcela: '+fmt(p.currentAmount)});
        changed=true;guard++;
        if(tocados.indexOf(l.id)<0)tocados.push(l.id);
      }
    });
    syncParceledLoan(l);
  });
  // Marca sujo SO o emprestimo que rendeu juro. Antes isto era save() sem
  // argumento, que marcava a base inteira e fazia este aparelho vencer a
  // nuvem na fusao — foi assim que o celular e o computador se separaram.
  if(changed)save(tocados);
  return changed;
}
function payParcela(loanId,pid){
  var l=loans.find(function(x){return x.id===loanId;});if(!l||!l.parcelas)return;
  var p=l.parcelas.find(function(x){return x.id===pid;});if(!p||p.paid)return;
  p.paid=true;p.paidDate=today();
  l.history=l.history||[];
  l.history.push({date:today(),type:'pagamento_final',value:p.currentAmount,note:'Parcela '+p.n+'/'+l.parcelas.length+' paga'});
  syncParceledLoan(l);
  save(loanId);renderAll();

}

// Total recebido do cliente ao longo de toda a vida do emprestimo (historico +

function loanPrincipal(loan){
