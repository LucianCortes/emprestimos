<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Empréstimos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; background: #f9fafb; color: #111827; font-family: 'Inter', sans-serif; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
#toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #fff; border: 0.5px solid #e5e7eb; border-left: 3px solid #22c55e; border-radius: 10px; padding: 11px 15px; font-size: 13px; color: #111827; min-width: 200px; box-shadow: 0 4px 16px rgba(0,0,0,.1); animation: slideIn .3s ease; }
.toast.error { border-left-color: #ef4444; }
.toast.warn { border-left-color: #f59e0b; }
@keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
header { background: #fff; border-bottom: 0.5px solid #e5e7eb; padding: 16px 16px 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.header-inner { max-width: 680px; margin: 0 auto; }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.logo-sub { font-size: 10px; color: #2563eb; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
.logo-main { font-size: 22px; font-weight: 800; color: #111827; }
.btn-new { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.stat-total { background: #eff6ff; border: 0.5px solid #bfdbfe; border-radius: 14px; padding: 16px; text-align: center; margin-bottom: 10px; }
.stat-total-label { font-size: 10px; color: #1d4ed8; letter-spacing: 2px; margin-bottom: 5px; }
.stat-total-value { font-size: 28px; font-weight: 800; color: #1e3a8a; letter-spacing: -1px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.stat-card { border-radius: 12px; padding: 11px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 0.5px solid; }
.btn-ver { width: 100%; background: #2563eb; color: #fff; border: none; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 2px; }
#tela-lista { display: none; }
.lista-header { background: #fff; border-bottom: 0.5px solid #e5e7eb; padding: 12px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 99; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.btn-voltar { background: #f3f4f6; border: 0.5px solid #e5e7eb; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: #374151; cursor: pointer; font-family: inherit; }
.filters { padding: 10px 16px 0; display: flex; gap: 6px; overflow-x: auto; background: #fff; max-width: 680px; margin: 0 auto; }
.filter-btn { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 0.5px solid #d1d5db; background: #fff; color: #6b7280; cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
.filter-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
.list { max-width: 680px; margin: 0 auto; padding: 12px 16px 90px; }
.empty { text-align: center; padding: 50px 0; color: #9ca3af; }
.group-card { background: #fff; border-radius: 14px; margin-bottom: 10px; overflow: hidden; border: 0.5px solid #e5e7eb; border-left: 3px solid #2563eb; }
.group-header { padding: 13px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.group-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; position: relative; }
.group-badge { position: absolute; top: -2px; right: -2px; color: #fff; border-radius: 50%; width: 16px; height: 16px; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1.5px solid #fff; }
.loan-row { border-top: 0.5px solid #f3f4f6; }
.loan-row-header { padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.loan-actions { display: flex; gap: 6px; padding: 8px 14px 10px; flex-wrap: wrap; }
.abtn { border-radius: 8px; padding: 9px 10px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; border: 0.5px solid; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 500; }
.modal { background: #fff; border-radius: 20px 20px 0 0; padding: 22px 20px 40px; width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; animation: slideUp .3s ease; box-shadow: 0 -4px 20px rgba(0,0,0,.1); }
@keyframes slideUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-title { font-size: 17px; font-weight: 700; }
.modal-close { background: #f3f4f6; border: none; color: #6b7280; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; color: #6b7280; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
.inp { width: 100%; background: #f9fafb; border: 0.5px solid #d1d5db; border-radius: 10px; padding: 11px 13px; color: #111827; font-size: 14px; font-family: inherit; outline: none; }
.inp:focus { border-color: #2563eb; background: #fff; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.preview-box { background: #f9fafb; border: 0.5px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.preview-row { display: flex; justify-content: space-between; font-size: 13px; color: #374151; margin-bottom: 4px; }
.preview-row.total { font-size: 15px; font-weight: 700; border-top: 0.5px solid #e5e7eb; padding-top: 8px; margin-top: 4px; }
.modal-actions { display: flex; gap: 10px; margin-top: 14px; }
.btn-full { width: 100%; padding: 12px; font-size: 14px; font-weight: 700; border-radius: 10px; cursor: pointer; font-family: inherit; }
.btn-blue { background: #2563eb; color: #fff; border: none; }
.btn-gray { background: #f3f4f6; color: #374151; border: 0.5px solid #e5e7eb; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 0.5px solid #e5e7eb; padding: 10px 16px 20px; display: flex; justify-content: center; gap: 8px; z-index: 100; box-shadow: 0 -1px 6px rgba(0,0,0,.06); }
.nav-btn { background: #f3f4f6; border: 0.5px solid #e5e7eb; border-radius: 10px; padding: 9px 12px; font-size: 12px; font-weight: 600; color: #374151; cursor: pointer; font-family: inherit; }
.pin-overlay { position: fixed; inset: 0; background: #fff; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 30px; }
.pin-dots { display: flex; gap: 14px; margin: 24px 0; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #d1d5db; background: transparent; transition: all .2s; }
.pin-dot.filled { background: #2563eb; border-color: #2563eb; }
.pin-pad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; width: 100%; max-width: 280px; }
.pin-btn { background: #f9fafb; border: 0.5px solid #e5e7eb; border-radius: 14px; padding: 18px; font-size: 22px; font-weight: 700; color: #111827; cursor: pointer; font-family: inherit; text-align: center; }
.pin-btn:active { background: #dbeafe; }
.doc-label { display: block; border-radius: 10px; padding: 13px 8px; text-align: center; cursor: pointer; border: 0.5px dashed #d1d5db; background: #f9fafb; }
.hist-item { background: #f9fafb; border-radius: 10px; padding: 12px 13px; margin-bottom: 8px; border-left: 3px solid #e5e7eb; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
.fade-in { animation: fadeIn .2s ease; }
</style>
</head>
<body>
<div id="toast-container"></div>
<div id="modal-container"></div>
<div id="app" style="display:none">
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div><div class="logo-sub">💰 Controle de</div><div class="logo-main">Empréstimos</div></div>
        <button class="btn-new" onclick="openForm()">+ Novo</button>
      </div>
      <div id="stats-container"></div>
    </div>
  </header>
  <div id="tela-lista">
    <div class="lista-header">
      <button class="btn-voltar" onclick="voltarHome()">← Voltar</button>
      <div style="flex:1">
        <div id="lista-titulo" style="font-size:15px;font-weight:700;color:#111827"></div>
        <div id="lista-sub" style="font-size:11px;color:#6b7280"></div>
      </div>
      <button class="btn-new" onclick="openForm()" style="padding:8px 12px;font-size:12px">+ Novo</button>
    </div>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter(this,'all')">Todos</button>
      <button class="filter-btn" data-filter="active" onclick="setFilter(this,'active')">Ativos</button>
      <button class="filter-btn" data-filter="overdue" onclick="setFilter(this,'overdue')">Vencidos</button>
      <button class="filter-btn" data-filter="warning" onclick="setFilter(this,'warning')">3 dias</button>
      <button class="filter-btn" data-filter="paid" onclick="setFilter(this,'paid')">Quitados</button>
    </div>
    <div class="list" id="loan-list"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="openClients()">👥 Clientes</button>
    <button class="nav-btn" onclick="openInadimplentes()">⚠️ Inadimp.</button>
    <button class="nav-btn" onclick="openBackup()">📥 Backup</button>
    <button class="nav-btn" onclick="openStats()">📊 Relatório</button>
    <button class="nav-btn" onclick="openPinSettings()">🔐 PIN</button>
  </div>
</div>
<script>
var loans=[],clients=[],inadimplentes=[];
var expandedGroups={},expandedCards={},deleteConfirm=null,currentFilter='all';
var appUnlocked=false,pinBuffer='',pinMode='check',pinNewTemp='',_payLoanId=null;
var PIN_KEY='emp_pin_v1';

function save(){localStorage.setItem('emp_loans_v2',JSON.stringify(loans));loans.forEach(upsertClient);localStorage.setItem('emp_clients_v2',JSON.stringify(clients));}
function load(){try{loans=JSON.parse(localStorage.getItem('emp_loans_v2')||'[]');}catch(e){loans=[];}try{clients=JSON.parse(localStorage.getItem('emp_clients_v2')||'[]');}catch(e){clients=[];}try{inadimplentes=JSON.parse(localStorage.getItem('emp_inad_v1')||'[]');}catch(e){inadimplentes=[];}}
function saveInad(){localStorage.setItem('emp_inad_v1',JSON.stringify(inadimplentes));}
function upsertClient(l){var k=l.name.trim().toLowerCase();var ex=clients.find(function(c){return c.name.trim().toLowerCase()===k;});if(!ex)clients.push({id:l.id,name:l.name,phone:l.phone||'',address:l.address||''});else{if(l.phone)ex.phone=l.phone;if(l.address)ex.address=l.address;}}

function fmt(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);}
function fmtDate(s){if(!s)return'';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function today(){return new Date().toISOString().split('T')[0];}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];}
function uid(){return Math.random().toString(36).slice(2,10);}
function daysUntil(s){var n=new Date();n.setHours(0,0,0,0);return Math.ceil((new Date(s+'T00:00:00')-n)/86400000);}
function clientKey(name){return name.trim().toLowerCase();}
function showToast(msg,type){var t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;document.getElementById('toast-container').appendChild(t);setTimeout(function(){t.remove();},3500);}
function closeModal(){document.getElementById('modal-container').innerHTML='';}
function modal(html){document.getElementById('modal-container').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}

function getPin(){return localStorage.getItem(PIN_KEY)||'';}
function initPin(){
  // Clear PIN on first load to allow access
  localStorage.removeItem(PIN_KEY);
  appUnlocked=true;
}
function showPinLock(mode,err){
  pinMode=mode;pinBuffer='';
  var titles={check:'Digite seu PIN',set:'Crie um PIN de 4 dígitos',confirm:'Confirme o PIN'};
  var html='<div class="pin-overlay"><div style="font-size:36px;margin-bottom:10px">🔐</div>'
    +'<div style="font-size:20px;font-weight:700;margin-bottom:4px">'+titles[mode]+'</div>'
    +'<div class="pin-dots" id="pin-dots">'+[0,1,2,3].map(function(i){return'<div class="pin-dot" id="pd-'+i+'"></div>';}).join('')+'</div>'
    +(err?'<div style="color:#dc2626;font-size:13px;font-weight:600;margin-bottom:12px">'+err+'</div>':'')
    +'<div class="pin-pad">'+[1,2,3,4,5,6,7,8,9,'','0','⌫'].map(function(n){return n===''?'<div></div>':'<button class="pin-btn" onclick="pinPress(\''+n+'\')">'+n+'</button>';}).join('')+'</div>'
    +(mode==='check'?'<div style="color:#9ca3af;font-size:12px;margin-top:16px;cursor:pointer" onclick="pinForgot()">Esqueci meu PIN</div>':'')
    +'</div>';
  document.body.innerHTML=html;
}
function pinPress(v){
  if(v==='⌫')pinBuffer=pinBuffer.slice(0,-1);
  else{if(pinBuffer.length>=4)return;pinBuffer+=v;}
  for(var i=0;i<4;i++){var d=document.getElementById('pd-'+i);if(d)d.classList.toggle('filled',i<pinBuffer.length);}
  if(pinBuffer.length===4)setTimeout(pinSubmit,200);
}
function pinSubmit(){
  if(pinMode==='check'){if(pinBuffer===getPin()){appUnlocked=true;location.reload();}else showPinLock('check','❌ PIN incorreto');}
  else if(pinMode==='set'){pinNewTemp=pinBuffer;showPinLock('confirm');}
  else if(pinMode==='confirm'){if(pinBuffer===pinNewTemp){localStorage.setItem(PIN_KEY,pinBuffer);showToast('🔐 PIN criado!');closeModal();}else showPinLock('set','❌ PINs diferentes');}
}
function pinForgot(){if(confirm('Redefinir PIN apaga todos os dados. Continuar?')){localStorage.clear();location.reload();}}
function openPinSettings(){
  var has=!!getPin();
  modal('<div class="modal-header"><span class="modal-title">🔐 PIN de Segurança</span><button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div style="text-align:center;padding:20px 0"><div style="font-size:48px;margin-bottom:12px">🔐</div>'
    +'<div style="font-size:14px;color:#374151;margin-bottom:4px">'+(has?'PIN ativado ✅':'Sem PIN configurado')+'</div></div>'
    +'<div style="display:flex;flex-direction:column;gap:10px">'
    +'<button class="btn-full btn-blue" onclick="closeModal();showPinLock(\'set\')">'+(has?'Alterar PIN':'Criar PIN')+'</button>'
    +(has?'<button class="btn-full btn-gray" onclick="localStorage.removeItem(\''+PIN_KEY+'\');showToast(\'PIN removido\');closeModal()">Remover PIN</button>':'')
    +'</div>');
}

function calcStats(){
  var active=loans.filter(function(l){return!l.paid;});
  var now=new Date();var tm=now.getMonth();var ty=now.getFullYear();
  var totalOwed=active.reduce(function(s,l){return s+l.currentAmount;},0);
  var totalLent=active.reduce(function(s,l){return s+l.originalAmount;},0);
  var totalOverdue=active.filter(function(l){return daysUntil(l.dueDate)<0;}).reduce(function(s,l){return s+l.currentAmount;},0);
  var avgLoan=active.length?active.reduce(function(s,l){return s+l.originalAmount;},0)/active.length:0;
  var clientCount=new Set(loans.map(function(l){return l.name.trim().toLowerCase();})).size;
  var warn3=active.filter(function(l){var d=daysUntil(l.dueDate);return d>=0&&d<=3;}).length;
  var juros=loans.reduce(function(sum,l){var rec=l.history.filter(function(h){return h.type.includes('pagamento');}).reduce(function(s,h){return s+h.value;},0);return sum+Math.max(0,rec-l.originalAmount);},0);
  var lucroM=loans.reduce(function(sum,l){var mp=l.history.filter(function(h){if(!h.type.includes('pagamento'))return false;var d=new Date(h.date+'T00:00:00');return d.getMonth()===tm&&d.getFullYear()===ty;}).reduce(function(s,h){return s+h.value;},0);return sum+mp*(l.interest/(100+l.interest));},0);
  var lucroA=loans.reduce(function(sum,l){var yp=l.history.filter(function(h){if(!h.type.includes('pagamento'))return false;return new Date(h.date+'T00:00:00').getFullYear()===ty;}).reduce(function(s,h){return s+h.value;},0);return sum+yp*(l.interest/(100+l.interest));},0);
  var totalHist=loans.reduce(function(s,l){return s+l.originalAmount;},0);
  return{totalOwed:totalOwed,totalLent:totalLent,totalOverdue:totalOverdue,avgLoan:avgLoan,clientCount:clientCount,warn3:warn3,jurosRecebidos:juros,lucroMensal:lucroM,lucroAnual:lucroA,totalHist:totalHist,activeCount:active.length};
}

function renderStats(){
  var s=calcStats();
  var html='';
  if(s.warn3>0)html+='<div style="background:#fffbeb;border:0.5px solid #fcd34d;border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;cursor:pointer" onclick="irParaLista(\'warning\')"><span style="font-size:18px">⚠️</span><div><div style="font-size:12px;font-weight:700;color:#92400e">'+s.warn3+' empréstimo(s) vence(m) em até 3 dias!</div><div style="font-size:11px;color:#a16207">Toque para ver</div></div></div>';
  html+='<div class="stat-total"><div class="stat-total-label">TOTAL A RECEBER</div><div class="stat-total-value">'+fmt(s.totalOwed)+'</div></div>';
  html+='<div class="stat-grid">';
  var cards=[
    {l:'💵 Emprestado',v:fmt(s.totalLent),bg:'#fff',bc:'#bfdbfe',vc:'#1e3a8a',lc:'#1d4ed8',f:'all'},
    {l:'📈 Juros recebidos',v:fmt(s.jurosRecebidos),bg:'#f0fdf4',bc:'#bbf7d0',vc:'#166534',lc:'#15803d',f:'all'},
    {l:'🔴 Vencido',v:fmt(s.totalOverdue),bg:'#fef2f2',bc:'#fca5a5',vc:'#991b1b',lc:'#dc2626',f:'overdue'},
    {l:'👥 Clientes',v:s.clientCount,bg:'#fff',bc:'#e5e7eb',vc:'#111827',lc:'#6b7280',f:'all'},
    {l:'📅 Lucro mês',v:fmt(s.lucroMensal),bg:'#f0fdf4',bc:'#bbf7d0',vc:'#166534',lc:'#15803d',f:'active'},
    {l:'🏆 Lucro ano',v:fmt(s.lucroAnual),bg:'#f0fdf4',bc:'#bbf7d0',vc:'#166534',lc:'#15803d',f:'active'}
  ];
  cards.forEach(function(card){
    html+='<div class="stat-card" style="background:'+card.bg+';border-color:'+card.bc+'" onclick="irParaLista(\''+card.f+'\')">'
      +'<div><div style="font-size:9px;color:'+card.lc+';margin-bottom:3px">'+card.l+'</div>'
      +'<div style="font-size:17px;font-weight:700;color:'+card.vc+'">'+card.v+'</div></div>'
      +'<div style="font-size:16px;color:'+card.bc+'">›</div></div>';
  });
  html+='</div><button class="btn-ver" onclick="irParaLista(\'all\')">👥 Ver clientes e empréstimos →</button>';
  document.getElementById('stats-container').innerHTML=html;
}

function irParaLista(f){
  document.getElementById('tela-lista').style.display='block';
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.toggle('active',b.dataset.filter===f);});
  var info={all:{t:'👥 Todos os clientes',s:'Todos os empréstimos'},active:{t:'⏳ Ativos',s:'Em aberto'},overdue:{t:'🔴 Vencidos',s:'Cobranças urgentes'},warning:{t:'⚠️ Vence em 3 dias',s:'Atenção'},paid:{t:'✅ Quitados',s:'Pagos'}};
  var i=info[f]||info.all;
  document.getElementById('lista-titulo').textContent=i.t;
  document.getElementById('lista-sub').textContent=i.s;
  renderList();window.scrollTo(0,0);
}
function voltarHome(){document.getElementById('tela-lista').style.display='none';window.scrollTo(0,0);}
function setFilter(btn,f){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');renderList();}

function renderList(){
  var container=document.getElementById('loan-list');
  var filtered=loans.slice();
  if(currentFilter==='active')filtered=filtered.filter(function(l){return!l.paid;});
  else if(currentFilter==='overdue')filtered=filtered.filter(function(l){return!l.paid&&daysUntil(l.dueDate)<0;});
  else if(currentFilter==='warning')filtered=filtered.filter(function(l){var d=daysUntil(l.dueDate);return!l.paid&&d>=0&&d<=3;});
  else if(currentFilter==='paid')filtered=filtered.filter(function(l){return l.paid;});
  if(filtered.length===0){container.innerHTML='<div class="empty"><div style="font-size:36px;margin-bottom:10px">📋</div><div>Nenhum empréstimo aqui</div></div>';return;}
  var groups={};
  filtered.forEach(function(l){var k=clientKey(l.name);if(!groups[k])groups[k]={key:k,name:l.name,phone:l.phone||'',address:l.address||'',loans:[]};groups[k].loans.push(l);});
  Object.values(groups).forEach(function(g){g.loans.sort(function(a,b){if(a.paid!==b.paid)return a.paid?1:-1;return new Date(a.dueDate)-new Date(b.dueDate);});});
  var sorted=Object.values(groups).sort(function(a,b){
    var ao=a.loans.some(function(l){return!l.paid&&daysUntil(l.dueDate)<0;});
    var bo=b.loans.some(function(l){return!l.paid&&daysUntil(l.dueDate)<0;});
    if(ao!==bo)return ao?-1:1;
    var aap=a.loans.every(function(l){return l.paid;});
    var bap=b.loans.every(function(l){return l.paid;});
    if(aap!==bap)return aap?1:-1;
    var an=a.loans.filter(function(l){return!l.paid;}).sort(function(x,y){return new Date(x.dueDate)-new Date(y.dueDate);})[0];
    var bn=b.loans.filter(function(l){return!l.paid;}).sort(function(x,y){return new Date(x.dueDate)-new Date(y.dueDate);})[0];
    if(!an&&!bn)return 0;if(!an)return 1;if(!bn)return-1;
    return new Date(an.dueDate)-new Date(bn.dueDate);
  });
  container.innerHTML=sorted.map(renderGroup).join('');
}

function renderGroup(group){
  var key=group.key;
  var isExp=!!expandedGroups[key];
  var active=group.loans.filter(function(l){return!l.paid;});
  var totalDue=active.reduce(function(s,l){return s+l.currentAmount;},0);
  var allPaid=group.loans.every(function(l){return l.paid;});
  var hasOver=group.loans.some(function(l){return!l.paid&&daysUntil(l.dueDate)<0;});
  var hasWarn=!hasOver&&group.loans.some(function(l){var d=daysUntil(l.dueDate);return!l.paid&&d>=0&&d<=3;});
  var phone=group.phone||'';
  var borderColor=hasOver?'#fca5a5':hasWarn?'#fcd34d':allPaid?'#bbf7d0':'#e5e7eb';
  var accentColor=hasOver?'#ef4444':hasWarn?'#f59e0b':allPaid?'#22c55e':'#2563eb';
  var bgAvatar=hasOver?'#fef2f2':hasWarn?'#fffbeb':allPaid?'#f0fdf4':'#eff6ff';
  var statusColor=hasOver?'#dc2626':hasWarn?'#b45309':allPaid?'#16a34a':'#6b7280';
  var nOver=active.filter(function(l){return daysUntil(l.dueDate)<0;}).length;
  var statusText=allPaid?'Quitado ✓':hasOver?nOver+' vencido(s)':hasWarn?'Vence em breve':active.length+' ativo(s)';
  var badge=group.loans.length>1?'<div class="group-badge" style="background:'+accentColor+'">'+group.loans.length+'</div>':'';
  var loansHtml='';
  if(isExp){
    group.loans.forEach(function(loan){
      var d=daysUntil(loan.dueDate);
      var isOver2=!loan.paid&&d<0;
      var rowColor=loan.paid?'#16a34a':isOver2?'#dc2626':'#111827';
      var dueColor=isOver2?'#dc2626':'#6b7280';
      var exp2=!!expandedCards[loan.id];
      var delConf=deleteConfirm===loan.id;
      var lid=loan.id;
      var rowLeft=loan.paid?'<span style="color:#16a34a">✓ Quitado &middot; '+fmt(loan.originalAmount)+'</span>':'<span style="color:#9ca3af">'+fmt(loan.originalAmount)+'</span> &rarr; <span style="color:'+rowColor+';font-weight:700">'+fmt(loan.currentAmount)+'</span>';
      var actions='';
      if(exp2){
        if(delConf){
          actions='<div class="loan-actions"><button class="abtn" style="flex:1;background:#f3f4f6;color:#374151;border-color:#e5e7eb" onclick="cancelDelete()">Cancelar</button><button class="abtn" style="flex:1;background:#fef2f2;color:#dc2626;border-color:#fca5a5;font-weight:700" onclick="deleteLoan(\''+lid+'\')">Confirmar</button></div>';
        }else{
          actions='<div class="loan-actions">'
            +(phone?'<button class="abtn" style="flex:1;min-width:70px;background:#064e3b;color:#34d399;border-color:#065f46" onclick="sendWhatsApp(\''+lid+'\')">🟢 Cobrar</button>':'')
            +(!loan.paid?'<button class="abtn" style="flex:2;min-width:70px;background:#2563eb;color:#fff;border-color:#2563eb" onclick="openPay(\''+lid+'\')">💳 Pagar</button>':'')
            +'<button class="abtn" style="flex:1;background:#f3f4f6;color:#374151;border-color:#e5e7eb" onclick="openReceipt(\''+lid+'\')">🧾 Recibo</button>'
            +'<button class="abtn" style="background:#f3f4f6;color:#374151;border-color:#e5e7eb" onclick="openEdit(\''+lid+'\')">✏️</button>'
            +'<button class="abtn" style="background:#fef2f2;color:#dc2626;border-color:#fca5a5" onclick="confirmDelete(\''+lid+'\')">🗑️</button>'
            +(!loan.paid?'<button class="abtn" style="background:#fffbeb;color:#b45309;border-color:#fcd34d" onclick="moverInadimplente(\''+lid+'\')">⚠️</button>':'')
            +'</div>';
        }
      }
      loansHtml+='<div class="loan-row" id="card-'+lid+'">'
        +'<div class="loan-row-header" onclick="toggleCard(\''+lid+'\')">'
        +'<div style="font-size:13px">'+rowLeft+'</div>'
        +'<div style="display:flex;align-items:center;gap:8px">'
        +(!loan.paid?'<span style="font-size:12px;color:'+dueColor+'">vence '+fmtDate(loan.dueDate)+'</span>':'')
        +'<span style="color:#d1d5db;font-size:11px">'+(exp2?'↑':'↓')+'</span>'
        +'</div></div>'+actions+'</div>';
    });
    var sName=group.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    var sPhone=phone.replace(/'/g,"\\'");
    var sAddr=group.address.replace(/'/g,"\\'");
    loansHtml='<div style="padding:8px 14px;border-bottom:0.5px solid #f3f4f6;background:#f9fafb"><button style="width:100%;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit" onclick="openForm({name:\''+sName+'\',phone:\''+sPhone+'\',address:\''+sAddr+'\',amount:\'\',interest:\'30\',startDate:\''+today()+'\',note:\'\'})">+ Novo empréstimo</button></div>'+loansHtml;
  }
  return '<div class="group-card fade-in" id="group-'+key+'" style="border-color:'+borderColor+';border-left-color:'+accentColor+'">'
    +'<div class="group-header" onclick="toggleGroup(\''+key+'\')">'
    +'<div class="group-avatar" style="background:'+bgAvatar+';color:'+accentColor+'">'+group.name.charAt(0).toUpperCase()+badge+'</div>'
    +'<div style="flex:1;min-width:0">'
    +'<div style="font-size:15px;font-weight:700;color:#111827">'+group.name+'</div>'
    +'<div style="font-size:11px;color:'+statusColor+';margin-top:2px">'+fmt(totalDue)+' &middot; '+statusText+'</div>'
    +'</div>'
    +'<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'
    +(phone&&!allPaid?'<button style="width:34px;height:34px;background:#064e3b;border:none;border-radius:50%;color:#34d399;font-size:13px;font-weight:700;cursor:pointer" onclick="event.stopPropagation();sendWhatsAppGroup(\''+key+'\')">WA</button>':'')
    +'<span style="color:#9ca3af;font-size:12px">'+(isExp?'↑':'↓')+'</span>'
    +'</div></div>'
    +(isExp?'<div style="background:#fff">'+loansHtml+'</div>':'')
    +'</div>';
}

function toggleCard(id){expandedCards[id]=!expandedCards[id];if(deleteConfirm&&deleteConfirm!==id)deleteConfirm=null;renderList();}

  if(amt<=0){box.innerHTML='';return;}
  box.innerHTML='<div class="preview-box"><div style="font-size:10px;color:#1d4ed8;font-weight:700;letter-spacing:1px;margin-bottom:8px">PREVIEW</div>'

function saveDoc(e,tipo){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){if(tipo==='rg')formData.docRG=ev.target.result;else formData.docResidencia=ev.target.result;renderForm();};r.readAsDataURL(f);}
function showSugg(){
  var q=formData.name.trim().toLowerCase();var box=document.getElementById('sugg-box');if(!box)return;
  if(q.length<1){box.style.display='none';return;}
  var m=clients.filter(function(c){return c.name.toLowerCase().includes(q);});
  if(!m.length){box.style.display='none';return;}
  box.innerHTML=m.slice(0,5).map(function(c){return'<div style="padding:10px 13px;cursor:pointer;font-size:13px;border-bottom:0.5px solid #f3f4f6" onmousedown="fillClient(\''+c.name.replace(/'/g,"\\'")+'\')"><div style="font-weight:600;color:#111827">'+c.name+'</div>'+(c.phone||c.address?'<div style="font-size:11px;color:#6b7280">'+(c.phone||'')+(c.phone&&c.address?' · ':'')+(c.address||'')+'</div>':'')+'</div>';}).join('');
  box.style.display='block';
}
function hideSugg(){var b=document.getElementById('sugg-box');if(b)b.style.display='none';}
function fillClient(name){var c=clients.find(function(x){return x.name===name;});if(!c)return;formData.name=c.name;formData.phone=c.phone||'';formData.address=c.address||'';renderForm();}
function addLoan(){
  var amt=parseFloat(formData.amount);
  if(!formData.name.trim()||!amt||amt<=0){showToast('Preencha nome e valor','error');return;}
  var rate=parseFloat(formData.interest)/100;
  var loan={id:uid(),name:formData.name.trim(),phone:formData.phone,address:formData.address,
    originalAmount:amt,currentAmount:parseFloat((amt*(1+rate)).toFixed(2)),
    interest:parseFloat(formData.interest),startDate:formData.startDate||today(),
    dueDate:addDays(formData.startDate||today(),30),note:formData.note,paid:false,
    docRG:formData.docRG||'',docResidencia:formData.docResidencia||'',
    history:[{date:formData.startDate||today(),type:'emprestimo',value:amt,note:'Empréstimo de '+fmt(amt)+' · Juros '+formData.interest+'%'}]};
  loans.push(loan);save();renderStats();renderList();closeModal();showToast('✅ Empréstimo de '+loan.name+' adicionado');
}

function openPay(id){var l=loans.find(function(x){return x.id===id;});if(!l)return;_payLoanId=id;renderPay(l,'');}

    +'<div style="background:#f9fafb;border-radius:12px;padding:14px;margin-bottom:14px"><div style="font-size:13px;color:#6b7280;margin-bottom:3px">'+loan.name+'</div>'
    +'<div style="font-size:26px;font-weight:800;color:#111827">'+fmt(loan.currentAmount)+'</div>'
    +'<div style="font-size:11px;color:#6b7280;margin-top:2px">Vence '+fmtDate(loan.dueDate)+'</div></div>'
    +'<button style="width:100%;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:0.5px solid #22c55e;border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-family:inherit;text-align:left" onclick="doPayment(\''+loan.id+'\','+loan.currentAmount+')">'
    +'<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:14px;font-weight:700;color:#16a34a">✅ Pagamento total</div><div style="font-size:11px;color:#22c55e;margin-top:2px">Toque para quitar</div></div>'
    +'<div style="font-size:18px;font-weight:800;color:#16a34a">'+fmt(loan.currentAmount)+'</div></div></button>'
    +'<div style="border:0.5px solid #e5e7eb;border-radius:12px;padding:14px;background:#f9fafb"><div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:10px">💳 Pagamento parcial</div>'
    +'<input id="pay-input" type="number" inputmode="decimal" placeholder="0,00" value="'+val+'" oninput="updatePartial(this.value,\''+loan.id+'\')" style="width:100%;background:#fff;border:0.5px solid #d1d5db;border-radius:10px;padding:11px 13px;font-size:15px;font-family:inherit;outline:none;margin-bottom:8px">'
    +'<div id="partial-prev">'+prev+'</div>'

    +'<button id="btn-conf" class="btn-full btn-blue" '+(paid<=0?'disabled style="opacity:.4"':'')+' onclick="doPartial()">Confirmar parcial</button>'

  setTimeout(function(){var el=document.getElementById('pay-input');if(el)el.focus();},100);
}
function updatePartial(val,loanId){
  _payLoanId=loanId;var paid=parseFloat(val)||0;
  var loan=loans.find(function(l){return l.id===loanId;});
  var btn=document.getElementById('btn-conf');if(btn){btn.disabled=paid<=0;btn.style.opacity=paid<=0?'.4':'1';}
  var box=document.getElementById('partial-prev');if(!box||!loan)return;
  if(paid<=0||paid>=loan.currentAmount){box.innerHTML='';return;}
  var rem=loan.currentAmount-paid;var nt=rem*(1+loan.interest/100);
  box.innerHTML='<div style="background:#fff;border-radius:8px;padding:11px;border:0.5px solid #e5e7eb;margin:8px 0">'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-bottom:3px"><span>Saldo restante</span><span style="color:#ef4444">'+fmt(rem)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-bottom:3px"><span>+ Juros '+loan.interest+'%</span><span style="color:#f59e0b">+'+fmt(rem*loan.interest/100)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:#2563eb;border-top:0.5px solid #e5e7eb;padding-top:7px;margin-top:5px"><span>Novo total</span><span>'+fmt(nt)+'</span></div>'
    +'<div style="font-size:11px;color:#6b7280;margin-top:4px">Novo vencimento: '+fmtDate(addDays(today(),30))+'</div></div>';
}
function doPartial(){var el=document.getElementById('pay-input');if(!el)return;var v=parseFloat(el.value)||0;if(v>0&&_payLoanId)doPayment(_payLoanId,v);}
function doPayment(id,amount){
  var loan=loans.find(function(l){return l.id===id;});if(!loan||amount<=0)return;
  var rem=parseFloat((loan.currentAmount-amount).toFixed(2));
  if(rem<=0.01){loan.paid=true;loan.currentAmount=0;loan.history.push({date:today(),type:'pagamento_final',value:amount,note:'Dívida quitada! Pagamento de '+fmt(amount)});showToast('✅ Dívida de '+loan.name+' quitada!');}
  else{var na=parseFloat((rem*(1+loan.interest/100)).toFixed(2));loan.currentAmount=na;loan.dueDate=addDays(today(),30);loan.history.push({date:today(),type:'pagamento_parcial',value:amount,note:'Pagou '+fmt(amount)+'. Saldo: '+fmt(rem)+'. Novo total: '+fmt(na)});showToast('💳 Pagamento de '+fmt(amount)+' registrado');}
  save();renderStats();renderList();closeModal();
}

function sendWhatsApp(id){
  var l=loans.find(function(x){return x.id===id;});if(!l||!l.phone)return;
  var d=daysUntil(l.dueDate);
  var msg=d<0?'Olá '+l.name+'! Seu empréstimo de '+fmt(l.originalAmount)+' está *vencido há '+Math.abs(d)+' dia(s)*. Total: *'+fmt(l.currentAmount)+'*. Entre em contato.':d<=3?'Olá '+l.name+'! Seu empréstimo vence em '+d+' dia(s) ('+fmtDate(l.dueDate)+'). Total: *'+fmt(l.currentAmount)+'*.':'Olá '+l.name+'! Lembrando que seu empréstimo vence em '+fmtDate(l.dueDate)+'. Total: *'+fmt(l.currentAmount)+'*.';
  var phone=(l.phone||'').replace(/\D/g,'');
  window.open('https://wa.me/55'+phone+'?text='+encodeURIComponent(msg),'_blank');
}
function sendWhatsAppGroup(key){var g=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;}).sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);})[0];if(g)sendWhatsApp(g.id);}

function openEdit(id){

    +'<div class="field"><label>Endereço</label><input id="ed-addr" class="inp" type="text" value="'+(l.address||'')+'"></div>'
    +'<div class="field-row"><div class="field"><label>Valor emprestado</label><input id="ed-amt" class="inp" type="number" inputmode="decimal" value="'+l.originalAmount+'"></div>'

    +'<div style="background:#fffbeb;border:0.5px solid #fcd34d;border-radius:8px;padding:9px 12px;font-size:11px;color:#92400e;margin-bottom:12px">⚠️ Editar não altera o histórico.</div>'
    +'<div class="modal-actions"><button class="btn-full btn-gray" onclick="closeModal()">Cancelar</button><button class="btn-full btn-blue" onclick="saveEdit(\''+id+'\')">Salvar</button></div>');
}
function saveEdit(id){
  var l=loans.find(function(x){return x.id===id;});if(!l)return;
  var name=(document.getElementById('ed-name')||{}).value||l.name;
  var phone=(document.getElementById('ed-phone')||{}).value||'';
  var addr=(document.getElementById('ed-addr')||{}).value||'';
  var amt=parseFloat((document.getElementById('ed-amt')||{}).value)||l.originalAmount;
  var interest=parseFloat((document.getElementById('ed-int')||{}).value)||l.interest;
  var start=(document.getElementById('ed-start')||{}).value||l.startDate;
  var due=(document.getElementById('ed-due')||{}).value||l.dueDate;
  var note=(document.getElementById('ed-note')||{}).value||'';
  var ratio=amt/l.originalAmount;
  l.name=name.trim();l.phone=phone;l.address=addr;l.originalAmount=amt;l.currentAmount=parseFloat((l.currentAmount*ratio).toFixed(2));l.interest=interest;l.startDate=start;l.dueDate=due;l.note=note;
  save();renderStats();renderList();closeModal();showToast('✅ Atualizado!');
}

function openReceipt(id){
  var l=loans.find(function(x){return x.id===id;});if(!l)return;
  var now=new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  var rc='<div id="rc" style="background:#fff;color:#111;border-radius:10px;padding:20px;font-family:monospace;font-size:12px;line-height:1.8;border:0.5px solid #e5e7eb;margin-bottom:14px">'
    +'<div style="font-size:15px;font-weight:700;text-align:center;margin-bottom:3px">COMPROVANTE DE EMPRÉSTIMO</div>'
    +'<div style="font-size:10px;text-align:center;color:#555;margin-bottom:12px">Emitido em '+now+'</div>'
    +'<hr style="border:none;border-top:1px dashed #ccc;margin:8px 0">'
    +'<div style="display:flex;justify-content:space-between"><span>Cliente:</span><span>'+l.name+'</span></div>'
    +(l.phone?'<div style="display:flex;justify-content:space-between"><span>Telefone:</span><span>'+l.phone+'</span></div>':'')
    +(l.address?'<div style="display:flex;justify-content:space-between"><span>Endereço:</span><span>'+l.address+'</span></div>':'')
    +'<hr style="border:none;border-top:1px dashed #ccc;margin:8px 0">'
    +'<div style="display:flex;justify-content:space-between"><span>Data:</span><span>'+fmtDate(l.startDate)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between"><span>Vencimento:</span><span>'+fmtDate(l.dueDate)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between"><span>Valor emprestado:</span><span>'+fmt(l.originalAmount)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between"><span>Juros mensal:</span><span>'+l.interest+'%</span></div>'
    +'<div style="display:flex;justify-content:space-between"><span>Juros (30 dias):</span><span>'+fmt(l.originalAmount*l.interest/100)+'</span></div>'
    +'<hr style="border:none;border-top:1px dashed #ccc;margin:8px 0">'
    +'<div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;border-top:2px solid #111;padding-top:6px"><span>TOTAL A PAGAR:</span><span>'+fmt(l.currentAmount)+'</span></div>'
    +'<hr style="border:none;border-top:1px dashed #ccc;margin:8px 0">'
    +'<div style="text-align:center;font-size:10px;color:#888">Gerado pelo Controle de Empréstimos</div></div>';
  modal('<div class="modal-header"><span class="modal-title">🧾 Comprovante</span><button class="modal-close" onclick="closeModal()">×</button></div>'
    +rc+'<div style="display:flex;gap:8px"><button class="btn-full btn-gray" style="flex:1" onclick="shareReceipt(\''+id+'\')">🟢 WhatsApp</button><button class="btn-full btn-blue" style="flex:1" onclick="printReceipt()">🖨️ Imprimir</button></div>');
}
function printReceipt(){var c=document.getElementById('rc');if(!c)return;var w=window.open('','_blank');w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:monospace;font-size:12px;padding:20px;max-width:380px;margin:0 auto}hr{border:none;border-top:1px dashed #ccc;margin:8px 0}</style></head><body>'+c.innerHTML+'</body></html>');w.document.close();setTimeout(function(){w.print();},300);}
function shareReceipt(id){var l=loans.find(function(x){return x.id===id;});if(!l)return;var msg='🧾 *COMPROVANTE DE EMPRÉSTIMO*\n\n👤 '+l.name+'\n📅 '+fmtDate(l.startDate)+'\n⏰ Vence: '+fmtDate(l.dueDate)+'\n💵 Emprestado: '+fmt(l.originalAmount)+'\n📈 Juros: '+l.interest+'%/mês\n━━━━━━━━\n💰 *TOTAL: '+fmt(l.currentAmount)+'*';var phone=(l.phone||'').replace(/\D/g,'');window.open((phone?'https://wa.me/55'+phone:'https://wa.me/')+'?text='+encodeURIComponent(msg),'_blank');}

function openHistory(id){
  var l=loans.find(function(x){return x.id===id;});if(!l)return;
  var histHtml=l.history.map(function(h){var isLoan=h.type==='emprestimo'||h.type==='empréstimo';var isFinal=h.type==='pagamento_final';var color=isLoan?'#3b82f6':isFinal?'#22c55e':'#f59e0b';var label=isLoan?'💵 Empréstimo':isFinal?'✅ Quitado':'💳 Parcial';return'<div class="hist-item" style="border-left-color:'+color+'"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:13px;font-weight:600;color:'+color+'">'+label+'</div><div style="font-size:11px;color:#6b7280;margin-top:2px">📅 '+fmtDate(h.date)+'</div></div><div style="font-size:14px;font-weight:700;color:'+(isLoan?'#ef4444':'#22c55e')+'">'+(isLoan?'-':'+')+fmt(h.value)+'</div></div>'+(!isLoan&&h.note?'<div style="font-size:11px;color:#6b7280;margin-top:6px;border-top:0.5px solid #e5e7eb;padding-top:6px">'+h.note+'</div>':'')+'</div>';}).join('');
  var docHtml='';
  if(l.docRG||l.docResidencia){docHtml='<div style="margin-bottom:14px"><div style="font-size:10px;color:#1d4ed8;font-weight:700;letter-spacing:1px;margin-bottom:8px">DOCUMENTOS</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+(l.docRG?'<div><div style="font-size:11px;color:#6b7280;margin-bottom:4px">🪪 RG/CNH</div><img src="'+l.docRG+'" style="width:100%;border-radius:8px;border:0.5px solid #e5e7eb"></div>':'<div style="background:#f9fafb;border:0.5px dashed #d1d5db;border-radius:8px;padding:16px;text-align:center;font-size:11px;color:#9ca3af">🪪 Sem foto</div>')+(l.docResidencia?'<div><div style="font-size:11px;color:#6b7280;margin-bottom:4px">🏠 Comprovante</div><img src="'+l.docResidencia+'" style="width:100%;border-radius:8px;border:0.5px solid #e5e7eb"></div>':'<div style="background:#f9fafb;border:0.5px dashed #d1d5db;border-radius:8px;padding:16px;text-align:center;font-size:11px;color:#9ca3af">🏠 Sem foto</div>')+'</div></div>';}
  modal('<div class="modal-header"><span class="modal-title">📋 Histórico</span><button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div style="margin-bottom:14px"><div style="font-size:18px;font-weight:700">'+l.name+'</div>'+(l.phone?'<div style="font-size:13px;color:#6b7280">📞 '+l.phone+'</div>':'')+(l.address?'<div style="font-size:12px;color:#6b7280">📍 '+l.address+'</div>':'')+'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px"><div style="background:#f9fafb;border-radius:10px;padding:11px"><div style="font-size:9px;color:#9ca3af;margin-bottom:3px">EMPRESTADO</div><div style="font-size:15px;font-weight:700">'+fmt(l.originalAmount)+'</div></div><div style="background:#f9fafb;border-radius:10px;padding:11px"><div style="font-size:9px;color:#9ca3af;margin-bottom:3px">TOTAL ATUAL</div><div style="font-size:15px;font-weight:700;color:#1d4ed8">'+fmt(l.currentAmount)+'</div></div></div>'
    +docHtml+'<div style="font-size:10px;color:#1d4ed8;font-weight:700;letter-spacing:1px;margin-bottom:10px">MOVIMENTAÇÕES</div>'+histHtml
    +(!l.paid?'<button class="btn-full btn-blue" style="margin-top:14px" onclick="closeModal();openPay(\''+id+'\')">Registrar pagamento</button>':''));
}

function moverInadimplente(id){
  var l=loans.find(function(x){return x.id===id;});if(!l)return;
  var motivo=prompt('Motivo (ex: sumiu, número desligado):')||'Sem contato';
  inadimplentes.push({id:l.id,name:l.name,phone:l.phone||'',address:l.address||'',originalAmount:l.originalAmount,currentAmount:l.currentAmount,startDate:l.startDate,dueDate:l.dueDate,interest:l.interest,motivo:motivo,movidoEm:today(),history:l.history||[]});
  loans=loans.filter(function(x){return x.id!==id;});saveInad();save();renderStats();renderList();closeModal();showToast('⚠️ Movido para inadimplentes');
}
function openInadimplentes(){
  var total=inadimplentes.reduce(function(s,i){return s+i.currentAmount;},0);
  var list=inadimplentes.length===0?'<div style="text-align:center;padding:30px;color:#9ca3af;font-size:13px">Nenhum inadimplente cadastrado</div>'
    :inadimplentes.map(function(i){return'<div style="background:#fff;border:0.5px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:8px"><div style="padding:12px 14px;display:flex;align-items:center;gap:10px"><div style="width:38px;height:38px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#9ca3af">'+i.name.charAt(0).toUpperCase()+'</div><div style="flex:1"><div style="font-size:14px;font-weight:600;color:#374151">'+i.name+'</div><div style="font-size:11px;color:#9ca3af">'+i.motivo+'</div></div><div style="text-align:right"><div style="font-size:14px;font-weight:700;color:#9ca3af">'+fmt(i.currentAmount)+'</div><div style="font-size:9px;color:#d1d5db">prejuízo</div></div></div><div style="padding:0 14px 12px;display:flex;gap:6px">'+(i.phone?'<button onclick="window.open(\'https://wa.me/55'+i.phone.replace(/\D/g,'')+'\',\'_blank\')" style="flex:1;background:#064e3b;color:#34d399;border:none;border-radius:8px;padding:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🟢 Contato</button>':'')+'<button onclick="reativar(\''+i.id+'\')" style="flex:1;background:#fef2f2;color:#dc2626;border:0.5px solid #fca5a5;border-radius:8px;padding:8px;font-size:11px;cursor:pointer;font-family:inherit">↩ Reativar</button><button onclick="excluirInad(\''+i.id+'\')" style="padding:8px 12px;background:#f3f4f6;color:#6b7280;border:0.5px solid #e5e7eb;border-radius:8px;font-size:12px;cursor:pointer">🗑️</button></div></div>';}).join('');
  modal('<div class="modal-header"><span class="modal-title">⚠️ Inadimplentes</span><button class="modal-close" onclick="closeModal()">×</button></div>'+(inadimplentes.length>0?'<div style="background:#fffbeb;border:0.5px solid #fcd34d;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:#92400e">⚠️ '+inadimplentes.length+' cliente(s) · '+fmt(total)+' no prejuízo</div>':'')+list);
}
function reativar(id){var i=inadimplentes.find(function(x){return x.id===id;});if(!i)return;loans.push({id:i.id,name:i.name,phone:i.phone,address:i.address,originalAmount:i.originalAmount,currentAmount:i.currentAmount,interest:i.interest,startDate:i.startDate,dueDate:i.dueDate,note:'Reativado',paid:false,history:i.history||[]});inadimplentes=inadimplentes.filter(function(x){return x.id!==id;});saveInad();save();renderStats();renderList();closeModal();showToast('✅ Reativado!');}
function excluirInad(id){inadimplentes=inadimplentes.filter(function(x){return x.id!==id;});saveInad();openInadimplentes();}

function openClients(){
  function render(search){
    var filtered=clients.filter(function(c){return!search||c.name.toLowerCase().includes(search.toLowerCase());});
    var listHtml=filtered.length===0?'<div style="text-align:center;padding:20px;color:#9ca3af">Nenhum cliente</div>'
      :filtered.map(function(c){var al=loans.filter(function(l){return!l.paid&&clientKey(l.name)===clientKey(c.name);});var total=al.reduce(function(s,l){return s+l.currentAmount;},0);var allQ=loans.filter(function(l){return clientKey(l.name)===clientKey(c.name);}).every(function(l){return l.paid;});var sN=c.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");var sP=c.phone.replace(/'/g,"\\'");var sA=c.address.replace(/'/g,"\\'");return'<div style="background:#fff;border:0.5px solid #e5e7eb;border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px"><div style="width:38px;height:38px;border-radius:50%;background:#eff6ff;color:#2563eb;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0">'+c.name.charAt(0).toUpperCase()+'</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;color:#111827">'+c.name+'</div>'+(c.phone?'<div style="font-size:11px;color:#6b7280">📞 '+c.phone+'</div>':'')+'</div><div style="text-align:right;flex-shrink:0"><div style="font-size:13px;font-weight:700;color:'+(allQ?'#22c55e':total>0?'#111827':'#9ca3af')+'">'+(allQ?'Quitado ✓':fmt(total))+'</div><button onclick="closeModal();openForm({name:\''+sN+'\',phone:\''+sP+'\',address:\''+sA+'\',amount:\'\',interest:\'30\',startDate:\''+today()+'\',note:\'\'})" style="margin-top:4px;background:#2563eb;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">+ Empr.</button></div></div>';}).join('');
    document.getElementById('clients-list').innerHTML=listHtml;
  }
  modal('<div class="modal-header"><span class="modal-title">👥 Clientes ('+clients.length+')</span><button class="modal-close" onclick="closeModal()">×</button></div>'+'<input type="text" placeholder="🔍 Buscar cliente..." oninput="renderClientsList(this.value)" style="width:100%;background:#f9fafb;border:0.5px solid #d1d5db;border-radius:10px;padding:10px 13px;font-size:14px;font-family:inherit;outline:none;margin-bottom:12px"><div id="clients-list"></div>');
  window.renderClientsList=render;render('');
}

  var s=calcStats();
  modal('<div class="modal-header"><span class="modal-title">📊 Relatório</span><button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div class="preview-box"><div style="font-size:10px;color:#1d4ed8;font-weight:700;letter-spacing:1px;margin-bottom:8px">POSIÇÃO ATUAL</div>'
    +'<div class="preview-row"><span>Total a receber</span><span style="color:#1d4ed8">'+fmt(s.totalOwed)+'</span></div>'
    +'<div class="preview-row"><span>Capital emprestado</span><span>'+fmt(s.totalLent)+'</span></div>'
    +'<div class="preview-row"><span>Valor vencido</span><span style="color:#ef4444">'+fmt(s.totalOverdue)+'</span></div>'
    +'<div class="preview-row"><span>Empréstimos ativos</span><span>'+s.activeCount+'</span></div>'
    +'<div class="preview-row"><span>Total de clientes</span><span>'+s.clientCount+'</span></div>'
    +'<div class="preview-row"><span>Média por empréstimo</span><span>'+fmt(s.avgLoan)+'</span></div></div>'
    +'<div class="preview-box"><div style="font-size:10px;color:#15803d;font-weight:700;letter-spacing:1px;margin-bottom:8px">RENDIMENTO</div>'
    +'<div class="preview-row"><span>Juros recebidos (total)</span><span style="color:#16a34a">'+fmt(s.jurosRecebidos)+'</span></div>'
    +'<div class="preview-row"><span>Lucro este mês</span><span style="color:#16a34a">'+fmt(s.lucroMensal)+'</span></div>'
    +'<div class="preview-row"><span>Lucro este ano</span><span style="color:#16a34a">'+fmt(s.lucroAnual)+'</span></div></div>'
    +'<div class="preview-box"><div style="font-size:10px;color:#6b7280;font-weight:700;letter-spacing:1px;margin-bottom:8px">HISTÓRICO</div>'
    +'<div class="preview-row"><span>Total já emprestado</span><span>'+fmt(s.totalHist)+'</span></div>'
    +'<div class="preview-row"><span>Total de operações</span><span>'+loans.length+'</span></div></div>');
}

function openBackup(){
  modal('<div class="modal-header"><span class="modal-title">📥 Backup & Restaurar</span><button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:6px">💾 Exportar backup</div>'
    +'<div style="font-size:12px;color:#6b7280;margin-bottom:10px">Salve um arquivo com todos seus dados.</div>'
    +'<div style="display:flex;flex-direction:column;gap:8px">'
    +'<button class="btn-full btn-blue" onclick="downloadBackup()">⬇️ Baixar arquivo (.json)</button>'
    +'<button class="btn-full btn-gray" onclick="copyBackup()">📋 Copiar dados</button></div></div>'
    +'<div style="border-top:0.5px solid #e5e7eb;padding-top:16px"><div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:6px">📤 Restaurar backup</div>'
    +'<div style="font-size:12px;color:#6b7280;margin-bottom:8px">Cole o conteúdo de um backup. <strong style="color:#dc2626">Substitui todos os dados atuais.</strong></div>'
    +'<textarea id="restore-input" placeholder="Cole o conteúdo do backup aqui..." style="width:100%;background:#f9fafb;border:0.5px solid #d1d5db;border-radius:10px;padding:11px 13px;font-size:11px;font-family:monospace;outline:none;resize:vertical;min-height:80px"></textarea>'
    +'<div style="display:flex;gap:8px;margin-top:8px">'
    +'<label style="flex:1;background:#f3f4f6;color:#374151;border:0.5px solid #e5e7eb;border-radius:10px;padding:11px;font-size:13px;font-weight:600;text-align:center;cursor:pointer">📁 Abrir arquivo<input type="file" accept=".json" style="display:none" onchange="loadFile(event)"></label>'
    +'<button onclick="restoreBackup()" style="flex:1;background:#fef2f2;color:#dc2626;border:0.5px solid #fca5a5;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">🔁 Restaurar</button>'
    +'</div></div>');
}
function downloadBackup(){var data=JSON.stringify({loans:loans,clients:clients,inadimplentes:inadimplentes,exportedAt:new Date().toISOString()},null,2);var blob=new Blob([data],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='emprestimos-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);showToast('📥 Backup baixado!');}
function copyBackup(){var data=JSON.stringify({loans:loans,clients:clients,inadimplentes:inadimplentes,exportedAt:new Date().toISOString()});navigator.clipboard.writeText(data).then(function(){showToast('📋 Dados copiados!');});}
function loadFile(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var el=document.getElementById('restore-input');if(el)el.value=ev.target.result;};r.readAsText(f);}
function restoreBackup(){var raw=(document.getElementById('restore-input')||{}).value||'';if(!raw.trim()){showToast('Cole os dados primeiro','error');return;}try{var p=JSON.parse(raw);if(!Array.isArray(p.loans))throw new Error('inválido');loans=p.loans;clients=p.clients||[];inadimplentes=p.inadimplentes||[];save();saveInad();renderStats();renderList();closeModal();showToast('✅ '+loans.length+' empréstimos restaurados!');}catch(e){showToast('Arquivo inválido','error');}}

// INIT
load();
// Remove any existing PIN so app opens directly
localStorage.removeItem(PIN_KEY);
appUnlocked=true;
document.getElementById('app').style.display='block';
renderStats();
renderList();
var s=calcStats();
if(s.warn3>0)setTimeout(function(){showToast('⚠️ '+s.warn3+' empréstimo(s) vence(m) em até 3 dias!','warn');},600);
</script>
