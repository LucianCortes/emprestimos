function openBackup(){
  modal('<div class="modal-header"><span class="modal-title">📥 Backup & Restaurar</span><button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:5px">Exportar</div>'
    +'<div style="display:flex;flex-direction:column;gap:6px">'
    +'<button class="btn-primary" onclick="downloadBackup()">⬇️ Baixar arquivo (.json)</button>'
    +'<button class="btn-secondary" onclick="copyBackup()">📋 Copiar dados</button></div></div>'
    +'<div style="border-top:0.5px solid #e2e8f0;padding-top:12px"><div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:5px">Restaurar</div>'
    +'<div style="font-size:10px;color:#64748b;margin-bottom:6px">Cole o backup. <strong style="color:#dc2626">Substitui todos os dados atuais.</strong></div>'
    +'<textarea id="restore-input" placeholder="Cole o backup aqui..." style="width:100%;background:#f8fafc;border:0.5px solid #d1d5db;border-radius:8px;padding:9px 11px;font-size:10px;font-family:monospace;outline:none;resize:vertical;min-height:65px"></textarea>'
    +'<div style="display:flex;gap:7px;margin-top:7px">'
    +'<label style="flex:1;background:#f1f5f9;color:#374151;border:0.5px solid #e2e8f0;border-radius:8px;padding:9px;font-size:11px;font-weight:600;text-align:center;cursor:pointer">📁 Abrir arquivo<input type="file" accept=".json" style="display:none" onchange="loadFile(event)"></label>'
    +'<button onclick="restoreBackup()" style="flex:1;background:#fef2f2;color:#dc2626;border:0.5px solid #fca5a5;border-radius:8px;padding:9px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🔁 Restaurar</button>'
    +'</div></div>');
}
// Junta todas as fotos referenciadas (IndexedDB ou base64 legado) num mapa {chave:base64}
function collectDocs(){
  var refs=[];
  loans.concat(inadimplentes||[]).forEach(function(o){
    ['docRG','docResidencia'].forEach(function(f){if(o[f]&&!isDataUrl(o[f]))refs.push(o[f]);});
  });
  if(!refs.length)return Promise.resolve({});
  return Promise.all(refs.map(function(k){return docGet(k).then(function(d){return{k:k,d:d};}).catch(function(){return{k:k,d:null};});}))
    .then(function(list){var m={};list.forEach(function(x){if(x.d)m[x.k]=x.d;});return m;});
}
function buildBackup(){
  return collectDocs().then(function(docs){
    return {loans:loans,clients:clients,inadimplentes:inadimplentes,docs:docs,exportedAt:new Date().toISOString()};
  });
}
function markBackup(){localStorage.setItem('emp_last_backup',String(Date.now()));}
function downloadBackup(){buildBackup().then(function(obj){var data=JSON.stringify(obj,null,2);var blob=new Blob([data],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='emprestimos-'+today()+'.json';a.click();URL.revokeObjectURL(url);markBackup();showToast('📥 Backup baixado!');});}
function copyBackup(){buildBackup().then(function(obj){navigator.clipboard.writeText(JSON.stringify(obj)).then(function(){markBackup();showToast('📋 Copiado!');});});}
function loadFile(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var el=document.getElementById('restore-input');if(el)el.value=ev.target.result;};r.readAsText(f);}
function restoreBackup(){
  var raw=(document.getElementById('restore-input')||{}).value||'';
  if(!raw.trim()){showToast('Cole os dados primeiro','error');return;}
  try{
    var p=JSON.parse(raw);
    if(!Array.isArray(p.loans))throw new Error('inválido');
    loans=p.loans;clients=p.clients||[];inadimplentes=p.inadimplentes||[];
    migrateLoans(loans);
    // Devolve as fotos do backup para o IndexedDB
    var docs=p.docs||{};var keys=Object.keys(docs);
    var writeDocs=keys.length?Promise.all(keys.map(function(k){return docSet(k,docs[k]).catch(function(){});})):Promise.resolve();
    writeDocs.then(function(){
      save();saveInad();renderAll();closeModal();
      showToast('✅ '+loans.length+' empréstimos restaurados!');
    });
  }catch(e){showToast('Arquivo inválido','error');}
}
