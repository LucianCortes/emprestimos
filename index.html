<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Empréstimos</title>
<!-- Tema antes de qualquer pintura: sem isto a tela pisca no tema errado
     quando o dono forçou claro/escuro diferente do aparelho. -->
<script id="tema-boot">
try{var _t=localStorage.getItem('emp_tema');
  if(_t==='claro')document.documentElement.setAttribute('data-theme','light');
  else if(_t==='escuro')document.documentElement.setAttribute('data-theme','dark');
}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   TOKENS — todas as cores nascem aqui, no tema claro.
   O escuro só REDEFINE. Nenhuma cor pode existir apenas dentro
   de @media ou de [data-theme]: se existisse, o outro tema
   ficaria sem ela e a tela sairia ilegível.
   ============================================================ */
:root{
  --bg:#F5F7FA; --pn:#FFFFFF; --pn2:#EDF1F6; --pn3:#E3E9F1;
  --ln:#DDE3EC; --ln2:#C7D0DC;
  --tx:#0B1119; --dim:#576375; --dim2:#8A95A6;
  --ac:#8A6317; --acTx:#FFFFFF;
  --gr:#0B6E4F; --rd:#B3261E; --am:#8A5200;
  --acS:#F5EEE0; --grS:#E2F1EA; --rdS:#FBE7E5; --amS:#FAEEDC;
  --sh:0 1px 2px rgba(11,17,25,.05);
  color-scheme:light;
}
/* escuro automático (segue o aparelho), salvo se o dono forçou o claro */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0C10; --pn:#141922; --pn2:#1C232E; --pn3:#232B37;
  --ln:#262E3A; --ln2:#333D4C;
  --tx:#EDF1F6; --dim:#8B97A8; --dim2:#5D6878;
  --ac:#E3B466; --acTx:#15100A;
  --gr:#4FD59A; --rd:#FF7A6E; --am:#F0B45E;
  --acS:rgba(227,180,102,.12); --grS:rgba(79,213,154,.12);
  --rdS:rgba(255,122,110,.12); --amS:rgba(240,180,94,.12);
  --sh:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}}
/* escuro forçado pelo seletor da tela Conta */
:root[data-theme="dark"]{
  --bg:#0A0C10; --pn:#141922; --pn2:#1C232E; --pn3:#232B37;
  --ln:#262E3A; --ln2:#333D4C;
  --tx:#EDF1F6; --dim:#8B97A8; --dim2:#5D6878;
  --ac:#E3B466; --acTx:#15100A;
  --gr:#4FD59A; --rd:#FF7A6E; --am:#F0B45E;
  --acS:rgba(227,180,102,.12); --grS:rgba(79,213,154,.12);
  --rdS:rgba(255,122,110,.12); --amS:rgba(240,180,94,.12);
  --sh:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--tx);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
/* botão desligado tem que PARECER desligado, não só recusar o toque */
button[disabled]{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:3px}

/* Dinheiro: SEMPRE em mono com as casas alinhadas */
.mono{font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;font-weight:600}
h1,h2,h3,.arch{font-family:Archivo,system-ui,sans-serif;letter-spacing:-.02em}

/* ============================================================
   ESQUELETO
   ============================================================ */
#app{display:none}
.shell{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.col-main{min-width:0}
#menu-desk{display:none}
.topo{background:var(--pn);border-bottom:1px solid var(--ln);padding:8px 12px;
  display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:60;min-height:56px}
.topo-tit{flex:1;min-width:0;font-family:Archivo,sans-serif;font-size:17px;font-weight:800;
  letter-spacing:-.018em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-kick{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.ico-btn{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;
  border-radius:10px;color:var(--dim);flex:none}
.ico-btn:hover{background:var(--pn2)}
.ico-ac{background:var(--ac);color:var(--acTx);min-width:44px;min-height:44px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex:none}
.rotulo-novo{display:none}
/* o seletor de setinhas do campo numérico briga com o valor grande da tela Receber */
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.screen{display:none;padding-bottom:96px}
.screen.active{display:block}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:70;display:flex;
  background:var(--pn);border-top:1px solid var(--ln);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  min-height:52px;justify-content:center;color:var(--dim2);
  font-family:Archivo,sans-serif;font-size:10.5px;font-weight:700;position:relative}
.tab[aria-current="page"]{color:var(--ac)}
.tab-badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--rd);color:var(--bg);
  min-width:16px;height:16px;border-radius:8px;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ============================================================
   PEÇAS (as mesmas em todas as telas)
   ============================================================ */
.sec{padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}
.sec-t{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2)}
.sec-a{color:var(--ac);font-size:12.5px;font-weight:700;font-family:Archivo,sans-serif;
  min-height:44px;display:flex;align-items:center}

/* blocos colados de indicadores: 1px da cor da linha entre eles, sem sombra */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);
  border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin:12px 14px}
.tile{background:var(--pn);padding:10px 11px;min-width:0;width:100%;text-align:left;
  display:block;min-height:56px}
.tile-l{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.tile-v{margin-top:2px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* caixa com borda — NUNCA dentro de outra caixa com borda */
.bloco{background:var(--pn);border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin:0 14px}
.bloco.plano{margin:0}

/* lista em LINHAS, com a barra de situação na lateral esquerda */
.linha{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  width:100%;padding:10px 12px 10px 9px;background:var(--pn);position:relative;
  border-bottom:1px solid var(--ln);border-left:3px solid var(--dim2);min-height:60px}
.linha:last-child{border-bottom:none}
.linha:hover{background:var(--pn2)}
/* o botão principal cobre a linha inteira (área de toque), sem virar
   "botão dentro de botão": o de Receber fica por cima, num nível acima */
.linha-main{min-width:0;text-align:left;padding:0;min-height:44px;
  display:flex;flex-direction:column;justify-content:center;gap:1px}
.linha-main::after{content:"";position:absolute;inset:0;z-index:1}
.linha-main:focus-visible{outline:none}
.linha-main:focus-visible::after{outline:2px solid var(--ac);outline-offset:-3px;border-radius:10px}
.linha>*:not(.linha-main){position:relative;z-index:2}
.linha-n{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-s{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-st{width:64px;text-align:right;font-size:11.5px;font-weight:700;white-space:nowrap}

.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:9px 14px;border-bottom:1px solid var(--ln)}
.kv:has(.ico-btn){align-items:center;padding-top:4px;padding-bottom:4px}
.kv:last-child{border-bottom:none}
.kv-l{font-size:13.5px;color:var(--dim)}
.kv.forte .kv-l{color:var(--tx);font-weight:600}

.selo{display:inline-block;border-radius:6px;padding:3px 9px;font-size:11.5px;font-weight:700;
  white-space:nowrap}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--ln2);background:transparent;color:var(--dim);border-radius:9px;
  padding:0 13px;min-height:44px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--acTx)}

/* Linha de empréstimo na ficha do cliente: empilhada, largura toda, sem rolar
   para o lado. O empréstimo aberto fica com o fundo do dourado suave. */
.emp-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;min-height:48px;padding:10px 13px;border:none;text-align:left;color:var(--tx)}
.emp-linha-t{flex:1;min-width:0;font-size:13.5px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;
  border-radius:12px;font-family:Archivo,sans-serif;font-size:15px;font-weight:700;padding:0 16px;width:100%}
/* botões em fila: sem isto cada um pede 100% da largura e a tela estoura */
.btn-fila{display:flex;gap:8px}
.btn-fila>.btn{width:auto;flex:1;min-width:0}
.btn-fila>.btn.fixo{flex:none;padding:0 15px}
.btn-ac{background:var(--ac);color:var(--acTx)}
.btn-gh{background:var(--pn);color:var(--tx);border:1px solid var(--ln2)}
.btn-rd{background:var(--rdS);color:var(--rd);border:1px solid var(--rd)}
.btn-txt{color:var(--dim);font-weight:600;font-family:inherit;font-size:14px;min-height:44px}
.btn-mini{min-height:44px;border-radius:9px;padding:0 13px;background:var(--ac);color:var(--acTx);
  font-family:Archivo,sans-serif;font-size:13px;font-weight:700;flex:none}
/* aparelho estreito: o botão cede espaço para o nome do cliente */
@media (max-width:359px){
  .btn-mini{padding:0 9px;font-size:12.5px}
  .linha{padding-left:7px;padding-right:9px;gap:7px}
  .linha-st{width:56px}
}

/* as quatro ações da ficha */
.acoes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:11px 14px 0}
.acao{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-height:62px;padding:8px 3px;border-radius:11px;border:1px solid var(--ln);background:var(--pn);
  color:var(--tx);font-family:Archivo,sans-serif;font-size:12px;font-weight:700}
.acao.pri{border-color:var(--ac);background:var(--ac);color:var(--acTx)}

.aviso{display:flex;align-items:center;gap:9px;margin:12px 14px 0;padding:10px 12px;
  border-radius:11px;border:1px solid var(--ln);background:var(--pn);
  font-size:12.5px;font-weight:600;text-align:left;width:calc(100% - 28px);min-height:48px}

.vazio{text-align:center;padding:40px 18px;color:var(--dim2)}
.vazio-t{font-family:Archivo,sans-serif;font-size:16px;font-weight:800;color:var(--tx);margin-top:8px}

/* campos */
.campo{margin-bottom:11px}
.campo>label,.rot{display:block;font-size:10px;color:var(--dim2);font-weight:700;
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.09em}
.inp{width:100%;background:var(--bg);border:1px solid var(--ln2);border-radius:10px;
  padding:12px 12px;color:var(--tx);font-size:15px;outline:none;min-height:46px}
.inp::placeholder{color:var(--dim2)}
.inp:focus{border-color:var(--ac)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg-btn{flex:1 1 0;min-width:0;min-height:44px;border-radius:9px;font-size:13px;font-weight:600;
  border:1px solid var(--ln2);background:var(--pn);color:var(--dim);white-space:nowrap}
.seg-btn.active{background:var(--ac);border-color:var(--ac);color:var(--acTx)}

/* prévia de cálculo (usada no formulário, na renovação e na edição) */
.previa,.preview-box{border:1px solid var(--ln);border-radius:11px;background:var(--pn);
  margin-bottom:11px;padding:11px 13px}
.previa-t,.preview-label{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim2);margin-bottom:7px;display:block}
.preview-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:13.5px;color:var(--dim);margin-bottom:4px}
.preview-row span:last-child{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-weight:600;color:var(--tx)}
.preview-row.total{font-size:15px;font-weight:600;color:var(--tx);
  border-top:1px solid var(--ln);padding-top:7px;margin-top:6px}

/* nomes que vieram do app antigo e continuam valendo — agora com os tokens */
.field{margin-bottom:11px}
.field>label,.field-label{display:block;font-size:10px;color:var(--dim2);font-weight:700;
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.09em}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg-control{display:flex;gap:5px;flex-wrap:wrap}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.modal-title{font-family:Archivo,sans-serif;font-size:18px;font-weight:800;letter-spacing:-.02em}
.modal-close{min-width:44px;min-height:44px;border-radius:10px;background:var(--pn2);color:var(--dim);
  display:flex;align-items:center;justify-content:center;flex:none;font-size:20px}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions>*{flex:1}
.btn-primary,.btn-secondary,.btn-danger{display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:48px;border-radius:12px;font-family:Archivo,sans-serif;font-size:15px;font-weight:700;padding:0 14px}
.btn-primary{background:var(--ac);color:var(--acTx);border:none}
.btn-secondary{background:var(--pn);color:var(--tx);border:1px solid var(--ln2)}
.btn-danger{background:var(--rdS);color:var(--rd);border:1px solid var(--rd)}
.abtn{min-height:44px;border-radius:9px;padding:0 12px;font-size:13px;font-weight:600;
  border:1px solid var(--ln2);background:var(--pn);color:var(--tx)}
.doc-label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border-radius:11px;min-height:76px;padding:10px 8px;text-align:center;cursor:pointer;
  border:1px dashed var(--ln2);background:var(--pn);font-size:12px;font-weight:600;color:var(--dim)}
.doc-label.tem{border-style:solid;border-color:var(--gr);color:var(--gr);background:var(--grS)}
.payment-tracker{border:1px solid var(--ln);border-radius:12px;background:var(--pn);padding:12px 14px;margin-bottom:11px}
.tracker-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;margin-bottom:4px}
.tracker-label{color:var(--dim)}
.tracker-val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.tracker-bar{height:6px;background:var(--pn2);border-radius:3px;margin:8px 0 6px;overflow:hidden}
.tracker-fill{height:100%;background:var(--gr);border-radius:3px}
.payment-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 12px;border:1px solid var(--ln);border-radius:9px;margin-bottom:5px;font-size:13px;background:var(--pn)}
.renew-box{border:1px solid var(--am);background:var(--amS);border-radius:11px;padding:12px 14px;margin-bottom:11px}
.renew-title{font-size:13px;font-weight:700;color:var(--am);margin-bottom:3px}
.hist-item{background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--ln2);
  border-radius:10px;padding:10px 12px;margin-bottom:6px}
.empty-state{text-align:center;padding:36px 18px;color:var(--dim2)}
/* a faixa da taxa carrega hex legado no atributo style (a bateria financeira o
   verifica); aqui o tema vence por cima, para ela não ficar ilegível no escuro */
#rate-hint.hint-cinza{color:var(--dim2)!important}
#rate-hint.hint-ambar{background:var(--amS)!important;color:var(--am)!important}

/* ============================================================
   JANELAS (folha por baixo no celular, centro no computador)
   ============================================================ */
.overlay{position:fixed;inset:0;background:rgba(6,9,14,.6);display:flex;align-items:flex-end;
  justify-content:center;z-index:500;padding:0}
.modal{background:var(--bg);border-radius:18px 18px 0 0;padding:16px 14px calc(30px + env(safe-area-inset-bottom));
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:sobe .22s ease}
@keyframes sobe{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.modal-t{font-family:Archivo,sans-serif;font-size:18px;font-weight:800;letter-spacing:-.02em}
.modal-x{min-width:44px;min-height:44px;border-radius:10px;background:var(--pn2);color:var(--dim);
  display:flex;align-items:center;justify-content:center;flex:none}
.modal-acoes{display:flex;gap:8px;margin-top:14px}
.modal-acoes>*{flex:1}
@media (min-width:900px){
  .overlay{align-items:center;padding:24px}
  .modal{border-radius:16px;max-width:480px;padding-bottom:20px}
}

/* folha de confirmação — substitui confirm()/prompt() do navegador.
   Fica acima de tudo (PIN, foto em tela cheia): é ela que pergunta. */
#sheet-root .overlay{z-index:9990}
.folha-txt{font-size:14px;color:var(--dim);line-height:1.55;margin-bottom:14px;white-space:pre-line}

/* ============================================================
   AVISOS
   ============================================================ */
/* Os avisos moram EMBAIXO, acima das abas: no topo eles tapavam justamente os
   números da Carteira, que é o que o dono abre o app para ver. */
#toast-container{position:fixed;left:12px;right:12px;z-index:9999;display:flex;
  flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  bottom:calc(78px + env(safe-area-inset-bottom))}
@media (min-width:900px){#toast-container{bottom:16px;left:auto;right:16px;align-items:flex-end}}
.toast{background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--gr);
  border-radius:10px;padding:10px 14px;font-size:13px;color:var(--tx);max-width:420px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);animation:entra .2s ease}
.toast.error{border-left-color:var(--rd)}
.toast.warn{border-left-color:var(--am)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   PIN
   ============================================================ */
.pin-overlay{position:fixed;inset:0;background:var(--bg);z-index:9000;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.pin-logo{width:52px;height:52px;border-radius:15px;background:var(--acS);color:var(--ac);
  display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.pin-title{font-family:Archivo,sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em}
.pin-sub{font-size:12.5px;color:var(--dim);margin:3px 0 20px;text-align:center;max-width:280px}
.pin-dots{display:flex;gap:14px;margin-bottom:18px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--ln2);background:transparent}
.pin-dot.filled{background:var(--ac);border-color:var(--ac)}
.pin-error{color:var(--rd);font-size:12px;font-weight:600;margin-bottom:10px;min-height:18px;text-align:center}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:264px}
.pin-key{background:var(--pn);border:1px solid var(--ln);border-radius:12px;min-height:56px;

<body>

<div id="modal-container"></div>

 <div class="shell">

             border:1px solid var(--ln);border-radius:11px;padding:0 12px;min-height:46px">

<script>
// ============================================================
// STATE
// ============================================================
var loans=[],clients=[],inadimplentes=[];
var currentFilter='all',currentScreen='home';
var expandedGroups={},expandedCards={},expandedClientHistory={},deleteConfirm=null,payingLoan=null;
var appUnlocked=false,pinBuffer='',pinMode='check',pinNewTemp='';
var _searchQuery='';
var PIN_KEY='emp_pin_v3';
var formData={};

// ============================================================
// NUVEM (Supabase) — configuração
// ============================================================
var SUPA_URL='https://dqauszhnkswgabkpbznf.supabase.co';
var SUPA_KEY='sb_publishable_EUqGfUca6mmNCPoBRRo5YQ_eClBC7NG';
var sb=null, cloudOn=false, cloudUser=null, cloudEmail='', _pushTimer=null;
try{
  if(window.supabase&&window.supabase.createClient){
    sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
    cloudOn=true;
  }
}catch(e){cloudOn=false;}

// ============================================================
// PERSISTENCE
// ============================================================
// save(touched): "touched" e o(s) id(s) mexido(s) agora. Se nao vier nada,
// marca tudo como pendente (conservador: em caso de duvida, o aparelho manda).
function save(touched){
  _ledgerInvalidate();                 // qualquer gravacao invalida o razao em cache
  var cliTocados=[];
  loans.forEach(function(l){var id=upsertClient(l);if(id)cliTocados.push(id);});
  markDirty('emprestimos',_idList(touched,loans));
  // So os clientes realmente criados/alterados. Marcar a lista toda fazia o
  // aparelho vencer a nuvem sempre nessa tabela.
  markDirty('clientes',touched==='*'?clients.map(function(c){return c.id;}):cliTocados);
  _saveLocal();
  cloudQueue();
}
function _saveLocal(){
  try{
    localStorage.setItem('emp_loans_v3',JSON.stringify(loans));
    localStorage.setItem('emp_clients_v3',JSON.stringify(clients));
  }catch(e){
    showToast('⚠️ Armazenamento do aparelho cheio (os dados na nuvem seguem salvos).','error');
    if(typeof console!=='undefined')console.error('Falha ao salvar local:',e);
  }
}
function load(){
  try{loans=JSON.parse(localStorage.getItem('emp_loans_v3')||localStorage.getItem('emp_loans_v2')||'[]');}catch(e){loans=[];}
  try{clients=JSON.parse(localStorage.getItem('emp_clients_v3')||localStorage.getItem('emp_clients_v2')||'[]');}catch(e){clients=[];}
  try{inadimplentes=JSON.parse(localStorage.getItem('emp_inad_v1')||'[]');}catch(e){inadimplentes=[];}
  migrateLoans(loans);
}
// Migracao defensiva: garante arrays e o campo principal (capital realmente emprestado)
function migrateLoans(arr){
  (arr||[]).forEach(function(l){
    if(!Array.isArray(l.payments))l.payments=[];
    if(!Array.isArray(l.history))l.history=[];
    if(l.principal==null){
      var f=l.history.find(function(h){return h.type==='emprestimo'||h.type==='empréstimo';});
      l.principal=f?f.value:(l.originalAmount||0);
    }
  });
}
function saveInad(touched){
  _ledgerInvalidate();                 // idem para inadimplentes
  markDirty('inadimplentes',_idList(touched,inadimplentes));
  _saveInadLocal();
  cloudQueue();
}
function _saveInadLocal(){
  try{localStorage.setItem('emp_inad_v1',JSON.stringify(inadimplentes));}
  catch(e){showToast('⚠️ Nao foi possivel salvar inadimplentes no aparelho.','error');}
}
// Devolve o id do cliente criado ou alterado — nulo quando nada mudou.
// Serve para marcar sujo so quem mexeu, em vez da lista inteira.
function upsertClient(l){
  var k=clientKey(l.name);
  var ex=clients.find(function(c){return clientKey(c.name)===k;});
  if(!ex){clients.push({id:l.id,name:l.name,phone:l.phone||'',address:l.address||''});return l.id;}
  var mudou=false;
  if(l.phone&&ex.phone!==l.phone){ex.phone=l.phone;mudou=true;}
  if(l.address&&ex.address!==l.address){ex.address=l.address;mudou=true;}
  return mudou?ex.id:null;
}

// ============================================================
// PENDENCIAS OFFLINE — o que ainda nao foi confirmado na nuvem
// ============================================================
// Duas listas guardadas no aparelho:
//  - emp_dirty_v1      : ids alterados aqui e ainda nao aceitos pela nuvem ("sujos").
//  - emp_tombstones_v1 : ids que o usuario apagou de fato (unica coisa que autoriza
//                        apagar na nuvem). Tombstone velho (>90 dias) e descartado.
var DIRTY_KEY='emp_dirty_v1', TOMB_KEY='emp_tombstones_v1', TOMB_MAX_DAYS=90;
var SYNC_TABLES=['emprestimos','clientes','inadimplentes'];
function _lsGet(k,def){try{var v=JSON.parse(localStorage.getItem(k)||'null');return (v==null)?def:v;}catch(e){return def;}}
function _lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
// Normaliza o argumento "touched": undefined => todos os ids do array
function _idList(touched,arr){
  // null  => nada mudou de fato (nao marca nada como sujo)
  // '*'   => tudo (so a restauracao de backup usa isso)
  // id/[] => exatamente o que mudou
  if(touched==='*')return (arr||[]).map(function(o){return o.id;});
  if(touched==null)return [];
  return (Array.isArray(touched)?touched:[touched]);
}
// ---- sujos ----
function _dirtyAll(){
  var o=_lsGet(DIRTY_KEY,{});
  if(!o||typeof o!=='object')o={};
  SYNC_TABLES.forEach(function(t){if(!Array.isArray(o[t]))o[t]=[];});
  return o;
}
function markDirty(table,ids){
  if(!table||!ids||!ids.length)return;
  var o=_dirtyAll(),ch=false;
  ids.forEach(function(id){if(id&&o[table].indexOf(id)<0){o[table].push(id);ch=true;}});
  if(ch)_lsSet(DIRTY_KEY,o);
  // se o registro voltou a existir, ele nao pode continuar na lista de apagados
  dropTombstones(table,ids);
}
function clearDirty(table,ids){
  if(!table||!ids||!ids.length)return;
  var o=_dirtyAll(),before=o[table].length;
  o[table]=o[table].filter(function(id){return ids.indexOf(id)<0;});
  if(o[table].length!==before)_lsSet(DIRTY_KEY,o);
}
function dirtyIds(table){return _dirtyAll()[table]||[];}
function isDirty(table,id){return dirtyIds(table).indexOf(id)>=0;}
// ---- apagados (tombstones) ----
function tombstones(){
  var arr=_lsGet(TOMB_KEY,[]);
  if(!Array.isArray(arr))arr=[];
  var limite=Date.now()-TOMB_MAX_DAYS*86400000,keep=[];
  arr.forEach(function(t){
    if(!t||!t.table||!t.id)return;
    var at=Date.parse(t.at||'');
    if(isNaN(at))at=Date.now();
    if(at>=limite)keep.push({table:t.table,id:t.id,at:t.at||new Date(at).toISOString()});
  });
  if(keep.length!==arr.length)_lsSet(TOMB_KEY,keep);
  return keep;
}
function addTombstone(table,id){
  if(!table||!id)return;
  var arr=tombstones();
  if(!arr.some(function(t){return t.table===table&&t.id===id;})){
    arr.push({table:table,id:id,at:new Date().toISOString()});
    _lsSet(TOMB_KEY,arr);
  }
  clearDirty(table,[id]); // apagado nao precisa mais ser enviado
}
function dropTombstones(table,ids){
  var arr=tombstones();
  var keep=arr.filter(function(t){return !(t.table===table&&ids.indexOf(t.id)>=0);});
  if(keep.length!==arr.length)_lsSet(TOMB_KEY,keep);
}
function tombIds(table){
  return tombstones().filter(function(t){return t.table===table;}).map(function(t){return t.id;});
}
function isTomb(table,id){return tombIds(table).indexOf(id)>=0;}
// Quantos lancamentos ainda nao chegaram na nuvem (aparece no aviso de sincronizacao)
function pendingCount(){
  var o=_dirtyAll(),n=0;
  SYNC_TABLES.forEach(function(t){n+=o[t].length;});
  return n+tombstones().length;
}

// ============================================================
// SINCRONIZAÇÃO COM A NUVEM
// ============================================================
function _d(v){return (v===''||v===undefined)?null:v;} // data vazia -> null
// Empréstimo: objeto do app -> linha do banco
function loanToRow(l){return {
  id:l.id,user_id:cloudUser,name:l.name||null,phone:l.phone||null,address:l.address||null,
  principal:l.principal,original_amount:l.originalAmount,current_amount:l.currentAmount,interest:l.interest,
  start_date:_d(l.startDate),due_date:_d(l.dueDate),note:l.note||null,paid:!!l.paid,
  doc_rg:l.docRG||null,doc_residencia:l.docResidencia||null,
  payments:l.payments||[],parcelas:l.parcelas||[],history:l.history||[]
};}
function rowToLoan(r){return {
  id:r.id,name:r.name||'',phone:r.phone||'',address:r.address||'',
  principal:r.principal,originalAmount:r.original_amount,currentAmount:r.current_amount,interest:r.interest,
  startDate:r.start_date||'',dueDate:r.due_date||'',note:r.note||'',paid:!!r.paid,
  docRG:r.doc_rg||'',docResidencia:r.doc_residencia||'',
  payments:r.payments||[],parcelas:r.parcelas||[],history:r.history||[]
};}
function clientToRow(c){return {id:c.id,user_id:cloudUser,name:c.name||null,phone:c.phone||null,address:c.address||null};}
function rowToClient(r){return {id:r.id,name:r.name||'',phone:r.phone||'',address:r.address||''};}
function inadToRow(i){return {
  id:i.id,user_id:cloudUser,name:i.name||null,phone:i.phone||null,address:i.address||null,
  original_amount:i.originalAmount,current_amount:i.currentAmount,interest:i.interest,
  start_date:_d(i.startDate),due_date:_d(i.dueDate),doc_rg:i.docRG||null,doc_residencia:i.docResidencia||null,
  motivo:i.motivo||null,movido_em:_d(i.movidoEm),last_accrual:_d(i.lastAccrual),history:i.history||[]
};}
function rowToInad(r){return {
  id:r.id,name:r.name||'',phone:r.phone||'',address:r.address||'',
  originalAmount:r.original_amount,currentAmount:r.current_amount,interest:r.interest,
  startDate:r.start_date||'',dueDate:r.due_date||'',docRG:r.doc_rg||'',docResidencia:r.doc_residencia||'',
  motivo:r.motivo||'',movidoEm:r.movido_em||'',lastAccrual:r.last_accrual||'',history:r.history||[]
};}

// Agenda um envio para a nuvem (espera 1,2s para juntar várias mudanças)
function cloudQueue(){
  if(!cloudOn||!cloudUser)return;
  if(_pushTimer)clearTimeout(_pushTimer);
  _pushTimer=setTimeout(function(){cloudPush();},1200);
}
// Envia o estado atual para a nuvem: grava/atualiza tudo e apaga SOMENTE o que
// o usuario apagou de fato (lista de tombstones). Nunca apaga "o que nao esta na lista".
function cloudPush(){
  if(!cloudOn||!cloudUser)return Promise.resolve();
  setSync('Salvando na nuvem…');
  var jobs=[
    _pushTable('emprestimos', loans.map(loanToRow), loans.map(function(l){return l.id;})),
    _pushTable('clientes', clients.map(clientToRow), clients.map(function(c){return c.id;})),
    _pushTable('inadimplentes', inadimplentes.map(inadToRow), inadimplentes.map(function(i){return i.id;}))
  ];
  return Promise.all(jobs).then(function(){setSync('Tudo salvo na nuvem ✓',true);})
    .catch(function(e){if(console)console.error('cloudPush',e);setSync('Sem conexão — salvo só no aparelho',true);});
}
function _pushTable(table, rows, ids){
  // fotografia dos pendentes ANTES do envio: o que o usuario mexer durante o
  // envio continua marcado como pendente e sobe no proximo push.
  var pend = dirtyIds(table);
  var p = rows.length ? sb.from(table).upsert(rows,{onConflict:'id'}) : Promise.resolve({error:null});
  return Promise.resolve(p).then(function(res){
    if(res&&res.error)throw res.error;
    // so limpa a marca de pendente do que realmente foi enviado e aceito
    clearDirty(table, pend.filter(function(id){return ids.indexOf(id)>=0;}));
    // apaga na nuvem apenas os ids que o usuario apagou aqui (e que nao voltaram a existir)
    var del = tombIds(table).filter(function(id){return ids.indexOf(id)<0;});
    if(!del.length)return;
    return Promise.resolve(sb.from(table).delete().eq('user_id',cloudUser).in('id',del))
      .then(function(r2){
        if(r2&&r2.error)throw r2.error;
        dropTombstones(table,del); // exclusao aplicada na nuvem: pode esquecer
      });
  });
}
// Junta nuvem + aparelho SEM perder o que foi feito offline.
// so na nuvem -> entra | so no aparelho -> fica (e sobe) | nos dois -> sujo vence local, senao vence a nuvem
function _mergeTable(table,cloudArr,localArr){
  var out=[],seen={},localById={};
  (localArr||[]).forEach(function(o){if(o&&o.id)localById[o.id]=o;});
  (cloudArr||[]).forEach(function(c){
    if(!c||!c.id||seen[c.id])return;
    if(isTomb(table,c.id))return;           // apagado aqui: nao ressuscita
    seen[c.id]=1;
    var l=localById[c.id];
    out.push((l&&isDirty(table,c.id))?l:c); // sujo => o aparelho manda
  });
  (localArr||[]).forEach(function(l){
    if(!l||!l.id||seen[l.id])return;
    if(isTomb(table,l.id))return;
    seen[l.id]=1;
    markDirty(table,[l.id]);                // so existe aqui: precisa subir
    out.push(l);
  });
  return out;
}
// Baixa os dados da nuvem e FUNDE com o aparelho (nunca substitui).
// Se a nuvem estiver vazia e o aparelho tiver dados, envia os do aparelho (primeira vez).
function cloudPull(){
  if(!cloudOn||!cloudUser)return Promise.resolve();
  setSync('Baixando da nuvem…');
  return Promise.all([
    sb.from('emprestimos').select('*'),
    sb.from('clientes').select('*'),
    sb.from('inadimplentes').select('*')
  ]).then(function(res){
    for(var i=0;i<res.length;i++){if(res[i].error)throw res[i].error;}
    var cl=res[0].data||[], cc=res[1].data||[], ci=res[2].data||[];
    var cloudEmpty=(cl.length+cc.length+ci.length)===0;
    var localHas=(loans.length+clients.length+inadimplentes.length)>0;
    if(cloudEmpty&&localHas){
      // Primeira vez: semeia a nuvem com o que já existe no aparelho
      return cloudPush().then(function(){migrateDocsToCloud();setSync('Dados enviados para a nuvem ✓',true);});
    }
    loans=_mergeTable('emprestimos',cl.map(rowToLoan),loans);
    clients=_mergeTable('clientes',cc.map(rowToClient),clients);
    inadimplentes=_mergeTable('inadimplentes',ci.map(rowToInad),inadimplentes);
    migrateLoans(loans);
    _ledgerInvalidate();               // veio coisa nova da nuvem: refaz o razao
    _saveLocal(); _saveInadLocal();
    // Só agora, com os dados de verdade na mão, os juros automáticos podem
    // correr. Antes isto rodava no cache velho, antes da fusão.
    accrueTudo();
    renderAll(); updateInadBadge();
    migrateDocsToCloud();
    // sobrou algo feito offline (ou alguma exclusao)? sobe agora.
    if(pendingCount()>0)return cloudPush();
    setSync('Sincronizado ✓',true);
  }).catch(function(e){
    if(console)console.error('cloudPull',e);
    setSync('Sem conexão — usando dados do aparelho',true);
  });
}
function setSync(msg,fade){
  var el=document.getElementById('sync-status'); if(!el)return;
  var p=pendingCount();
  var txt=msg;
  if(p>0){ // enquanto houver pendencia o aviso fica na tela
    txt=msg+' · '+p+' lançamento'+(p>1?'s':'')+' aguardando internet';
    fade=false;
  }
  el.textContent=txt; el.style.opacity='1';
  if(fade)setTimeout(function(){if(el)el.style.opacity='0';},2500);
}

// ============================================================
// DOCUMENTOS — fotos na nuvem (Supabase Storage) + cache no aparelho
// ============================================================
// O loan guarda só uma "chave" (ex: doc_<id>_docRG). A imagem fica:
//  - na nuvem (bucket "docs"), para sincronizar entre aparelhos;
//  - e em cache no IndexedDB, para abrir rápido e economizar tráfego.
var _docDB=null, DOC_BUCKET='docs';
function docDB(){
  return new Promise(function(res,rej){
    if(_docDB)return res(_docDB);
    if(!window.indexedDB)return rej(new Error('sem indexedDB'));
    var rq=indexedDB.open('emp_docs',1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore('docs');};
    rq.onsuccess=function(){_docDB=rq.result;res(_docDB);};
    rq.onerror=function(){rej(rq.error);};
  });
}
// --- cache local (IndexedDB) ---
function _idbSet(key,dataUrl){
  return docDB().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction('docs','readwrite');tx.objectStore('docs').put(dataUrl,key);
    tx.oncomplete=function(){res(key);};tx.onerror=function(){rej(tx.error);};
  });});
}
function _idbGet(key){
  return docDB().then(function(db){return new Promise(function(res,rej){
    var rq=db.transaction('docs','readonly').objectStore('docs').get(key);
    rq.onsuccess=function(){res(rq.result||null);};rq.onerror=function(){rej(rq.error);};
  });}).catch(function(){return null;});
}
function _idbDel(key){
  if(!key)return Promise.resolve();
  return docDB().then(function(db){return new Promise(function(res){
    var tx=db.transaction('docs','readwrite');tx.objectStore('docs').delete(key);
    tx.oncomplete=function(){res();};tx.onerror=function(){res();};
  });}).catch(function(){});
}
// --- conversões base64 <-> blob ---
function dataUrlToBlob(d){
  var parts=d.split(','),mime=((parts[0].match(/:(.*?);/)||[])[1])||'image/jpeg',bin=atob(parts[1]),arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function blobToDataUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});}
function docCloudPath(key){return cloudUser+'/'+key+'.jpg';}
function docCloudAvailable(){return cloudOn&&cloudUser&&sb&&sb.storage;}

// --- API pública: grava, lê e apaga (coordena nuvem + cache) ---
function docSet(key,dataUrl){
  return _idbSet(key,dataUrl).then(function(){
    if(docCloudAvailable()){
      try{ sb.storage.from(DOC_BUCKET).upload(docCloudPath(key),dataUrlToBlob(dataUrl),{upsert:true,contentType:'image/jpeg'})
        .then(function(r){if(r&&r.error&&console)console.warn('upload foto',r.error.message);}); }catch(e){}
    }
    return key;
  });
}
function docGet(key){
  if(!key)return Promise.resolve(null);
  return _idbGet(key).then(function(cached){
    if(cached)return cached;                       // já está no aparelho
    if(!docCloudAvailable())return null;            // sem nuvem e sem cache
    return sb.storage.from(DOC_BUCKET).download(docCloudPath(key)).then(function(r){
      if(r&&r.data){return blobToDataUrl(r.data).then(function(durl){_idbSet(key,durl);return durl;});}
      return null;
    }).catch(function(){return null;});
  });
}
function docDel(key){
  if(!key)return Promise.resolve();
  if(docCloudAvailable()){try{sb.storage.from(DOC_BUCKET).remove([docCloudPath(key)]);}catch(e){}}
  return _idbDel(key);
}
function isDataUrl(v){return typeof v==='string'&&v.indexOf('data:')===0;}
// Migra fotos antigas em base64 (gravadas no próprio registro) para o cache/nuvem.
function migrateDocsToIDB(){
  if(!window.indexedDB)return;
  var pending=[],tocadosDocs=[];
  loans.forEach(function(l){
    ['docRG','docResidencia'].forEach(function(f){
      if(isDataUrl(l[f])){
        var key='doc_'+l.id+'_'+f;var data=l[f];
        l[f]=key;if(tocadosDocs.indexOf(l.id)<0)tocadosDocs.push(l.id);pending.push(docSet(key,data));
      }
    });
  });
  if(pending.length)Promise.all(pending).then(function(){save(tocadosDocs);}).catch(function(){});
}
// Sobe para a nuvem as fotos que hoje só existem no aparelho (executa uma vez por aparelho).
function migrateDocsToCloud(){
  if(!docCloudAvailable())return;
  if(localStorage.getItem('emp_docs_clouded_'+cloudUser))return;
  var refs=[];
  loans.concat(inadimplentes||[]).forEach(function(o){
    ['docRG','docResidencia'].forEach(function(f){if(o[f]&&!isDataUrl(o[f]))refs.push(o[f]);});
  });
  if(!refs.length){localStorage.setItem('emp_docs_clouded_'+cloudUser,'1');return;}
  Promise.all(refs.map(function(k){
    return _idbGet(k).then(function(durl){
      if(!durl)return null;
      return sb.storage.from(DOC_BUCKET).upload(docCloudPath(k),dataUrlToBlob(durl),{upsert:true,contentType:'image/jpeg'}).catch(function(){});
    });
  })).then(function(){localStorage.setItem('emp_docs_clouded_'+cloudUser,'1');}).catch(function(){});
}

// ============================================================
// PIN — guardado como hash (não fica mais em texto puro)
// ============================================================
// Observação honesta: por ser um app 100% no navegador, isto é uma TRANCA
// BÁSICA, não criptografia forte. Um PIN de 4 dígitos é fácil de quebrar por
// quem tiver acesso técnico ao aparelho. A proteção real é o bloqueio do
// celular + backups frequentes.
function pinHash(s){var h=5381;s=String(s);for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return 'h'+h.toString(36);}
function hasPin(){return !!localStorage.getItem(PIN_KEY);}
function checkPin(buf){
  var stored=localStorage.getItem(PIN_KEY)||'';
  if(!stored)return true;
  // compat: PIN antigo gravado em texto puro
  if(stored.charAt(0)!=='h')return buf===stored;
  return pinHash(buf)===stored;
}
function setPin(buf){localStorage.setItem(PIN_KEY,pinHash(buf));}

// Loan balance helpers
function getBalance(loan){
  if(loan.parcelas&&loan.parcelas.length){
    return parseFloat(loan.parcelas.filter(function(p){return!p.paid;}).reduce(function(s,p){return s+(p.currentAmount||0);},0).toFixed(2));
  }
  var paid=(loan.payments||[]).reduce(function(s,p){return s+(p.value||0);},0);
  return Math.max(0,parseFloat((loan.currentAmount-paid).toFixed(2)));
}
function syncParceledLoan(l){
  if(!l.parcelas||!l.parcelas.length)return;
  l.paid=l.parcelas.every(function(p){return p.paid;});
  l.currentAmount=parseFloat(l.parcelas.reduce(function(s,p){return s+(p.currentAmount||0);},0).toFixed(2));
  var un=l.parcelas.filter(function(p){return!p.paid;}).slice().sort(function(a,b){return new Date(a.dueDate+'T00:00:00')-new Date(b.dueDate+'T00:00:00');});
  if(un.length)l.dueDate=un[0].dueDate;
}
function accrueParcelas(){
  var changed=false, tocados=[];
  loans.forEach(function(l){
    if(!l.parcelas||!l.parcelas.length)return;
    l.parcelas.forEach(function(p){
      if(p.paid)return;
      var guard=0;
      while(daysUntil(p.dueDate)<0&&guard<600){
        var before=parseFloat(p.currentAmount)||0;
        var juros=parseFloat((before*(l.interest/100)).toFixed(2));
        p.currentAmount=parseFloat((before+juros).toFixed(2));
        p.dueDate=addDays(p.dueDate,30);
        l.history=l.history||[];
        // rate: congela a taxa usada AGORA, para o passado nao mudar se a taxa mudar
        l.history.push({date:today(),type:'renovacao',value:before,rate:l.interest,note:'Parcela '+p.n+': juros '+l.interest+'%: +'+fmt(juros)+'. Novo saldo da parcela: '+fmt(p.currentAmount)});
        changed=true;guard++;
        if(tocados.indexOf(l.id)<0)tocados.push(l.id);
      }
    });
    syncParceledLoan(l);
  });
  // Marca sujo SO o emprestimo que rendeu juro. Antes isto era save() sem
  // argumento, que marcava a base inteira e fazia este aparelho vencer a
  // nuvem na fusao — foi assim que o celular e o computador se separaram.
  if(changed)save(tocados);
  return changed;
}
function payParcela(loanId,pid){
  var l=loans.find(function(x){return x.id===loanId;});if(!l||!l.parcelas)return;
  var p=l.parcelas.find(function(x){return x.id===pid;});if(!p||p.paid)return;
  p.paid=true;p.paidDate=today();
  l.history=l.history||[];
  l.history.push({date:today(),type:'pagamento_final',value:p.currentAmount,note:'Parcela '+p.n+'/'+l.parcelas.length+' paga'});
  syncParceledLoan(l);
  save(loanId);renderAll();
  showToast('✅ Parcela '+p.n+' paga ('+fmt(p.currentAmount)+')');
}

// Total recebido do cliente ao longo de toda a vida do emprestimo (historico +

// Capital realmente emprestado (nao muda em renovacoes)
function loanPrincipal(loan){

// ============================================================
// RAZÃO (ledger) — a ÚNICA fonte de verdade financeira do app
// ============================================================
// POR QUE ISTO EXISTE. Antes o juro recebido saía de min(recebido, cobrado),
// comparando dois acumulados. Isso errava por três motivos:
//   1) ORDEM NO MESMO DIA. Ao renovar, o app grava o pagamento e a renovação
//      com a MESMA data. O filtro por data não distinguia os dois, então o juro
//      do mês seguinte entrava na conta ANTES do pagamento que veio primeiro —
//      e o pagamento era classificado como juro quando na verdade abateu capital.
//   2) TAXA DE HOJE SOBRE TODO O PASSADO. Mudar o juro de um cliente reescrevia
//      o lucro de meses já fechados.
//   3) FATIA MENSAL ERRADA. A diferença de dois min() não é o juro que de fato
//      entrou dentro da janela.
// Agora percorremos os eventos um a um, na ordem real dos fatos, e cada
// pagamento é dividido NA HORA entre juro pendente e abatimento de capital.
//
// LIMITE CONHECIDO (importante): lançamentos ANTIGOS não têm o campo `rate`.
// Para eles o ledger usa a taxa atual (loan.interest) — não há como recuperar a
// taxa que valia na época, essa informação nunca foi gravada. A partir de agora
// toda entrada nova de emprestimo/renovacao grava `rate`, então daqui pra frente
// o passado para de se mexer quando a taxa do cliente muda.

// Arredondamento para centavos. Equivale a parseFloat(x.toFixed(2)) — a
// convenção que o app usa em todo lugar — mas ~6x mais rápido, o que importa
// porque isto roda dezenas de milhares de vezes ao desenhar o painel. O sinal
// separado mantém o "meio pra longe do zero" que o toFixed faz (Math.round
// sozinho arredondaria -0,125 para -0,12 em vez de -0,13).
function _r2(n){n=Number(n)||0;return (n<0?-Math.round(-n*100):Math.round(n*100))/100;}
// Ordem dos fatos DENTRO do mesmo dia: o cliente paga, o desconto é aplicado,
// e só então o saldo rola cobrando o juro do mês seguinte.
function _ledgerOrdem(t){
  t=t||'';
  if(t==='estorno')return 0;
  if(t.indexOf('pagamento')>=0)return 1;
  if(t==='desconto')return 2;
  if(t==='ajuste')return 3;
  if(t==='emprestimo'||t==='empréstimo')return 4;
  if(t==='renovacao')return 5;
  return 6;                                  // tipo desconhecido vai por último
}
// Taxa do evento: a gravada no lançamento; sem ela, a taxa atual do empréstimo.
function _ledgerRate(loan,ev){
  var r=(ev&&ev.rate!=null&&ev.rate!=='')?ev.rate:(loan?loan.interest:0);
  return (parseFloat(r)||0)/100;
}
// Cache: ledger() roda dentro de laços (calcStats, relatório, lista de clientes).
// A assinatura pega qualquer mexida que altere o cálculo; _ledgerGen é o martelo
// que save()/saveInad() batem para invalidar tudo de uma vez.
var _ledgerCache={},_ledgerGen=0;
function _ledgerInvalidate(){_ledgerGen++;_ledgerCache={};}
function _ledgerSig(loan){
  return [loan.interest,(loan.history||[]).length,(loan.payments||[]).length,
    loan.currentAmount,loan.paid?1:0,(loan.parcelas||[]).length,_ledgerGen].join('#');
}
function _ledgerVazio(){
  return {linhas:[],capitalEmprestado:0,recebidoTotal:0,jurosRecebido:0,capitalAbatido:0,
    jurosPendente:0,descontoTotal:0,saldo:0,emRisco:0};
}
function ledger(loan){
  if(!loan)return _ledgerVazio();
  var sig=_ledgerSig(loan);
  var hit=loan.id?_ledgerCache[loan.id]:null;
  if(hit&&hit.ref===loan&&hit.sig===sig)return hit.res;
  var res=_ledgerCalc(loan);
  if(loan.id)_ledgerCache[loan.id]={ref:loan,sig:sig,res:res};
  return res;
}
function _ledgerCalc(loan){
  // 1) juntar as fontes: o histórico + os pagamentos do período corrente
  //    (que ainda não foram fechados dentro de history).
  var eventos=[];
  (loan.history||[]).forEach(function(h){
    if(!h)return;
    eventos.push({date:h.date||'',type:h.type||'',value:parseFloat(h.value)||0,
      note:h.note||h.description||'',rate:h.rate,atual:false,
      pagamentoOriginal:h.pagamentoOriginal});
    // ESTORNO — leia com atenção, aqui mora uma armadilha.
    // estornoPagamento() APAGA o pagamento de loan.payments e grava só o rastro.
    // Ou seja: quando o ledger chega no 'estorno', o pagamento que ele deveria
    // desfazer nem existe mais na base. Desfazer assim mesmo contaria a volta
    // duas vezes (juro recebido negativo, saldo maior que o getBalance).
    // Solução: a partir de agora o estorno guarda uma cópia do pagamento
    // (h.pagamentoOriginal) dentro do próprio JSONB. Quando ela existe, o ledger
    // recria o pagamento na data original E aplica o estorno — os dois aparecem
    // no extrato, nada some, e a conta fecha em zero.
    // Quando ela NÃO existe (estornos antigos, já gravados antes desta versão),
    // o estorno é só rastro: não mexe em dinheiro nenhum, porque o pagamento já
    // foi removido da base e a baixa já está refletida no saldo.
    if(h.type==='estorno'&&h.pagamentoOriginal){
      var po=h.pagamentoOriginal;
      var pd=po.date||h.date||'';
      eventos.push({date:pd,type:'pagamento_parcial',
        value:parseFloat(po.value)||0,note:po.note||'',rate:null,atual:false,estornado:true,
        // Quando o pagamento e o estorno caem no MESMO dia (o caso normal: o
        // dono percebe o erro na hora), o pagamento tem que vir antes do seu
        // próprio estorno — senão o extrato mostra um saldo que nunca existiu.
        _ordem:(pd===h.date)?-1:null});
    }
  });
  (loan.payments||[]).forEach(function(p){
    if(!p)return;
    eventos.push({date:p.date||'',type:'pagamento_parcial',value:parseFloat(p.value)||0,
      note:p.note||'',rate:null,atual:true});
  });
  // 2) ordenar por data e, no mesmo dia, pela ordem real dos fatos (estável).
  //    A chave de ordem sai uma vez por evento — dentro do comparador ela seria
  //    recalculada umas 5x por evento a cada painel.
  eventos.forEach(function(e,i){e._i=i;e._o=(e._ordem==null)?_ledgerOrdem(e.type):e._ordem;});
  eventos.sort(function(a,b){
    if(a.date!==b.date)return (a.date<b.date)?-1:1;
    if(a._o!==b._o)return a._o-b._o;
    return a._i-b._i;                        // desempate estável
  });
  // 3) percorrer
  // R e um atalho local para _r2: o arredondamento roda ~7x por evento e a
  // busca do nome global custa caro num laco desse tamanho.
  var R=_r2;
  var jurosPendente=0,capitalEmprestado=0,jurosRecebido=0,capitalAbatido=0,
      recebidoTotal=0,descontoTotal=0,saldo=0,periodo=1;
  var linhas=eventos.map(function(e){
    var r=_ledgerRate(loan,e),t=e.type||'',V=R(e.value);
    var linha={data:e.date,tipo:t,rotulo:'',valor:V,sinal:'',parteJuros:0,parteCapital:0,
      juroCobrado:0,saldoDepois:0,nota:e.note,atual:!!e.atual,periodo:periodo,
      estornado:!!e.estornado};
    if(t==='emprestimo'||t==='empréstimo'){
      var jn=R(V*r);
      capitalEmprestado=R(capitalEmprestado+V);
      jurosPendente=R(jurosPendente+jn);
      saldo=R(saldo+V+jn);
      linha.rotulo='Emprestei';linha.sinal='-';linha.juroCobrado=jn;
    }else if(t==='renovacao'){
      // Rolagem do saldo: cobra o juro do mês seguinte. NÃO é dinheiro que sai
      // nem que entra — por isso não leva sinal e não mexe em capital.
      var jr=R(V*r);
      jurosPendente=R(jurosPendente+jr);
      saldo=R(saldo+jr);
      linha.rotulo='Rolou para o mês seguinte';linha.sinal='';linha.juroCobrado=jr;
      periodo++;                             // a renovação fecha um ciclo
    }else if(t.indexOf('pagamento')>=0){
      // O dinheiro paga primeiro o juro pendente; o que passa disso abate capital.
      var j=R(Math.min(V,jurosPendente));
      jurosPendente=R(jurosPendente-j);
      jurosRecebido=R(jurosRecebido+j);
      capitalAbatido=R(capitalAbatido+(V-j));
      recebidoTotal=R(recebidoTotal+V);
      saldo=R(saldo-V);
      linha.rotulo=(t==='pagamento_final'||t==='pagamento_total')?'Recebi (quitação)':'Recebi';
      linha.sinal='+';linha.parteJuros=j;linha.parteCapital=R(V-j);
    }else if(t==='desconto'){
      // Concessão: abate primeiro o juro pendente, o resto reduz o saldo.
      // NUNCA entra em jurosRecebido nem em recebidoTotal — não é dinheiro que entrou.
      var jd=R(Math.min(V,jurosPendente));
      jurosPendente=R(jurosPendente-jd);
      descontoTotal=R(descontoTotal+V);
      saldo=R(saldo-V);
      linha.rotulo='Desconto';linha.sinal='-';linha.juroCobrado=-jd;
    }else if(t==='estorno'){
      linha.rotulo='Estorno';linha.sinal='-';
      if(e.pagamentoOriginal){
        // Desfaz um pagamento: devolve na ordem INVERSA da alocação — primeiro o
        // capital abatido, depois o juro recebido (que volta a ficar pendente).
        var c=R(Math.min(V,capitalAbatido));
        capitalAbatido=R(capitalAbatido-c);
        var je=R(V-c);
        jurosRecebido=R(jurosRecebido-je);
        jurosPendente=R(jurosPendente+je);
        recebidoTotal=R(recebidoTotal-V);
        saldo=R(saldo+V);
        linha.parteJuros=je;linha.parteCapital=c;
      }else{
        // Estorno antigo, sem a cópia do pagamento: o pagamento já foi apagado
        // da base, então o dinheiro já saiu das contas. Aqui é só rastro.
        linha.somenteRastro=true;
      }
    }else if(t==='ajuste'){
      // Correção de um lançamento errado (saveEdit). Coerente com o que o app já
      // faz: mexe no capital e no saldo, mas NÃO gera juro pendente novo —
      // não é dinheiro novo emprestado, é conserto de digitação.
      capitalEmprestado=R(capitalEmprestado+V);
      saldo=R(saldo+R(V*(1+r)));
      linha.rotulo='Ajuste';linha.sinal='';
    }else{
      // Tipo desconhecido: não mexe em nada, mas aparece no extrato para não
      // sumir da vista do dono.
      linha.rotulo='Outro lançamento';linha.tipo='outro';linha.sinal='';
    }
    linha.saldoDepois=saldo;
    return linha;
  });
  // 4) O saldo do ledger tem que bater com getBalance(). Para o emprestimo
  //    PARCELADO o saldo mora nas parcelas (cada uma rola sozinha), então o
  //    extrato continua valendo mas o saldo vem de getBalance() — é ele quem
  //    manda. Para o não parcelado, o clamp em zero espelha o getBalance().
  var parcelado=!!(loan.parcelas&&loan.parcelas.length);
  var saldoFinal=parcelado?getBalance(loan):R(Math.max(0,saldo));
  return {
    linhas:linhas,
    capitalEmprestado:capitalEmprestado,
    recebidoTotal:recebidoTotal,
    jurosRecebido:jurosRecebido,
    capitalAbatido:capitalAbatido,
    jurosPendente:jurosPendente,
    descontoTotal:descontoTotal,
    saldo:saldoFinal,
    emRisco:R(Math.max(0,capitalEmprestado-recebidoTotal))
  };
}
// ===== Funções derivadas — todas saem do ledger =====
// Juros recebido dentro de um período [start, end) — datas no formato YYYY-MM-DD.
// Soma a parte de juro dos pagamentos da janela e DESCONTA os estornos da janela
// (senão um pagamento estornado no mesmo mês continuaria inflando o lucro do mês).
function jurosRecPeriodo(loan,start,end){
  return _r2(ledger(loan).linhas.reduce(function(s,l){
    var d=l.data;
    if(!d)return s;
    if(start&&d<start)return s;              // janela [start, end): fim exclusivo
    if(end&&!(d<end))return s;
    if(l.tipo&&l.tipo.indexOf('pagamento')>=0)return s+l.parteJuros;
    if(l.tipo==='estorno')return s-l.parteJuros;
    return s;
  },0));
}
// Juros recebido na vida toda (Relatório, cartão do cliente).
function loanJuros(loan){return ledger(loan).jurosRecebido;}
// ===== LEGADO — mantidos só para auditoria e para a bateria de testes =====
// NÃO use estes dois em cálculo financeiro novo: eles são justamente o modelo
// errado que o ledger substituiu (aplicam a taxa de hoje sobre todo o passado
// e não sabem a ordem dos fatos dentro do mesmo dia).
function _chargedBefore(loan,before){
  var rate=(loan.interest||0)/100;
  return (loan.history||[]).reduce(function(s,h){
    if(!h.type)return s;
    if(before&&!(h.date<before))return s;
    return (h.type==='emprestimo'||h.type==='renovacao')?s+(h.value||0)*rate:s;
  },0);
}
function _receivedBefore(loan,before){
  var h=(loan.history||[]).filter(function(e){return e.type&&e.type.indexOf('pagamento')>=0&&(!before||e.date<before);}).reduce(function(s,e){return s+(e.value||0);},0);
  var p=(loan.payments||[]).filter(function(e){var d=e.date||today();return !before||d<before;}).reduce(function(s,e){return s+(e.value||0);},0);
  return h+p;
}
// Capital de fato emprestado num período: soma empréstimos e adições (dinheiro que saiu). NÃO conta renovação.
function capitalNoPeriodo(start,end){
  return allRecords().reduce(function(s,l){
    return s+(l.history||[]).reduce(function(a,h){
      return (h.type==='emprestimo'&&(!start||h.date>=start)&&(!end||h.date<end))?a+(h.value||0):a;
    },0);
  },0);
}
// ===== DESCONTO NEGOCIADO =====
// Regra do proprietario: o juro continua sendo o do mes cheio. O desconto e uma
// concessao registrada — ele ABATE o saldo devedor e NADA MAIS:
//  - NAO entra em _receivedBefore()  (nao e dinheiro recebido, nao vira "juros ganho")
//  - NAO entra em _chargedBefore()   (nao muda o juro cobrado)
//  - NAO entra em capitalNoPeriodo() (nao e dinheiro que saiu do caixa)
// Isso ja vale automaticamente porque essas tres funcoes filtram por tipo
// ('pagamento*', 'emprestimo', 'renovacao') e 'desconto' nao casa com nenhum.
function loanDescontos(loan){return ledger(loan).descontoTotal;}
// ============================================================
// MEMÓRIA DA TAXA E PERFIL DO CLIENTE — deduzidos, nunca digitados
// ============================================================
// POR QUE DEDUZIR EM VEZ DE GUARDAR. Não há como criar coluna nova no banco,
// mas mesmo se houvesse: um campo "taxa do cliente" preenchido à mão desatualiza
// no dia em que o dono empresta com outra taxa e esquece de editar o cadastro.
// O histórico, esse, nunca mente — ele É o que aconteceu. Então tudo aqui sai de
// allRecords() e do ledger, e se corrige sozinho no próximo empréstimo.

// Data do evento mais recente do histórico — só para desempatar dois empréstimos
// que começaram no MESMO dia (acontece quando o dono lança dois de uma vez).
function _ultimoEventoData(l){
  var d='';
  ((l&&l.history)||[]).forEach(function(h){if(h&&h.date&&h.date>d)d=h.date;});
  return d;
}
// Dia em que o dinheiro de fato saiu. CUIDADO: loan.startDate NÃO serve para
// isso — doRenew() o reescreve para hoje a cada renovação, então num empréstimo
// renovado ele é a data da última rolagem, não a do empréstimo. O lançamento
// 'emprestimo' no histórico, esse, nunca se move. Só cai no startDate em
// registro antigo que não tem esse lançamento.
function _dataDoEmprestimo(l){
  var d='';
  ((l&&l.history)||[]).forEach(function(h){
    if(!h||!h.date)return;
    if(h.type!=='emprestimo'&&h.type!=='empréstimo')return;
    if(!d||h.date<d)d=h.date;                 // o primeiro desembolso
  });
  return d||((l&&l.startDate)||'');
}
// Qual taxa este cliente costuma pagar? Vale a do empréstimo MAIS RECENTE —
// é a última decisão que o dono tomou sobre ele. `varias` avisa que o histórico
// não é unânime, para o app não fingir uma certeza que não tem.
// Devolve {taxa, quando, varias, taxas[]} ou null se o cliente é novo.
function clientRate(nome){
  var k=clientKey(nome);
  if(!k)return null;
  var melhor=null,vistas={};
  allRecords().forEach(function(l){
    if(!l||clientKey(l.name)!==k)return;
    var t=parseFloat(l.interest);
    if(isNaN(t))return;                       // registro sem taxa não opina
    vistas[t]=1;
    // A ESCOLHA é pelo startDate (o registro mexido mais recentemente); a DATA
    // MOSTRADA é a do desembolso, que não se move quando o empréstimo rola.
    var ord=l.startDate||'',ult=_ultimoEventoData(l);
    if(!melhor||ord>melhor.ord||(ord===melhor.ord&&ult>melhor.ult))
      melhor={taxa:t,ord:ord,ult:ult,quando:_dataDoEmprestimo(l)};
  });
  if(!melhor)return null;
  var taxas=Object.keys(vistas).map(Number).sort(function(a,b){return a-b;});
  return {taxa:melhor.taxa,quando:melhor.quando,varias:taxas.length>1,taxas:taxas};
}
// Formata uma taxa sem casas decimais inúteis: 25 -> "25%", 27.5 -> "27,5%".
function _fmtTaxa(t){
  t=parseFloat(t)||0;
  return (Math.round(t*10)/10).toString().replace('.',',')+'%';
}
// Primeiro nome, para a faixa do formulário não virar um parágrafo.
function _primeiroNome(n){return String(n||'').trim().split(/\s+/)[0]||'';}
// PERFIL: o dono tem dois tipos de cliente na cabeça — o que rola o juro para
// sempre e o que vai abatendo. Isto lê o comportamento em vez de perguntar.
// Corte de 5%: abaixo disso o capital praticamente não andou.
// Só classifica quem já renovou; sem renovação não há comportamento, seria chute.
function clientPerfil(key){
  var k=clientKey(key);
  var cap=0,abat=0,renov=0,naRua=0,jurosMes=0;
  allRecords().forEach(function(l){
    if(!l||clientKey(l.name)!==k)return;
    var g=ledger(l);
    cap=_r2(cap+g.capitalEmprestado);
    abat=_r2(abat+g.capitalAbatido);
    renov+=loanRenovacoes(l);
    if(l.paid)return;                         // quitado não rende mais nem está na rua
    naRua=_r2(naRua+Math.max(0,g.capitalEmprestado-g.capitalAbatido));
    jurosMes=_r2(jurosMes+_juroDoPeriodoAtual(g));
  });
  var pct=cap>0?(abat/cap):0;
  var r={capital:cap,abatido:abat,renovacoes:renov,naRua:naRua,jurosMes:jurosMes,
    tipo:'novo',rotulo:'',frase:''};
  if(renov>=2&&pct<0.05){
    r.tipo='so_juro';r.rotulo='Paga só o juro';
    r.frase='Renovou '+renov+' vez'+(renov>1?'es':'')+' sem abater a dívida. Rende '
      +fmt(jurosMes)+' por mês, mas os '+fmt(naRua)+' seguem na rua.';
  }else if(pct>=0.05&&renov>=1){
    r.tipo='amortiza';r.rotulo='Vai abatendo';
    r.frase='Já abateu '+fmt(abat)+' da dívida. O juro do mês vai caindo junto.';
  }
  return r;
}
// Juro cobrado no ciclo aberto: o juroCobrado do último 'emprestimo'/'renovacao'
// do razão. Vem do ledger e NÃO cai a zero quando o cliente já pagou o juro do
// mês (jurosPendente cairia, e a frase diria "rende R$ 0,00 por mês" — mentira).
function _juroDoPeriodoAtual(g){
  var linhas=(g&&g.linhas)||[];
  for(var i=linhas.length-1;i>=0;i--){
    var t=linhas[i].tipo;
    if(t==='renovacao'||t==='emprestimo'||t==='empréstimo')return _r2(linhas[i].juroCobrado);
  }
  return 0;
}
// ============================================================
// PRÉVIA DA DIVISÃO DO PAGAMENTO — o que é juro, o que abate
// ============================================================
// Antes de gravar, mostra ao dono exatamente a mesma conta que o razão vai fazer
// depois: o dinheiro cobre primeiro o juro pendente, o que sobra abate o capital
// (a regra está em _ledgerCalc, no ramo 'pagamento'). Por isso a prévia sai DO
// ledger — se ela divergir do que fica gravado, é bug, não arredondamento.
// Devolve {juro, capital, faltaJuro, saldoDepois, texto}; texto vazio se não há
// o que prever (valor <= 0, ou empréstimo parcelado, onde o saldo mora nas
// parcelas e esta divisão não descreve o que acontece).
function previaPagamento(loan,valor){
  var vazio={juro:0,capital:0,faltaJuro:0,saldoDepois:0,texto:''};
  var v=_r2(valor);
  if(!loan||v<=0)return vazio;
  if(loan.parcelas&&loan.parcelas.length)return vazio;
  var g=ledger(loan);
  var jp=_r2(g.jurosPendente);
  var juro=_r2(Math.min(v,jp));
  var capital=_r2(v-juro);
  var falta=_r2(Math.max(0,jp-v));
  // A DIVISÃO (juro x abatimento) sai do razão — é ela que vai ficar gravada.
  // Já o "novo saldo" sai de getBalance(), que é o número que o dono vê no
  // cartão um segundo depois de confirmar. Em dados coerentes os dois são o
  // mesmo (ledger.saldo é definido como getBalance); em base antiga torta, o
  // certo é a prévia bater com a tela, não com a teoria.
  var saldoDepois=_r2(Math.max(0,getBalance(loan)-v));
  var texto;
  if(jp<=0)texto=fmt(v)+' abate a dívida inteiro · novo saldo '+fmt(saldoDepois);
  else if(v<jp)texto=fmt(v)+' vai todo para o juro · ainda faltam '+fmt(falta)+' de juro';
  else if(capital<=0)texto=fmt(v)+' cobre exatamente o juro · novo saldo '+fmt(saldoDepois);
  else texto=fmt(juro)+' cobre o juro · '+fmt(capital)+' abate a dívida · novo saldo '+fmt(saldoDepois);
  return {juro:juro,capital:capital,faltaJuro:falta,saldoDepois:saldoDepois,texto:texto};
}
// ============================================================
// CAPITAL RECUPERADO — "quanto do meu bolso ainda está exposto aqui"
// ============================================================
// O dono pensa em caixa, não em saldo devedor. Este bloco responde a pergunta
// dele com três fatos já acontecidos (nada de projeção): quanto saiu do bolso,
// quanto já voltou e quanto ainda falta voltar para ele não ter mais nada a
// perder. A barra é recebido/emprestado travada em 100% — quem já devolveu mais
// do que saiu não "enche demais"; o excedente é juro e aparece no juro ganho.
// Os três números em linhas de tabela (não em cartão dentro de cartão), com a
// barra de recuperação embaixo. Só desenha: as contas vêm prontas de quem chama.
function _capitalBox(cap,rec,risco){
  cap=_r2(cap);rec=_r2(rec);risco=_r2(risco);
  var pct=cap>0?Math.min(100,Math.round((rec/cap)*100)):(rec>0?100:0);
  var corpo=kv('Tirei do bolso',din(cap,13.5))
    + kv('Já voltou',din(rec,13.5,'var(--gr)'))
    + kv('Ainda em risco',din(risco,15.5,risco>0?'var(--am)':'var(--gr)'),true);
  if(cap>0&&risco<=0){
    corpo+='<div style="padding:12px 14px;font-size:12.5px;font-weight:600;color:var(--gr)">'
      +'✓ Capital recuperado — daqui pra frente é só ganho</div>';
  }else if(cap>0){
    corpo+='<div style="padding:12px 14px">'
      +'<div style="height:7px;background:var(--pn2);border-radius:4px;overflow:hidden">'
      +'<div style="height:100%;width:'+pct+'%;background:var(--am);border-radius:4px"></div></div>'
      +'<div style="font-size:12.5px;color:var(--dim);margin-top:8px;font-weight:600">'
      +'Faltam '+fmt(risco)+' para você não ter mais nada a perder com este cliente.</div></div>';
  }
  return '<div class="bloco">'+corpo+'</div>';
}
function descontosPeriodo(loan,from,to){
  return (loan&&loan.history||[]).reduce(function(s,h){
    return (h.type==='desconto'&&inRange(h.date,from,to))?s+(h.value||0):s;
  },0);
}
// Aplica o desconto no registro (nao salva nem redesenha — quem chama decide).
// Se o desconto zerar o saldo, o emprestimo e encerrado por acordo.
function _regDesconto(loan,valor,motivo){
  valor=parseFloat((parseFloat(valor)||0).toFixed(2));
  if(!loan||valor<=0)return 0;
  loan.currentAmount=parseFloat(Math.max(0,(loan.currentAmount||0)-valor).toFixed(2));
  loan.history=loan.history||[];
  loan.history.push({type:'desconto',date:today(),value:valor,note:(motivo||'').trim()||'Desconto negociado'});
  if(getBalance(loan)<=0.009){
    _histPagamentosPeriodo(loan);      // preserva o que ja tinha sido pago no periodo
    loan.currentAmount=0;loan.paid=true;
    loan.history.push({type:'ajuste',date:today(),value:0,note:'Saldo zerado pelo desconto — dívida encerrada por acordo.'});
  }
  return valor;
}
// Datas / intervalos para o relatorio
function dStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function inRange(ds,from,to){if(!ds)return false;if(from&&ds<from)return false;if(to&&ds>to)return false;return true;}
function loanActiveInRange(l,from,to){if(!from&&!to)return true;if(inRange(l.startDate,from,to))return true;if((l.history||[]).some(function(h){return inRange(h.date,from,to);}))return true;return(l.payments||[]).some(function(p){return inRange(p.date,from,to);});}
function clientEvents(ls,from,to){var ev=[];ls.forEach(function(l){(l.history||[]).forEach(function(h){var t=h.type||'';var kind=(t.indexOf('emprest')>=0)?'borrow':(t.indexOf('pagamento')>=0||t==='pay')?'pay':(t.indexOf('renov')>=0||t==='renew')?'renew':'other';if((!from&&!to)||inRange(h.date,from,to))ev.push({date:h.date,kind:kind,value:h.value||0});});(l.payments||[]).forEach(function(p){if((!from&&!to)||inRange(p.date,from,to))ev.push({date:p.date,kind:'pay',value:p.value||0});});});ev.sort(function(a,b){return new Date(b.date+'T00:00:00')-new Date(a.date+'T00:00:00');});return ev;}
// Juros composto automatico dos inadimplentes: a cada mes vencido, rola +30 dias e acumula juros sobre o saldo
function accrueInadimplentes(){var changed=false,tocados=[];(inadimplentes||[]).forEach(function(i){if(i.interest==null||!i.dueDate)return;var guard=0;while(daysUntil(i.dueDate)<0&&guard<600){var before=parseFloat(i.currentAmount)||0;var juros=parseFloat((before*(i.interest/100)).toFixed(2));i.currentAmount=parseFloat((before+juros).toFixed(2));i.dueDate=addDays(i.dueDate,30);i.history=i.history||[];i.history.push({date:today(),type:'renovacao',value:before,rate:i.interest,note:'Juros de inadimplencia '+i.interest+'%: +'+fmt(juros)+'. Novo saldo: '+fmt(i.currentAmount)});i.lastAccrual=today();changed=true;if(tocados.indexOf(i.id)<0)tocados.push(i.id);guard++;}});if(changed)saveInad(tocados);return changed;}
// Link WhatsApp sem duplicar o DDI 55
function waLink(phone){
  var p=(phone||'').replace(/\D/g,'');
  if(!p)return 'https://wa.me/';
  if(p.length>11&&p.indexOf('55')===0)return 'https://wa.me/'+p;
  return 'https://wa.me/55'+p;
}

// NAVEGAÇÃO — quatro abas e três telas empilhadas
// ============================================================
// Abas: home (Carteira) · clients · report (Números) · conta
// Empilhadas (com voltar): cliente (ficha) · receber · (o formulário é janela)
var ABAS=['home','clients','report','conta'];
var TELAS=['home','clients','cliente','receber','report','conta'];
var TITULO={home:'Carteira',clients:'Clientes',report:'Números',conta:'Conta',
            cliente:'Cliente',receber:'Receber'};

var receberId=null;         // empréstimo aberto na tela Receber
var _voltarPara='clients';  // para onde o botão de voltar leva

function goScreen(name){
  if(TELAS.indexOf(name)<0)name='home';
  if(typeof _fecharTeclado==='function')_fecharTeclado(); // trocar de tela desce o teclado
  currentScreen=name;
  var i,el;
  for(i=0;i<TELAS.length;i++){
    el=document.getElementById('screen-'+TELAS[i]);
    if(el&&el.classList)el.classList[TELAS[i]===name?'add':'remove']('active');
  }
  // aba acesa: as telas empilhadas mantêm acesa a aba de onde vieram
  var aba=(name==='cliente'||name==='receber')?'clients':name;
  for(i=0;i<ABAS.length;i++){
    var on=(ABAS[i]===aba)?'page':'false';
    el=document.getElementById('nav-'+ABAS[i]);
    if(el&&el.setAttribute)el.setAttribute('aria-current',on);
    el=document.getElementById('menu-'+ABAS[i]);
    if(el&&el.setAttribute)el.setAttribute('aria-current',on);
  }
  pintarTopo();
  if(name==='home')renderHome();
  if(name==='clients')renderLoanList(_searchQuery);
  if(name==='report')renderReport();
  if(name==='cliente')renderCliente();
  if(name==='receber')renderReceber();
  if(name==='conta')renderConta();
  if(typeof window!=='undefined'&&window.scrollTo)window.scrollTo(0,0);
  var cm=document.querySelector&&document.querySelector('.col-main');
  if(cm&&cm.scrollTo)cm.scrollTo(0,0);
}
// Cabeçalho: título da tela, botão de voltar só onde há para onde voltar.

      b=document.getElementById('btn-voltar');

  if(t)t.textContent=empilhada?(currentScreen==='receber'?'Receber':(_nomeDoCliente(clienteAtual)||'Cliente'))
                              :(TITULO[currentScreen]||'Empréstimos');

                    :(currentScreen==='home'?'Controle de empréstimos':'');

  pedirConfirmacao({titulo:'Excluir este empréstimo?',
    texto:(alvo?esc(alvo.name)+' · saldo '+fmt(getBalance(alvo))+'.\n':'')
      +'O lançamento sai da sua carteira e da nuvem. Essa ação não pode ser desfeita.',
    ok:'Excluir',perigo:true},function(){_deleteLoanExec(id);});
}
function _deleteLoanExec(id){
  var l=loans.find(function(x){return x.id===id;});
  if(l){if(!isDataUrl(l.docRG))docDel(l.docRG);if(!isDataUrl(l.docResidencia))docDel(l.docResidencia);}
  loans=loans.filter(function(l){return l.id!==id;});
  addTombstone('emprestimos',id); // unica coisa que autoriza apagar na nuvem
  delete expandedCards[id];
  deleteConfirm=null;
  save([]);renderAll();   // [] de proposito: o id virou tombstone, nao pode ser marcado sujo
  showToast('🗑️ Empréstimo excluído');
}

function doInlinePay(id,bal){
  var loan=loans.find(function(l){return l.id===id;});
  if(!loan)return;
  loan.history=loan.history||[];
  // preserva os pagamentos parciais ja feitos neste periodo
  (loan.payments||[]).forEach(function(p){loan.history.push({date:p.date,type:'pagamento_parcial',value:p.value,note:p.note||''});});
  loan.history.push({type:'pagamento_final',date:today(),value:bal,description:'Pagamento total',note:'Dívida quitada'});
  loan.paid=true;
  loan.currentAmount=0;
  loan.payments=[];
  payingLoan=null;
  delete expandedCards[id];
  save(id);renderAll();
  showToast('✅ '+fmt(bal)+' — quitado!');
}
function doInlinePayPartial(id){
  var loan=loans.find(function(l){return l.id===id;});
  if(!loan)return;
  var inp=document.getElementById('partial-'+id);
  var val=parseFloat((inp?inp.value:0)||0);
  if(!val||val<=0){showToast('⚠️ Digite o valor parcial');return;}
  var bal=getBalance(loan);
  if(val>=bal){doInlinePay(id,bal);return;}
  loan.payments=loan.payments||[];
  loan.payments.push({id:'p'+Date.now(),date:today(),value:val,note:'Pagamento parcial'});
  payingLoan=null;
  save(id);renderAll();
  showToast('✅ '+fmt(val)+' registrado · restam '+fmt(getBalance(loan)));
}

// Os juros automaticos (parcela vencida e inadimplente) SO podem rodar depois
// que os dados de verdade chegaram. Rodar no cache velho, antes da fusao, era o
// que fazia um aparelho lancar juro em cima de saldo desatualizado e depois
// empurrar isso por cima do outro.
function accrueTudo(){
  var a=accrueInadimplentes();
  var b=accrueParcelas();
  return a||b;
}
function initApp(){
  load();                 // carrega o cache do aparelho (instantâneo)
  migrateDocsToIDB();
  if(!cloudOn){
    // biblioteca da nuvem não carregou: modo offline (só o aparelho)
    accrueTudo();         // sem nuvem, o cache é a única verdade que existe
    enterApp();
    setTimeout(function(){showToast('Sem nuvem agora — usando dados do aparelho.','warn');},800);
    return;
  }
  // Verifica se já existe sessão (login salvo). Se sim, entra; se não, pede login.
  sb.auth.getSession().then(function(res){
    var sess=res&&res.data&&res.data.session;
    if(sess){
      cloudUser=sess.user.id;
      cloudEmail=sess.user.email||'';
      enterApp();      // mostra já com o cache
      cloudPull();     // e atualiza com a nuvem
    }else{
      showLogin('');
    }
  }).catch(function(){
    // Sem internet para validar a sessão: deixa usar offline com o cache
    accrueTudo();
    enterApp();
    setTimeout(function(){showToast('Sem conexão — usando dados do aparelho.','warn');},800);
  });
}

  var el=document.getElementById('pin-overlay');if(el)el.remove();
  pinBuffer='';pinNewTemp='';
}
function pinPress(v){
  if(pinLockedSecs()>0)return;                          // teclado travado
  if(v==='⌫')pinBuffer=pinBuffer.slice(0,-1);
  else{if(pinBuffer.length>=4)return;pinBuffer+=v;}
  for(var i=0;i<4;i++){var d=document.getElementById('pd-'+i);if(d)d.classList.toggle('filled',i<pinBuffer.length);}
  if(pinBuffer.length===4)setTimeout(pinSubmit,220);
}
function pinSubmit(){
  if(pinMode==='check'){
    if(pinLockedSecs()>0){pinBuffer='';return;}
    if(checkPin(pinBuffer)){
      pinFails=0;pinLockUntil=0;
      var el=document.getElementById('pin-overlay');if(el)el.remove();
      _showApp();
    }else{
      pinFails++;
      if(pinFails>=PIN_MAX_FAILS){
        pinFails=0;pinLockUntil=Date.now()+PIN_LOCK_MS;
        showPinScreen('check','');
        _pinStartLockTimer();
      }else{
        var rest=PIN_MAX_FAILS-pinFails;
        showPinScreen('check','PIN incorreto — '+rest+' tentativa'+(rest>1?'s':'')+' antes de travar 30s');
      }
    }
  }else if(pinMode==='set'){
    pinNewTemp=pinBuffer;showPinScreen('confirm','');
  }else if(pinMode==='confirm'){
    if(pinBuffer===pinNewTemp){
      var el2=document.getElementById('pin-overlay');if(el2)el2.remove();
      setPin(pinBuffer);
      pinFails=0;pinLockUntil=0;
      showToast('🔐 PIN salvo!');closeModal();
    }else{showPinScreen('set','PINs diferentes');}
  }else if(pinMode==='remove'){
    if(checkPin(pinBuffer)){
      var el3=document.getElementById('pin-overlay');if(el3)el3.remove();
      localStorage.removeItem(PIN_KEY);
      pinFails=0;pinLockUntil=0;
      showToast('🔓 PIN removido');closeModal();
    }else{showPinScreen('remove','PIN incorreto');}
  }
}
