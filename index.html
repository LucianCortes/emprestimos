// ============================================================
// RAZÃO (ledger) — a ÚNICA fonte de verdade financeira do app
// ============================================================
// POR QUE ISTO EXISTE. Antes o juro recebido saía de min(recebido, cobrado),
// comparando dois acumulados. Isso errava por três motivos:
//   1) ORDEM NO MESMO DIA. Ao renovar, o app grava o pagamento e a renovação
//      com a MESMA data. O filtro por data não distinguia os dois, então o juro
//      do mês seguinte entrava na conta ANTES do pagamento que veio primeiro —
//      e o pagamento era classificado como juro quando na verdade abateu capital.
//   2) TAXA DE HOJE SOBRE TODO O PASSADO. Mudar o juro de um cliente reescrevia
//      o lucro de meses já fechados.
//   3) FATIA MENSAL ERRADA. A diferença de dois min() não é o juro que de fato
//      entrou dentro da janela.
// Agora percorremos os eventos um a um, na ordem real dos fatos, e cada
// pagamento é dividido NA HORA entre juro pendente e abatimento de capital.
//
// LIMITE CONHECIDO (importante): lançamentos ANTIGOS não têm o campo `rate`.
// Para eles o ledger usa a taxa atual (loan.interest) — não há como recuperar a
// taxa que valia na época, essa informação nunca foi gravada. A partir de agora
// toda entrada nova de emprestimo/renovacao grava `rate`, então daqui pra frente
// o passado para de se mexer quando a taxa do cliente muda.

// Arredondamento para centavos. Equivale a parseFloat(x.toFixed(2)) — a
// convenção que o app usa em todo lugar — mas ~6x mais rápido, o que importa
// porque isto roda dezenas de milhares de vezes ao desenhar o painel. O sinal
// separado mantém o "meio pra longe do zero" que o toFixed faz (Math.round
// sozinho arredondaria -0,125 para -0,12 em vez de -0,13).
function _r2(n){n=Number(n)||0;return (n<0?-Math.round(-n*100):Math.round(n*100))/100;}
// Ordem dos fatos DENTRO do mesmo dia: o cliente paga, o desconto é aplicado,
// e só então o saldo rola cobrando o juro do mês seguinte.
function _ledgerOrdem(t){
  t=t||'';
  if(t==='estorno')return 0;
  if(t.indexOf('pagamento')>=0)return 1;
  if(t==='desconto')return 2;
  if(t==='ajuste')return 3;
  if(t==='emprestimo'||t==='empréstimo')return 4;
  if(t==='renovacao')return 5;
  return 6;                                  // tipo desconhecido vai por último
}
// Taxa do evento: a gravada no lançamento; sem ela, a taxa atual do empréstimo.
function _ledgerRate(loan,ev){
  var r=(ev&&ev.rate!=null&&ev.rate!=='')?ev.rate:(loan?loan.interest:0);
  return (parseFloat(r)||0)/100;
}
// Cache: ledger() roda dentro de laços (calcStats, relatório, lista de clientes).
// A assinatura pega qualquer mexida que altere o cálculo; _ledgerGen é o martelo
// que save()/saveInad() batem para invalidar tudo de uma vez.
var _ledgerCache={},_ledgerGen=0;
function _ledgerInvalidate(){_ledgerGen++;_ledgerCache={};}
function _ledgerSig(loan){
  return [loan.interest,(loan.history||[]).length,(loan.payments||[]).length,
    loan.currentAmount,loan.paid?1:0,(loan.parcelas||[]).length,_ledgerGen].join('#');
}
function _ledgerVazio(){
  return {linhas:[],capitalEmprestado:0,recebidoTotal:0,jurosRecebido:0,capitalAbatido:0,
    jurosPendente:0,descontoTotal:0,saldo:0,emRisco:0};
}
function ledger(loan){
  if(!loan)return _ledgerVazio();
  var sig=_ledgerSig(loan);
  var hit=loan.id?_ledgerCache[loan.id]:null;
  if(hit&&hit.ref===loan&&hit.sig===sig)return hit.res;
  var res=_ledgerCalc(loan);
  if(loan.id)_ledgerCache[loan.id]={ref:loan,sig:sig,res:res};
  return res;
}
function _ledgerCalc(loan){
  // 1) juntar as fontes: o histórico + os pagamentos do período corrente
  //    (que ainda não foram fechados dentro de history).
  var eventos=[];
  (loan.history||[]).forEach(function(h){
    if(!h)return;
    eventos.push({date:h.date||'',type:h.type||'',value:parseFloat(h.value)||0,
      note:h.note||h.description||'',rate:h.rate,atual:false,
      // capital: usado só pelo ramo 'ajuste' — é a diferença SEM o juro (ver C3).
      capital:h.capital,
      pagamentoOriginal:h.pagamentoOriginal});
    // ESTORNO — leia com atenção, aqui mora uma armadilha.
    // estornoPagamento() APAGA o pagamento de loan.payments e grava só o rastro.
    // Ou seja: quando o ledger chega no 'estorno', o pagamento que ele deveria
    // desfazer nem existe mais na base. Desfazer assim mesmo contaria a volta
    // duas vezes (juro recebido negativo, saldo maior que o getBalance).
    // Solução: a partir de agora o estorno guarda uma cópia do pagamento
    // (h.pagamentoOriginal) dentro do próprio JSONB. Quando ela existe, o ledger
    // recria o pagamento na data original E aplica o estorno — os dois aparecem
    // no extrato, nada some, e a conta fecha em zero.
    // Quando ela NÃO existe (estornos antigos, já gravados antes desta versão),
    // o estorno é só rastro: não mexe em dinheiro nenhum, porque o pagamento já
    // foi removido da base e a baixa já está refletida no saldo.
    if(h.type==='estorno'&&h.pagamentoOriginal){
      var po=h.pagamentoOriginal;
      var pd=po.date||h.date||'';
      eventos.push({date:pd,type:'pagamento_parcial',
        value:parseFloat(po.value)||0,note:po.note||'',rate:null,atual:false,estornado:true,
        // Quando o pagamento e o estorno caem no MESMO dia (o caso normal: o
        // dono percebe o erro na hora), o pagamento tem que vir antes do seu
        // próprio estorno — senão o extrato mostra um saldo que nunca existiu.
        _ordem:(pd===h.date)?-1:null});
    }
  });
  (loan.payments||[]).forEach(function(p){
    if(!p)return;
    eventos.push({date:p.date||'',type:'pagamento_parcial',value:parseFloat(p.value)||0,
      note:p.note||'',rate:null,atual:true});
  });
  // 2) ordenar por data e, no mesmo dia, pela ordem real dos fatos (estável).
  //    A chave de ordem sai uma vez por evento — dentro do comparador ela seria
  //    recalculada umas 5x por evento a cada painel.
  eventos.forEach(function(e,i){e._i=i;e._o=(e._ordem==null)?_ledgerOrdem(e.type):e._ordem;});
  eventos.sort(function(a,b){
    if(a.date!==b.date)return (a.date<b.date)?-1:1;
    if(a._o!==b._o)return a._o-b._o;
    return a._i-b._i;                        // desempate estável
  });
  // 3) percorrer
  // R e um atalho local para _r2: o arredondamento roda ~7x por evento e a
  // busca do nome global custa caro num laco desse tamanho.
  var R=_r2;
  var jurosPendente=0,capitalEmprestado=0,jurosRecebido=0,capitalAbatido=0,
      recebidoTotal=0,descontoTotal=0,saldo=0,periodo=1;
  var linhas=eventos.map(function(e){
    var r=_ledgerRate(loan,e),t=e.type||'',V=R(e.value);
    var linha={data:e.date,tipo:t,rotulo:'',valor:V,sinal:'',parteJuros:0,parteCapital:0,
      juroCobrado:0,saldoDepois:0,nota:e.note,atual:!!e.atual,periodo:periodo,
      estornado:!!e.estornado};
    if(t==='emprestimo'||t==='empréstimo'){
      var jn=R(V*r);
      capitalEmprestado=R(capitalEmprestado+V);
      jurosPendente=R(jurosPendente+jn);
      saldo=R(saldo+V+jn);
      linha.rotulo='Emprestei';linha.sinal='-';linha.juroCobrado=jn;
    }else if(t==='renovacao'){
      // Rolagem do saldo: cobra o juro do mês seguinte. NÃO é dinheiro que sai
      // nem que entra — por isso não leva sinal e não mexe em capital.
      var jr=R(V*r);
      jurosPendente=R(jurosPendente+jr);
      saldo=R(saldo+jr);
      linha.rotulo='Rolou para o mês seguinte';linha.sinal='';linha.juroCobrado=jr;
      periodo++;                             // a renovação fecha um ciclo
    }else if(t.indexOf('pagamento')>=0){
      // O dinheiro paga primeiro o juro pendente; o que passa disso abate capital.
      var j=R(Math.min(V,jurosPendente));
      jurosPendente=R(jurosPendente-j);
      jurosRecebido=R(jurosRecebido+j);
      capitalAbatido=R(capitalAbatido+(V-j));
      recebidoTotal=R(recebidoTotal+V);
      saldo=R(saldo-V);
      linha.rotulo=(t==='pagamento_final'||t==='pagamento_total')?'Recebi (quitação)':'Recebi';
      linha.sinal='+';linha.parteJuros=j;linha.parteCapital=R(V-j);
    }else if(t==='desconto'){
      // Concessão: abate primeiro o juro pendente, o resto reduz o saldo.
      // NUNCA entra em jurosRecebido nem em recebidoTotal — não é dinheiro que entrou.
      var jd=R(Math.min(V,jurosPendente));
      jurosPendente=R(jurosPendente-jd);
      descontoTotal=R(descontoTotal+V);
      saldo=R(saldo-V);
      linha.rotulo='Desconto';linha.sinal='-';linha.juroCobrado=-jd;
    }else if(t==='estorno'){
      linha.rotulo='Estorno';linha.sinal='-';
      if(e.pagamentoOriginal){
        // Desfaz um pagamento: devolve na ordem INVERSA da alocação — primeiro o
        // capital abatido, depois o juro recebido (que volta a ficar pendente).
        var c=R(Math.min(V,capitalAbatido));
        capitalAbatido=R(capitalAbatido-c);
        var je=R(V-c);
        jurosRecebido=R(jurosRecebido-je);
        jurosPendente=R(jurosPendente+je);
        recebidoTotal=R(recebidoTotal-V);
        saldo=R(saldo+V);
        linha.parteJuros=je;linha.parteCapital=c;
      }else{
        // Estorno antigo, sem a cópia do pagamento: o pagamento já foi apagado
        // da base, então o dinheiro já saiu das contas. Aqui é só rastro.
        linha.somenteRastro=true;
      }
    }else if(t==='ajuste'){
      // Correção de um lançamento errado (saveEdit). Coerente com o que o app já
      // faz: mexe no capital e no saldo, mas NÃO gera juro pendente novo —
      // não é dinheiro novo emprestado, é conserto de digitação.
      //
      // C3 — O VALOR GRAVADO JÁ VEM COM O JURO DENTRO.
      // saveEdit grava value = diferença × (1 + taxa/100). Aplicar a taxa OUTRA
      // VEZ aqui cobrava juro em cima de juro, e o extrato passava a mostrar um
      // saldo maior que o do cartão. Agora o saldo anda exatamente o valor
      // gravado — que é o mesmo que já foi somado ao currentAmount. Nada gravado
      // muda: só a conta do extrato passa a bater com a do cartão.
      //
      // O CAPITAL é outra coisa: `value` é capital + juro, e capital emprestado
      // é só a parte do capital. Lançamentos NOVOS gravam essa parte no campo
      // `capital`. Os ANTIGOS não têm esse campo, então deduzimos
      // V ÷ (1 + taxa/100) — a conta inversa EXATA da que gerou o valor, não é
      // chute: se o valor saiu de dif×(1+taxa), dividir por (1+taxa) devolve dif.
      // Esta derivação existe SÓ por causa dos lançamentos antigos; no dia em que
      // não houver mais nenhum sem o campo `capital`, ela pode sair daqui.
      var capAj=(e.capital!=null&&e.capital!=='')
        ? R(parseFloat(e.capital)||0)
        : R(V/(1+r));
      capitalEmprestado=R(capitalEmprestado+capAj);
      saldo=R(saldo+V);
      linha.rotulo='Ajuste';linha.sinal='';
    }else{
      // Tipo desconhecido: não mexe em nada, mas aparece no extrato para não
      // sumir da vista do dono.
      linha.rotulo='Outro lançamento';linha.tipo='outro';linha.sinal='';
    }
    linha.saldoDepois=saldo;
    return linha;
  });
  // 4) O saldo do ledger tem que bater com getBalance(). Para o emprestimo
  //    PARCELADO o saldo mora nas parcelas (cada uma rola sozinha), então o
  //    extrato continua valendo mas o saldo vem de getBalance() — é ele quem
  //    manda. Para o não parcelado, o clamp em zero espelha o getBalance().
  var parcelado=!!(loan.parcelas&&loan.parcelas.length);
  var saldoFinal=parcelado?getBalance(loan):R(Math.max(0,saldo));
  return {
    linhas:linhas,
    capitalEmprestado:capitalEmprestado,
    recebidoTotal:recebidoTotal,
    jurosRecebido:jurosRecebido,
    capitalAbatido:capitalAbatido,
    jurosPendente:jurosPendente,
    descontoTotal:descontoTotal,
    saldo:saldoFinal,
    emRisco:R(Math.max(0,capitalEmprestado-recebidoTotal))
  };
}
// ===== Funções derivadas — todas saem do ledger =====
// Juros recebido dentro de um período [start, end) — datas no formato YYYY-MM-DD.
// Soma a parte de juro dos pagamentos da janela e DESCONTA os estornos da janela
// (senão um pagamento estornado no mesmo mês continuaria inflando o lucro do mês).
function jurosRecPeriodo(loan,start,end){
  return _r2(ledger(loan).linhas.reduce(function(s,l){
    var d=l.data;
    if(!d)return s;
    if(start&&d<start)return s;              // janela [start, end): fim exclusivo
    if(end&&!(d<end))return s;
    if(l.tipo&&l.tipo.indexOf('pagamento')>=0)return s+l.parteJuros;
    if(l.tipo==='estorno')return s-l.parteJuros;
    return s;
  },0));
}
// Juros recebido na vida toda (Relatório, cartão do cliente).
function loanJuros(loan){return ledger(loan).jurosRecebido;}
// ===== LEGADO — mantidos só para auditoria e para a bateria de testes =====
// NÃO use estes dois em cálculo financeiro novo: eles são justamente o modelo
// errado que o ledger substituiu (aplicam a taxa de hoje sobre todo o passado
// e não sabem a ordem dos fatos dentro do mesmo dia).
function _chargedBefore(loan,before){
  var rate=(loan.interest||0)/100;
  return (loan.history||[]).reduce(function(s,h){
    if(!h.type)return s;
    if(before&&!(h.date<before))return s;
    return (h.type==='emprestimo'||h.type==='renovacao')?s+(h.value||0)*rate:s;
  },0);
}
function _receivedBefore(loan,before){
  var h=(loan.history||[]).filter(function(e){return e.type&&e.type.indexOf('pagamento')>=0&&(!before||e.date<before);}).reduce(function(s,e){return s+(e.value||0);},0);
  var p=(loan.payments||[]).filter(function(e){var d=e.date||today();return !before||d<before;}).reduce(function(s,e){return s+(e.value||0);},0);
  return h+p;
}
// Capital de fato emprestado num período: soma empréstimos e adições (dinheiro que saiu). NÃO conta renovação.
// C9 — o 3o argumento (opcional) limita a conta a uma lista de registros, para o
// relatorio poder somar so o que passou pelos filtros da tela. Sem ele a funcao
// continua se comportando como antes: a carteira inteira.
function capitalNoPeriodo(start,end,lista){
  return (lista||allRecords()).reduce(function(s,l){
    return s+(l.history||[]).reduce(function(a,h){
      return (h.type==='emprestimo'&&(!start||h.date>=start)&&(!end||h.date<end))?a+(h.value||0):a;
    },0);
  },0);
}
// ===== DESCONTO NEGOCIADO =====
// Regra do proprietario: o juro continua sendo o do mes cheio. O desconto e uma
// concessao registrada — ele ABATE o saldo devedor e NADA MAIS:
//  - NAO entra em _receivedBefore()  (nao e dinheiro recebido, nao vira "juros ganho")
//  - NAO entra em _chargedBefore()   (nao muda o juro cobrado)
//  - NAO entra em capitalNoPeriodo() (nao e dinheiro que saiu do caixa)
// Isso ja vale automaticamente porque essas tres funcoes filtram por tipo
// ('pagamento*', 'emprestimo', 'renovacao') e 'desconto' nao casa com nenhum.
function loanDescontos(loan){return ledger(loan).descontoTotal;}
// ============================================================
// MEMÓRIA DA TAXA E PERFIL DO CLIENTE — deduzidos, nunca digitados
// ============================================================
// POR QUE DEDUZIR EM VEZ DE GUARDAR. Não há como criar coluna nova no banco,
// mas mesmo se houvesse: um campo "taxa do cliente" preenchido à mão desatualiza
// no dia em que o dono empresta com outra taxa e esquece de editar o cadastro.
// O histórico, esse, nunca mente — ele É o que aconteceu. Então tudo aqui sai de
// allRecords() e do ledger, e se corrige sozinho no próximo empréstimo.

// Data do evento mais recente do histórico — só para desempatar dois empréstimos
// que começaram no MESMO dia (acontece quando o dono lança dois de uma vez).
function _ultimoEventoData(l){
  var d='';
  ((l&&l.history)||[]).forEach(function(h){if(h&&h.date&&h.date>d)d=h.date;});
  return d;
}
// Dia em que o dinheiro de fato saiu. CUIDADO: loan.startDate NÃO serve para
// isso — doRenew() o reescreve para hoje a cada renovação, então num empréstimo
// renovado ele é a data da última rolagem, não a do empréstimo. O lançamento
// 'emprestimo' no histórico, esse, nunca se move. Só cai no startDate em
// registro antigo que não tem esse lançamento.
function _dataDoEmprestimo(l){
  var d='';
  ((l&&l.history)||[]).forEach(function(h){
    if(!h||!h.date)return;
    if(h.type!=='emprestimo'&&h.type!=='empréstimo')return;
    if(!d||h.date<d)d=h.date;                 // o primeiro desembolso
  });
  return d||((l&&l.startDate)||'');
}
// Qual taxa este cliente costuma pagar? Vale a do empréstimo MAIS RECENTE —
// é a última decisão que o dono tomou sobre ele. `varias` avisa que o histórico
// não é unânime, para o app não fingir uma certeza que não tem.
// Devolve {taxa, quando, varias, taxas[]} ou null se o cliente é novo.
function clientRate(nome){
  var k=clientKey(nome);
  if(!k)return null;
  var melhor=null,vistas={};
  allRecords().forEach(function(l){
    if(!l||clientKey(l.name)!==k)return;
    var t=parseFloat(l.interest);
    if(isNaN(t))return;                       // registro sem taxa não opina
    vistas[t]=1;
    // A ESCOLHA é pelo startDate (o registro mexido mais recentemente); a DATA
    // MOSTRADA é a do desembolso, que não se move quando o empréstimo rola.
    var ord=l.startDate||'',ult=_ultimoEventoData(l);
    if(!melhor||ord>melhor.ord||(ord===melhor.ord&&ult>melhor.ult))
      melhor={taxa:t,ord:ord,ult:ult,quando:_dataDoEmprestimo(l)};
  });
  if(!melhor)return null;
  var taxas=Object.keys(vistas).map(Number).sort(function(a,b){return a-b;});
  return {taxa:melhor.taxa,quando:melhor.quando,varias:taxas.length>1,taxas:taxas};
}
// Formata uma taxa sem casas decimais inúteis: 25 -> "25%", 27.5 -> "27,5%".
function _fmtTaxa(t){
  t=parseFloat(t)||0;
  return (Math.round(t*10)/10).toString().replace('.',',')+'%';
}
// Primeiro nome, para a faixa do formulário não virar um parágrafo.
function _primeiroNome(n){return String(n||'').trim().split(/\s+/)[0]||'';}
// PERFIL: o dono tem dois tipos de cliente na cabeça — o que rola o juro para
// sempre e o que vai abatendo. Isto lê o comportamento em vez de perguntar.
// Corte de 5%: abaixo disso o capital praticamente não andou.
// Só classifica quem já renovou; sem renovação não há comportamento, seria chute.
function clientPerfil(key){
  var k=clientKey(key);
  var cap=0,abat=0,renov=0,naRua=0,jurosMes=0;
  allRecords().forEach(function(l){
    if(!l||clientKey(l.name)!==k)return;
    var g=ledger(l);
    cap=_r2(cap+g.capitalEmprestado);
    abat=_r2(abat+g.capitalAbatido);
    renov+=loanRenovacoes(l);
    if(l.paid)return;                         // quitado não rende mais nem está na rua
    naRua=_r2(naRua+Math.max(0,g.capitalEmprestado-g.capitalAbatido));
    jurosMes=_r2(jurosMes+_juroDoPeriodoAtual(g));
  });
  var pct=cap>0?(abat/cap):0;
  var r={capital:cap,abatido:abat,renovacoes:renov,naRua:naRua,jurosMes:jurosMes,
    tipo:'novo',rotulo:'',frase:''};
  if(renov>=2&&pct<(CONFIG.PERFIL_CORTE_PCT/100)){
    r.tipo='so_juro';r.rotulo='Paga só o juro';
    r.frase='Renovou '+renov+' vez'+(renov>1?'es':'')+' sem abater a dívida. Rende '
      +fmt(jurosMes)+' por mês, mas os '+fmt(naRua)+' seguem na rua.';
  }else if(pct>=(CONFIG.PERFIL_CORTE_PCT/100)&&renov>=1){
    r.tipo='amortiza';r.rotulo='Vai abatendo';
    r.frase='Já abateu '+fmt(abat)+' da dívida. O juro do mês vai caindo junto.';
  }
  return r;
}
// Juro cobrado no ciclo aberto: o juroCobrado do último 'emprestimo'/'renovacao'
// do razão. Vem do ledger e NÃO cai a zero quando o cliente já pagou o juro do
// mês (jurosPendente cairia, e a frase diria "rende R$ 0,00 por mês" — mentira).
function _juroDoPeriodoAtual(g){
  var linhas=(g&&g.linhas)||[];
  for(var i=linhas.length-1;i>=0;i--){
    var t=linhas[i].tipo;
    if(t==='renovacao'||t==='emprestimo'||t==='empréstimo')return _r2(linhas[i].juroCobrado);
  }
  return 0;
}
// ============================================================
// PRÉVIA DA DIVISÃO DO PAGAMENTO — o que é juro, o que abate
// ============================================================
// Antes de gravar, mostra ao dono exatamente a mesma conta que o razão vai fazer
// depois: o dinheiro cobre primeiro o juro pendente, o que sobra abate o capital
// (a regra está em _ledgerCalc, no ramo 'pagamento'). Por isso a prévia sai DO
// ledger — se ela divergir do que fica gravado, é bug, não arredondamento.
// Devolve {juro, capital, faltaJuro, saldoDepois, texto}; texto vazio se não há
// o que prever (valor <= 0, ou empréstimo parcelado, onde o saldo mora nas
// parcelas e esta divisão não descreve o que acontece).
function previaPagamento(loan,valor){
  var vazio={juro:0,capital:0,faltaJuro:0,saldoDepois:0,texto:''};
  var v=_r2(valor);
  if(!loan||v<=0)return vazio;
  if(loan.parcelas&&loan.parcelas.length)return vazio;
  var g=ledger(loan);
  var jp=_r2(g.jurosPendente);
  var juro=_r2(Math.min(v,jp));
  var capital=_r2(v-juro);
  var falta=_r2(Math.max(0,jp-v));
  // A DIVISÃO (juro x abatimento) sai do razão — é ela que vai ficar gravada.
  // Já o "novo saldo" sai de getBalance(), que é o número que o dono vê no
  // cartão um segundo depois de confirmar. Em dados coerentes os dois são o
  // mesmo (ledger.saldo é definido como getBalance); em base antiga torta, o
  // certo é a prévia bater com a tela, não com a teoria.
  var saldoDepois=_r2(Math.max(0,getBalance(loan)-v));
  var texto;
  if(jp<=0)texto=fmt(v)+' abate a dívida inteiro · novo saldo '+fmt(saldoDepois);
  else if(v<jp)texto=fmt(v)+' vai todo para o juro · ainda faltam '+fmt(falta)+' de juro';
  else if(capital<=0)texto=fmt(v)+' cobre exatamente o juro · novo saldo '+fmt(saldoDepois);
  else texto=fmt(juro)+' cobre o juro · '+fmt(capital)+' abate a dívida · novo saldo '+fmt(saldoDepois);
  return {juro:juro,capital:capital,faltaJuro:falta,saldoDepois:saldoDepois,texto:texto};
}
// ============================================================
// CAPITAL RECUPERADO — "quanto do meu bolso ainda está exposto aqui"
// ============================================================
// O dono pensa em caixa, não em saldo devedor. Este bloco responde a pergunta
// dele com três fatos já acontecidos (nada de projeção): quanto saiu do bolso,
// quanto já voltou e quanto ainda falta voltar para ele não ter mais nada a
// perder. A barra é recebido/emprestado travada em 100% — quem já devolveu mais
// do que saiu não "enche demais"; o excedente é juro e aparece no juro ganho.
// Os três números em linhas de tabela (não em cartão dentro de cartão), com a
// barra de recuperação embaixo. Só desenha: as contas vêm prontas de quem chama.
function _capitalBox(cap,rec,risco){
  cap=_r2(cap);rec=_r2(rec);risco=_r2(risco);
  var pct=cap>0?Math.min(100,Math.round((rec/cap)*100)):(rec>0?100:0);
  var corpo=kv('Tirei do bolso',din(cap,13.5))
    + kv('Já voltou',din(rec,13.5,'var(--gr)'))
    + kv('Ainda em risco',din(risco,15.5,risco>0?'var(--am)':'var(--gr)'),true);
  if(cap>0&&risco<=0){
    corpo+='<div style="padding:12px 14px;font-size:12.5px;font-weight:600;color:var(--gr)">'
      +'✓ Capital recuperado — daqui pra frente é só ganho</div>';
  }else if(cap>0){
    corpo+='<div style="padding:12px 14px">'
      +'<div style="height:7px;background:var(--pn2);border-radius:4px;overflow:hidden">'
      +'<div style="height:100%;width:'+pct+'%;background:var(--am);border-radius:4px"></div></div>'
      +'<div style="font-size:12.5px;color:var(--dim);margin-top:8px;font-weight:600">'
      +'Faltam '+fmt(risco)+' para você não ter mais nada a perder com este cliente.</div></div>';
  }
  return '<div class="bloco">'+corpo+'</div>';
}
function descontosPeriodo(loan,from,to){
  return (loan&&loan.history||[]).reduce(function(s,h){
    return (h.type==='desconto'&&inRange(h.date,from,to))?s+(h.value||0):s;
  },0);
}
// Aplica o desconto no registro (nao salva nem redesenha — quem chama decide).
// Se o desconto zerar o saldo, o emprestimo e encerrado por acordo.
function _regDesconto(loan,valor,motivo){
  valor=parseFloat((parseFloat(valor)||0).toFixed(2));
  if(!loan||valor<=0)return 0;
  loan.currentAmount=parseFloat(Math.max(0,(loan.currentAmount||0)-valor).toFixed(2));
  loan.history=loan.history||[];
  loan.history.push({type:'desconto',date:today(),value:valor,note:(motivo||'').trim()||'Desconto negociado'});
  if(getBalance(loan)<=0.009){
    _histPagamentosPeriodo(loan);      // preserva o que ja tinha sido pago no periodo
    loan.currentAmount=0;loan.paid=true;
    loan.history.push({type:'ajuste',date:today(),value:0,note:'Saldo zerado pelo desconto — dívida encerrada por acordo.'});
  }
  return valor;
}
// Datas / intervalos para o relatorio
function dStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function inRange(ds,from,to){if(!ds)return false;if(from&&ds<from)return false;if(to&&ds>to)return false;return true;}
function loanActiveInRange(l,from,to){if(!from&&!to)return true;if(inRange(l.startDate,from,to))return true;if((l.history||[]).some(function(h){return inRange(h.date,from,to);}))return true;return(l.payments||[]).some(function(p){return inRange(p.date,from,to);});}
function clientEvents(ls,from,to){var ev=[];ls.forEach(function(l){(l.history||[]).forEach(function(h){var t=h.type||'';var kind=(t.indexOf('emprest')>=0)?'borrow':(t.indexOf('pagamento')>=0||t==='pay')?'pay':(t.indexOf('renov')>=0||t==='renew')?'renew':'other';if((!from&&!to)||inRange(h.date,from,to))ev.push({date:h.date,kind:kind,value:h.value||0});});(l.payments||[]).forEach(function(p){if((!from&&!to)||inRange(p.date,from,to))ev.push({date:p.date,kind:'pay',value:p.value||0});});});ev.sort(function(a,b){return new Date(b.date+'T00:00:00')-new Date(a.date+'T00:00:00');});return ev;}
// Juros composto automatico dos inadimplentes: a cada mes vencido, rola +30 dias e acumula juros sobre o saldo
// C8 — a rolagem do juro do inadimplente e gravada na data da COMPETENCIA (o
// vencimento que esta sendo rolado), nao em today(). Ver o comentario longo em
// accrueParcelas: e a mesma regra e o mesmo motivo. `lastAccrual` continua sendo
// today(), porque ele responde outra pergunta — "quando o app rodou esta conta".
function accrueInadimplentes(){var changed=false,tocados=[];(inadimplentes||[]).forEach(function(i){if(i.interest==null||!i.dueDate)return;var guard=0;while(daysUntil(i.dueDate)<0&&guard<600){var before=parseFloat(i.currentAmount)||0;var juros=parseFloat((before*(i.interest/100)).toFixed(2));var venc=i.dueDate;i.currentAmount=parseFloat((before+juros).toFixed(2));i.dueDate=addDays(i.dueDate,CONFIG.CICLO_DIAS);i.history=i.history||[];i.history.push({date:venc,type:'renovacao',value:before,rate:i.interest,note:'Juros de inadimplencia '+i.interest+'%: +'+fmt(juros)+'. Novo saldo: '+fmt(i.currentAmount)});i.lastAccrual=today();changed=true;if(tocados.indexOf(i.id)<0)tocados.push(i.id);guard++;}});if(changed)saveInad(tocados);return changed;}
// Link WhatsApp sem duplicar o DDI 55

// NAVEGAÇÃO — quatro abas e três telas empilhadas

var TELAS=['home','clients','cliente','receber','report','conta'];

function _deleteLoanExec(id){
  // AS FOTOS NÃO SÃO APAGADAS AQUI, de propósito. O empréstimo acabou de ir
  // para a lixeira de 30 dias (_redeAntesDeApagar). Se as fotos sumissem
  // agora, quem trouxesse o empréstimo de volta receberia um registro sem
  // documento nenhum — perda de dado que o dono não aceita.
  // Quem apaga a foto de verdade é a lixeira: quando o prazo vence ou quando
  // o dono manda "apagar de vez". Ver _lixeiraApagarFotos().
  loans=loans.filter(function(l){return l.id!==id;});

  delete expandedCards[id];
  deleteConfirm=null;
  save([]);renderAll();   // [] de proposito: o id virou tombstone, nao pode ser marcado sujo

}

// ============================================================
// D1 — SERVICE WORKER: O APP ABRE SEM INTERNET
// ============================================================
// O icone na tela do celular era so um atalho: sem sinal, o navegador tentava
// buscar a pagina no servidor e falhava. Com o sw.js registrado, a propria
// pagina fica guardada no aparelho e abre offline.
// Duas protecoes obrigatorias:
//  - try/catch em volta de tudo (navegador antigo sem suporte nao pode quebrar
//    o app);
//  - nao registrar em file:// — o navegador recusa e joga erro no console, e e
//    exatamente assim que os testes locais e o uso pelo arquivo direto abrem
//    este HTML.
function registrarServiceWorker(){
  try{
    if(typeof navigator==='undefined'||!navigator.serviceWorker)return;
    if(typeof location==='undefined'||location.protocol==='file:')return;
    // Caminhos RELATIVOS: o app e publicado numa subpasta do GitHub Pages.
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(function(reg){
      if(!reg||!reg.addEventListener)return;
      reg.addEventListener('updatefound',function(){
        var novo=reg.installing;
        if(!novo||!novo.addEventListener)return;
        novo.addEventListener('statechange',function(){
          // 'installed' COM um worker ja no comando = versao nova pronta,
          // esperando o app fechar. Sem controller e a primeira instalacao,
          // e ai nao ha nada a avisar.
          if(novo.state==='installed'&&navigator.serviceWorker.controller){
            showToast('Nova versão disponível — feche e abra o app');
          }
        });
      });
    }).catch(function(e){
      if(typeof console!=='undefined'&&console.warn)console.warn('service worker',e&&e.message);
    });
  }catch(e){
    if(typeof console!=='undefined'&&console.warn)console.warn('service worker',e&&e.message);
  }
}
function initApp(){
  load();                 // carrega o cache do aparelho (instantâneo)
  migrateDocsToIDB();
  registrarServiceWorker();   // D1 — faz o app abrir sem internet
  _ligarGatilhosRessinc();    // D3 — internet de volta / aba visivel / de 3 em 3 min
  if(!cloudOn){
    // biblioteca da nuvem não carregou: modo offline (só o aparelho)
    accrueTudo();         // sem nuvem, o cache é a única verdade que existe
    enterApp();
    setTimeout(function(){showToast('Sem nuvem agora — usando dados do aparelho.','warn');},800);
    return;
  }
  // Verifica se já existe sessão (login salvo). Se sim, entra; se não, pede login.
  sb.auth.getSession().then(function(res){
    var sess=res&&res.data&&res.data.session;
    if(sess){
      cloudUser=sess.user.id;
      cloudEmail=sess.user.email||'';
      enterApp();      // mostra já com o cache
      cloudPull();     // e atualiza com a nuvem
    }else{
      showLogin('');
    }
  }).catch(function(){
    // Sem internet para validar a sessão: deixa usar offline com o cache
    accrueTudo();
    enterApp();
    setTimeout(function(){showToast('Sem conexão — usando dados do aparelho.','warn');},800);
  });
}

// D7 — O LEMBRETE DE BACKUP AGORA VALE TAMBEM PARA QUEM USA A NUVEM.
// Existia aqui uma linha que desligava o lembrete quando havia nuvem ativa
// ("a nuvem ja e o backup"). Isso e falso: a nuvem copia o erro junto. Se um
// registro for apagado ou estragado por engano, a nuvem replica o estrago nos
// dois aparelhos. Backup baixado e a unica copia que congela o passado.
// O prazo do lembrete mora no bloco CONFIG, la em cima (BACKUP_LEMBRETE_DIAS).
// Data do ultimo backup baixado/copiado. Devolve null quando nunca houve.
function ultimoBackupMs(){
  var v=null;
  try{v=localStorage.getItem('emp_last_backup');}catch(e){v=null;}
  if(!v)return null;
  var n=parseInt(v,10);
  return isNaN(n)?null:n;
}
function diasDesdeBackup(){
  var ms=ultimoBackupMs();
  if(ms==null)return null;
  return Math.floor((Date.now()-ms)/86400000);
}
// Texto pronto para a tela Conta: "Último backup: 01/09/2026 — há 9 dias"
function textoUltimoBackup(){
  var ms=ultimoBackupMs();
  if(ms==null)return 'Nenhum backup baixado ainda';
  var d=new Date(ms);
  var data=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  var dias=diasDesdeBackup();
  var quando=dias<=0?'hoje':(dias===1?'há 1 dia':'há '+dias+' dias');
  return 'Último backup: '+data+' — '+quando;
}
function checkBackupReminder(){
  if(!loans.length)return;
  var dias=diasDesdeBackup();
  var stale=(dias==null)||(dias>=CONFIG.BACKUP_LEMBRETE_DIAS);
  if(stale)setTimeout(function(){showToast('💾 Faça um backup dos seus dados (aba Conta → Backup e restaurar)','warn');},1600);
}
// Bloqueio temporario apos varios erros seguidos (trava de forca bruta caseira)
var PIN_MAX_FAILS=5, PIN_LOCK_MS=30000;
var pinFails=0, pinLockUntil=0, _pinLockTimer=null;
function pinLockedSecs(){var s=Math.ceil((pinLockUntil-Date.now())/1000);return s>0?s:0;}
function _pinTick(){
  var el=document.getElementById('pin-err');
  var s=pinLockedSecs();
  if(s>0){if(el)el.textContent='Bloqueado — tente de novo em '+s+'s';return;}
  if(_pinLockTimer&&typeof clearInterval!=='undefined'){clearInterval(_pinLockTimer);}
  _pinLockTimer=null;
  if(el)el.textContent='Pode tentar de novo';
}
function _pinStartLockTimer(){
  if(typeof setInterval==='undefined')return;          // ambiente sem timers (testes)
  if(_pinLockTimer)clearInterval(_pinLockTimer);
  _pinTick();
  _pinLockTimer=setInterval(_pinTick,1000);
}

// Sai da tela de PIN sem mexer em nada (so vale para criar/alterar/remover)
function pinCancelSet(){
  if(pinMode==='check')return;                          // no boot nao ha para onde voltar
  var el=document.getElementById('pin-overlay');if(el)el.remove();
  pinBuffer='';pinNewTemp='';
}
function pinPress(v){
  if(pinLockedSecs()>0)return;                          // teclado travado
  if(v==='⌫')pinBuffer=pinBuffer.slice(0,-1);
  else{if(pinBuffer.length>=4)return;pinBuffer+=v;}
  for(var i=0;i<4;i++){var d=document.getElementById('pd-'+i);if(d)d.classList.toggle('filled',i<pinBuffer.length);}
  if(pinBuffer.length===4)setTimeout(pinSubmit,220);
}
function pinSubmit(){
  if(pinMode==='check'){
    if(pinLockedSecs()>0){pinBuffer='';return;}
    if(checkPin(pinBuffer)){
      pinFails=0;pinLockUntil=0;
      var el=document.getElementById('pin-overlay');if(el)el.remove();
      _showApp();
    }else{
      pinFails++;
      if(pinFails>=PIN_MAX_FAILS){
        pinFails=0;pinLockUntil=Date.now()+PIN_LOCK_MS;
        showPinScreen('check','');
        _pinStartLockTimer();
      }else{
        var rest=PIN_MAX_FAILS-pinFails;
        showPinScreen('check','PIN incorreto — '+rest+' tentativa'+(rest>1?'s':'')+' antes de travar 30s');
      }
    }
  }else if(pinMode==='set'){
    pinNewTemp=pinBuffer;showPinScreen('confirm','');
  }else if(pinMode==='confirm'){
    if(pinBuffer===pinNewTemp){
      var el2=document.getElementById('pin-overlay');if(el2)el2.remove();
      setPin(pinBuffer);
      pinFails=0;pinLockUntil=0;
      showToast('🔐 PIN salvo!');closeModal();
    }else{showPinScreen('set','PINs diferentes');}
  }else if(pinMode==='remove'){
    if(checkPin(pinBuffer)){
      var el3=document.getElementById('pin-overlay');if(el3)el3.remove();
      localStorage.removeItem(PIN_KEY);
      pinFails=0;pinLockUntil=0;
      showToast('🔓 PIN removido');closeModal();
    }else{showPinScreen('remove','PIN incorreto');}
  }
}

      _redeAntesDeOperacao('antes de apagar tudo deste aparelho',function(){
        localStorage.clear();location.reload();
      });

// STATS
// ============================================================
function calcStats(){
  var active=loans.filter(function(l){return!l.paid;});
  // C7 — QUEM ATRASOU NAO PODE CONTAR NUM INDICADOR E SUMIR DO OUTRO.
  // "Em risco" ja somava ativos + inadimplentes, mas "A receber" e "Vencido"
  // somavam so os ativos. Resultado: mover um cliente para inadimplente derrubava
  // o "A receber" do dono sem nada ter sido pago. Agora os tres olham o MESMO
  // conjunto — tudo que ainda esta em aberto.
  var emAberto=active.concat(inadimplentes||[]);
  var now=new Date();var tm=now.getMonth();var ty=now.getFullYear();
  var totalOwed=emAberto.reduce(function(s,l){return s+getBalance(l);},0);
  var totalLent=active.reduce(function(s,l){return s+l.originalAmount;},0);
  var totalOverdue=emAberto.filter(function(l){return daysUntil(l.dueDate)<0;}).reduce(function(s,l){return s+getBalance(l);},0);
  // Quanto do "A receber" esta parado com inadimplente. Serve para a linha de
  // aviso embaixo dos indicadores: sem ela o numero do dono muda do dia para a
  // noite e ele nao sabe por que.
  var inadAberto=_r2((inadimplentes||[]).reduce(function(s,i){return s+getBalance(i);},0));
  var inadCount=(inadimplentes||[]).length;
  var warn3=active.filter(function(l){var d=daysUntil(l.dueDate);return d>=0&&d<=3;}).length;
  var clientCount=new Set(loans.map(function(l){return clientKey(l.name);})).size;
  function _p2(n){return String(n).padStart(2,'0');}
  var yStart=ty+'-01-01', yEnd=(ty+1)+'-01-01';
  var mStart=ty+'-'+_p2(tm+1)+'-01';
  var mEnd=(tm===11?(ty+1)+'-01-01':ty+'-'+_p2(tm+2)+'-01');
  // Juros recebido (Opção B): juro entra como lucro na hora; capital só baixa quando o cliente abate de fato.
  // inadimplentes entram no juro/lucro: o que ja foi pago antes de atrasar continua contando
  var todos=allRecords();
  var juros=todos.reduce(function(s,l){return s+loanJuros(l);},0);
  var jurosYear=todos.reduce(function(s,l){return s+jurosRecPeriodo(l,yStart,yEnd);},0);
  var lucroM=todos.reduce(function(s,l){return s+jurosRecPeriodo(l,mStart,mEnd);},0);
  var lucroA=jurosYear;
  // Capital emprestado (dinheiro que de fato saiu) — renovação não conta como capital novo
  var capitalYear=capitalNoPeriodo(yStart,yEnd);
  var capitalMonth=capitalNoPeriodo(mStart,mEnd);
  var activeClientCount=new Set(active.map(function(l){return clientKey(l.name);})).size;
  var overdueCount=active.filter(function(l){return daysUntil(l.dueDate)<0;}).length;
  // DINHEIRO EM RISCO: quanto do bolso dele ainda nao voltou. So conta o que
  // ainda esta em aberto — emprestimos ativos + inadimplentes. Emprestimo
  // quitado nao tem mais risco nenhum, esta fechado.
  // emAberto ja foi montado la em cima (C7): ativos + inadimplentes.
  var emRisco=_r2(emAberto.reduce(function(s,l){return s+ledger(l).emRisco;},0));
  var capitalEmRisco=_r2(emAberto.reduce(function(s,l){return s+ledger(l).capitalEmprestado;},0));
  // Quanto do dinheiro que saiu do bolso já voltou, nos empréstimos ainda em aberto.
  // Limitado ao capital de cada um: o que passa disso é lucro, não devolução.
  var capitalRecuperado=_r2(emAberto.reduce(function(s,l){
    var g=ledger(l);return s+Math.min(g.recebidoTotal,g.capitalEmprestado);},0));
  return{totalOwed:totalOwed,totalLent:totalLent,totalOverdue:totalOverdue,warn3:warn3,
    inadAberto:inadAberto,inadCount:inadCount,
    capitalRecuperado:capitalRecuperado,
    clientCount:clientCount,activeClientCount:activeClientCount,overdueCount:overdueCount,
    juros:juros,jurosYear:jurosYear,capitalYear:capitalYear,capitalMonth:capitalMonth,
    lucroM:lucroM,lucroA:lucroA,activeCount:active.length,
    emRisco:emRisco,capitalEmRisco:capitalEmRisco};
}

// ============================================================
// SITUAÇÃO — a cor da barra lateral e do selo saem daqui
// ============================================================
// Só descreve o que já existe (vencimento e quitação). Não calcula dinheiro.
function sitLoan(l){
  if(!l)return 'emdia';
  if(l.paid)return 'quitado';
  var d=daysUntil(l.dueDate);
  if(d<0)return 'vencido';
  if(d===0)return 'hoje';
  if(d<=7)return 'breve';
  return 'emdia';
}
function sitTexto(l){
  if(l.paid)return 'quitado';
  var d=daysUntil(l.dueDate);
  if(d<0)return Math.abs(d)+'d atrás';
  if(d===0)return 'hoje';
  return 'em '+d+'d';
}
function sitFrase(l){
  if(l.paid)return 'Quitado';
  var d=daysUntil(l.dueDate);
  if(d<0)return 'Vencido há '+Math.abs(d)+' dia'+(Math.abs(d)>1?'s':'');
  if(d===0)return 'Vence hoje';
  return 'Vence em '+d+' dia'+(d>1?'s':'');
}
function sitGrupo(g){
  var ativos=g.loans.filter(function(l){return !l.paid;});
  if(!ativos.length)return 'quitado';
  var ordem={vencido:0,hoje:1,breve:2,emdia:3},pior='emdia';
  ativos.forEach(function(l){var s=sitLoan(l);if(ordem[s]<ordem[pior])pior=s;});
  return pior;
}
// Agrupa por cliente — a lista mostra pessoas, não empréstimos soltos.
function gruposDeClientes(lista){
  var g={},ordem=[];
  (lista||loans).forEach(function(l){
    var k=clientKey(l.name);
    if(!g[k]){g[k]={key:k,name:l.name,phone:l.phone||'',address:l.address||'',loans:[]};ordem.push(k);}
    if(l.phone&&!g[k].phone)g[k].phone=l.phone;
    if(l.address&&!g[k].address)g[k].address=l.address;
    g[k].loans.push(l);
  });
  return ordem.map(function(k){
    g[k].loans.sort(function(a,b){
      if(a.paid!==b.paid)return a.paid?1:-1;
      return new Date(a.dueDate)-new Date(b.dueDate);
    });
    return g[k];
  });
}
// Quem precisa aparecer primeiro: vencido, depois o que vence logo, quitado por último.
function ordenarGrupos(arr){
  var peso={vencido:0,hoje:1,breve:2,emdia:3,quitado:4};
  return arr.sort(function(a,b){
    var pa=peso[sitGrupo(a)],pb=peso[sitGrupo(b)];
    if(pa!==pb)return pa-pb;
    var an=a.loans.filter(function(l){return !l.paid;})[0];
    var bn=b.loans.filter(function(l){return !l.paid;})[0];
    if(an&&bn)return new Date(an.dueDate)-new Date(bn.dueDate);
    if(an)return -1;
    if(bn)return 1;
    return a.name.localeCompare(b.name);
  });
}
function saldoGrupo(g){
  return _r2(g.loans.filter(function(l){return !l.paid;})
    .reduce(function(s,l){return s+getBalance(l);},0));
}
function inicial(n){return String(n||'?').trim().charAt(0).toUpperCase();}
// Data curta (dd/mm) — nas linhas o ano só rouba espaço de quem precisa dele.
function _dm(iso){var p=String(iso||'').split('-');return p.length===3?(p[2]+'/'+p[1]):'';}

// Barra lateral + fundo do avatar de acordo com a situação
// A linha inteira é tocável (o ::after do botão principal cobre a linha), mas
// quem recebe o foco do teclado é um <button> de verdade — e o botão Receber
// fica POR CIMA, nunca dentro dele: botão dentro de botão não existe em HTML.
function _linhaAbre(sit,acao,extra){
  return '<div class="linha" style="border-left-color:'+corSit(sit)+(extra||'')+'">'
    +'<button class="linha-main" onclick="'+acao+'">';
}
function _linhaFecha(resto){return '</button>'+resto+'</div>';}

// CARTEIRA (era "Início")

function renderHome(){
  var s=calcStats();
  var ativos=loans.filter(function(l){return !l.paid;});
  var cobrar=ativos.filter(function(l){var d=daysUntil(l.dueDate);return d<=0;})
    .sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);});
  var emdia=ativos.filter(function(l){return daysUntil(l.dueDate)>0;})
    .sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);});
  var totalCobrar=_r2(cobrar.reduce(function(t,l){return t+getBalance(l);},0));
  var html='';

  // Inadimplentes NÃO aparecem aqui — a pedido do dono, eles vivem só no
  // filtro da lista de clientes, para a Carteira ficar com quem ainda paga.

  // Os quatro números que cabem numa olhada.
  html+='<div class="tiles">'
    + tile('A receber',dinK(s.totalOwed),'var(--tx)',"goScreen('clients')")
    + tile('Vencido',dinK(s.totalOverdue),s.totalOverdue>0?'var(--rd)':'var(--dim2)',"filtrarClientes('overdue')")
    + tile('Lucro do mês',dinK(s.lucroM),'var(--gr)',"goScreen('report')")
    + tile('Em risco',dinK(s.emRisco),s.emRisco>0?'var(--am)':'var(--gr)',"goScreen('report')")
    +'</div>';

  // C7 — LINHA DE AVISO DO INADIMPLENTE.
  // "A receber" e "Vencido" agora incluem quem esta na lista de inadimplentes.
  // Sem dizer isto em algum lugar, o dono ve um numero grande e nao entende de
  // onde saiu (ou ve o numero cair quando alguem sai da lista). A linha e
  // discreta, fica logo abaixo dos indicadores e some quando nao ha inadimplente.
  if(s.inadAberto>0.009){
    html+='<div style="font-size:11.5px;color:var(--dim2);padding:6px 16px 0;line-height:1.5">'
      +'Inclui '+fmt(s.inadAberto)+' parados com '+s.inadCount
      +(s.inadCount===1?' inadimplente.':' inadimplentes.')+'</div>';
  }

  // O dinheiro do próprio bolso: quanto saiu, quanto já voltou, quanto ainda
  // pode virar prejuízo. Mesma leitura da ficha do cliente, agora da carteira toda.
  if(s.capitalEmRisco>0.009){
    var pctRec=Math.min(100,Math.round((s.capitalRecuperado/s.capitalEmRisco)*100));
    html+='<div class="sec"><span class="sec-t">Meu dinheiro na rua</span>'
      +'<span style="font-size:11.5px;font-weight:600;color:'+(s.emRisco>0?'var(--am)':'var(--gr)')+'">'
      +pctRec+'% recuperado</span></div>'
      +'<div class="bloco">'
      + kv('Tirei do bolso',din(s.capitalEmRisco,13.5))
      + kv('Já voltou',din(s.capitalRecuperado,13.5,'var(--gr)'))
      + kv('Ainda em risco',din(s.emRisco,15.5,s.emRisco>0?'var(--am)':'var(--gr)'),true)
      +'<div style="padding:12px 14px">'
      +'<div style="height:7px;background:var(--pn2);border-radius:4px;overflow:hidden">'
      +'<div style="height:100%;width:'+pctRec+'%;background:'+(s.emRisco>0?'var(--am)':'var(--gr)')
      +';border-radius:4px"></div></div>'
      +'<div style="font-size:12.5px;color:var(--dim);margin-top:8px;font-weight:600">'
      +(s.emRisco>0
        ? 'Faltam '+fmt(s.emRisco)+' voltarem para você não ter nada a perder.'
        : 'Todo o dinheiro que saiu já voltou. O que entrar agora é lucro.')
      +'</div></div></div>';
  }

  // Cobrar hoje: as pessoas antes do total, com o botão na própria linha.
  html+='<div class="sec"><span class="sec-t">Cobrar hoje</span>'
    +(cobrar.length?'<span style="font-size:11.5px;font-weight:600;color:var(--rd)">'
      +cobrar.length+(cobrar.length>1?' cobranças · ':' cobrança · ')+fmt(totalCobrar)+'</span>':'')
    +'</div>';
  if(!cobrar.length){
    html+='<div class="bloco"><div class="vazio" style="padding:24px 18px">'
      +'<span style="color:var(--gr);display:flex;justify-content:center">'+sv(I.check,24)+'</span>'
      +'<div class="vazio-t">Nada para cobrar hoje</div>'
      +'<div style="font-size:12.5px;margin-top:2px">Ninguém está vencido nem vence hoje.</div></div></div>';
  }else{
    html+='<div class="bloco">'+cobrar.map(function(l){return linhaCobranca(l,true);}).join('')+'</div>';
  }

  // No computador a lista curta dá lugar à tabela completa.
  if(emdia.length){
    html+='<div class="sec so-cel"><span class="sec-t">Em dia</span>'
      +'<button class="sec-a" onclick="goScreen(\'clients\')">ver todos →</button></div>'
      +'<div class="bloco so-cel">'+emdia.slice(0,4).map(function(l){return linhaCobranca(l,false);}).join('')+'</div>';
  }else if(!loans.length){
    html+='<div class="bloco so-cel"><div class="vazio">'
      +'<span style="color:var(--dim2);display:flex;justify-content:center">'+sv(I.users,26)+'</span>'
      +'<div class="vazio-t">Nenhum empréstimo ainda</div>'
      +'<div style="font-size:12.5px;margin-top:2px">Toque no + lá em cima para lançar o primeiro.</div></div></div>';
  }
  html+=tabelaDesk();
  document.getElementById('home-content').innerHTML=html;
}
// Linha de um empréstimo na Carteira. Com ação = botão Receber na própria linha.
function linhaCobranca(l,comAcao){
  var sit=sitLoan(l);
  var bal=getBalance(l);
  var sub=l.interest+'% · '+(daysUntil(l.dueDate)<0?'venceu ':'vence ')+_dm(l.dueDate);
  return _linhaAbre(sit,"abrirCliente('"+_js(clientKey(l.name))+"','home')")
    +'<span class="linha-n">'+esc(l.name)+'</span>'
    +'<span class="linha-s">'+esc(sub)+'</span>'

        ? '<button class="btn-mini" onclick="abrirReceber(\''+_js(l.id)+'\')">Receber</button>'
        : '<span class="linha-st" style="color:'+corSit(sit)+'">'+sitTexto(l)+'</span>'));
}
// Escapa aspas simples para dentro de onclick="..."
function _js(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

function renderClientsList(q){_searchQuery=q;renderLoanList(q);}

// Contagem de cada filtro — o número já diz o tamanho do problema.
function contagens(){
  var gs=gruposDeClientes(loans);
  var c={all:gs.length,overdue:0,today:0,week:0,paid:0,inad:(inadimplentes||[]).length};
  gs.forEach(function(g){
    var ativos=g.loans.filter(function(l){return !l.paid;});
    if(!ativos.length){c.paid++;return;}
    if(ativos.some(function(l){return daysUntil(l.dueDate)<0;}))c.overdue++;
    if(ativos.some(function(l){return daysUntil(l.dueDate)===0;}))c.today++;
    if(ativos.some(function(l){var d=daysUntil(l.dueDate);return d>=0&&d<=7;}))c.week++;
  });
  return c;
}
function grupoCasa(g,f){
  var ativos=g.loans.filter(function(l){return !l.paid;});
  if(f==='paid')return ativos.length===0;
  if(f==='overdue')return ativos.some(function(l){return daysUntil(l.dueDate)<0;});
  if(f==='today')return ativos.some(function(l){return daysUntil(l.dueDate)===0;});
  if(f==='week')return ativos.some(function(l){var d=daysUntil(l.dueDate);return d>=0&&d<=7;});
  return true;
}
function renderChips(){
  var el=document.getElementById('filtro-chips');
  if(!el)return;
  var c=contagens();
  var defs=[['all','Todos',c.all],['overdue','Vencidos',c.overdue],['today','Hoje',c.today],
            ['week','Semana',c.week],['paid','Quitados',c.paid],['inad','Inadimplentes',c.inad]];
  el.innerHTML=defs.map(function(d){
    var on=currentFilter===d[0];
    var badge=(d[0]==='inad')
      ? ' <span id="inad-badge" style="display:'+(c.inad?'inline-flex':'none')
        +';align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;'
        +'border-radius:9px;background:'+(on?'var(--acTx)':'var(--rd)')+';color:'+(on?'var(--ac)':'var(--bg)')
        +';font-size:10px;font-weight:800">'+c.inad+'</span>'
      : ' <span class="mono" style="font-weight:600;opacity:.75">'+d[2]+'</span>';
    return '<button class="chip" aria-pressed="'+on+'" onclick="setFilter(this,\''+d[0]+'\')">'
      +d[1]+badge+'</button>';
  }).join('');
  // Traz o filtro ativo para dentro da tela: o de inadimplentes é o último da
  // fila e ficava escondido, deixando a lista sem explicação.
  var ativo=el.querySelector&&el.querySelector('[aria-pressed="true"]');
  if(ativo&&el.scrollTo)el.scrollTo({left:Math.max(0,ativo.offsetLeft-14),behavior:'auto'});
}
function renderLoanList(search){
  renderChips();
  var container=document.getElementById('loan-list');
  if(!container)return;
  if(currentFilter==='inad'){renderInad();return;}
  var gs=gruposDeClientes(loans).filter(function(g){return grupoCasa(g,currentFilter);});
  if(search){
    var sq=String(search).toLowerCase();
    gs=gs.filter(function(g){
      return g.name.toLowerCase().indexOf(sq)>=0||(g.phone||'').indexOf(sq)>=0;
    });
  }
  if(!gs.length){
    container.innerHTML='<div class="vazio">'
      +'<span style="color:var(--dim2);display:flex;justify-content:center">'+sv(I.search,26)+'</span>'
      +'<div class="vazio-t">Nenhum cliente aqui</div>'
      +'<div style="font-size:12.5px;margin-top:2px">Tente outro filtro ou outra busca.</div></div>';
    return;
  }
  ordenarGrupos(gs);
  var total=_r2(gs.reduce(function(s,g){return s+saldoGrupo(g);},0));
  container.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;'
    +'padding:11px 16px 8px;font-size:11.5px;color:var(--dim2);font-weight:600">'
    +'<span>'+gs.length+' cliente'+(gs.length!==1?'s':'')+'</span>'
    +'<span>'+din(total,11.5,'var(--dim2)')+' em aberto</span></div>'
    +'<div class="bloco">'+gs.map(renderGroup).join('')+'</div>';
}

// Linha de um cliente. O bloco expandido existe desde antes e é o MESMO
// conteúdo da ficha — quem abre a ficha vê isto em tela cheia.
function renderGroup(group){
  var key=group.key;
  var sit=sitGrupo(group);
  var ativos=group.loans.filter(function(l){return !l.paid;});
  var saldo=saldoGrupo(group);
  var prox=ativos.slice().sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);})[0];
  // Capital ainda exposto neste cliente (só os empréstimos ATIVOS). Soma
  // emprestimo a emprestimo: um já recuperado não tapa o buraco de outro.
  var riscoAtivo=_r2(ativos.reduce(function(s,l){return s+ledger(l).emRisco;},0));
  var riscoTag='';
  if(ativos.length){
    riscoTag=riscoAtivo>0
      ?'<span style="color:var(--am)">falta '+fmt(riscoAtivo)+' voltar</span>'
      :'<span style="color:var(--gr)">✓ recuperado</span>';
  }
  var sub=ativos.length
    ? (ativos.length>1?ativos.length+' empréstimos':(prox?prox.interest+'%':''))
      +(prox?' · vence '+_dm(prox.dueDate):'')
    : 'quitado';
  var linha=_linhaAbre(sit,"abrirCliente('"+_js(key)+"')")
    +'<span class="linha-n">'+esc(group.name)+'</span>'
    +'<span class="linha-s">'+esc(sub)+'</span>'
    +(riscoTag?'<span class="linha-s">'+riscoTag+'</span>':'')
    + _linhaFecha(
      '<span style="text-align:right">'
      +(saldo?din(saldo,15):'<span class="mono" style="color:var(--dim2)">—</span>')+'</span>'
      +'<span class="linha-st" style="color:'+corSit(sit)+'">'
      +(prox?sitTexto(prox):'quitado')+'</span>');
  if(!expandedGroups[key])return linha;
  // Expandido = a ficha inteira desenhada no lugar (mesmas peças, sem duplicar
  // regra nenhuma). É por onde a bateria de testes olha o cartão do cliente.
  return linha+'<div style="padding:2px 0 12px;border-bottom:1px solid var(--ln)">'
    + fichaCorpo(key,{dentroDaLista:true})+'</div>';
}

// ============================================================
// T2 — BLOCO "DOCUMENTOS" DA FICHA DO CLIENTE
// ============================================================
// ONDE A PÁGINA NOVA É GRAVADA — a regra, escrita, para ninguém adivinhar:
// o cliente pode ter VÁRIOS empréstimos e a foto fica guardada DENTRO do
// empréstimo. A página nova vai para o registro MAIS RECENTE e ainda EM ABERTO
// daquele cliente. Se não houver nenhum em aberto, vai para o mais recente que
// existir. Se o cliente não tiver registro nenhum, não há onde gravar: o botão
// some e fica só a frase "anexe ao cadastrar o primeiro empréstimo".
// Para MOSTRAR é diferente: a ficha reúne as páginas de TODOS os registros do
// cliente (docItensDoCliente), porque para o dono é "o documento do cliente",
// não "o documento do empréstimo número 3".
function _docRegistroAlvo(key){
  var meus=allRecords().filter(function(l){return l&&clientKey(l.name)===key;});
  if(!meus.length)return null;
  var maisNovoPrimeiro=function(a,b){
    var da=new Date(a.startDate||0).getTime()||0;
    var db=new Date(b.startDate||0).getTime()||0;
    return db-da;
  };
  var abertos=meus.filter(function(l){return !l.paid;}).sort(maisNovoPrimeiro);
  if(abertos.length)return abertos[0];
  return meus.slice().sort(maisNovoPrimeiro)[0];
}

// Anexar DEPOIS do cadastro, pela ficha. Aceita várias páginas de uma vez.
function saveDocFicha(e,key,campo){
  var fl=e.target.files;if(!fl||!fl.length)return;
  var alvo=_docRegistroAlvo(key);
  if(!alvo){showToast('Este cliente ainda não tem empréstimo para guardar a foto','error');return;}
  var arquivos=[],i;
  for(i=0;i<fl.length;i++)arquivos.push(fl[i]);
  try{e.target.value='';}catch(err){}   // deixa escolher o MESMO arquivo de novo
  _docComprimirLista(arquivos,0,[],function(novas){
    if(!novas.length){showToast('Não consegui ler a imagem','error');return;}
    var lista=docPaginas(alvo[campo]);
    novas.forEach(function(foto){
      var chave=docNovaChave(alvo.id,campo);
      lista.push(chave);
      docSet(chave,foto).catch(function(){
        showToast('A foto não gravou neste aparelho','error');   // nunca falha calado
      });
    });
    alvo[campo]=docGuardarPaginas(lista);
    _docGravarRegistro(alvo);
    renderAll();
    showToast((novas.length===1?'1 página anexada':novas.length+' páginas anexadas')
      +' · '+docNomeCampo(campo));
  });
}

function _loansDoCliente(key){
  return loans.filter(function(l){return clientKey(l.name)===key;})
    .sort(function(a,b){
      if(a.paid!==b.paid)return a.paid?1:-1;
      return new Date(a.dueDate)-new Date(b.dueDate);
    });
}
function fichaCabecalho(key){
  var ls=_loansDoCliente(key);
  var g={key:key,name:_nomeDoCliente(key)||'Cliente',loans:ls,
    phone:'',address:''};
  ls.forEach(function(l){if(l.phone&&!g.phone)g.phone=l.phone;if(l.address&&!g.address)g.address=l.address;});
  if(!g.phone||!g.address){
    var c=(clients||[]).find(function(x){return clientKey(x.name)===key;});
    if(c){g.phone=g.phone||c.phone||'';g.address=g.address||c.address||'';}
  }
  var sit=ls.length?sitGrupo(g):'quitado';
  var contato=[g.phone,g.address].filter(function(x){return x;}).join(' · ');
  return '<div style="display:flex;align-items:center;gap:12px;padding:14px 14px 0">'
    +'<div style="width:50px;height:50px;border-radius:15px;flex:none;display:flex;'
      +'align-items:center;justify-content:center;background:'+corSitS(sit)+';color:'+corSit(sit)
      +';font-family:Archivo,sans-serif;font-size:20px;font-weight:800">'+esc(inicial(g.name))+'</div>'
    +'<div style="flex:1;min-width:0">'
      +'<div class="arch" style="font-size:21px;font-weight:800;line-height:1.15;'
        +'overflow:hidden;text-overflow:ellipsis">'+esc(g.name)+'</div>'
      +'<div style="font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;'
        +'white-space:nowrap">'+esc(contato||'sem contato cadastrado')+'</div></div>'
    +(g.phone?'<button class="ico-btn" style="border:1px solid var(--ln);background:var(--pn);color:var(--gr)"'
      +' aria-label="Falar no WhatsApp com '+esc(g.name)+'"'
      +' onclick="sendWAGroup(\''+_js(key)+'\')">'+sv(I.wa,19)+'</button>':'')
    +'</div>';
}
// O corpo da ficha. `dentroDaLista` deixa as margens iguais às do cartão antigo.
function fichaCorpo(key,op){
  op=op||{};
  var ls=_loansDoCliente(key);
  if(!ls.length){
    return '<div class="vazio"><div class="vazio-t">Sem empréstimos</div>'
      +'<div style="font-size:12.5px;margin-top:2px">Este cliente não tem lançamentos.</div></div>';
  }
  var ativos=ls.filter(function(l){return !l.paid;});
  // Empréstimo em foco: o escolhido pelo seletor, senão o mais urgente.
  var alvo=ls.find(function(l){return l.id===fichaLoanId;})||ativos[0]||ls[0];
  var html='';

  // ---- vários empréstimos: o total em cima, a lista embaixo ----
  // Escolha do dono (opção B): a fileira de botões que rolava para o lado saiu.
  // No lugar entra o que ele deve somando tudo — o número que se fala ao telefone —
  // e uma linha fina por empréstimo, empilhadas, sem rolagem lateral.
  var quitados=ls.filter(function(l){return l.paid;});
  var visiveis=ativos.length?ativos:ls;
  if(fichaVerQuitados)visiveis=ls;
  if(visiveis.length>1){
    var totalCli=_r2(visiveis.reduce(function(s,l){return s+(l.paid?0:getBalance(l));},0));
    var maisVelho=visiveis.filter(function(l){return !l.paid;})
      .sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);})[0];
    var subTotal=visiveis.length+' empréstimos';
    if(maisVelho){
      var dv=daysUntil(maisVelho.dueDate);
      subTotal+=dv<0?' · o mais antigo vencido há '+Math.abs(dv)+' dia'+(Math.abs(dv)>1?'s':'')
        :dv===0?' · um vence hoje':' · o próximo vence em '+dv+' dia'+(dv>1?'s':'');
    }
    html+='<div class="bloco" style="margin-top:12px;padding:14px 15px">'
      +'<span class="rot">Deve no total</span>'
      +'<div style="margin:4px 0 2px">'+din(totalCli,30)+'</div>'
      +'<div style="font-size:12.5px;color:var(--dim)">'+esc(subTotal)+'</div></div>';

    html+='<div class="sec"><span class="sec-t">Os empréstimos</span></div>'
      +'<div class="bloco" style="padding:0;overflow:hidden">'
      + visiveis.map(function(l,i){
          var on=l.id===alvo.id, sl=sitLoan(l), dl=daysUntil(l.dueDate);
          var quando=l.paid?'quitado':(dl<0?'venceu há '+Math.abs(dl)+'d':dl===0?'vence hoje':'vence em '+dl+'d');
          return '<button class="emp-linha" aria-pressed="'+on+'"'
            +' onclick="verEmprestimo(\''+_js(l.id)+'\')"'
            +' style="border-left:3px solid '+corSit(sl)+';background:'+(on?'var(--acS)':'var(--pn)')
            +(i<visiveis.length-1?';border-bottom:1px solid var(--ln)':'')+'">'
            +'<span class="emp-linha-t">vence '+_dm(l.dueDate)
              +' · <span style="color:'+corSit(sl)+';font-weight:600">'+esc(quando)+'</span></span>'
            + din(l.paid?loanPrincipal(l):getBalance(l),14,on?'var(--ac)':'var(--tx)')
            +'</button>';
        }).join('')
      +'</div>';
  }
  if(quitados.length&&ativos.length){
    var totQ=_r2(quitados.reduce(function(s,l){return s+loanPrincipal(l);},0));
    html+='<button class="sec-a" style="margin:10px 14px 0;padding:6px 0;background:none;border:none"'
      +' aria-expanded="'+(fichaVerQuitados?'true':'false')+'" onclick="toggleQuitados()">'
      +(fichaVerQuitados?'esconder':'ver')+' '+quitados.length+' já quitado'+(quitados.length>1?'s':'')
      +' · <span class="mono">'+fmt(totQ)+'</span></button>';
  }

  // ---- saldo devedor (ou o aviso de quitado) ----
  var sit=sitLoan(alvo),bal=getBalance(alvo),pagoPer=getPaidPeriod(alvo);
  if(bal>0.009){
    html+='<div class="bloco" style="margin-top:12px;border-left:3px solid '+corSit(sit)+'">'
      +'<div style="padding:14px 15px 15px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:9px">'
        +'<span class="tile-l">Saldo devedor</span>'
        +selo(sitFrase(alvo),corSit(sit),corSitS(sit))+'</div>'
      +'<div style="margin:5px 0 3px">'+din(bal,32)+'</div>'
      +'<div style="font-size:12.5px;color:var(--dim)">de '+fmt(alvo.currentAmount)
        +' · juro '+alvo.interest+'% ao mês · vence '+fmtDate(alvo.dueDate)+'</div>'
      +(pagoPer>0
        ?'<div style="margin-top:11px;height:6px;background:var(--pn2);border-radius:3px;overflow:hidden">'
         +'<div style="height:100%;width:'+Math.min(100,Math.round(pagoPer/(alvo.currentAmount||1)*100))
         +'%;background:var(--gr)"></div></div>'
         +'<div style="font-size:11.5px;color:var(--gr);margin-top:5px;font-weight:600">'
         +fmt(pagoPer)+' já pago neste período</div>':'')
      +'</div></div>';
  }else{
    html+='<div class="bloco" style="margin-top:12px"><div style="padding:18px;text-align:center">'
      +'<span style="color:var(--gr);display:flex;justify-content:center;margin-bottom:6px">'+sv(I.check,26)+'</span>'
      +'<div style="font-weight:700">Sem dívida em aberto</div>'
      +'<div style="font-size:12.5px;color:var(--dim)">Último vencimento em '+fmtDate(alvo.dueDate)+'</div>'
      +'</div></div>';
  }

  // ---- sugestão de renovação, quando é o passo natural ----
  // O botão Renovar já existe entre as quatro ações, mas ficava perdido: quem
  // acabou de receber só o juro não achava o caminho para rolar o mês. Aqui a
  // conta aparece pronta, no momento em que ela faz sentido.
  var _parcelado=!!(alvo.parcelas&&alvo.parcelas.length);
  var _pagoPer=getPaidPeriod(alvo), _atraso=daysUntil(alvo.dueDate);
  if(!_parcelado&&bal>0.009&&(_pagoPer>0||_atraso<0)){
    var _juroNovo=_r2(bal*alvo.interest/100), _novoTotal=_r2(bal+_juroNovo);
    html+='<div class="bloco" style="margin-top:11px;border-left:3px solid var(--ac);padding:13px 15px">'
      +'<div style="font-size:14px;font-weight:700;margin-bottom:3px">'
      +(_pagoPer>0?'Recebeu '+fmt(_pagoPer)+' neste mês. Rolar o resto?'
                 :'Venceu há '+Math.abs(_atraso)+' dia'+(Math.abs(_atraso)>1?'s':'')+'. Rolar para o próximo mês?')+'</div>'
      +'<div style="font-size:12.5px;color:var(--dim);line-height:1.5">Sobra '+fmt(bal)
      +'. Com o juro de '+alvo.interest+'% vira <span class="mono" style="color:var(--tx);font-weight:600">'
      +fmt(_novoTotal)+'</span>, vencendo em '+_dm(addDays(today(),CONFIG.CICLO_DIAS))+'.</div>'
      +'<button class="btn btn-ac" style="margin-top:11px" onclick="openRenew(\''+_js(alvo.id)+'\')">'
      +sv(I.cycle,17)+'Renovar para o próximo mês</button></div>';
  }

  // ---- as quatro ações ----
  var parcelado=_parcelado;
  html+='<div class="acoes">'
    +(bal>0.009&&!parcelado
      ?'<button class="acao pri" onclick="abrirReceber(\''+_js(alvo.id)+'\')">'+sv(I.check,18)+'Receber</button>'
      :'<button class="acao" disabled style="opacity:.45">'+sv(I.check,18)+'Receber</button>')
    +((!parcelado&&bal>0.009)
      ?'<button class="acao" onclick="openRenew(\''+_js(alvo.id)+'\')">'+sv(I.cycle,18)+'Renovar</button>'
      :'<button class="acao" disabled style="opacity:.45">'+sv(I.cycle,18)+'Renovar</button>')
    +'<button class="acao" onclick="openReceipt(\''+_js(alvo.id)+'\')">'+sv(I.rec,18)+'Recibo</button>'
    +'<button class="acao" onclick="openHistory(\''+_js(alvo.id)+'\')">'+sv(I.doc,18)+'Documentos</button>'
    +'</div>';

  // ---- parcelas, quando for o caso ----
  if(parcelado){
    var pagas=alvo.parcelas.filter(function(p){return p.paid;}).length;
    html+='<div class="sec"><span class="sec-t">Parcelas · '+pagas+'/'+alvo.parcelas.length+' pagas</span></div>'
      +'<div class="bloco">'+renderParcelasList(alvo)+'</div>'
      +'<div style="font-size:11.5px;color:var(--dim2);padding:8px 16px 0;line-height:1.5">'
      +'Empréstimo parcelado: o recebimento é parcela por parcela, no botão de cada linha. '
      +'Por isso Receber e Renovar ficam apagados aqui.</div>';
  }

  // ---- documentos do cliente (T2) ----
  // Fica logo depois das ações: é onde o dono procura quando quer conferir
  // ou anexar a cópia que chegou pelo WhatsApp.
  html+=fichaDocsHtml(key);

  // ---- meu dinheiro com este cliente (soma do cliente inteiro) ----
  // C10 — MESMO CONJUNTO E MESMO CRITERIO DO SELO DE PERFIL, QUE FICA LOGO ABAIXO.
  // Antes este quadro somava so o que esta em `loans` — se o cliente tivesse um
  // emprestimo na lista de inadimplentes, ele ficava de fora — e contava como
  // "ainda em risco" ate emprestimo ja quitado. O selo de perfil, a um centimetro
  // dali, usava allRecords() e ignorava os quitados. Dois numeros diferentes para
  // a mesma pergunta, um do lado do outro.
  // REGRA DO DONO: quitado NAO esta mais em risco — ele esta fechado.
  // Capital e recebido continuam somando a vida toda (inclusive quitados), porque
  // "tirei do bolso" e "ja voltou" sao a historia inteira do cliente.
  var capCli=0,recCli=0,riscoCli=0;
  allRecords().forEach(function(l){
    if(!l||clientKey(l.name)!==key)return;
    var g2=ledger(l);
    capCli=_r2(capCli+g2.capitalEmprestado);
    recCli=_r2(recCli+g2.recebidoTotal);
    if(l.paid)return;                     // quitado sai do "ainda em risco"
    riscoCli=_r2(riscoCli+g2.emRisco);
  });
  if(op.dentroDaLista&&!expandedClientHistory[key]){
    // Na lista o detalhe fica atrás de um toque, como sempre foi.
    html+='<div class="sec"><button class="sec-a" style="color:var(--dim)"'
      +' onclick="toggleClientHistory(\''+_js(key)+'\')">Histórico do cliente ▾</button></div>';
  }else{
    html+='<div class="sec"><span class="sec-t">Meu dinheiro com este cliente</span></div>'
      + _capitalBox(capCli,recCli,riscoCli)
      + _blocoPerfil(key);
  }

  // ---- extrato do razão ----
  if(!op.dentroDaLista||expandedClientHistory[key]){
    html+='<div class="sec"><span class="sec-t">Extrato'
      +(ls.length>1?' deste empréstimo':'')+'</span></div>'
      +'<div class="bloco">'+extratoHtml(alvo)+'</div>';
  }

  // ---- o que mais dá para fazer com este cliente ----
  html+='<div style="display:flex;flex-direction:column;gap:8px;margin:16px 14px 0">'
    +'<button class="btn btn-gh" onclick="novoParaCliente(\''+_js(key)+'\')">'+sv(I.plus,18)
      +'Novo empréstimo para '+esc(_primeiroNome(_nomeDoCliente(key)))+'</button>'
    +(ativos.length>1
      ?'<button class="btn btn-gh" onclick="openPayAll(\''+_js(key)+'\')">'+sv(I.check,18)
        +'Pagar todos — '+fmt(_r2(ativos.reduce(function(s,l){return s+getBalance(l);},0)))+'</button>':'')
    +(ativos.length
      ?'<button class="btn-txt" style="color:var(--am)" onclick="moveClientToInad(\''+_js(key)+'\')">'
        +'Mover para inadimplentes</button>':'')
    +(!alvo.paid
      ?'<div class="btn-fila">'
        +'<button class="btn btn-gh" onclick="openEdit(\''+_js(alvo.id)+'\')">'+sv(I.edit,17)+'Editar</button>'
        +'<button class="btn btn-gh" onclick="openAddValue(\''+_js(alvo.id)+'\')">'+sv(I.plus,17)+'Valor</button>'
        +'<button class="btn btn-gh fixo" style="color:var(--rd)" aria-label="Excluir empréstimo"'
          +' onclick="deleteLoan(\''+_js(alvo.id)+'\')">'+sv(I.trash,17)+'</button>'
       +'</div>'
      :'')
    +'</div>';
  return html;
}
function verEmprestimo(id){fichaLoanId=id;renderAll();}
function toggleQuitados(){fichaVerQuitados=!fichaVerQuitados;renderAll();}
function novoParaCliente(key){
  var l=_loansDoCliente(key)[0]||(clients||[]).find(function(c){return clientKey(c.name)===key;});
  if(!l){openForm();return;}
  openForm({name:l.name,phone:l.phone||'',address:l.address||''});
}
// Selo + frase do perfil deduzido do comportamento (clientPerfil).
function _blocoPerfil(key){
  var perfil=clientPerfil(key);
  if(!perfil.rotulo)return '';
  return '<div style="margin:9px 14px 0">'
    +'<span class="selo" style="background:var(--pn2);color:var(--dim);border:1px solid var(--ln)">'
      +esc(perfil.rotulo)+'</span>'
    +'<div style="font-size:12px;line-height:1.45;color:var(--dim);margin-top:5px">'
      +esc(perfil.frase)+'</div></div>';
}
// ============================================================
// EXTRATO — uma linha por evento do razão, com o saldo ao lado
// ============================================================
function extratoHtml(loan){
  var lg=ledger(loan);
  var periodoAtual=null;
  var linhas=lg.linhas.map(function(li){
    var sep='';
    if(li.periodo!==periodoAtual){
      periodoAtual=li.periodo;
      sep='<div style="display:flex;align-items:center;gap:8px;padding:10px 14px 4px;background:var(--pn)">'
        +'<span style="height:1px;flex:1;background:var(--ln)"></span>'
        +'<span style="font-size:9px;font-weight:700;color:var(--dim2);letter-spacing:.13em">PERÍODO '+li.periodo+'</span>'
        +'<span style="height:1px;flex:1;background:var(--ln)"></span></div>';
    }
    var cor=li.sinal==='+'?'var(--gr)':li.sinal==='-'?'var(--rd)':'var(--dim2)';
    var rot=esc(li.rotulo);
    if(li.tipo==='renovacao'||li.tipo==='emprestimo'||li.tipo==='empréstimo')
      rot+=' <span style="color:var(--am);font-weight:600">· juro '+fmt(li.juroCobrado)+'</span>';
    if(li.atual)rot+=' <span style="font-size:10px;color:var(--am);font-weight:700">(mês atual)</span>';
    if(li.estornado)rot+=' <span style="font-size:10px;color:var(--rd);font-weight:700">(estornado)</span>';
    var sub='';
    if(li.tipo&&li.tipo.indexOf('pagamento')>=0){
      sub=(li.parteCapital>0.004)
        ?fmt(li.parteJuros)+' de juro · '+fmt(li.parteCapital)+' abateu a dívida'
        :fmt(li.parteJuros)+' de juro · não abateu a dívida';
    }else if(li.tipo==='estorno'&&!li.somenteRastro){
      sub='devolveu '+fmt(li.parteCapital)+' de abatimento e '+fmt(li.parteJuros)+' de juro';
    }else if(li.tipo==='desconto'&&li.juroCobrado<-0.004){
      sub='perdoou '+fmt(-li.juroCobrado)+' de juro pendente';
    }
    return sep+'<div class="ext">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'
      +'<div style="min-width:0"><div class="ext-t">'+rot+'</div>'
      +'<div class="ext-d">'+fmtDate(li.data)+(li.nota?' · '+esc(li.nota):'')+'</div></div>'
      +'<div style="text-align:right;flex:none">'
        +(li.sinal
          ?'<div>'+din(li.valor,14,cor)+'</div>'
          :'<div style="font-size:11.5px;color:var(--dim2)">sem dinheiro</div>')
        +'<div class="ext-s">saldo '+fmt(li.saldoDepois)+'</div></div>'
      +'</div>'
      +(sub?'<div class="ext-sub">'+sub+'</div>':'')
      +'</div>';
  }).join('');
  if(!linhas)linhas='<div class="ext" style="color:var(--dim2);font-size:12.5px">Nenhuma movimentação registrada.</div>';
  // Rodapé com os totais do razão
  return linhas
    +'<div style="padding:11px 14px;background:var(--pn2);font-size:12px;color:var(--dim);line-height:1.7">'
    +'<b style="color:var(--tx)">Emprestei</b> '+fmt(lg.capitalEmprestado)
    +' · <b style="color:var(--tx)">Recebi</b> '+fmt(lg.recebidoTotal)
    +' · <b style="color:var(--tx)">Juro ganho</b> <span style="color:var(--gr);font-weight:700">'
    +fmt(lg.jurosRecebido)+'</span>'
    +' · <b style="color:var(--tx)">Desconto</b> '+fmt(lg.descontoTotal)+'</div>';
}

// ============================================================
// RECEBER — tela própria, não janela
// ============================================================
function renderReceber(){
  var box=document.getElementById('receber-content');
  if(!box)return;
  var loan=loans.find(function(l){return l.id===receberId;});
  if(!loan||loan.paid){
    // Quitou (ou sumiu): não faz sentido continuar aqui.
    if(currentScreen==='receber'){receberId=null;goScreen(clienteAtual?'cliente':'clients');}
    return;
  }
  var parcelado=!!(loan.parcelas&&loan.parcelas.length);
  var bal=getBalance(loan);
  var jp=_r2(ledger(loan).jurosPendente);
  var pagoPer=getPaidPeriod(loan);
  var totalDesc=loanDescontos(loan);
  var html='<div style="padding:14px 14px 0">'
    +'<div class="arch" style="font-size:22px;font-weight:800">Receber</div>'
    +'<div style="font-size:13.5px;color:var(--dim)">'+esc(loan.name)+' · saldo '+fmt(bal)+'</div>'
    +'</div>';

  // ---- o valor domina a tela ----
  html+='<div style="margin:14px 14px 0;background:var(--pn);border:1px solid var(--ac);'
    +'border-radius:14px;padding:13px 15px 15px">'
    +'<label class="rot" for="pay-input">Valor recebido</label>'
    +'<div style="display:flex;align-items:baseline;gap:8px">'
    +'<span class="mono" style="font-size:22px;color:var(--dim2);flex:none">R$</span>'
    +'<input id="pay-input" class="mono" type="number" inputmode="decimal" step="0.01" placeholder="0,00"'
    +' oninput="updatePayBtn(this.value,\''+_js(loan.id)+'\')"'
    +' style="flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:32px;'
    +'padding:2px 0;color:var(--tx)"></div>'
    +'</div>';

  // ---- atalhos com o valor já calculado ----
  var meio=_r2(bal/2);
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 14px 0">'
    + atalho('Tudo',bal,loan.id)
    + (jp>0?atalho('Só o juro',jp,loan.id):atalho('Só o juro',0,loan.id,'juro pago'))
    + '<button class="seg-btn" style="min-height:48px;font-size:14px" onclick="focarValor()">Parcial</button>'
    + '<button class="seg-btn" style="min-height:48px;font-size:14px" onclick="focarDesconto()">Com desconto</button>'
    +'</div>';

  // ---- a conta antes de confirmar ----
  html+='<div class="sec"><span class="sec-t">O que este valor faz</span></div>'
    +'<div class="bloco" id="pay-div">'+divisaoHtml(loan,0)+'</div>'
    +'<div id="pay-split" style="font-size:11.5px;color:var(--dim);padding:8px 16px 0;line-height:1.45">'
    + esc(_juroDoMesHtml(loan))+'</div>';

  // ---- observação e confirmação ----
  html+='<div style="margin:12px 14px 0">'
    +'<label class="rot" for="pay-note">Observação (opcional)</label>'
    +'<input id="pay-note" class="inp" type="text" placeholder="PIX, dinheiro, quem entregou…">'
    +'<button id="btn-conf-pay" class="btn btn-ac" style="margin-top:10px" disabled'
      +' onclick="doPartialModal(\''+_js(loan.id)+'\')">Registrar pagamento</button>'
    +'<button class="btn btn-gh" style="margin-top:8px"'
      +' onclick="doPayment(\''+_js(loan.id)+'\','+bal+',\'\')">Quitar tudo — '+fmt(bal)+'</button>'
    +'<button class="btn-txt" style="width:100%;margin-top:4px" onclick="voltar()">Cancelar</button>'
    +'</div>';

  // ---- o que já foi pago neste período (com estorno) ----
  if((loan.payments||[]).length){
    html+='<div class="sec"><span class="sec-t">Pagamentos deste período</span>'
      +'<span style="font-size:11.5px;color:var(--gr);font-weight:600">'+fmt(pagoPer)+'</span></div>'
      +'<div class="bloco">'+(loan.payments||[]).map(function(p,i){
        return '<div class="kv"><span class="kv-l">'+fmtDate(p.date)
          +(p.note?' · '+esc(p.note):'')+'</span>'
          +'<span style="display:flex;align-items:center;gap:8px">'
          +din(p.value,14,'var(--gr)')
          +'<button class="ico-btn" style="color:var(--rd)"'
          +' title="Estornar este lançamento" aria-label="Estornar '+fmt(p.value)+'"'
          +' onclick="estornoPagamento(\''+_js(loan.id)+'\','+i+')">'+sv(I.undo,16)+'</button></span></div>';
      }).join('')+'</div>'
      +'<div style="font-size:11px;color:var(--dim2);padding:6px 16px 0;line-height:1.45">'
      +'O estorno desfaz um lançamento feito por engano: o saldo volta a subir e fica registrado no extrato.</div>';
  }

  // ---- períodos já fechados (só leitura) ----
  var passados=(loan.history||[]).filter(function(h){
    return h.type&&(h.type.indexOf('pagamento')>=0||h.type==='desconto'||h.type==='estorno');
  });
  if(passados.length){
    html+='<div class="sec"><span class="sec-t">Períodos já fechados</span></div>'
      +'<div class="bloco">'+passados.slice(-8).map(function(h){
        var mm=_histLabel(h.type);
        return '<div class="kv"><span class="kv-l">'+fmtDate(h.date)+' · '+esc(mm.label)+'</span>'
          // C5 — a cor do valor sai de mm.valCor, que _histLabel ja define tipo a
          // tipo. Antes saia do SINAL ("+" = verde, qualquer outra coisa = vermelho):
          // com a renovacao passando a nao ter sinal, ela apareceria em vermelho,
          // como se fosse prejuizo. E o desconto (verde no _histLabel) ja aparecia
          // vermelho por esse mesmo motivo.
          +din(h.value,13.5,mm.valCor)+'</div>';
      }).join('')+'</div>'
      +(passados.length>8?'<div style="font-size:11px;color:var(--dim2);padding:6px 16px 0">'

  }else{

      +'<div class="dupla">'

        +'<input id="pay-desc" class="inp" type="number" inputmode="decimal" placeholder="0,00"></div>'
      +'<div><label class="rot" for="pay-desc-note">Motivo</label>'
        +'<input id="pay-desc-note" class="inp" type="text" placeholder="Ex: acordo"></div>'
      +'</div>'
      +'<button class="btn btn-gh" style="margin-top:10px" onclick="aplicarDesconto(\''+_js(loan.id)+'\')">'
      +sv(I.tag,17)+'Aplicar desconto</button>'
      +'</div></div>';
  }
  box.innerHTML=html+'<div style="height:12px"></div>';
  // NÃO abrir o teclado sozinho: ele cobria os atalhos ao entrar na tela e
  // voltava a subir depois de registrar. Quem abre o teclado é o botão "Parcial".
}
function atalho(rot,v,id,vazio){
  if(v<=0.009){
    return '<button class="seg-btn" disabled style="min-height:48px;font-size:14px;opacity:.5">'
      +rot+' · '+(vazio||'—')+'</button>';
  }
  return '<button class="seg-btn" style="min-height:48px;font-size:14px" onclick="usarAtalho('+v+',\''+_js(id)+'\')">'
    +rot+' · <span class="mono">'+fmt(v)+'</span></button>';
}
function usarAtalho(v,id){
  var el=document.getElementById('pay-input');
  if(el){el.value=String(v);}
  updatePayBtn(v,id);
}
function focarDesconto(){
  var el=document.getElementById('pay-desc');
  if(el&&el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'});
  if(el&&el.focus)el.focus();
}
// A frase de apoio do campo de valor: quanto ainda falta de juro neste mês.
// Sai do jurosPendente do razão — o mesmo número que a prévia e a gravação usam.
function _juroDoMesHtml(loan){
  var jp=_r2(ledger(loan).jurosPendente);
  if(jp<=0)return 'Juro deste mês já está pago · o que entrar abate a dívida.';
  return 'Juro deste mês: '+fmt(jp)+' · o que passar disso abate a dívida.';
}
// A divisão juro/abatimento — sai de previaPagamento, que sai do razão.
function divisaoHtml(loan,v){
  var p=previaPagamento(loan,v);
  var bal=getBalance(loan);
  if(!v||v<=0){
    var jp=_r2(ledger(loan).jurosPendente);
    return kv('Juro pendente deste mês',din(jp,13.5,jp>0?'var(--am)':'var(--gr)'))
      + kv('Saldo devedor',din(bal,15.5),true);
  }
  return kv('Cobre o juro',din(p.juro,13.5))
    + kv('Abate a dívida',din(p.capital,13.5,'var(--gr)'))
    + kv('Fica devendo',din(p.saldoDepois,15.5),true);
}
