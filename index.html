    var activeLoans=group.loans.filter(function(l){return!l.paid;});
    var paidLoans=group.loans.filter(function(l){return l.paid;});
    // Sem auto-expand: usuário clica para ver opções
    activeLoans.forEach(function(loan){loansHtml+=renderLoanRow(loan,phone);});
    // Se houver quitados, mostrar resumo discreto
    if(paidLoans.length){
      loansHtml+='<div style="padding:5px 11px;font-size:10px;color:#94a3b8;background:#f8fafc;border-top:0.5px solid #f1f5f9">'+paidLoans.length+' empréstimo'+(paidLoans.length>1?'s':'')+' quitado'+(paidLoans.length>1?'s':'')+' — ver no histórico</div>';
    }
    // Histórico colapsável do cliente
    var isHistExp=!!expandedClientHistory[key];
    var totalEmprestado=group.loans.reduce(function(s,l){return s+loanPrincipal(l);},0);
    var totalRecebido=group.loans.reduce(function(s,l){return s+loanReceived(l);},0);
    var totalJurosCliente=group.loans.reduce(function(s,l){return s+loanJuros(l);},0);
    var histContent='';
    if(isHistExp){
      histContent='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;background:#f8fafc;border-top:0.5px solid #e2e8f0">'
        +'<div style="padding:9px 6px;text-align:center"><div style="font-size:8px;text-transform:uppercase;letter-spacing:.4px;color:#94a3b8;margin-bottom:2px">Emprestado</div><div style="font-size:12px;font-weight:700;color:#1d4ed8">'+fmt(totalEmprestado)+'</div></div>'
        +'<div style="padding:9px 6px;text-align:center;border-left:0.5px solid #e2e8f0;border-right:0.5px solid #e2e8f0"><div style="font-size:8px;text-transform:uppercase;letter-spacing:.4px;color:#94a3b8;margin-bottom:2px">Recebido</div><div style="font-size:12px;font-weight:700;color:#334155">'+fmt(totalRecebido)+'</div></div>'
        +'<div style="padding:9px 6px;text-align:center"><div style="font-size:8px;text-transform:uppercase;letter-spacing:.4px;color:#94a3b8;margin-bottom:2px">Juros</div><div style="font-size:12px;font-weight:700;color:#16a34a">'+fmt(totalJurosCliente)+'</div></div>'
        +'</div>';
      // Capital recuperado do cliente. Soma o risco emprestimo a emprestimo (e
      // nao capital total - recebido total): um emprestimo ja recuperado nao
      // "cobre" o buraco de outro que ainda esta em aberto.
      var capCli=0,recCli=0,riscoCli=0;
      group.loans.forEach(function(l){
        var g=ledger(l);
        capCli+=g.capitalEmprestado;recCli+=g.recebidoTotal;riscoCli+=g.emRisco;
      });
      histContent+='<div style="padding:9px 11px;border-top:0.5px solid #e2e8f0">'+_capitalBox(capCli,recCli,riscoCli)+'</div>';
      // Perfil deduzido do comportamento. Selo pequeno + uma frase com números
      // reais — o rótulo sozinho não ensina nada a quem lê.
      var perfil=clientPerfil(key);
      if(perfil.rotulo){
        histContent+='<div style="padding:0 11px 9px">'
          +'<span style="display:inline-block;font-size:9px;font-weight:700;color:#475569;background:#f1f5f9;border:0.5px solid #e2e8f0;border-radius:20px;padding:2px 8px">'+esc(perfil.rotulo)+'</span>'
          +'<div style="font-size:10px;line-height:1.4;color:#64748b;margin-top:4px">'+esc(perfil.frase)+'</div>'
          +'</div>';
      }
      var ordered=group.loans.slice().sort(function(a,b){if(a.paid!==b.paid)return a.paid?1:-1;return new Date(b.startDate+'T00:00:00')-new Date(a.startDate+'T00:00:00');});
      histContent+=ordered.map(function(l){
        var emp=loanPrincipal(l),pago=loanReceived(l),jur=loanJuros(l);
        return'<div style="display:flex;gap:6px;padding:9px 11px;border-bottom:0.5px solid #f1f5f9">'
          +'<div style="flex:1;min-width:0"><div style="font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px">Emprestei</div><div style="font-size:13px;font-weight:700;color:#1e293b">'+fmt(emp)+'</div><div style="font-size:9px;color:#94a3b8">'+fmtDate(l.startDate)+'</div></div>'
          +'<div style="flex:1;min-width:0"><div style="font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px">Pagou</div><div style="font-size:13px;font-weight:700;color:'+(pago>0?'#16a34a':'#94a3b8')+'">'+fmt(pago)+'</div></div>'
          +'<div style="flex:1;min-width:0"><div style="font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px">Juros</div><div style="font-size:13px;font-weight:700;color:'+(jur>0?'#16a34a':'#94a3b8')+'">'+fmt(jur)+'</div></div>'
          +'</div>';
      }).join('');
      if(!allPaid){
        histContent+='<div style="padding:9px 12px;border-top:0.5px solid #f1f5f9">'
          +'<button onclick="moveClientToInad(\''+key+'\')" style="width:100%;background:none;border:0.5px solid #fcd34d;border-radius:7px;padding:7px;font-size:11px;font-weight:600;color:#b45309;cursor:pointer;font-family:inherit">Mover para inadimplentes</button>'
          +'</div>';
      }
    }
    loansHtml+='<div style="border-top:0.5px solid #e2e8f0">'
      +'<button onclick="toggleClientHistory(\''+key+'\')" style="width:100%;background:#f8fafc;border:none;padding:8px 11px;font-size:11px;font-weight:600;color:#64748b;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center">'
      +'<span>📋 Histórico do cliente</span><span style="font-size:10px">'+(isHistExp?'▲':'▼')+'</span></button>'
      +(isHistExp?'<div>'+histContent+'</div>':'')
      +'</div>';
  }
  return'<div class="client-card fade-in" id="group-'+key+'" style="border-left-color:'+accentColor+'">'
    +'<div class="client-header" onclick="toggleGroup(\''+key+'\')">'
    +'<div class="client-avatar" style="background:'+bgAvatar+';color:'+accentColor+'">'+group.name.charAt(0).toUpperCase()+badgeHtml+'</div>'
    +'<div style="flex:1;min-width:0">'
    +'<div class="client-name">'+esc(group.name)+'</div>'
    +'<div class="client-sub">'+fmt(totalBalance)+(phone?' · '+phone:'')+'</div>'
    +(riscoTag?'<div class="client-sub" style="margin-top:2px">'+riscoTag+'</div>':'')
    +'</div>'
    +(phone&&!allPaid?'<button style="width:28px;height:28px;background:#064e3b;border:none;border-radius:50%;color:#34d399;font-size:9px;font-weight:700;cursor:pointer;flex-shrink:0" onclick="event.stopPropagation();sendWAGroup(\''+key+'\')">WA</button>':'')
    +'<span class="status-badge" style="background:'+statusBg+';color:'+statusTc+'">'+statusText+'</span>'
    +'<span class="chevron">'+(isExp?'↑':'↓')+'</span>'
    +'</div>'
    +(isExp?'<div>'+loansHtml+'</div>':'')
    +'</div>';
}

// Botao do historico completo (unico lugar onde se ve a foto do documento).
// Quando ha foto, o botao avisa discretamente com o 🪪.
function _histBtn(loan){
  var temDoc=!!(loan.docRG||loan.docResidencia);
  return'<button class="abtn" title="Histórico completo'+(temDoc?' e fotos do documento':'')+'" onclick="openHistory(\''+loan.id+'\')">📋 Histórico'+(temDoc?' · 🪪':'')+'</button>';
}
// Linha do pagamento rápido: quanto do valor digitado vai ser juro. Sai do
// jurosPendente do razão — o mesmo número que a prévia do modal e a gravação usam.
function _juroDoMesHtml(loan){
  var jp=_r2(ledger(loan).jurosPendente);
  if(jp<=0)return 'Juro deste mês já está pago · o que entrar abate a dívida.';
  return 'Juro deste mês: '+fmt(jp)+' · o que passar disso abate a dívida.';
}
function renderLoanRow(loan,phone){
  var lid=loan.id;
  var parceled=!!(loan.parcelas&&loan.parcelas.length);
  var d=daysUntil(loan.dueDate);
  var isOver=!loan.paid&&d<0;
  var balance=getBalance(loan);
  var paidPeriod=getPaidPeriod(loan);
  var exp=!!expandedCards[lid];
  var delConf=deleteConfirm===lid;
  var isPaying=payingLoan===lid;
  var dueColor=isOver?'#dc2626':d<=3&&d>=0?'#b45309':'#64748b';
  var rowLeft='';
  if(loan.paid){
    rowLeft='<span style="color:#16a34a;font-weight:600">✓ Quitado</span> <span style="color:#94a3b8">· '+fmt(loan.originalAmount)+(parceled?' · '+loan.parcelas.length+'x':'')+'</span>';
  }else if(parceled){
    var pagas=loan.parcelas.filter(function(p){return p.paid;}).length;
    rowLeft='<span style="color:#94a3b8;font-size:11px">'+fmt(loan.originalAmount)+' · '+pagas+'/'+loan.parcelas.length+'x</span> → <span style="color:'+dueColor+';font-weight:700">'+fmt(balance)+'</span>';
  }else if(paidPeriod>0){
    rowLeft='<span style="color:#94a3b8;font-size:11px">'+fmt(paidPeriod)+' pago</span> → <span style="color:'+dueColor+';font-weight:700">'+fmt(balance)+'</span>';
  }else{
    rowLeft='<span style="color:#94a3b8;font-size:11px">'+fmt(loan.originalAmount)+'</span> → <span style="color:'+dueColor+';font-weight:700">'+fmt(loan.currentAmount)+'</span>';
  }
  var dueInfo=loan.paid?'':((parceled?'próx. ':'vence ')+fmtDate(loan.dueDate)+(isOver?' ('+Math.abs(d)+'d atrás)':d<=3&&d>=0?' ('+d+'d)':''));
  var canRenew=!parceled&&!loan.paid&&(d<0||paidPeriod>0);
  var actions='';
  if(exp){
    if(delConf){
      actions='<div class="loan-actions"><button class="abtn" onclick="cancelDelete()">Cancelar</button><button class="abtn red grow" onclick="deleteLoan(\''+lid+'\')">Confirmar exclusão</button></div>';
    } else if(parceled){
      actions=renderParcelasList(loan)
        +'<div style="padding:6px 9px;display:flex;gap:5px">'
        +'<button class="abtn" style="flex:1 1 0%;text-align:center;min-width:0" onclick="openEdit(\''+lid+'\')">✏️ Editar</button>'
        +'<button class="abtn red" style="flex:1 1 0%;text-align:center;min-width:0" onclick="confirmDelete(\''+lid+'\')">🗑️ Excluir</button>'
        +'</div>'
        +'<div class="loan-actions" style="padding-top:0;border-top:0.5px solid #f1f5f9">'
        +(phone?'<button class="abtn green" onclick="sendWA(\''+lid+'\')">📲 WA</button>':'')
        +'<button class="abtn" onclick="openReceipt(\''+lid+'\')">🧾 Recibo</button>'
        +_histBtn(loan)
        +'</div>';
    } else if(isPaying){
      actions='<div style="padding:8px 10px;background:#eff6ff;border-top:0.5px solid #bfdbfe">'
        +'<div style="font-size:10px;color:#1d4ed8;font-weight:700;margin-bottom:6px">Como deseja pagar?</div>'
        +'<button onclick="doInlinePay(\''+lid+'\','+balance+')" style="width:100%;background:#16a34a;color:#fff;border:none;border-radius:8px;padding:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:5px">✅ Total — '+fmt(balance)+'</button>'
        +'<div style="display:flex;gap:5px;align-items:center">'
        +'<input id="partial-'+lid+'" type="number" step="0.01" min="0.01" placeholder="Valor parcial..." style="flex:1;border:0.5px solid #bfdbfe;border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;outline:none;background:#fff">'
        +'<button onclick="doInlinePayPartial(\''+lid+'\')" style="background:#2563eb;color:#fff;border:none;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">Parcial ✓</button>'
        +'</div>'
        +'<div style="font-size:10px;line-height:1.35;color:#1e40af;margin-top:5px">'+_juroDoMesHtml(loan)+'</div>'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-top:3px">'
        +'<button onclick="cancelPayLoan()" style="background:none;border:none;padding:5px;font-size:10px;color:#94a3b8;cursor:pointer;font-family:inherit">Cancelar</button>'
        +'<button onclick="openPay(\''+lid+'\')" style="background:none;border:none;padding:5px;font-size:10px;color:#2563eb;cursor:pointer;font-family:inherit;text-decoration:underline">mais opções</button>'
        +'</div>'
        +'</div>'
        +'<div style="padding:5px 9px 5px;display:flex;gap:5px;border-top:0.5px solid #e2e8f0">'
        +'<button class="abtn" style="flex:1 1 0%;text-align:center;min-width:0" onclick="openAddValue(\''+lid+'\')">➕ Valor</button>'
        +'<button class="abtn" style="flex:1 1 0%;text-align:center;min-width:0" onclick="openEdit(\''+lid+'\')">✏️ Editar</button>'
        +'<button class="abtn red" style="flex:1 1 0%;text-align:center;min-width:0" onclick="confirmDelete(\''+lid+'\')">🗑️ Excluir</button>'
        +'</div>'
        +'<div class="loan-actions" style="padding-top:0;border-top:0.5px solid #f1f5f9">'
        +(phone?'<button class="abtn green" onclick="sendWA(\''+lid+'\')">📲 WA</button>':'')
        +(canRenew?'<button class="abtn amber" onclick="openRenew(\''+lid+'\')">🔄 Renovar</button>':'')
        +'<button class="abtn" onclick="openReceipt(\''+lid+'\')">🧾 Recibo</button>'
        +_histBtn(loan)
        +'</div>';
    } else {
      actions='<div style="padding:6px 9px 5px;display:flex;gap:5px;flex-wrap:wrap">'
        +(!loan.paid?'<button class="abtn blue" style="flex:2 1 0%;padding:9px;text-align:center;font-size:12px;border-radius:8px" onclick="startPayLoan(\''+lid+'\')">💳 Pagar</button>':'')
        +(!loan.paid?'<button class="abtn" style="flex:1 1 0%;text-align:center;min-width:0" onclick="openAddValue(\''+lid+'\')">➕ Valor</button>':'')
        +'<button class="abtn" style="flex:1 1 0%;text-align:center;min-width:0" onclick="openEdit(\''+lid+'\')">✏️ Editar</button>'
        +'<button class="abtn red" style="flex:1 1 0%;text-align:center;min-width:0" onclick="confirmDelete(\''+lid+'\')">🗑️ Excluir</button>'
        +'</div>'
        +'<div class="loan-actions" style="padding-top:0;border-top:0.5px solid #f1f5f9">'
        +(phone?'<button class="abtn green" onclick="sendWA(\''+lid+'\')">📲 WA</button>':'')
        +(canRenew?'<button class="abtn amber" onclick="openRenew(\''+lid+'\')">🔄 Renovar</button>':'')
        +'<button class="abtn" onclick="openReceipt(\''+lid+'\')">🧾 Recibo</button>'
        +_histBtn(loan)
        +'</div>';
    }
  }
  return'<div class="loan-row" id="card-'+lid+'">'
    +'<div class="loan-row-main" onclick="toggleCard(\''+lid+'\')" style="cursor:pointer">'
    +'<div class="loan-amount-info">'+rowLeft+'</div>'
    +'<div style="display:flex;align-items:center;gap:5px">'
    +(!loan.paid?'<span class="loan-date-info" style="color:'+dueColor+'">'+dueInfo+'</span>':'')
    +'<span class="chevron">'+(exp?'↑':'↓')+'</span>'
    +'</div></div>'+actions+'</div>';
}

function openForm(pre){
  formData=Object.assign({name:'',phone:'',address:'',amount:'',interest:'30',startDate:today(),note:'',docRG:'',docResidencia:'',parcelas:'1'},pre||{});
  // Cliente conhecido abre com a taxa DELE, não com o padrão 30%. Só quando quem
  // chamou não impôs uma taxa (o "+ Novo empréstimo para X" não impõe).
  formData._rateManual=false;
  if(!(pre&&pre.interest))_adotarTaxaDoCliente();
  renderForm();
}
// Puxa a taxa do histórico do cliente para o formulário. Não mexe em nada se o
// dono já escolheu uma taxa na mão nesta tela (_rateManual) — a decisão dele
// sempre ganha do palpite do app.
function _adotarTaxaDoCliente(){
  if(formData._rateManual)return null;
  var info=clientRate(formData.name);
  if(info)formData.interest=String(info.taxa);
  return info;
}
// A faixa acima dos botões de taxa. Cinza quando o app apenas lembra; âmbar
// quando o dono escolheu uma taxa diferente da que costuma cobrar deste cliente.
// Nunca bloqueia — só conta o que o histórico diz.
function _taxaHintHtml(){
  var info=clientRate(formData.name);
  if(!info)return '';
  var escolhida=parseFloat(formData.interest);
  var difere=!isNaN(escolhida)&&Math.abs(escolhida-info.taxa)>0.001;
  var lista=info.varias?' (este cliente já teve '+info.taxas.map(_fmtTaxa).join(' e ')+')':'';
  if(difere){
    return '<div id="rate-hint" style="background:#fffbeb;border:0.5px solid #fcd34d;border-radius:7px;padding:5px 8px;margin-bottom:5px;font-size:10px;line-height:1.35;color:#b45309">'
      +'Atenção: você cobrava '+_fmtTaxa(info.taxa)+' deste cliente.'+esc(lista)+'</div>';
  }
  return '<div id="rate-hint" style="padding:0 2px 5px;font-size:10px;line-height:1.35;color:#94a3b8">'
    +'Você cobrou '+_fmtTaxa(info.taxa)+' de '+esc(_primeiroNome(formData.name))
    +(info.quando?' no empréstimo de '+fmtDate(info.quando):'')
    +' — toque em outra taxa para mudar.'+esc(lista)+'</div>';
}
// Redesenha só a faixa e os botões de taxa. Chamado enquanto o dono DIGITA o
// nome: um renderForm() inteiro aqui tiraria o foco do campo a cada tecla.
function _syncTaxaCliente(){
  _adotarTaxaDoCliente();
  var hint=document.getElementById('rate-hint');
  var wrap=document.getElementById('rate-hint-wrap');
  if(wrap)wrap.innerHTML=_taxaHintHtml();
  else if(hint)hint.outerHTML=_taxaHintHtml();
  var seg=document.getElementById('rate-seg');
  if(seg&&!formData._rateManual){
    var atual=String(formData.interest);
    var btns=seg.querySelectorAll('.seg-btn');
    var achou=false;
    btns.forEach(function(b){
      var v=b.getAttribute('data-rate');
      var on=(v!=null&&v===atual);
      if(on)achou=true;
      b.classList[on?'add':'remove']('active');
    });
    var outro=document.getElementById('btn-outro-rate');
    if(outro){
      outro.textContent=achou?'Outro':atual+'%';
      outro.classList[achou?'remove':'add']('active');
    }
  }
  updatePreview();
}

  var amt=parseFloat(formData.amount)||0;
  var rate=parseFloat(formData.interest)||0;
  var preview='';
  if(amt>0){
    preview='<div class="preview-box"><div class="preview-label">Preview</div>'
      +'<div class="preview-row"><span>Valor emprestado</span><span>'+fmt(amt)+'</span></div>'
      +'<div class="preview-row"><span>Juros ('+rate+'%)</span><span style="color:#ef4444">+'+fmt(amt*rate/100)+'</span></div>'

    +'<div class="field"><label>Endereço</label><input class="inp" type="text" value="'+esc(formData.address||'')+'" placeholder="Rua, número..." oninput="formData.address=this.value"></div>'
    +'</div>'
    +'<div class="field-row">'
    +'<div class="field"><label>Valor (R$) *</label><input id="f-amt" class="inp" type="number" inputmode="decimal" value="'+esc(formData.amount)+'" placeholder="0,00" oninput="formData.amount=this.value;updatePreview()"></div>'
    +'<div class="field"><label>Data do empréstimo</label><input class="inp" type="date" value="'+formData.startDate+'" onchange="formData.startDate=this.value;updatePreview()"></div>'

    +'<div id="rate-hint-wrap">'+_taxaHintHtml()+'</div>'
    +'<div class="seg-control" id="rate-seg">'
    +rates.map(function(v){return'<button class="seg-btn'+(String(formData.interest)===v?' active':'')+'" data-rate="'+v+'" onclick="setRate(\''+v+'\',this)">'+v+'%</button>';}).join('')

    +'<div class="field"><label>Parcelas</label><div class="seg-control">'+['1','2','3','4','6','12'].map(function(v){return'<button class="seg-btn'+(String(formData.parcelas||'1')===v?' active':'')+'" onclick="setParcelas(\''+v+'\',this)">'+v+'x</button>';}).join('')+'</div></div>'
    +'<div id="form-preview">'+preview+'</div>'

function saveDoc(e,tipo){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var max=1000,w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}
      else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var data;try{data=cv.toDataURL('image/jpeg',0.7);}catch(err){data=ev.target.result;}
      if(tipo==='rg')formData.docRG=data;else formData.docResidencia=data;
      renderForm();
    };
    img.onerror=function(){if(tipo==='rg')formData.docRG=ev.target.result;else formData.docResidencia=ev.target.result;renderForm();};
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
}

// outra decisão: a taxa que ele tinha tocado era para o nome anterior.
function fillClient(idx){

// Remove um cliente salvo da lista de sugestões (e da nuvem).
function removeClient(idx){
  var c=clients[idx];if(!c)return;
  if(!confirm('Remover "'+c.name+'" da lista de clientes salvos?'))return;
  var k=clientKey(c.name);
  var temEmp=loans.some(function(l){return clientKey(l.name)===k;});
  clients.splice(idx,1);

function addLoan(){
  var amt=parseFloat(formData.amount);
  if(!formData.name.trim()||!amt||amt<=0){showToast('Preencha nome e valor','error');return;}
  var rate=parseFloat(formData.interest)/100;
  var start=formData.startDate||today();
  var nParc=parseInt(formData.parcelas)||1;
  var loan={
    id:uid(),name:formData.name.trim(),phone:formData.phone||'',address:formData.address||'',
    originalAmount:amt,principal:amt,interest:parseFloat(formData.interest),
    startDate:start,note:formData.note||'',
    paid:false,payments:[],
    docRG:'',docResidencia:'',
    // rate: a taxa fica congelada no lancamento — mudar o juro do cliente depois
    // nao pode reescrever o lucro de meses ja fechados.
    history:[{date:start,type:'emprestimo',value:amt,rate:parseFloat(formData.interest),note:'Empréstimo de '+fmt(amt)+' · Juros '+formData.interest+'%'+(nParc>1?' · '+nParc+'x':'')}]
  };
  // Fotos vão para o IndexedDB; o loan guarda só a chave
  ['docRG','docResidencia'].forEach(function(f){
    if(isDataUrl(formData[f])){var key='doc_'+loan.id+'_'+f;loan[f]=key;docSet(key,formData[f]);}
  });
  if(nParc>1){
    loan.parcelas=[];
    var acc=0;
    for(var k=1;k<=nParc;k++){
      var pPrin=(k<nParc)?parseFloat((amt/nParc).toFixed(2)):parseFloat((amt-acc).toFixed(2));
      acc=parseFloat((acc+pPrin).toFixed(2));
      loan.parcelas.push({id:uid(),n:k,principal:pPrin,currentAmount:parseFloat((pPrin*(1+rate)).toFixed(2)),dueDate:addDays(start,30*k),paid:false});
    }
    syncParceledLoan(loan);
  }else{
    loan.currentAmount=parseFloat((amt*(1+rate)).toFixed(2));
    loan.dueDate=addDays(start,30);
  }
  loans.push(loan);save(loan.id);renderAll();closeModal();
  showToast('✅ Empréstimo de '+loan.name+(nParc>1?' ('+nParc+'x)':'')+' adicionado');
}

// Estorno de um pagamento parcial lancado por engano NO PERIODO CORRENTE.
// O saldo volta a subir e fica um rastro no historico (nada some sem registro).
// idx e a posicao do pagamento em loan.payments (lancamentos antigos podem nao
// ter id, por isso a posicao — a janela e sempre redesenhada antes do clique).
function estornoPagamento(id,idx){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  idx=parseInt(idx,10);
  var p=(loan.payments||[])[idx];
  if(!p){showToast('Lançamento não encontrado (o período pode já ter sido fechado)','error');return;}
  if(!confirm('Estornar o pagamento de '+fmt(p.value)+' lançado em '+fmtDate(p.date)+'?\n\nO saldo devedor volta a subir '+fmt(p.value)+'.\nO estorno fica registrado no histórico.'))return;
  loan.payments.splice(idx,1);
  loan.history=loan.history||[];
  // pagamentoOriginal: a cópia do pagamento desfeito. Vai dentro do JSONB
  // history (nenhuma coluna nova). Sem ela o razão não teria como recriar o
  // pagamento no extrato nem fechar a conta — veja o comentário em _ledgerCalc.
  loan.history.push({type:'estorno',date:today(),value:p.value,
    pagamentoOriginal:{date:p.date,value:p.value,note:p.note||''},
    note:'Estorno do pagamento de '+fmt(p.value)+' lançado em '+fmtDate(p.date)+(p.note?' ('+p.note+')':'')});
  save(id);renderAll();               // save() ja marca o emprestimo como pendente de sincronizacao
  showToast('↩️ Estorno de '+fmt(p.value)+' registrado · saldo '+fmt(getBalance(loan)));
  openPay(id);                        // redesenha a janela com os numeros novos
}
// Desconto lancado pela janela de pagamento
function aplicarDesconto(id){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  if(loan.parcelas&&loan.parcelas.length){showToast('Empréstimo parcelado não aceita desconto por aqui','error');return;}
  var v=parseFloat((document.getElementById('pay-desc')||{}).value)||0;
  var motivo=((document.getElementById('pay-desc-note')||{}).value||'').trim();
  if(v<=0){showToast('⚠️ Informe o valor do desconto','error');return;}
  var bal=getBalance(loan);
  if(v>bal+0.009){showToast('Desconto maior que o saldo ('+fmt(bal)+')','error');return;}
  if(!motivo&&!confirm('Conceder '+fmt(v)+' de desconto sem informar o motivo?'))return;
  if(!confirm('Conceder desconto de '+fmt(v)+'?\n\nSaldo: '+fmt(bal)+' → '+fmt(parseFloat((bal-v).toFixed(2)))+'\nNão entra como dinheiro recebido nem no lucro.'))return;
  _regDesconto(loan,v,motivo);
  save(id);renderAll();closeModal();
  showToast('🏷️ Desconto de '+fmt(v)+' registrado'+(loan.paid?' · dívida encerrada':' · saldo '+fmt(getBalance(loan))));
}
function updatePayBtn(val,id){

  var box=document.getElementById('pay-split');

  var loan=id?loans.find(function(l){return l.id===id;}):null;

function doPartialModal(id){
  var el=document.getElementById('pay-input');if(!el)return;
  var note=(document.getElementById('pay-note')||{}).value||'';
  var v=parseFloat(el.value)||0;

function doPayment(id,amount,note){
  var loan=loans.find(function(l){return l.id===id;});if(!loan||amount<=0)return;
  var balance=getBalance(loan);
  amount=parseFloat(amount);
  if(amount>=balance-0.01){
    // Final — quita
    (loan.payments||[]).forEach(function(p){loan.history.push({date:p.date,type:'pagamento_parcial',value:p.value,note:p.note||''});});
    loan.history.push({date:today(),type:'pagamento_final',value:amount,note:(note?note+' · ':'')+'Dívida quitada! Pagamento de '+fmt(amount)});
    loan.paid=true;loan.currentAmount=0;loan.payments=[];
    showToast('✅ Dívida de '+loan.name+' quitada!');
  }else{
    // Parcial — adiciona ao array de pagamentos do período
    loan.payments=loan.payments||[];
    loan.payments.push({id:uid(),date:today(),value:amount,note:note||''});
    showToast('💳 '+fmt(amount)+' registrado para '+loan.name);
  }
  save(id);renderAll();closeModal();
}

function doRenew(id){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  // 1) desconto negociado (se houver) — abate o saldo antes do juro
  var desc=parseFloat((document.getElementById('rn-desc')||{}).value)||0;
  var dmot=((document.getElementById('rn-desc-note')||{}).value||'').trim();
  if(desc>0){
    var bal0=getBalance(loan);
    if(desc>bal0+0.009){showToast('Desconto maior que o saldo ('+fmt(bal0)+')','error');return;}
    if(!confirm('Renovar concedendo '+fmt(desc)+' de desconto?\n\nSaldo: '+fmt(bal0)+' → '+fmt(parseFloat((bal0-desc).toFixed(2)))+' antes do juro.'))return;
    _regDesconto(loan,desc,dmot);
    if(loan.paid){                       // desconto zerou tudo: nao ha o que renovar
      save(id);renderAll();closeModal();
      showToast('🏷️ Desconto de '+fmt(desc)+' — saldo zerado, dívida encerrada');
      return;
    }
  }
  // 2) renovacao normal: juro do mes cheio sobre o saldo
  var balance=getBalance(loan);
  var newTotal=parseFloat((balance*(1+loan.interest/100)).toFixed(2));
  // Move pagamentos do período para histórico
  (loan.payments||[]).forEach(function(p){loan.history.push({date:p.date,type:'pagamento_parcial',value:p.value,note:p.note||''});});
  loan.history.push({date:today(),type:'renovacao',value:balance,rate:loan.interest,
    note:'Renovado. Saldo: '+fmt(balance)+'. Juros '+loan.interest+'%: '+fmt(balance*loan.interest/100)+'. Novo total: '+fmt(newTotal)});
  loan.currentAmount=newTotal;
  loan.originalAmount=balance;
  loan.startDate=today();
  loan.dueDate=addDays(today(),30);
  loan.payments=[];
  save(id);renderAll();closeModal();
  showToast('🔄 Renovado! Novo total: '+fmt(newTotal)+(desc>0?' (desconto de '+fmt(desc)+')':''));
}

function saveEdit(id){
  var l=loans.find(function(x){return x.id===id;});if(!l)return;
  var name=document.getElementById('ed-name').value.trim();
  var phone=document.getElementById('ed-phone').value;
  var addr=document.getElementById('ed-addr').value;
  var note=(document.getElementById('ed-note')||{}).value||'';
  l.name=name||l.name;l.phone=phone;l.address=addr;l.note=note;
  if(!(l.parcelas&&l.parcelas.length)){
    var amount=parseFloat(document.getElementById('ed-amount').value);
    if(isNaN(amount)||amount<=0)amount=loanPrincipal(l);
    var interest=parseFloat(document.getElementById('ed-int').value);
    if(isNaN(interest))interest=l.interest;
    var start=document.getElementById('ed-start').value||l.startDate;
    var due=document.getElementById('ed-due').value||l.dueDate;
    if(loanRenovacoes(l)===0){
      // Nunca renovado: recalcular do zero esta certo (nao ha juros acumulado a perder)
      l.principal=parseFloat(amount.toFixed(2));
      l.originalAmount=parseFloat(amount.toFixed(2));
      l.interest=interest;
      l.currentAmount=parseFloat((amount*(1+interest/100)).toFixed(2));
    }else{
      // Ja renovado: o saldo acumulado e sagrado. So a DIFERENCA entra.
      var antes=loanPrincipal(l);
      var dif=parseFloat((amount-antes).toFixed(2));
      l.interest=interest;
      if(dif!==0){
        var saldoAntes=l.currentAmount||0;
        var delta=parseFloat((dif*(1+interest/100)).toFixed(2));
        l.currentAmount=parseFloat((saldoAntes+delta).toFixed(2));
        l.principal=parseFloat(amount.toFixed(2));
        l.originalAmount=parseFloat(((l.originalAmount||0)+dif).toFixed(2));
        l.history=l.history||[];
        l.history.push({type:'ajuste',date:today(),value:delta,
          note:'Ajuste do valor emprestado: '+fmt(antes)+' → '+fmt(amount)+'. Saldo '+(delta>=0?'+':'')+fmt(delta)+' (diferença de '+fmt(dif)+' com juros '+interest+'%). Saldo: '+fmt(saldoAntes)+' → '+fmt(l.currentAmount)});
      }
    }
    l.startDate=start;l.dueDate=due;
  }
  editingId=null;
  save(id);renderAll();closeModal();showToast('✅ Atualizado!');
}

// Rotulo, cor e sinal de cada tipo de lancamento do historico.
// Novos tipos: desconto (abate saldo, NAO e dinheiro recebido) e estorno
// (pagamento lancado por engano e desfeito).
function _histLabel(t,current){
  if(t==='emprestimo'||t==='empréstimo')return{label:'💵 Empréstimo',cor:'#3b82f6',valCor:'#ef4444',sinal:'-'};
  if(t==='pagamento_final')return{label:'✅ Quitado',cor:'#22c55e',valCor:'#22c55e',sinal:'+'};
  if(t==='renovacao')return{label:'🔄 Renovação',cor:'#f59e0b',valCor:'#f59e0b',sinal:'+'};
  if(t==='ajuste')return{label:'⚖️ Ajuste',cor:'#7c3aed',valCor:'#7c3aed',sinal:'+'};
  if(t==='desconto')return{label:'🏷️ Desconto',cor:'#0d9488',valCor:'#0d9488',sinal:'-'};
  if(t==='estorno')return{label:'↩️ Estorno',cor:'#dc2626',valCor:'#dc2626',sinal:'-'};
  return{label:'💳 Pagamento'+(current?' (mês atual)':''),cor:'#22c55e',valCor:'#22c55e',sinal:'+'};
}
// Cores do extrato novo (o rótulo e o sinal vêm do ledger, não daqui).
function _ledgerCores(t){
  t=t||'';
  if(t==='emprestimo'||t==='empréstimo')return{cor:'#3b82f6',valCor:'#ef4444'};
  if(t==='renovacao')return{cor:'#f59e0b',valCor:'#f59e0b'};
  if(t==='ajuste')return{cor:'#7c3aed',valCor:'#7c3aed'};
  if(t==='desconto')return{cor:'#0d9488',valCor:'#0d9488'};
  if(t==='estorno')return{cor:'#dc2626',valCor:'#dc2626'};
  if(t.indexOf('pagamento')>=0)return{cor:'#22c55e',valCor:'#22c55e'};
  return{cor:'#94a3b8',valCor:'#64748b'};
}
function openHistory(id){
  var l=allRecords().find(function(x){return x.id===id;});if(!l)return;
  var ehInad=loans.indexOf(l)<0;                       // veio da lista de inadimplentes
  var parceled=!!(l.parcelas&&l.parcelas.length);
  var balance=getBalance(l);var paidPeriod=getPaidPeriod(l);
  // ===== EXTRATO desenhado a partir do RAZÃO =====
  // Uma linha por evento, na ordem real dos fatos, com o saldo resultante ao
  // lado. A renovação NÃO leva sinal de dinheiro: ela não é entrada nem saída,
  // é o saldo rolando com o juro do mês seguinte. Era esse "+R$ 1.300" que fazia
  // o dono achar que o histórico não batia.
  var lg=ledger(l);
  var totalDesc=lg.descontoTotal;
  var periodoAtual=null;
  var histHtml=lg.linhas.map(function(li){
    var m=_ledgerCores(li.tipo);
    var sep='';
    if(li.periodo!==periodoAtual){
      periodoAtual=li.periodo;
      sep='<div style="display:flex;align-items:center;gap:7px;margin:12px 0 6px">'
        +'<div style="height:1px;flex:1;background:#e2e8f0"></div>'
        +'<div style="font-size:8px;font-weight:700;color:#94a3b8;letter-spacing:1px">PERÍODO '+li.periodo+'</div>'
        +'<div style="height:1px;flex:1;background:#e2e8f0"></div></div>';
    }
    // Rótulo. Na renovação o juro cobrado vai junto do texto, não na coluna do dinheiro.
    var rot=esc(li.rotulo);
    if(li.tipo==='renovacao')rot+=' <span style="font-weight:600;color:#b45309">· juro '+fmt(li.juroCobrado)+'</span>';
    else if(li.tipo==='emprestimo'||li.tipo==='empréstimo')rot+=' <span style="font-weight:600;color:#b45309">· juro '+fmt(li.juroCobrado)+'</span>';
    if(li.atual)rot+=' <span style="font-size:9px;color:#b45309;font-weight:700">(mês atual)</span>';
    if(li.estornado)rot+=' <span style="font-size:9px;color:#dc2626;font-weight:700">(estornado)</span>';
    // Coluna do dinheiro: só quem de fato movimentou caixa.
    var valHtml=li.sinal
      ?'<div style="font-size:12px;font-weight:700;color:'+m.valCor+'">'+(li.sinal==='-'?'−':'+')+fmt(li.valor)+'</div>'
      :'<div style="font-size:11px;color:#cbd5e1">—</div>';
    // A divisão do pagamento: quanto foi juro, quanto abateu a dívida.
    var divisao='';
    if(li.tipo&&li.tipo.indexOf('pagamento')>=0){
      divisao=(li.parteCapital>0.004)

// Move UM emprestimo para inadimplentes (os outros do mesmo cliente ficam ativos).
// Chamado pelo botao dentro de openHistory.
function moveToInad(id){
  var loan=loans.find(function(l){return l.id===id;});if(!loan)return;
  var outros=loans.filter(function(l){return clientKey(l.name)===clientKey(loan.name)&&l.id!==id&&!l.paid;}).length;
  var aviso='Mover só este empréstimo de '+loan.name+' ('+fmt(getBalance(loan))+') para inadimplentes?';
  if(outros>0)aviso+='\n\nOs outros '+outros+' empréstimo(s) ativo(s) deste cliente continuam normais.';
  if(loan.parcelas&&loan.parcelas.length)aviso+='\n\n⚠️ Empréstimo parcelado: as parcelas viram um saldo único de '+fmt(getBalance(loan))+'.';
  if(!confirm(aviso))return;
  var motivo=prompt('Motivo (ex: sumiu, número desligado):');
  if(motivo===null)return;                  // usuario desistiu: nao move nada
  motivo=motivo.trim()||'Sem contato';
  var saldo=getBalance(loan);
  _histPagamentosPeriodo(loan); // preserva no historico o que ele ja tinha pago
  inadimplentes.push({
    id:loan.id,name:loan.name,phone:loan.phone||'',address:loan.address||'',
    originalAmount:loan.originalAmount,currentAmount:saldo,
    startDate:loan.startDate,dueDate:loan.dueDate,interest:loan.interest,
    docRG:loan.docRG||'',docResidencia:loan.docResidencia||'',
    motivo:motivo,movidoEm:today(),history:loan.history||[]
  });
  loans=loans.filter(function(l){return l.id!==id;});
  // saiu de verdade da tabela emprestimos: sem isto ele volta no proximo pull
  addTombstone('emprestimos',id);
  delete expandedCards[id];deleteConfirm=null;
  saveInad(id);save();renderAll();closeModal();
  showToast('⚠️ Movido para inadimplentes');
}
// Move os pagamentos do periodo atual para o historico (nao se perde o que ja foi pago)
function _histPagamentosPeriodo(loan){
  if(!loan)return;
  loan.history=loan.history||[];
  (loan.payments||[]).forEach(function(p){
    loan.history.push({date:p.date,type:'pagamento_parcial',value:p.value,note:p.note||''});
  });
  loan.payments=[];
}
function moveClientToInad(key){
  var clientLoans=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;});
  if(!clientLoans.length){showToast('Cliente não tem empréstimos ativos');return;}
  var nome=clientLoans[0].name;
  var motivo=prompt('Motivo para marcar '+nome+' como inadimplente (ex: sumiu, número desligado):');
  if(motivo===null)return;
  motivo=motivo.trim()||'Sem contato';
  var movidos=[];
  clientLoans.forEach(function(loan){
    var saldo=getBalance(loan);
    _histPagamentosPeriodo(loan); // preserva no historico o que ele ja tinha pago
    inadimplentes.push({
      id:loan.id,name:loan.name,phone:loan.phone||'',address:loan.address||'',
      originalAmount:loan.originalAmount,currentAmount:saldo,
      startDate:loan.startDate,dueDate:loan.dueDate,interest:loan.interest,
      docRG:loan.docRG||'',docResidencia:loan.docResidencia||'',
      motivo:motivo,movidoEm:today(),history:loan.history||[]
    });
    movidos.push(loan.id);
    addTombstone('emprestimos',loan.id); // saiu de verdade da tabela emprestimos
    delete expandedCards[loan.id];
  });
  loans=loans.filter(function(l){return!(clientKey(l.name)===key&&!l.paid);});
  delete expandedGroups[key];deleteConfirm=null;
  saveInad(movidos);save();renderAll();
  showToast('⚠️ '+nome+' movido para inadimplentes');
}
function renderInad(){

  var html='';

    html+=inadimplentes.map(function(i){

        +'<div style="flex:1;min-width:0"><div class="client-name" style="color:#374151">'+esc(i.name)+'</div>'
        +'<div class="client-sub">'+esc(i.motivo)+' · desde '+fmtDate(i.movidoEm)+'</div></div>'
        +'<div style="text-align:right;flex-shrink:0"><div style="font-size:13px;font-weight:800;color:#dc2626">'+fmt(i.currentAmount)+'</div><div style="font-size:9px;color:#94a3b8">'+(i.interest||0)+'%/mês</div></div>'
        +'</div>'
        +'<div style="padding:0 12px 7px;font-size:10px;color:#b45309">Próx. juros em '+prox+' · saldo cresce '+(i.interest||0)+'% ao mês</div>'
        +'<div class="inad-actions">'
        +(phone?'<button onclick="window.open(\''+waLink(phone)+'\',\'_blank\')" style="flex:1;background:#064e3b;color:#34d399;border:none;border-radius:7px;padding:7px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit">WA Contato</button>':'')
        +'<button onclick="reativarInad(\''+i.id+'\')" style="flex:1;background:#fff;color:#374151;border:0.5px solid #e2e8f0;border-radius:7px;padding:7px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit">↩ Reativar</button>'
        +'<button onclick="excluirInad(\''+i.id+'\')" style="padding:7px 10px;background:#fef2f2;color:#dc2626;border:0.5px solid #fca5a5;border-radius:7px;font-size:11px;cursor:pointer;font-family:inherit">🗑️</button>'
        +'</div></div>';
    }).join('');
  }
  document.getElementById('inad-content').innerHTML=html;
  updateInadBadge();
}
function reativarInad(id){
  var i=inadimplentes.find(function(x){return x.id===id;});if(!i)return;
  loans.push({id:i.id,name:i.name,phone:i.phone,address:i.address,principal:loanPrincipal(i),originalAmount:i.originalAmount,currentAmount:i.currentAmount,interest:i.interest,startDate:i.startDate,dueDate:i.dueDate,note:'Reativado',paid:false,payments:[],docRG:i.docRG||'',docResidencia:i.docResidencia||'',history:i.history||[]});
  inadimplentes=inadimplentes.filter(function(x){return x.id!==id;});
  addTombstone('inadimplentes',id); // saiu de verdade da tabela inadimplentes
  saveInad();save(id);renderAll();
  showToast('✅ Reativado!');
}
function excluirInad(id){
  if(!confirm('Excluir definitivamente?'))return;
  var i=inadimplentes.find(function(x){return x.id===id;});
  if(i){if(!isDataUrl(i.docRG))docDel(i.docRG);if(!isDataUrl(i.docResidencia))docDel(i.docResidencia);}
  inadimplentes=inadimplentes.filter(function(x){return x.id!==id;});
  addTombstone('inadimplentes',id);
  saveInad();renderInad();updateInadBadge();
  showToast('Excluído');
}

// Report filter state
var _rPeriod='all';var _rStatus='all';var _rClient='';var _rFrom='';var _rTo='';var expandedReportGroups={};

function getReportRange(){
  if(_rPeriod==='custom')return{from:_rFrom||null,to:_rTo||null};
  if(_rPeriod==='all')return{from:null,to:null};
  var now=new Date();var c=new Date(now);
  if(_rPeriod==='1m')c.setMonth(c.getMonth()-1);
  else if(_rPeriod==='3m')c.setMonth(c.getMonth()-3);
  else if(_rPeriod==='6m')c.setMonth(c.getMonth()-6);
  else if(_rPeriod==='1y')c.setFullYear(c.getFullYear()-1);
  return{from:dStr(c),to:today()};
}
function reportFiltered(){
  var r=getReportRange();var q=(_rClient||'').trim().toLowerCase();
  return loans.filter(function(l){
    if(!loanActiveInRange(l,r.from,r.to))return false;
    if(_rStatus==='active'&&l.paid)return false;
    if(_rStatus==='overdue'&&(l.paid||daysUntil(l.dueDate)>=0))return false;
    if(_rStatus==='paid'&&!l.paid)return false;
    if(q&&(l.name||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
// Inadimplentes que entram no relatorio (mesmos filtros de periodo e nome).
// Nos filtros "Ativos" e "Quitados" eles nao aparecem — nao sao nem um nem outro.
function reportFilteredInad(){
  if(_rStatus==='active'||_rStatus==='paid')return [];
  var r=getReportRange();var q=(_rClient||'').trim().toLowerCase();
  return (inadimplentes||[]).filter(function(i){
    if(!loanActiveInRange(i,r.from,r.to))return false;
    if(q&&(i.name||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}

    +'<span style="font-size:10px;color:#94a3b8;white-space:nowrap">até</span>'
    +'<input type="date" value="'+(_rTo||'')+'" onchange="setRTo(this.value)" style="'+ds+'">'
    +(_rPeriod==='custom'?'<button onclick="clearRDates()" title="Limpar datas" style="background:#f1f5f9;border:0.5px solid #e2e8f0;border-radius:8px;padding:7px 9px;font-size:11px;cursor:pointer;font-family:inherit;color:#64748b">✕</button>':'')
    +'</div>'
    +'<div style="display:flex;align-items:center;gap:6px;background:#f8fafc;border:0.5px solid #e2e8f0;border-radius:9px;padding:7px 10px">'
    +'<span style="font-size:13px;color:#94a3b8">🔍</span>'
    +'<input id="r-client-input" type="text" placeholder="Buscar cliente por nome..." value="'+esc(_rClient)+'" oninput="setRClient(this.value)" style="flex:1;border:none;background:transparent;outline:none;font-size:12px;font-family:inherit;color:#0f172a">'
    +'</div>'
    +'</div>'
    +'<div id="report-body"></div>';
  document.getElementById('report-content').innerHTML=html;
  renderReportBody();
}
function renderReportBody(){
  var body=document.getElementById('report-body');if(!body)return;
  var rr=getReportRange();
  var filtered=reportFiltered();
  var fInad=reportFilteredInad(); // capital e juros de quem atrasou continuam contando
  // Descontos concedidos DENTRO do periodo filtrado (nao sao receita nem capital:
  // e o que se deixou de receber, entao aparece em card proprio)
  var totalDesc=filtered.reduce(function(s,l){return s+descontosPeriodo(l,rr.from,rr.to);},0)
    +fInad.reduce(function(s,i){return s+descontosPeriodo(i,rr.from,rr.to);},0);
  var totalCapital=filtered.reduce(function(s,l){return s+loanPrincipal(l);},0)
    +fInad.reduce(function(s,i){return s+loanPrincipal(i);},0);
  var totalAberto=filtered.filter(function(l){return!l.paid;}).reduce(function(s,l){return s+getBalance(l);},0);
  var totalJuros=filtered.reduce(function(s,l){return s+loanJuros(l);},0)
    +fInad.reduce(function(s,i){return s+loanJuros(i);},0);
  var vencidos=filtered.filter(function(l){return!l.paid&&daysUntil(l.dueDate)<0;}).length;
  var quitados=filtered.filter(function(l){return l.paid;}).length;
  var ativos=filtered.filter(function(l){return!l.paid;}).length;
  var cn={};filtered.forEach(function(l){cn[clientKey(l.name)]=1;});
  var nClients=Object.keys(cn).length;
  function mCard(label,val,color,largo,sub){
    return'<div style="background:#fff;border:0.5px solid #e2e8f0;border-radius:11px;padding:10px 12px'+(largo?';grid-column:1/-1':'')+'">'
      +'<div style="font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px">'+label+'</div>'
      +'<div style="font-size:15px;font-weight:800;color:'+(color||'#1e293b')+'">'+val+'</div>'
      +(sub?'<div style="font-size:9px;color:#94a3b8;margin-top:2px">'+sub+'</div>':'')+'</div>';
  }
  var html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px 12px 6px">'
    +mCard('Capital emprestado',fmt(totalCapital),'#1d4ed8')
    +mCard('Em aberto',fmt(totalAberto),'#d97706')
    +mCard('Juros ganhos',fmt(totalJuros),'#16a34a')
    +mCard('Emprestimos',filtered.length+' · '+nClients+' cliente'+(nClients!==1?'s':''),'#374151')
    +mCard('Descontos concedidos',(totalDesc>0?'-':'')+fmt(totalDesc),totalDesc>0?'#0d9488':'#94a3b8',true,'Abatido do saldo por acordo — não é dinheiro recebido nem entra no lucro')
    +'</div>';
  html+='<div style="display:flex;gap:6px;padding:0 12px 8px">'
    +'<div style="flex:1;background:#f0fdf4;border:0.5px solid #bbf7d0;border-radius:9px;padding:7px;text-align:center"><div style="font-size:13px;font-weight:800;color:#16a34a">'+quitados+'</div><div style="font-size:9px;color:#15803d">Quitados</div></div>'
    +'<div style="flex:1;background:#eff6ff;border:0.5px solid #bfdbfe;border-radius:9px;padding:7px;text-align:center"><div style="font-size:13px;font-weight:800;color:#2563eb">'+ativos+'</div><div style="font-size:9px;color:#1d4ed8">Ativos</div></div>'
    +'<div style="flex:1;background:#fef2f2;border:0.5px solid #fca5a5;border-radius:9px;padding:7px;text-align:center"><div style="font-size:13px;font-weight:800;color:#dc2626">'+vencidos+'</div><div style="font-size:9px;color:#991b1b">Vencidos</div></div>'
    +'<div style="flex:1;background:#fef2f2;border:0.5px solid #fecaca;border-radius:9px;padding:7px;text-align:center"><div style="font-size:13px;font-weight:800;color:#b45309">'+fInad.length+'</div><div style="font-size:9px;color:#92400e">Inadimplentes</div></div>'
    +'</div>';
  // Como os clientes do filtro se comportam. Conta CLIENTE, não empréstimo —
  // por isso passa pelo clientKey. Some quando não há nenhum classificado.
  var nSoJuro=0,nAmortiza=0;
  Object.keys(cn).forEach(function(k){
    var t=clientPerfil(k).tipo;
    if(t==='so_juro')nSoJuro++;else if(t==='amortiza')nAmortiza++;
  });
  if(nSoJuro||nAmortiza){
    var partes=[];
    if(nSoJuro)partes.push(nSoJuro+(nSoJuro===1?' paga':' pagam')+' só o juro');
    if(nAmortiza)partes.push(nAmortiza+(nAmortiza===1?' vai':' vão')+' abatendo');
    html+='<div style="padding:0 12px 8px;font-size:10px;color:#94a3b8">'+partes.join(' · ')+'</div>';
  }
  if(!filtered.length){
    html+='<div class="empty-state" style="padding:30px 0"><div class="empty-icon">🔍</div><div style="font-weight:600">Nenhum resultado</div><div style="font-size:11px;margin-top:3px">Ajuste os filtros acima</div></div>';
  }else{
    var groups={};
    filtered.forEach(function(l){var k=clientKey(l.name);if(!groups[k])groups[k]={key:k,name:l.name,loans:[]};groups[k].loans.push(l);});
    var arr=Object.keys(groups).map(function(k){return groups[k];});
    arr.sort(function(a,b){
      var ao=a.loans.some(function(l){return!l.paid&&daysUntil(l.dueDate)<0;});
      var bo=b.loans.some(function(l){return!l.paid&&daysUntil(l.dueDate)<0;});
      if(ao!==bo)return ao?-1:1;
      var aa=a.loans.every(function(l){return l.paid;});
      var ba=b.loans.every(function(l){return l.paid;});
      if(aa!==ba)return aa?1:-1;
      return a.name.localeCompare(b.name);
    });
    html+='<div style="padding:0 12px 2px"><div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">'+arr.length+' cliente'+(arr.length!==1?'s':'')+'</div></div>';
    html+='<div style="padding:0 12px">'+arr.map(renderReportGroup).join('')+'</div>';
  }
  body.innerHTML=html;
}
function renderReportGroup(g){
  var key=g.key;
  var exp=!!expandedReportGroups[key];
  var active=g.loans.filter(function(l){return!l.paid;});
  var bal=active.reduce(function(s,l){return s+getBalance(l);},0);
  var allPaid=g.loans.every(function(l){return l.paid;});
  var hasOver=g.loans.some(function(l){return!l.paid&&daysUntil(l.dueDate)<0;});
  var accent=hasOver?'#ef4444':allPaid?'#22c55e':'#2563eb';
  var bgAv=hasOver?'#fef2f2':allPaid?'#f0fdf4':'#eff6ff';
  var stText=allPaid?'Quitado':hasOver?'Vencido':active.length+' ativo'+(active.length!==1?'s':'');
  var stBg=hasOver?'#fef2f2':allPaid?'#f0fdf4':'#eff6ff';
  var stTc=hasOver?'#dc2626':allPaid?'#16a34a':'#1d4ed8';
  var rows='';
  if(exp){
    var r=getReportRange();
    var ev=clientEvents(g.loans,r.from,r.to);
    if(!ev.length){
      rows='<div style="padding:10px 12px;border-top:0.5px solid #f1f5f9;font-size:10px;color:#94a3b8;text-align:center">Sem movimentações no período</div>';
    }else{
      rows='<div style="border-top:0.5px solid #f1f5f9">'+ev.slice(0,60).map(function(h){
        var isB=h.kind==='borrow',isP=h.kind==='pay',isR=h.kind==='renew';
        var label=isB?'Emprestou':isP?'Pagou':isR?'Renovou':'Evento';
        var color=isB?'#dc2626':isP?'#16a34a':isR?'#b45309':'#64748b';
        var sign=isB?'− ':isP?'+ ':'';
        return'<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:0.5px solid #f1f5f9">'
          +'<div><div style="font-size:11px;font-weight:600;color:#334155">'+label+'</div><div style="font-size:9px;color:#94a3b8">'+fmtDate(h.date)+'</div></div>'
          +(h.value>0?'<div style="font-size:12px;font-weight:700;color:'+color+';white-space:nowrap">'+sign+fmt(h.value)+'</div>':'')
          +'</div>';
      }).join('')+'</div>';
    }
  }
  return'<div style="background:#fff;border:0.5px solid #e2e8f0;border-left:3px solid '+accent+';border-radius:11px;margin-bottom:7px;overflow:hidden">'
    +'<div onclick="toggleReportGroup(\''+key+'\')" style="padding:10px 12px;display:flex;align-items:center;gap:9px;cursor:pointer">'
    +'<div style="width:30px;height:30px;border-radius:50%;background:'+bgAv+';color:'+accent+';display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">'+g.name.charAt(0).toUpperCase()+'</div>'
    +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700;color:#0f172a">'+esc(g.name)+'</div>'
    +'<div style="font-size:10px;color:#64748b">'+fmt(bal)+' em aberto · '+g.loans.length+' empréstimo'+(g.loans.length!==1?'s':'')+'</div></div>'
    +'<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:'+stBg+';color:'+stTc+';flex-shrink:0">'+stText+'</span>'
    +'<span style="font-size:10px;color:#94a3b8">'+(exp?'↑':'↓')+'</span>'
    +'</div>'+rows+'</div>';
}
function toggleReportGroup(key){
  if(expandedReportGroups[key])delete expandedReportGroups[key];
  else expandedReportGroups[key]=true;
  renderReportBody();
}
function setRPeriod(v){_rPeriod=v;if(v!=='custom'){_rFrom='';_rTo='';}renderReport();}
function setRStatus(v){_rStatus=v;renderReport();}
function setRClient(v){_rClient=v;renderReportBody();}
function setRFrom(v){_rFrom=v;_rPeriod='custom';renderReport();}
function setRTo(v){_rTo=v;_rPeriod='custom';renderReport();}
function clearRDates(){_rFrom='';_rTo='';_rPeriod='all';renderReport();}

function openPayAll(key){
  var clientLoans=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;});
  if(!clientLoans.length){showToast('Nenhum empréstimo ativo','error');return;}
  var totalBal=clientLoans.reduce(function(s,l){return s+getBalance(l);},0);
  var nome=clientLoans[0].name;
  modal('<div class="modal-header"><span class="modal-title">💳 Pagar — '+esc(nome)+'</span><button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div style="margin-bottom:10px"><div style="font-size:11px;color:#64748b;margin-bottom:4px">Total em aberto ('+clientLoans.length+' empréstimos)</div>'
    +'<div style="font-size:20px;font-weight:800;color:#1d4ed8">'+fmt(totalBal)+'</div></div>'
    +'<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:#374151;display:block;margin-bottom:5px">Valor pago (R$)</label>'
    +'<input id="payall-val" type="number" step="0.01" placeholder="0,00" value="'+totalBal.toFixed(2)+'" style="width:100%;box-sizing:border-box;background:#f8fafc;border:0.5px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit;outline:none"></div>'
    +'<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:#374151;display:block;margin-bottom:5px">Observação (opcional)</label>'
    +'<input id="payall-note" type="text" placeholder="Ex: PIX, dinheiro..." style="width:100%;box-sizing:border-box;background:#f8fafc;border:0.5px solid #e2e8f0;border-radius:8px;padding:9px 12px;font-size:12px;font-family:inherit;outline:none"></div>'
    +'<button class="btn-primary" onclick="doPayAll(\''+key+'\')"  style="width:100%">✅ Confirmar pagamento</button>');
}
function doPayAll(key){
  var val=parseFloat((document.getElementById('payall-val')||{}).value||0);
  var note=(document.getElementById('payall-note')||{}).value||'';
  if(!val||val<=0){showToast('Informe o valor','error');return;}
  var clientLoans=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;});
  var remaining=val;
  clientLoans.sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);});
  clientLoans.forEach(function(loan){
    if(remaining<=0)return;
    if(loan.parcelas&&loan.parcelas.length){
      loan.parcelas.slice().sort(function(a,b){return new Date(a.dueDate+'T00:00:00')-new Date(b.dueDate+'T00:00:00');}).forEach(function(p){
        if(remaining<=0||p.paid)return;
        if(remaining>=(p.currentAmount||0)-0.01){
          remaining=parseFloat((remaining-p.currentAmount).toFixed(2));
          p.paid=true;p.paidDate=today();
          loan.history.push({date:today(),type:'pagamento_final',value:p.currentAmount,note:'Parcela '+p.n+' (pagar tudo)'});
        }
      });
      // Sobra menor que a próxima parcela: abate parcialmente em vez de sumir
      if(remaining>0.009){
        var prox=loan.parcelas.filter(function(p){return!p.paid;}).sort(function(a,b){return new Date(a.dueDate+'T00:00:00')-new Date(b.dueDate+'T00:00:00');})[0];
        if(prox){
          var ap=Math.min(remaining,prox.currentAmount||0);
          prox.currentAmount=parseFloat(((prox.currentAmount||0)-ap).toFixed(2));
          remaining=parseFloat((remaining-ap).toFixed(2));
          loan.history.push({date:today(),type:'pagamento_parcial',value:ap,note:'Abatimento parcial parcela '+prox.n+' (pagar tudo)'});
        }
      }
      syncParceledLoan(loan);
      return;
    }
    var bal=getBalance(loan);
    var pay=Math.min(remaining,bal);
    remaining=parseFloat((remaining-pay).toFixed(2));
    if(pay>=bal){
      loan.paid=true;
      loan.history.push({date:today(),type:'pagamento_total',description:'Pagamento total (pagar tudo)',value:pay,note:note});
      loan.payments=[];
    }else{
      loan.payments.push({id:Date.now()+'_'+loan.id,date:today(),value:pay,note:note||'Pagar tudo parcial'});
    }
  });
  save();renderAll();closeModal();
  showToast('✅ Pagamento de '+fmt(val)+' registrado!');
}

function sendWA(id){
  var l=loans.find(function(x){return x.id===id;});if(!l||!l.phone)return;
  var d=daysUntil(l.dueDate);var balance=getBalance(l);
  var msg=d<0
    ?'Olá '+l.name+'! Seu empréstimo está *vencido há '+Math.abs(d)+' dia(s)*. Saldo: *'+fmt(balance)+'*. Entre em contato.'
    :d<=3
    ?'Olá '+l.name+'! Seu empréstimo vence em '+d+' dia(s) ('+fmtDate(l.dueDate)+'). Saldo: *'+fmt(balance)+'*.'
    :'Olá '+l.name+'! Lembrando que seu empréstimo vence em '+fmtDate(l.dueDate)+'. Saldo: *'+fmt(balance)+'*.';
  window.open(waLink(l.phone)+'?text='+encodeURIComponent(msg),'_blank');
}
function sendWAGroup(key){
  var g=loans.filter(function(l){return clientKey(l.name)===key&&!l.paid;}).sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);})[0];
  if(g)sendWA(g.id);
}

function openBackup(){
  modal('<div class="modal-header"><span class="modal-title">📥 Backup & Restaurar</span><button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:5px">Exportar</div>'
    +'<div style="display:flex;flex-direction:column;gap:6px">'
    +'<button class="btn-primary" onclick="downloadBackup()">⬇️ Baixar arquivo (.json)</button>'
    +'<button class="btn-secondary" onclick="copyBackup()">📋 Copiar dados</button></div></div>'
    +'<div style="border-top:0.5px solid #e2e8f0;padding-top:12px"><div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:5px">Restaurar</div>'
    +'<div style="font-size:10px;color:#64748b;margin-bottom:6px">Cole o backup. <strong style="color:#dc2626">Substitui todos os dados atuais.</strong></div>'
    +'<textarea id="restore-input" placeholder="Cole o backup aqui..." style="width:100%;background:#f8fafc;border:0.5px solid #d1d5db;border-radius:8px;padding:9px 11px;font-size:10px;font-family:monospace;outline:none;resize:vertical;min-height:65px"></textarea>'
    +'<div style="display:flex;gap:7px;margin-top:7px">'
    +'<label style="flex:1;background:#f1f5f9;color:#374151;border:0.5px solid #e2e8f0;border-radius:8px;padding:9px;font-size:11px;font-weight:600;text-align:center;cursor:pointer">📁 Abrir arquivo<input type="file" accept=".json" style="display:none" onchange="loadFile(event)"></label>'
    +'<button onclick="restoreBackup()" style="flex:1;background:#fef2f2;color:#dc2626;border:0.5px solid #fca5a5;border-radius:8px;padding:9px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🔁 Restaurar</button>'
    +'</div></div>');
}
// Junta todas as fotos referenciadas (IndexedDB ou base64 legado) num mapa {chave:base64}
function collectDocs(){
  var refs=[];
  loans.concat(inadimplentes||[]).forEach(function(o){
    ['docRG','docResidencia'].forEach(function(f){if(o[f]&&!isDataUrl(o[f]))refs.push(o[f]);});
  });
  if(!refs.length)return Promise.resolve({});
  return Promise.all(refs.map(function(k){return docGet(k).then(function(d){return{k:k,d:d};}).catch(function(){return{k:k,d:null};});}))
    .then(function(list){var m={};list.forEach(function(x){if(x.d)m[x.k]=x.d;});return m;});
}
function buildBackup(){
  return collectDocs().then(function(docs){
    return {loans:loans,clients:clients,inadimplentes:inadimplentes,docs:docs,exportedAt:new Date().toISOString()};
  });
}
function markBackup(){localStorage.setItem('emp_last_backup',String(Date.now()));}
function downloadBackup(){buildBackup().then(function(obj){var data=JSON.stringify(obj,null,2);var blob=new Blob([data],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='emprestimos-'+today()+'.json';a.click();URL.revokeObjectURL(url);markBackup();showToast('📥 Backup baixado!');});}
function copyBackup(){buildBackup().then(function(obj){navigator.clipboard.writeText(JSON.stringify(obj)).then(function(){markBackup();showToast('📋 Copiado!');});});}
function loadFile(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var el=document.getElementById('restore-input');if(el)el.value=ev.target.result;};r.readAsText(f);}
function restoreBackup(){
  var raw=(document.getElementById('restore-input')||{}).value||'';
  if(!raw.trim()){showToast('Cole os dados primeiro','error');return;}
  try{
    var p=JSON.parse(raw);
    if(!Array.isArray(p.loans))throw new Error('inválido');
    loans=p.loans;clients=p.clients||[];inadimplentes=p.inadimplentes||[];
    migrateLoans(loans);
    // Devolve as fotos do backup para o IndexedDB
    var docs=p.docs||{};var keys=Object.keys(docs);
    var writeDocs=keys.length?Promise.all(keys.map(function(k){return docSet(k,docs[k]).catch(function(){});})):Promise.resolve();
    writeDocs.then(function(){
      save();saveInad();renderAll();closeModal();
      showToast('✅ '+loans.length+' empréstimos restaurados!');
    });
  }catch(e){showToast('Arquivo inválido','error');}
}
