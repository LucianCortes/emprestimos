<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Empréstimos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface2: #f9fafb;
    --border: #e5e7eb;
    --border2: #d1d5db;
    --blue: #2563eb;
    --blue-light: #3b82f6;
    --blue-dim: #eff6ff;
    --blue-border: #bfdbfe;
    --green: #16a34a;
    --green-light: #22c55e;
    --green-dim: #f0fdf4;
    --green-border: #bbf7d0;
    --red: #dc2626;
    --red-light: #ef4444;
    --red-dim: #fef2f2;
    --red-border: #fca5a5;
    --orange: #d97706;
    --orange-light: #f59e0b;
    --orange-dim: #fffbeb;
    --orange-border: #fcd34d;
    --yellow: #ca8a04;
    --yellow-light: #fbbf24;
    --text: #111827;
    --text2: #374151;
    --text3: #6b7280;
    --text4: #9ca3af;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans); }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

  /* ── TOAST ── */
  #toast { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: #fff; border: 0.5px solid #e5e7eb; border-left: 3px solid var(--green); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--text); min-width: 220px; animation: slideInRight .3s ease; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .toast.warn { border-left-color: var(--orange); }
  .toast.error { border-left-color: var(--red); }
  @keyframes slideInRight { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }

  /* ── HEADER ── */
  header { background: #ffffff; border-bottom: 1px solid var(--border); padding: 20px 20px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .header-inner { max-width: 700px; margin: 0 auto; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .logo { display: flex; flex-direction: column; }
  .logo-sub { font-size: 10px; color: var(--blue); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
  .logo-main { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -.5px; }
  .btn-new { background: var(--blue); color: #fff; border: none; border-radius: 12px; padding: 12px 22px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--sans); display: flex; align-items: center; gap: 6px; transition: background .2s, transform .1s; }
  .btn-new:hover { background: var(--blue-light); }
  .btn-new:active { transform: scale(.97); }

  /* ── STATS GRID ── */
  .stats-main { background: linear-gradient(135deg, #0d2040 0%, #091528 100%); border: 1px solid var(--blue-dim); border-radius: 16px; padding: 20px; margin-bottom: 10px; text-align: center; }
  .stats-main-label { font-size: 10px; color: var(--blue-light); text-transform: uppercase; letter-spacing: 3px; font-weight: 600; margin-bottom: 6px; }
  .stats-main-value { font-size: 36px; font-weight: 800; color: var(--text); font-family: var(--mono); letter-spacing: -2px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .stats-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; text-align: center; }
  .stat-card.dashed { border-style: dashed; }
  .stat-label { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
  .stat-value { font-size: 17px; font-weight: 700; font-family: var(--mono); color: var(--text2); }
  .stat-value.green { color: var(--green-light); }
  .stat-value.blue { color: var(--blue-light); }
  .stat-value.red { color: var(--red-light); }
  .stat-value.orange { color: var(--orange-light); }
  .stat-sub { font-size: 9px; color: var(--text4); margin-top: 2px; }
  /* Alert banner */
  .alert-banner { background: #fffbeb; border: 0.5px solid #fcd34d; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; cursor: pointer; }
  .alert-banner .alert-icon { font-size: 18px; }
  .alert-banner .alert-text { font-size: 12px; color: #92400e; font-weight: 600; }
  .alert-banner .alert-sub { font-size: 11px; color: #a16207; }

  /* ── FILTERS ── */
  .filters { max-width: 700px; margin: 0 auto; padding: 12px 20px 0; display: flex; gap: 6px; overflow-x: auto; background:#f3f4f6; }
  .filter-btn { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 0.5px solid #d1d5db; background: #fff; color: #6b7280; cursor: pointer; font-family: var(--sans); white-space: nowrap; transition: all .2s; flex-shrink: 0; }
  .filter-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }

  /* ── LOAN LIST ── */
  .list { max-width: 700px; margin: 0 auto; padding: 12px 16px 80px; background:#f3f4f6; }
  .empty { text-align: center; padding: 60px 0; color: var(--text4); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* ── LOAN CARD ── */
  .loan-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; transition: transform .15s, box-shadow .15s; }
  .loan-card:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(37,99,235,.1); }
  .loan-card.overdue { border-color: #5a1010; }
  .loan-card.warning { border-color: #5a3010; }
  .loan-card-header { padding: 15px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .loan-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--blue-dim); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: var(--blue-light); flex-shrink: 0; }
  .loan-name { font-weight: 700; font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loan-info-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .loan-info-right { text-align: right; flex-shrink: 0; margin-left: 10px; }
  .loan-amount { font-size: 17px; font-weight: 800; font-family: var(--mono); color: var(--text); }
  .loan-amount.paid { color: var(--green-light); }
  .loan-amount-sub { font-size: 10px; color: var(--text3); }
  .chevron { color: var(--text4); font-size: 12px; margin-left: 6px; transition: transform .2s; }
  .chevron.open { transform: rotate(180deg); }
  .tag { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .3px; margin-top: 3px; }

  /* ── EXPANDED CARD ── */
  .loan-body { border-top: 1px solid var(--border); padding: 14px 16px; background: #070e1a; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .detail-cell { background: #f9fafb; border: 0.5px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; text-align: center; }
  .detail-cell-label { font-size: 9px; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .detail-cell-value { font-size: 13px; font-weight: 700; font-family: var(--mono); color: var(--text2); }
  .detail-meta { font-size: 11px; color: var(--text3); margin-bottom: 10px; line-height: 1.7; }
  .card-actions { display: flex; gap: 8px; }
  .btn-danger-outline { background: #fef2f2; color: #dc2626; border: 0.5px solid #fca5a5; border-radius: 10px; padding: 9px 12px; font-size: 12px; cursor: pointer; font-family: var(--sans); flex-shrink: 0; transition: background .2s; }
  .btn-danger-outline:hover { background: #1a0505; }
  .btn-ghost { background: #f3f4f6; color: #374151; border: 0.5px solid #e5e7eb; border-radius: 10px; padding: 9px 14px; font-size: 12px; cursor: pointer; font-family: var(--sans); transition: all .2s; flex: 1; }
  .btn-ghost:hover { border-color: var(--blue); color: var(--text); }
  .btn-primary { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 9px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--sans); flex: 2; transition: background .2s; }
  .btn-primary:hover { background: var(--blue-light); }
  .delete-confirm { background: #fef2f2; border: 0.5px solid #fca5a5; border-radius: 10px; padding: 14px; text-align: center; }
  .delete-confirm-text { font-size: 13px; color: #dc2626; margin-bottom: 10px; font-weight: 500; }
  .delete-confirm-btns { display: flex; gap: 8px; }

  /* ── MODAL OVERLAY ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 500; padding: 0; }
  .modal { background: #fff; border: 0.5px solid #e5e7eb; border-top: none; border-radius: 20px 20px 0 0; padding: 24px 22px 40px; width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; animation: slideUp .3s ease; box-shadow: 0 -4px 20px rgba(0,0,0,.1); }
  @keyframes slideUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 17px; font-weight: 700; color: #111827; }
  .modal-close { background: #f3f4f6; border: none; color: #6b7280; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }

  /* ── FORM FIELDS ── */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: #6b7280; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
  .field input, .field select, .field textarea { width: 100%; background: #f9fafb; border: 0.5px solid #d1d5db; border-radius: 10px; padding: 11px 13px; color: #111827; font-size: 14px; font-family: var(--sans); outline: none; transition: border .2s; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #2563eb; background: #fff; }
  .field input option, .field select option { background: var(--surface2); }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .preview-box { background: #070e1a; border: 1px solid var(--border2); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .preview-title { font-size: 10px; color: var(--blue-light); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .preview-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); margin-bottom: 5px; }
  .preview-row.total { font-size: 15px; font-weight: 700; color: var(--text); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 5px; }
  .preview-row span:last-child { font-family: var(--mono); }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn-full { width: 100%; padding: 13px; font-size: 14px; font-weight: 700; border-radius: 12px; cursor: pointer; font-family: var(--sans); transition: background .2s; }

  /* ── PAYMENT MODAL ── */
  .pay-info { background: #070e1a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .pay-debtor { font-size: 13px; color: var(--text3); margin-bottom: 4px; }
  .pay-amount { font-size: 28px; font-weight: 800; font-family: var(--mono); color: var(--text); letter-spacing: -1px; }
  .pay-due { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .pay-total-btn { width: 100%; background: linear-gradient(135deg, #0f3d20, #052e16); border: 1px solid var(--green); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; cursor: pointer; font-family: var(--sans); text-align: left; transition: opacity .2s; }
  .pay-total-btn:hover { opacity: .85; }
  .pay-total-inner { display: flex; justify-content: space-between; align-items: center; }
  .pay-total-label { font-size: 14px; font-weight: 700; color: var(--green-light); }
  .pay-total-sub { font-size: 11px; color: #4ade80; margin-top: 3px; }
  .pay-total-value { font-size: 20px; font-weight: 800; font-family: var(--mono); color: var(--green-light); }
  .pay-partial { border: 1px solid var(--border); border-radius: 14px; padding: 16px; background: #070e1a; }
  .pay-partial-title { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 12px; }
  .partial-preview { background: var(--surface); border-radius: 8px; padding: 12px; margin: 10px 0; }
  .partial-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .partial-row span:last-child { font-family: var(--mono); }
  .partial-row.total-row { font-size: 14px; font-weight: 700; color: var(--blue-light); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 6px; }
  .partial-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn-confirm { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: var(--sans); flex: 2; transition: opacity .2s; }
  .btn-confirm:disabled { opacity: .4; cursor: not-allowed; }
  .btn-whatsapp { background: #075e54; color: #25d366; border: 1px solid #25d36644; border-radius: 10px; padding: 9px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--sans); flex-shrink: 0; transition: opacity .2s; }
  .btn-whatsapp:hover { opacity: .8; }

  /* ── HISTORY MODAL ── */
  .history-header { margin-bottom: 16px; }
  .history-name { font-size: 20px; font-weight: 800; color: var(--text); }
  .history-contact { font-size: 13px; color: var(--text3); margin-top: 2px; }
  .history-address { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .history-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .h-stat { background: #070e1a; border-radius: 10px; padding: 12px; }
  .h-stat-label { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .h-stat-value { font-size: 16px; font-weight: 700; font-family: var(--mono); color: var(--text2); }
  .history-list-title { font-size: 10px; color: var(--blue-light); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
  .history-item { background: #070e1a; border-radius: 10px; padding: 13px 14px; margin-bottom: 8px; border-left: 3px solid var(--border2); }
  .history-item.loan { border-left-color: var(--blue-light); }
  .history-item.partial { border-left-color: var(--orange-light); }
  .history-item.final { border-left-color: var(--green-light); }
  .history-item-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .history-item-type { font-size: 13px; font-weight: 700; }
  .history-item-date { font-size: 11px; color: var(--text3); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .history-item-value { font-family: var(--mono); font-size: 15px; font-weight: 700; }
  .history-item-note { font-size: 11px; color: var(--text3); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .history-footer { display: flex; gap: 8px; margin-top: 16px; }

  /* ── BACKUP MODAL ── */
  .backup-section { margin-bottom: 16px; }
  .backup-title { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
  .backup-desc { font-size: 12px; color: var(--text3); margin-bottom: 10px; line-height: 1.6; }
  .backup-textarea { width: 100%; background: #070e1a; border: 1px solid var(--border2); border-radius: 10px; padding: 11px 13px; color: var(--text2); font-size: 11px; font-family: var(--mono); outline: none; resize: vertical; min-height: 80px; }
  .backup-btns { display: flex; flex-direction: column; gap: 8px; }
  .btn-backup { width: 100%; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--sans); border: none; transition: opacity .2s; }
  .btn-backup:hover { opacity: .85; }

  /* ── CLIENT SUGGESTIONS ── */
  .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; z-index: 200; max-height: 160px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.4); margin-top: 4px; }
  .suggestion-item { padding: 10px 13px; cursor: pointer; font-size: 13px; transition: background .15s; border-bottom: 1px solid var(--border); }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: var(--surface); }
  .suggestion-name { font-weight: 600; color: var(--text); }
  .suggestion-detail { font-size: 11px; color: var(--text3); }
  .field-wrap { position: relative; }

  /* ── BOTTOM NAV ── */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 0.5px solid #e5e7eb; padding: 10px 20px 20px; display: flex; justify-content: center; gap: 8px; z-index: 100; box-shadow: 0 -1px 6px rgba(0,0,0,.06); }
  .nav-btn { background: #f3f4f6; border: 0.5px solid #e5e7eb; border-radius: 10px; padding: 9px 14px; font-size: 12px; font-weight: 600; color: #374151; cursor: pointer; font-family: var(--sans); display: flex; align-items: center; gap: 6px; transition: all .2s; }
  .nav-btn:hover { border-color: #2563eb; color: #2563eb; background:#eff6ff; }

  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  /* ── PIN LOCK ── */
  .pin-overlay { position: fixed; inset: 0; background: #05080f; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 30px; }
  .pin-logo { font-size: 40px; margin-bottom: 12px; }
  .pin-title { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
  .pin-sub { font-size: 13px; color: var(--text3); margin-bottom: 36px; text-align: center; }
  .pin-dots { display: flex; gap: 16px; margin-bottom: 32px; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border2); background: transparent; transition: all .2s; }
  .pin-dot.filled { background: var(--blue-light); border-color: var(--blue-light); }
  .pin-pad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; width: 100%; max-width: 280px; }
  .pin-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; font-size: 22px; font-weight: 700; color: var(--text); cursor: pointer; font-family: var(--sans); text-align: center; transition: background .15s, transform .1s; -webkit-tap-highlight-color: transparent; }
  .pin-btn:active { background: var(--blue-dim); transform: scale(.94); }
  .pin-btn.del { font-size: 16px; color: var(--text3); }
  .pin-error { color: var(--red-light); font-size: 13px; margin-top: 16px; font-weight: 600; }
  .pin-forgot { color: var(--text3); font-size: 12px; margin-top: 20px; cursor: pointer; text-decoration: underline; }

  /* ── RECEIPT ── */
  .receipt { background: #fff; color: #111; border-radius: 12px; padding: 24px; font-family: monospace; font-size: 13px; line-height: 1.8; margin-bottom: 16px; }
  .receipt-title { font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 4px; }
  .receipt-sub { font-size: 11px; text-align: center; color: #555; margin-bottom: 16px; }
  .receipt-divider { border: none; border-top: 1px dashed #ccc; margin: 10px 0; }
  .receipt-row { display: flex; justify-content: space-between; }
  .receipt-total { font-weight: 700; font-size: 15px; border-top: 2px solid #111; padding-top: 8px; margin-top: 4px; }
  .receipt-footer { text-align: center; font-size: 11px; color: #888; margin-top: 12px; }


  /* ── GROUPED CLIENT CARD ── */
  .client-group { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 12px; overflow: hidden; transition: box-shadow .15s; }
  .client-group:hover { box-shadow: 0 4px 20px rgba(37,99,235,.1); }
  .client-group.has-overdue { border-color: #5a1010; }
  .client-group.has-warning { border-color: #5a3010; }
  .client-group-header { padding: 15px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .client-group-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--blue-dim); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: var(--blue-light); flex-shrink: 0; position: relative; }
  .client-group-badge { position: absolute; top: -3px; right: -3px; background: var(--blue); color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface); }
  .client-group-info { flex: 1; min-width: 0; }
  .client-group-name { font-weight: 800; font-size: 15px; color: var(--text); }
  .client-group-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .client-group-right { text-align: right; flex-shrink: 0; }
  .client-group-total { font-size: 17px; font-weight: 800; font-family: var(--mono); color: var(--text); }
  .client-group-total.allpaid { color: var(--green-light); }
  .client-group-sub2 { font-size: 10px; color: var(--text3); margin-top: 2px; }
  .client-group-body { border-top: 1px solid var(--border); background: #070e1a; }
  .client-group-actions { padding: 10px 14px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
  .loan-sub-card { border-bottom: 1px solid var(--border); }
  .loan-sub-card:last-child { border-bottom: none; }
  .loan-sub-header { padding: 12px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .loan-sub-label { font-size: 12px; color: var(--text3); }
  .loan-sub-amount { font-size: 14px; font-weight: 700; font-family: var(--mono); }
  .loan-sub-body { padding: 0 16px 14px; background: #050c18; border-top: 1px solid #0d1a2e; }
  .fade-in { animation: fadeIn .2s ease; }
</style>
</head>
<body>

<div id="toast"></div>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">
        <span class="logo-sub">💰 Controle de</span>
        <span class="logo-main">Empréstimos</span>
      </div>
      <button class="btn-new" onclick="openForm()">
        <span style="font-size:18px;line-height:1">+</span> Novo
      </button>
    </div>
    <div id="stats-container"></div>
  </div>
</header>

<!-- FILTERS -->
<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all" onclick="setFilter(this,'all')">Todos</button>
  <button class="filter-btn" data-filter="active" onclick="setFilter(this,'active')">Ativos</button>
  <button class="filter-btn" data-filter="overdue" onclick="setFilter(this,'overdue')">Vencidos</button>
  <button class="filter-btn" data-filter="warning" onclick="setFilter(this,'warning')">Vence em 3 dias</button>
  <button class="filter-btn" data-filter="paid" onclick="setFilter(this,'paid')">Pagos</button>
</div>

<!-- LIST -->
<div class="list" id="loan-list"></div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn" onclick="openClients()">👥 Clientes</button>
  <button class="nav-btn" onclick="openInadimplentes()">⚠️ Inadimp.</button>
  <button class="nav-btn" onclick="openBackup()">📥 Backup</button>
  <button class="nav-btn" onclick="openStats()">📊 Relatório</button>
</div>

<!-- ══════════════════════════════════════════
     MODALS (hidden by default, rendered in JS)
════════════════════════════════════════════ -->
<div id="modal-container"></div>

<script>
// ─── STORAGE ───────────────────────────────────────────────────────────
const LOANS_KEY = 'emp_loans_v2';
const CLIENTS_KEY = 'emp_clients_v2';

let loans = [];
let clients = []; // { id, name, phone, address }
let currentFilter = 'all';
let expandedCards = {};
let deleteConfirm = null;

function save() {
  localStorage.setItem(LOANS_KEY, JSON.stringify(loans));
  // Keep clients in sync (upsert from loans)
  loans.forEach(l => upsertClient(l));
  localStorage.setItem(CLIENTS_KEY, JSON.stringify(clients));
}

function load() {
  try { loans = JSON.parse(localStorage.getItem(LOANS_KEY) || '[]'); } catch { loans = []; }
  try { clients = JSON.parse(localStorage.getItem(CLIENTS_KEY) || '[]'); } catch { clients = []; }
}

function upsertClient(loan) {
  const exists = clients.find(c => c.name.trim().toLowerCase() === loan.name.trim().toLowerCase());
  if (!exists) {
    clients.push({ id: loan.id, name: loan.name, phone: loan.phone || '', address: loan.address || '' });
  } else {
    if (loan.phone) exists.phone = loan.phone;
    if (loan.address) exists.address = loan.address;
  }
}

// ─── UTILS ─────────────────────────────────────────────────────────────
const fmt = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
const fmtDate = s => { if (!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const today = () => new Date().toISOString().split('T')[0];
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().split('T')[0]; };
const uid = () => Math.random().toString(36).slice(2,10);
const daysUntil = s => { const n = new Date(); n.setHours(0,0,0,0); return Math.ceil((new Date(s+'T00:00:00') - n) / 86400000); };

function statusInfo(loan) {
  const d = daysUntil(loan.dueDate);
  if (loan.paid) return { label: 'Quitado ✓', color: 'var(--green-light)', bg: 'var(--green-dim)', cls: 'paid' };
  if (d < 0)    return { label: `${Math.abs(d)}d atrasado`, color: 'var(--red-light)', bg: 'var(--red-dim)', cls: 'error' };
  if (d === 0)  return { label: 'Vence hoje!', color: 'var(--yellow-light)', bg: '#3a2800', cls: 'warn' };
  if (d <= 3)   return { label: `Vence em ${d}d`, color: 'var(--orange-light)', bg: 'var(--orange-dim)', cls: 'warn' };
  if (d <= 7)   return { label: `${d} dias`, color: 'var(--orange-light)', bg: '#2a1a00', cls: '' };
  return { label: `${d} dias`, color: 'var(--text3)', bg: 'var(--surface2)', cls: '' };
}

// ─── STATS ─────────────────────────────────────────────────────────────
function calcStats() {
  const active = loans.filter(l => !l.paid);
  const now = new Date(); now.setHours(0,0,0,0);
  const thisMonth = now.getMonth(); const thisYear = now.getFullYear();

  const totalOwed     = active.reduce((s,l) => s + l.currentAmount, 0);
  const totalLent     = active.reduce((s,l) => s + l.originalAmount, 0);
  const totalOverdue  = active.filter(l => daysUntil(l.dueDate) < 0).reduce((s,l) => s + l.currentAmount, 0);
  const avgLoan       = active.length ? active.reduce((s,l) => s + l.originalAmount, 0) / active.length : 0;
  const clientCount   = new Set(loans.map(l => l.name.trim().toLowerCase())).size;
  const warn3         = active.filter(l => { const d = daysUntil(l.dueDate); return d >= 0 && d <= 3; }).length;

  // Juros recebidos (total histórico)
  const jurosRecebidos = loans.reduce((sum, l) => {
    const received = l.history.filter(h => h.type.includes('pagamento')).reduce((s,h) => s+h.value, 0);
    return sum + Math.max(0, received - l.originalAmount);
  }, 0);

  // Lucro mensal: juros pagos em pagamentos deste mês
  const lucroMensal = loans.reduce((sum, l) => {
    const monthPayments = l.history.filter(h => {
      if (!h.type.includes('pagamento')) return false;
      const d = new Date(h.date + 'T00:00:00');
      return d.getMonth() === thisMonth && d.getFullYear() === thisYear;
    });
    const paidThisMonth = monthPayments.reduce((s,h) => s+h.value, 0);
    // Estimate interest portion: proportional to interest rate
    return sum + paidThisMonth * (l.interest / (100 + l.interest));
  }, 0);

  // Lucro anual: same but this year
  const lucroAnual = loans.reduce((sum, l) => {
    const yearPayments = l.history.filter(h => {
      if (!h.type.includes('pagamento')) return false;
      const d = new Date(h.date + 'T00:00:00');
      return d.getFullYear() === thisYear;
    });
    const paidThisYear = yearPayments.reduce((s,h) => s+h.value, 0);
    return sum + paidThisYear * (l.interest / (100 + l.interest));
  }, 0);

  const totalEmprestadoHistorico = loans.reduce((s,l) => s + l.originalAmount, 0);

  return { totalOwed, totalLent, totalOverdue, avgLoan, clientCount, warn3, jurosRecebidos, lucroMensal, lucroAnual, totalEmprestadoHistorico, activeCount: active.length };
}

function renderStats() {
  const s = calcStats();
  let html = '';

  // Alert for 3-day warning
  if (s.warn3 > 0) {
    html += `<div class="alert-banner" onclick="setFilter(document.querySelector('[data-filter=warning]'),'warning')">
      <span class="alert-icon">⚠️</span>
      <div>
        <div class="alert-text">${s.warn3} empréstimo${s.warn3>1?'s':''} vence${s.warn3>1?'m':''} em até 3 dias!</div>
        <div class="alert-sub">Toque para ver</div>
      </div>
    </div>`;
  }

  html += `<div class="stats-main">
    <div class="stats-main-label">Total a receber</div>
    <div class="stats-main-value">${fmt(s.totalOwed)}</div>
  </div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">💵 Emprestado</div>
      <div class="stat-value blue">${fmt(s.totalLent)}</div>
      <div class="stat-sub">capital na rua</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">📈 Juros recebidos</div>
      <div class="stat-value ${s.jurosRecebidos>0?'green':''}">${fmt(s.jurosRecebidos)}</div>
      <div class="stat-sub">total acumulado</div>
    </div>
  </div>
  <div class="stats-grid-3">
    <div class="stat-card">
      <div class="stat-label">👥 Clientes</div>
      <div class="stat-value">${s.clientCount}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">📊 Média</div>
      <div class="stat-value" style="font-size:14px">${fmt(s.avgLoan)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🔴 Vencido</div>
      <div class="stat-value ${s.totalOverdue>0?'red':''}" style="font-size:14px">${fmt(s.totalOverdue)}</div>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card dashed">
      <div class="stat-label">📅 Lucro mensal</div>
      <div class="stat-value ${s.lucroMensal>0?'green':''}" style="font-size:15px">${fmt(s.lucroMensal)}</div>
      <div class="stat-sub">este mês</div>
    </div>
    <div class="stat-card dashed">
      <div class="stat-label">🏆 Lucro anual</div>
      <div class="stat-value ${s.lucroAnual>0?'green':''}" style="font-size:15px">${fmt(s.lucroAnual)}</div>
      <div class="stat-sub">este ano</div>
    </div>
  </div>`;

  document.getElementById('stats-container').innerHTML = html;
}

// ─── LOAN LIST ─────────────────────────────────────────────────────────
let expandedGroups = {}; // clientKey -> bool

function clientKey(name) { return name.trim().toLowerCase(); }

function setFilter(btn, f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderList();
}

function renderList() {
  const container = document.getElementById('loan-list');
  let filtered = [...loans];
  if (currentFilter === 'active')  filtered = filtered.filter(l => !l.paid);
  if (currentFilter === 'overdue') filtered = filtered.filter(l => !l.paid && daysUntil(l.dueDate) < 0);
  if (currentFilter === 'warning') filtered = filtered.filter(l => { const d = daysUntil(l.dueDate); return !l.paid && d >= 0 && d <= 3; });
  if (currentFilter === 'paid')    filtered = filtered.filter(l => l.paid);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div>Nenhum empréstimo aqui</div></div>`;
    return;
  }

  // Group by client name
  const groups = {};
  filtered.forEach(l => {
    const k = clientKey(l.name);
    if (!groups[k]) groups[k] = { key: k, name: l.name, phone: l.phone, address: l.address, loans: [] };
    groups[k].loans.push(l);
  });

  // Sort each group's loans by due date
  Object.values(groups).forEach(g => {
    g.loans.sort((a,b) => {
      if (a.paid !== b.paid) return a.paid ? 1 : -1;
      return new Date(a.dueDate) - new Date(b.dueDate);
    });
  });

  // Sort groups: those with overdue first, then by nearest due date
  const sorted = Object.values(groups).sort((a, b) => {
    const aOverdue = a.loans.some(l => !l.paid && daysUntil(l.dueDate) < 0);
    const bOverdue = b.loans.some(l => !l.paid && daysUntil(l.dueDate) < 0);
    if (aOverdue !== bOverdue) return aOverdue ? -1 : 1;
    const aAllPaid = a.loans.every(l => l.paid);
    const bAllPaid = b.loans.every(l => l.paid);
    if (aAllPaid !== bAllPaid) return aAllPaid ? 1 : -1;
    const aNext = a.loans.filter(l=>!l.paid).sort((x,y)=>new Date(x.dueDate)-new Date(y.dueDate))[0];
    const bNext = b.loans.filter(l=>!l.paid).sort((x,y)=>new Date(x.dueDate)-new Date(y.dueDate))[0];
    if (!aNext && !bNext) return 0;
    if (!aNext) return 1; if (!bNext) return -1;
    return new Date(aNext.dueDate) - new Date(bNext.dueDate);
  });

  container.innerHTML = sorted.map(g => renderGroup(g)).join('');
}

function renderGroup(group) {
  const key = group.key;
  const isExpanded = expandedGroups[key] !== false;
  const activeLoans = group.loans.filter(l => !l.paid);
  const totalDue = activeLoans.reduce((s,l) => s + l.currentAmount, 0);
  const allPaid = group.loans.every(l => l.paid);
  const hasOverdue = group.loans.some(l => !l.paid && daysUntil(l.dueDate) < 0);
  const hasWarn = !hasOverdue && group.loans.some(l => { const d=daysUntil(l.dueDate); return !l.paid && d>=0 && d<=3; });
  const phone = group.loans.find(l=>l.phone)?.phone || '';
  const loansHtml = group.loans.map(l => renderSubLoan(l)).join('');

  const borderColor = hasOverdue ? '#fca5a5' : hasWarn ? '#fcd34d' : allPaid ? '#bbf7d0' : '#e5e7eb';
  const accentColor = hasOverdue ? '#ef4444' : hasWarn ? '#f59e0b' : allPaid ? '#22c55e' : '#2563eb';
  const bgAvatar    = hasOverdue ? '#fef2f2' : hasWarn ? '#fffbeb' : allPaid ? '#f0fdf4' : '#eff6ff';

  let badge = '';
  if (allPaid) {
    badge = '<span style="background:#f0fdf4;color:#16a34a;border-radius:20px;font-size:10px;padding:2px 9px;font-weight:600">Quitado ✓</span>';
  } else if (hasOverdue) {
    const n = group.loans.filter(l=>!l.paid&&daysUntil(l.dueDate)<0).length;
    badge = '<span style="background:#fef2f2;color:#dc2626;border-radius:20px;font-size:10px;padding:2px 9px;font-weight:600">' + n + ' vencido' + (n>1?'s':'') + '</span>';
  } else if (hasWarn) {
    badge = '<span style="background:#fffbeb;color:#b45309;border-radius:20px;font-size:10px;padding:2px 9px;font-weight:600">Vence em breve</span>';
  } else {
    badge = '<span style="background:#f3f4f6;color:#6b7280;border-radius:20px;font-size:10px;padding:2px 9px">' + activeLoans.length + ' ativo' + (activeLoans.length!==1?'s':'') + '</span>';
  }

  const safeName = group.name.replace(/'/g, "\\'");
  const safePhone = phone.replace(/'/g, "\\'");
  const safeAddr = (group.address||'').replace(/'/g, "\\'");

  const groupActionsHtml = '<div style="display:flex;gap:8px;padding:10px 14px;border-bottom:0.5px solid #e5e7eb;background:#fff">'
    + '<button onclick="closeGroupActions();openForm({name:\'' + safeName + '\',phone:\'' + safePhone + '\',address:\'' + safeAddr + '\',amount:\'\',interest:\'30\',startDate:\''+today()+'\',note:\'\'})" style="flex:1;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:9px 0;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans)">+ Novo empréstimo</button>'
    + (phone ? '<button onclick="sendWhatsAppGroup(\'' + key + '\')" style="background:#064e3b;color:#34d399;border:none;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans)">🟢 Cobrar</button>' : '')
    + '</div>';

  const avatarBadge = group.loans.length > 1
    ? '<div style="position:absolute;top:-3px;right:-3px;background:var(--blue);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #0c1a2e">' + group.loans.length + '</div>'
    : '';

  const chevronStyle = 'color:#9ca3af;font-size:12px;margin-left:4px;display:inline-block;transform:' + (isExpanded ? 'rotate(180deg)' : 'rotate(0deg)');
  const totalDisplay = allPaid ? 'Quitado ✓' : fmt(totalDue);
  const totalColor = allPaid ? '#16a34a' : '#111827';
  const phoneHtml = phone ? '<span style="font-size:10px;color:#475569">📞 ' + phone + '</span>' : '';
  const countHtml = !allPaid ? '<div style="font-size:10px;color:#9ca3af">' + group.loans.length + ' empréstimo' + (group.loans.length!==1?'s':'') + '</div>' : '';

  return '<div class="fade-in" id="group-' + key + '" style="background:#fff;border:0.5px solid ' + borderColor + ';border-left:3px solid ' + accentColor + ';border-radius:14px;margin-bottom:10px;overflow:hidden">'
    + '<div style="padding:14px;cursor:pointer;display:flex;align-items:center;gap:10px" onclick="toggleGroup(\'' + key + '\')">'
    + '<div style="width:42px;height:42px;border-radius:50%;background:' + bgAvatar + ';color:' + accentColor + ';display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0;position:relative">'
    + '<span style="color:' + accentColor + ';font-size:17px;font-weight:700">' + group.name.charAt(0).toUpperCase() + '</span>' + avatarBadge + '</div>'
    + '<div style="flex:1;min-width:0">'
    + '<div style="font-weight:700;font-size:15px;color:#111827;margin-bottom:4px">' + group.name + '</div>'
    + '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' + badge + phoneHtml + '</div>'
    + '</div>'
    + '<div style="text-align:right;flex-shrink:0;margin-left:6px">'
    + '<div style="font-size:17px;font-weight:700;color:' + totalColor + ';font-family:var(--mono)">' + totalDisplay + '</div>'
    + countHtml + '</div>'
    + '<span style="' + chevronStyle + '">▼</span>'
    + '</div>'
    + (isExpanded ? '<div style="border-top:0.5px solid #f3f4f6;background:#f9fafb">' + groupActionsHtml + loansHtml + '</div>' : '')
    + '</div>';
}

function renderSubLoan(loan) {
  const st = statusInfo(loan);
  const exp = expandedCards[loan.id];
  const delConf = deleteConfirm === loan.id;

  const detailHtml = exp ? `<div class="loan-sub-body fade-in" style="background:#fff;border-top:0.5px solid #f3f4f6">
    <div class="detail-grid" style="margin-top:10px">
      <div class="detail-cell"><div class="detail-cell-label">Emprestado</div><div class="detail-cell-value" style="color:#374151">${fmt(loan.originalAmount)}</div></div>
      <div class="detail-cell"><div class="detail-cell-label">Total devido</div><div class="detail-cell-value" style="color:#1d4ed8">${fmt(loan.currentAmount)}</div></div>
      <div class="detail-cell"><div class="detail-cell-label">Juros/mês</div><div class="detail-cell-value" style="color:#d97706">${loan.interest}%</div></div>
    </div>
    ${loan.note ? `<div style="font-size:11px;color:var(--text3);margin:8px 0">📝 ${loan.note}</div>` : ''}
    ${delConf ? `
    <div class="delete-confirm" style="margin-top:10px">
      <div class="delete-confirm-text">Excluir este empréstimo?</div>
      <div class="delete-confirm-btns">
        <button class="btn-ghost" style="flex:1" onclick="cancelDelete()">Cancelar</button>
        <button style="flex:1;background:#7f1d1d;color:#fca5a5;border:none;border-radius:10px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)" onclick="deleteLoan('${loan.id}')">Excluir</button>
      </div>
    </div>` : `
    <div class="card-actions" style="margin-top:10px">
      <button class="btn-danger-outline" onclick="confirmDelete('${loan.id}')">🗑️</button>
      <button class="btn-ghost" style="padding:9px 10px;font-size:12px" onclick="openEdit('${loan.id}')">✏️</button>
      <button class="btn-ghost" style="padding:9px 10px;font-size:12px" onclick="openReceipt('${loan.id}')">🧾</button>
      ${loan.phone ? `<button class="btn-whatsapp" style="padding:9px 10px" onclick="sendWhatsApp('${loan.id}')">🟢</button>` : ''}
      ${!loan.paid ? `<button class="btn-primary" onclick="openPay('${loan.id}')">Pagar</button>` : ''}
      ${!loan.paid ? `<button style="padding:9px 10px;font-size:11px;background:#fffbeb;color:#b45309;border:0.5px solid #fcd34d;border-radius:10px;cursor:pointer;font-family:var(--sans)" onclick="moverParaInadimplente('${loan.id}')">⚠️</button>` : ''}
    </div>`}
  </div>` : '';

  return `<div class="loan-sub-card" id="card-${loan.id}" style="background:#fff;border-bottom:0.5px solid #f3f4f6">
    <div class="loan-sub-header" style="padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px" onclick="toggleCard('${loan.id}')">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="tag" style="background:${st.bg};color:${st.color};border:1px solid ${st.color}33">${st.label}</span>
          ${!loan.paid ? `<span class="loan-sub-label">Vence ${fmtDate(loan.dueDate)}</span>` : ''}
          <span class="loan-sub-label">Juros ${loan.interest}%</span>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:3px">Emprestado em ${fmtDate(loan.startDate)}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;margin-left:8px">
        <div class="loan-sub-amount" style="color:${loan.paid?'var(--green-light)':'var(--text)'}">${loan.paid ? 'Quitado ✓' : fmt(loan.currentAmount)}</div>
        <div style="font-size:10px;color:#9ca3af">${fmt(loan.originalAmount)} original</div>
      </div>
      <span style="color:#9ca3af;font-size:11px;margin-left:4px;display:inline-block;transform:${exp?'rotate(180deg)':'rotate(0deg)'}">▼</span>
    </div>
    ${detailHtml}
  </div>`;
}

function toggleGroup(key) {
  expandedGroups[key] = !expandedGroups[key];
  if (expandedGroups[key] === undefined) expandedGroups[key] = false;
  renderList();
}

function toggleCard(id) {
  expandedCards[id] = !expandedCards[id];
  if (deleteConfirm && deleteConfirm !== id) deleteConfirm = null;
  renderList();
}

function closeGroupActions() { /* no-op, used before openForm */ }

function sendWhatsAppGroup(key) {
  // Send to the most urgent loan of this client
  const group = Object.values(loans).filter(l => clientKey(l.name) === key);
  const urgent = group.filter(l=>!l.paid).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate))[0];
  if (urgent) sendWhatsApp(urgent.id);
}

function confirmDelete(id) { deleteConfirm = id; renderList(); }
function cancelDelete() { deleteConfirm = null; renderList(); }
function deleteLoan(id) {
  loans = loans.filter(l => l.id !== id);
  delete expandedCards[id];
  deleteConfirm = null;
  save(); renderStats(); renderList();
  showToast('Empréstimo excluído');
}

// ─── TOAST ─────────────────────────────────────────────────────────────
function showToast(msg, type='') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ─── OPEN MODALS ───────────────────────────────────────────────────────
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

function modal(content) {
  document.getElementById('modal-container').innerHTML = `

function showSuggestions() {
  const q = formData.name.trim().toLowerCase();
  const box = document.getElementById('suggestions');
  if (!box) return;
  if (q.length < 1) { box.style.display='none'; return; }
  const matches = clients.filter(c => c.name.toLowerCase().includes(q));
  if (!matches.length) { box.style.display='none'; return; }
  box.innerHTML = matches.slice(0,5).map(c => `
    <div class="suggestion-item" onmousedown="fillClient('${c.name}')">
      <div class="suggestion-name">${c.name}</div>
      <div class="suggestion-detail">${c.phone||''}${c.phone&&c.address?' · ':''}${c.address||''}</div>
    </div>`).join('');
  box.style.display = 'block';
}
function hideSuggestions() { const b=document.getElementById('suggestions'); if(b) b.style.display='none'; }
function fillClient(name) {
  const c = clients.find(x => x.name === name);
  if (!c) return;
  formData.name = c.name; formData.phone = c.phone||''; formData.address = c.address||'';
  renderForm();
}

function updatePreview() {
  const amt = parseFloat(formData.amount) || 0;
  const rate = parseFloat(formData.interest) || 0;
  const box = document.getElementById('form-preview');
  if (!box) return;
  if (amt <= 0) { box.innerHTML=''; return; }
  const total = amt * (1+rate/100);
  box.innerHTML = `<div class="preview-box">
    <div class="preview-title">Preview</div>
    <div class="preview-row"><span>Valor emprestado</span><span>${fmt(amt)}</span></div>
    <div class="preview-row"><span>Juros (${rate}%)</span><span style="color:var(--red-light)">+${fmt(amt*rate/100)}</span></div>
    <div class="preview-row total"><span>Total a receber</span><span style="color:var(--blue-light)">${fmt(total)}</span></div>
    <div style="font-size:11px;color:var(--text3);margin-top:6px">Vencimento: ${fmtDate(addDays(formData.startDate||today(),30))}</div>
  </div>`;
}

function saveDocPhoto(event, tipo) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    if (tipo === 'rg') formData.docRG = e.target.result;
    else formData.docResidencia = e.target.result;
    renderForm();
  };
  reader.readAsDataURL(file);
}

function addLoan() {
  const amt = parseFloat(formData.amount);
  const rate = parseFloat(formData.interest) / 100;
  if (!formData.name.trim() || !amt || amt <= 0) { showToast('Preencha nome e valor', 'error'); return; }
  const loan = {
    id: uid(), name: formData.name.trim(), phone: formData.phone, address: formData.address, docRG: formData.docRG||'', docResidencia: formData.docResidencia||'',
    originalAmount: amt, currentAmount: parseFloat((amt*(1+rate)).toFixed(2)),
    interest: parseFloat(formData.interest), startDate: formData.startDate||today(),
    dueDate: addDays(formData.startDate||today(), 30), note: formData.note, paid: false,
    history: [{ date: formData.startDate||today(), type:'empréstimo', value: amt, note:`Empréstimo de ${fmt(amt)} · Juros ${formData.interest}%` }]
  };
  loans.push(loan);
  save(); renderStats(); renderList(); closeModal();
  showToast(`✅ Empréstimo de ${loan.name} adicionado`);
}

// ─── PAYMENT ───────────────────────────────────────────────────────────
let _currentPayLoanId = null;

function updatePartialPreview(val, loanId) {
  _currentPayLoanId = loanId;
  const paid = parseFloat(val.replace(',','.')) || 0;
  const loan = loans.find(l=>l.id===loanId);
  const box = document.getElementById('partial-preview-box');
  const btn = document.getElementById('btn-confirm-partial');
  if (!loan || !box) return;
  if (btn) { btn.disabled = paid <= 0; btn.dataset.val = val; }
  if (paid <= 0 || paid >= loan.currentAmount) { box.innerHTML=''; return; }
  const rem = loan.currentAmount - paid;
  const newTotal = rem * (1 + loan.interest/100);
  box.innerHTML = `<div class="partial-preview">
    <div class="partial-row"><span>Saldo restante</span><span style="color:var(--red-light)">${fmt(rem)}</span></div>
    <div class="partial-row"><span>+ Juros ${loan.interest}%</span><span style="color:var(--orange-light)">+${fmt(rem*loan.interest/100)}</span></div>
    <div class="partial-row total-row"><span>Novo total</span><span>${fmt(newTotal)}</span></div>
    <div style="font-size:11px;color:var(--text3);margin-top:6px">Novo vencimento: ${fmtDate(addDays(today(),30))}</div>
  </div>`;
}

function doPartialFromInput() {
  const btn = document.getElementById('btn-confirm-partial');
  if (!btn) return;
  const val = parseFloat((btn.dataset.val||'').replace(',','.')) || 0;
  const id = btn.dataset.id || _currentPayLoanId;
  if (val > 0 && id) doPayment(id, val);
}
function openPay(id) {
  const loan = loans.find(l=>l.id===id);
  if (!loan) return;
  renderPay(loan, '');
}

function renderPay(loan, val) {
  const paid = parseFloat(val) || 0;
  let partialPreview = '';
  if (paid > 0 && paid < loan.currentAmount) {
    const rem = loan.currentAmount - paid;
    const newTotal = rem * (1 + loan.interest/100);
    partialPreview = `<div class="partial-preview">
      <div class="partial-row"><span>Saldo restante</span><span style="color:var(--red-light)">${fmt(rem)}</span></div>
      <div class="partial-row"><span>+ Juros ${loan.interest}%</span><span style="color:var(--orange-light)">+${fmt(rem*loan.interest/100)}</span></div>
      <div class="partial-row total-row"><span>Novo total</span><span>${fmt(newTotal)}</span></div>
      <div style="font-size:11px;color:var(--text3);margin-top:6px">Novo vencimento: ${fmtDate(addDays(today(),30))}</div>
    </div>`;
  }
  modal(`
    <div class="modal-header">
      <span class="modal-title">Registrar Pagamento</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="pay-info">
      <div class="pay-debtor">${loan.name}</div>
      <div class="pay-amount">${fmt(loan.currentAmount)}</div>
      <div class="pay-due">Total devido · Vence ${fmtDate(loan.dueDate)}</div>
    </div>
    <button class="pay-total-btn" onclick="doPayment('${loan.id}', ${loan.currentAmount})">
      <div class="pay-total-inner">
        <div>
          <div class="pay-total-label">✅ Pagamento total</div>
          <div class="pay-total-sub">Toque para quitar a dívida</div>
        </div>
        <div class="pay-total-value">${fmt(loan.currentAmount)}</div>
      </div>
    </button>
    <div class="pay-partial">
      <div class="pay-partial-title">💳 Pagamento parcial</div>
      <input id="pay-input" inputmode="decimal" style="width:100%;background:#070e1a;border:1px solid var(--border2);border-radius:10px;padding:11px 13px;color:var(--text);font-size:15px;font-family:var(--sans);outline:none;-webkit-appearance:none"
        type="text" placeholder="0,00" value="${val}"
        oninput="updatePartialPreview(this.value,'${loan.id}')">
      <div id="partial-preview-box">${partialPreview}</div>
      <div class="partial-actions">
        <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn-confirm" id="btn-confirm-partial" ${paid<=0?'disabled':''} data-id="${loan.id}" data-val="${val}" onclick="doPartialFromInput()">Confirmar parcial</button>
      </div>
    </div>
  `);
  // Focus the partial input
  setTimeout(() => { const el = document.getElementById('pay-input'); if(el) el.focus(); }, 100);
}

function doPayment(id, amount) {
  const loan = loans.find(l=>l.id===id);
  if (!loan || amount <= 0) return;
  const remaining = parseFloat((loan.currentAmount - amount).toFixed(2));
  if (remaining <= 0.01) {
    loan.paid = true; loan.currentAmount = 0;
    loan.history.push({ date: today(), type:'pagamento_final', value: amount, note:`Dívida quitada! Pagamento de ${fmt(amount)}` });
    showToast(`✅ Dívida de ${loan.name} quitada!`);
  } else {
    const newAmount = parseFloat((remaining * (1 + loan.interest/100)).toFixed(2));
    loan.currentAmount = newAmount;
    loan.dueDate = addDays(today(), 30);
    loan.history.push({ date: today(), type:'pagamento_parcial', value: amount, note:`Pagou ${fmt(amount)}. Saldo restante ${fmt(remaining)}. Novo total com juros: ${fmt(newAmount)}` });
    showToast(`💳 Pagamento parcial de ${fmt(amount)} registrado`);
  }
  save(); renderStats(); renderList(); closeModal();
}

// ─── WHATSAPP ────────────────────────────────────────────────────────────
function sendWhatsApp(id) {
  const loan = loans.find(l=>l.id===id);
  if (!loan || !loan.phone) return;
  const days = daysUntil(loan.dueDate);
  let msg = '';
  if (days < 0) {
    msg = `Olá ${loan.name}! Passando para avisar que seu empréstimo de ${fmt(loan.originalAmount)} está *vencido há ${Math.abs(days)} dia(s)*. O valor total com juros é de *${fmt(loan.currentAmount)}*. Por favor, entre em contato para regularizar. Obrigado!`;
  } else if (days <= 3) {
    msg = `Olá ${loan.name}! Lembrete: seu empréstimo de ${fmt(loan.originalAmount)} *vence em ${days} dia(s)* (${fmtDate(loan.dueDate)}). O valor total com juros é *${fmt(loan.currentAmount)}*. Qualquer dúvida, estou à disposição!`;
  } else {
    msg = `Olá ${loan.name}! Passando para lembrar que você tem um empréstimo de ${fmt(loan.originalAmount)} com vencimento em ${fmtDate(loan.dueDate)}. O valor total com juros é *${fmt(loan.currentAmount)}*. Obrigado!`;
  }
  const phone = loan.phone.replace(/\D/g,'');
  const url = `https://wa.me/55${phone}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

      <div class="h-stat"><div class="h-stat-label">Juros/mês</div><div class="h-stat-value" style="color:var(--orange-light)">${loan.interest}%</div></div>
      <div class="h-stat"><div class="h-stat-label">Vencimento</div><div class="h-stat-value" style="font-size:14px">${fmtDate(loan.dueDate)}</div></div>

function openClients() {
  renderClientsModal();
}

function renderClientsModal(search='') {
  const q = search.toLowerCase();

function saveInad() { localStorage.setItem(INAD_KEY, JSON.stringify(inadimplentes)); }

function moverParaInadimplente(loanId) {
  const loan = loans.find(l => l.id === loanId);
  if (!loan) return;
  const motivo = prompt('Motivo (ex: sumiu, número desligado, endereço errado):') || 'Sem contato';
  inadimplentes.push({
    id: loan.id, name: loan.name, phone: loan.phone || '', address: loan.address || '',
    originalAmount: loan.originalAmount, currentAmount: loan.currentAmount,
    startDate: loan.startDate, dueDate: loan.dueDate, interest: loan.interest,
    motivo: motivo, movidoEm: today(), history: loan.history || []
  });
  loans = loans.filter(l => l.id !== loanId);
  saveInad(); save(); renderStats(); renderList(); closeModal();
  showToast('⚠️ Movido para inadimplentes');
}

function reativarInadimplente(id) {
  const inad = inadimplentes.find(i => i.id === id);
  if (!inad) return;

    originalAmount: inad.originalAmount, currentAmount: inad.currentAmount,
    interest: inad.interest, startDate: inad.startDate, dueDate: inad.dueDate,
    note: 'Reativado do arquivo de inadimplentes', paid: false,
    history: inad.history || []
  });
  inadimplentes = inadimplentes.filter(i => i.id !== id);
  saveInad(); save(); renderStats(); renderList(); closeModal();

function excluirInadimplente(id) {
  inadimplentes = inadimplentes.filter(i => i.id !== id);

}

function openBackup() {
  const data = JSON.stringify({ loans, clients, inadimplentes, exportedAt: new Date().toISOString() }, null, 2);
  modal(`
    <div class="modal-header">
      <span class="modal-title">📥 Backup & Restaurar</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="backup-section">
      <div class="backup-title">💾 Exportar backup</div>
      <div class="backup-desc">Salve um arquivo com todos seus dados. Abra no celular ou PC quando quiser restaurar.</div>
      <div class="backup-btns">
        <button class="btn-backup" style="background:var(--blue);color:#fff" onclick="downloadBackup()">⬇️ Baixar arquivo de backup (.json)</button>
        <button class="btn-backup" style="background:var(--surface2);color:var(--text2);border:1px solid var(--border2)" onclick="copyBackup()">📋 Copiar dados (para colar em outro lugar)</button>
      </div>
    </div>
    <div class="backup-section" style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px">
      <div class="backup-title">📤 Restaurar backup</div>
      <div class="backup-desc">Cole abaixo o conteúdo de um backup anterior e clique em restaurar. <strong style="color:var(--red-light)">Isso substituirá todos os dados atuais.</strong></div>
      <textarea class="backup-textarea" id="restore-input" placeholder="Cole o conteúdo do backup aqui..." rows="5"></textarea>
      <div class="backup-btns" style="margin-top:10px;gap:8px;flex-direction:row;display:flex">
        <label class="btn-backup" style="background:var(--surface2);color:var(--text2);border:1px solid var(--border2);text-align:center;cursor:pointer">
          📁 Abrir arquivo
          <input type="file" accept=".json" style="display:none" onchange="loadFile(event)">
        </label>
        <button class="btn-backup" style="background:#7f1d1d;color:#fca5a5;flex:1" onclick="restoreBackup()">🔁 Restaurar</button>
      </div>
    </div>
  `);
}

function downloadBackup() {
  const data = JSON.stringify({ loans, clients, inadimplentes, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = `emprestimos-backup-${today()}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('📥 Backup baixado!');
}

function copyBackup() {
  const data = JSON.stringify({ loans, clients, inadimplentes, exportedAt: new Date().toISOString() });
  navigator.clipboard.writeText(data).then(() => showToast('📋 Dados copiados!'));
}

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { const el = document.getElementById('restore-input'); if(el) el.value = e.target.result; };
  reader.readAsText(file);
}

function restoreBackup() {
  const raw = document.getElementById('restore-input')?.value?.trim();
  if (!raw) { showToast('Cole os dados primeiro', 'error'); return; }
  try {
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed.loans)) throw new Error('Formato inválido');
    loans = parsed.loans;
    clients = parsed.clients || [];
    inadimplentes = parsed.inadimplentes || [];
    saveInad();
    save(); renderStats(); renderList(); closeModal();
    showToast(`✅ ${loans.length} empréstimos restaurados!`);
  } catch(e) {
    showToast('Arquivo inválido ou corrompido', 'error');
  }
}


// ─── PIN SECURITY ──────────────────────────────────────────────────────
const PIN_KEY = 'emp_pin_v1';
let pinBuffer = '';
let pinMode = 'check'; // 'check' | 'set' | 'confirm'
let pinNewTemp = '';
let appUnlocked = false;

function getPin() { return localStorage.getItem(PIN_KEY) || ''; }

function initPin() {
  const pin = getPin();
  if (!pin) { appUnlocked = true; return; } // no pin set yet
  showPinLock('check');
}

function showPinLock(mode, err='') {
  pinMode = mode; pinBuffer = '';
  const titles = { check: 'Digite seu PIN', set: 'Crie um PIN de 4 dígitos', confirm: 'Confirme o PIN' };
  const subs = { check: 'Acesse seu controle de empréstimos', set: 'Proteja seus dados financeiros', confirm: 'Digite novamente para confirmar' };
  document.body.innerHTML = `
    <div class="pin-overlay" id="pin-overlay">
      <div class="pin-logo">🔐</div>
      <div class="pin-title">${titles[mode]}</div>
      <div class="pin-sub">${subs[mode]}</div>
      <div class="pin-dots" id="pin-dots">
        ${[0,1,2,3].map(i=>`<div class="pin-dot" id="pd-${i}"></div>`).join('')}
      </div>
      ${err ? `<div class="pin-error">${err}</div>` : ''}
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n => n==='' ? '<div></div>' :
          `<button class="pin-btn ${n==='⌫'?'del':''}" onclick="pinPress('${n}')">${n}</button>`
        ).join('')}
      </div>
      ${mode==='check' ? `<div class="pin-forgot" onclick="pinForgot()">Esqueci meu PIN</div>` : ''}
    </div>`;
}

function pinPress(val) {
  if (val === '⌫') {
    pinBuffer = pinBuffer.slice(0,-1);
  } else {
    if (pinBuffer.length >= 4) return;
    pinBuffer += val;
  }
  // update dots
  for (let i=0;i<4;i++) {
    const d = document.getElementById('pd-'+i);
    if (d) d.classList.toggle('filled', i < pinBuffer.length);
  }
  if (pinBuffer.length === 4) setTimeout(pinSubmit, 200);
}

function pinSubmit() {
  if (pinMode === 'check') {
    if (pinBuffer === getPin()) {
      appUnlocked = true;
      rebuildApp();
    } else {
      showPinLock('check', '❌ PIN incorreto. Tente novamente.');
    }
  } else if (pinMode === 'set') {
    pinNewTemp = pinBuffer;
    showPinLock('confirm');
  } else if (pinMode === 'confirm') {
    if (pinBuffer === pinNewTemp) {
      localStorage.setItem(PIN_KEY, pinBuffer);
      showToast('🔐 PIN criado com sucesso!');
      closeModal();
    } else {
      showPinLock('set', '❌ PINs diferentes. Tente novamente.');
    }
  }
}

function pinForgot() {
  if (confirm('Redefinir PIN apagará todos os dados. Continuar?')) {
    localStorage.clear(); location.reload();
  }
}

function rebuildApp() {
  document.body.innerHTML = `
    <div id="toast"></div>
    <header>
      <div class="header-inner">
        <div class="header-top">
          <div class="logo">
            <span class="logo-sub">💰 Controle de</span>

  const name = document.getElementById('ed-name')?.value?.trim();
  const phone = document.getElementById('ed-phone')?.value?.trim();
  const address = document.getElementById('ed-address')?.value?.trim();
  const amount = parseFloat(document.getElementById('ed-amount')?.value);
  const interest = parseFloat(document.getElementById('ed-interest')?.value);
  const startDate = document.getElementById('ed-startdate')?.value;
  const dueDate = document.getElementById('ed-duedate')?.value;
  const note = document.getElementById('ed-note')?.value?.trim();
  if (!name || !amount || amount<=0) { showToast('Nome e valor são obrigatórios','error'); return; }
  // Recalculate current amount if original changed
  const ratio = amount / loan.originalAmount;
  loan.name = name; loan.phone = phone; loan.address = address;
  loan.originalAmount = amount;
  loan.currentAmount = parseFloat((loan.currentAmount * ratio).toFixed(2));
  loan.interest = interest; loan.startDate = startDate;
  loan.dueDate = dueDate; loan.note = note;
  save(); renderStats(); renderList(); closeModal();
  showToast('✅ Empréstimo atualizado!');
}


// ─── COMPROVANTE PDF ─────────────────────────────────────────────────────
function openReceipt(id) {
  const loan = loans.find(l=>l.id===id);
  if (!loan) return;
  const now = new Date();
  const nowStr = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  modal(`
    <div class="modal-header">
      <span class="modal-title">🧾 Comprovante</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="receipt" id="receipt-content">
      <div class="receipt-title">COMPROVANTE DE EMPRÉSTIMO</div>
      <div class="receipt-sub">Emitido em ${nowStr}</div>
      <hr class="receipt-divider">
      <div class="receipt-row"><span>Cliente:</span><span>${loan.name}</span></div>
      ${loan.phone ? `<div class="receipt-row"><span>Telefone:</span><span>${loan.phone}</span></div>` : ''}
      ${loan.address ? `<div class="receipt-row"><span>Endereço:</span><span style="max-width:180px;text-align:right">${loan.address}</span></div>` : ''}
      <hr class="receipt-divider">
      <div class="receipt-row"><span>Data do empréstimo:</span><span>${fmtDate(loan.startDate)}</span></div>
      <div class="receipt-row"><span>Vencimento:</span><span>${fmtDate(loan.dueDate)}</span></div>
      <div class="receipt-row"><span>Valor emprestado:</span><span>${fmt(loan.originalAmount)}</span></div>
      <div class="receipt-row"><span>Juros mensal:</span><span>${loan.interest}%</span></div>
      <div class="receipt-row"><span>Juros (30 dias):</span><span>${fmt(loan.originalAmount * loan.interest/100)}</span></div>
      <hr class="receipt-divider">
      <div class="receipt-row receipt-total"><span>TOTAL A PAGAR:</span><span>${fmt(loan.currentAmount)}</span></div>
      ${loan.note ? `<hr class="receipt-divider"><div style="font-size:11px;color:#555">Obs: ${loan.note}</div>` : ''}
      <hr class="receipt-divider">
      <div class="receipt-footer">Documento gerado pelo Controle de Empréstimos<br>Este comprovante não tem valor jurídico</div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-ghost" style="flex:1" onclick="shareReceiptWhatsApp('${id}')">🟢 Enviar WhatsApp</button>
      <button class="btn-primary" style="flex:1" onclick="printReceipt()">🖨️ Imprimir / PDF</button>
    </div>
  `);
}

function printReceipt() {
  const content = document.getElementById('receipt-content');
  if (!content) return;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Comprovante</title>
  <style>body{font-family:monospace;font-size:13px;padding:20px;max-width:400px;margin:0 auto;line-height:1.8}
  .receipt-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:4px}
  .receipt-sub{font-size:11px;text-align:center;color:#555;margin-bottom:16px}
  hr{border:none;border-top:1px dashed #ccc;margin:10px 0}
  .receipt-row{display:flex;justify-content:space-between}
  .receipt-total{font-weight:700;font-size:15px;border-top:2px solid #111;padding-top:8px;margin-top:4px}
  .receipt-footer{text-align:center;font-size:11px;color:#888;margin-top:12px}
  </style></head><body>${content.innerHTML}</body></html>`);
  w.document.close();
  setTimeout(() => w.print(), 300);
}

function shareReceiptWhatsApp(id) {
  const loan = loans.find(l=>l.id===id);
  if (!loan) return;
  const msg = `🧾 *COMPROVANTE DE EMPRÉSTIMO*

` +
    `👤 Cliente: ${loan.name}
` +
    `📅 Data: ${fmtDate(loan.startDate)}
` +
    `⏰ Vencimento: ${fmtDate(loan.dueDate)}
` +
    `💵 Valor emprestado: ${fmt(loan.originalAmount)}
` +
    `📈 Juros: ${loan.interest}%/mês
` +
    `━━━━━━━━━━━━━━
` +
    `💰 *TOTAL A PAGAR: ${fmt(loan.currentAmount)}*

` +
    `_Qualquer dúvida, entre em contato._`;
  const phone = (loan.phone||'').replace(/\D/g,'');
  const url = phone
    ? `https://wa.me/55${phone}?text=${encodeURIComponent(msg)}`
    : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}
